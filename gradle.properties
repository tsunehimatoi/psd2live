# This is a single-project desktop build. Keep each invocation self-contained so an interrupted
# Kotlin compilation cannot leave a growing pool of Gradle and Kotlin daemons behind.
org.gradle.daemon=false
# `gradlew run` keeps this JVM alive beside the app's own, so its heap stays modest.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Compile inside Gradle's process instead of starting a second, independently-lived Kotlin daemon.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.sync.suppressAgpWarnings=GENERIC
