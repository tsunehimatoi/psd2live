# Reuse a local Gradle daemon for fast iterative builds/tests (CI passes --no-daemon).
# Idle daemons exit automatically after 30 minutes.
org.gradle.daemon=true
org.gradle.daemon.idletimeout=1800000
# `gradlew run` keeps this JVM alive beside the app's own, so its heap stays modest.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Compile inside Gradle's process instead of starting a second, independently-lived Kotlin daemon.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.sync.suppressAgpWarnings=GENERIC
