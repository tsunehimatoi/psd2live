name: Package macOS
description: Build and verify a public DMG with its bundled runtime and no Cubism SDK.
inputs:
  architecture:
    description: Expected build architecture (arm64 or x86_64).
    required: true
  run-tests:
    description: Run the JVM test suite before packaging.
    default: 'true'
outputs:
  dmg:
    description: Path to the built DMG.
    value: ${{ steps.package.outputs.dmg }}
runs:
  using: composite
  steps:
    - name: Check build architecture
      shell: bash
      env:
        EXPECTED_ARCH: ${{ inputs.architecture }}
      run: test "$(uname -m)" = "$EXPECTED_ARCH"
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle
    - uses: dtolnay/rust-toolchain@stable
    - uses: ./.github/actions/test-native
      if: inputs.run-tests == 'true'
    - name: Test launcher error handling
      shell: bash
      run: bash packaging/macos/test-launcher.sh
    - name: Test and package DMG
      id: package
      shell: bash
      env:
        RUN_TESTS: ${{ inputs.run-tests }}
        PSD2LIVE_NATIVE_REQUIRED: '1'
      run: |
        tasks=(packageDistributionForCurrentOS)
        if [[ "$RUN_TESTS" == true ]]; then
          tasks+=(test)
          if [[ "$(uname -m)" == arm64 ]]; then tasks+=(pluginBuildTest); fi
        fi
        ./gradlew "${tasks[@]}" --no-daemon
        images=(build/PSD2Live-*-macos-*.dmg)
        [[ ${#images[@]} -eq 1 && -s "${images[0]}" ]]
        echo "dmg=${images[0]}" >> "$GITHUB_OUTPUT"
    - name: Verify bundled algorithm worker
      shell: bash
      run: python3 packaging/smoke-test-workers.py build/PSD2Live.app
    - name: Verify mounted package and bundled runtime
      shell: bash
      env:
        DMG: ${{ steps.package.outputs.dmg }}
      run: python3 packaging/macos/smoke-test.py "$DMG"
