name: macOS

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test and package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/package-macos
        id: package
        with:
          architecture: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ steps.package.outputs.dmg }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-test-results-${{ matrix.arch }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
