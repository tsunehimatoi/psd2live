# Public CI — no Cubism SDK download or packaging.
# Does not set PSD2LIVE_INCLUDE_CUBISM / -Ppsd2live.includeCubism.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test pinned example download tooling (no downloads)
        run: python -m unittest discover -s tools/examples -p 'test_*.py'

      - name: Test MCP script client (no server)
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Set up JDK 21 (JetBrains Runtime)
        uses: ./.github/actions/setup-jbr

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-

      # The x64 images come with Rust; the arm64 ones may not.
      - name: Set up Rust (arm64)
        if: runner.arch == 'ARM64'
        uses: dtolnay/rust-toolchain@stable

      # Skiko's linux-arm64 library links EGL/GL, which the x64 image has and the arm64 one lacks.
      - name: Install EGL/GL (Linux arm64)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1

      # The Rust runtime: its own tests, and the library the runtime conformance tests load.
      - name: Build and test the runtime
        working-directory: runtime
        run: |
          cargo test --release
          cargo build --release

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew test --no-daemon

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: gradlew.bat test --no-daemon

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/

  macos:
    name: Test and package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/package-macos
        id: package
        with:
          architecture: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ steps.package.outputs.dmg }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-test-results-${{ matrix.arch }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
