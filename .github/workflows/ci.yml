# Public CI — no Cubism SDK download or packaging.
# Does not set PSD2LIVE_INCLUDE_CUBISM / -Ppsd2live.includeCubism.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test pinned example download tooling (no downloads)
        run: python -m unittest discover -s tools/examples -p 'test_*.py'

      - name: Test MCP script client (no server)
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Set up JDK 21 (JetBrains Runtime)
        uses: ./.github/actions/setup-jbr

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-

      # The x64 images come with Rust; the arm64 ones may not.
      - name: Set up Rust (arm64)
        if: runner.arch == 'ARM64'
        uses: dtolnay/rust-toolchain@stable

      # Skiko's linux-arm64 library links EGL/GL, which the x64 image has and the arm64 one lacks.
      - name: Install EGL/GL (Linux arm64)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1

      - uses: ./.github/actions/test-native

      - name: Test Godot shader generation
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustc --edition=2021 --test runtime/godot/src/shaders.rs -o "$RUNNER_TEMP/shader-tests"
          "$RUNNER_TEMP/shader-tests"

      - name: Test and package application
        shell: bash
        env:
          PSD2LIVE_NATIVE_REQUIRED: '1'
        run: |
          tasks=(test)
          if [[ "$RUNNER_ARCH" == X64 ]]; then tasks+=(pluginBuildTest); fi
          if [[ "$RUNNER_OS" == Linux ]]; then tasks+=(packageDeb); else tasks+=(createDistributable); fi
          ./gradlew "${tasks[@]}" --no-daemon

      - name: Verify packaged Windows worker
        if: runner.os == 'Windows'
        run: python packaging/smoke-test-workers.py build/compose/binaries/main/app/PSD2Live

      - name: Verify packaged Linux launcher and worker
        if: runner.os == 'Linux'
        run: |
          dpkg-deb -x build/compose/binaries/main/deb/*.deb "$RUNNER_TEMP/deb-root"
          deb_apps=("$RUNNER_TEMP"/deb-root/opt/*)
          test "${#deb_apps[@]}" -eq 1
          python3 packaging/linux/smoke-test.py "${deb_apps[0]}"
          python3 packaging/smoke-test-workers.py "${deb_apps[0]}"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/

  macos:
    name: Test and package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            timeout_minutes: 60
          - runner: macos-15-intel
            arch: x86_64
            # Cold Intel builds assemble the isolated workers before the full JVM suite.
            # Leave time for that suite, DMG packaging, and the mounted-package smoke test.
            # A cold run spent 27 minutes compiling, then hit 90 minutes during tests.
            # Keep the complete suite and packaging checks; allow their measured cold-build cost.
            timeout_minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/package-macos
        id: package
        with:
          architecture: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ steps.package.outputs.dmg }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-test-results-${{ matrix.arch }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
