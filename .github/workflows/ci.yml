# Public CI — no Cubism SDK download or packaging.
# Does not set PSD2LIVE_INCLUDE_CUBISM / -Ppsd2live.includeCubism.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-

      # The x64 images come with Rust; the arm64 ones may not.
      - name: Set up Rust (arm64)
        if: runner.arch == 'ARM64'
        uses: dtolnay/rust-toolchain@stable

      # Skiko's linux-arm64 library links EGL/GL, which the x64 image has and the arm64 one lacks.
      - name: Install EGL/GL (Linux arm64)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1

      # The Rust runtime: its own tests, and the library the runtime conformance tests load.
      - name: Build and test the runtime
        working-directory: runtime
        run: |
          cargo test --release
          cargo build --release

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew test --no-daemon

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: gradlew.bat test --no-daemon
