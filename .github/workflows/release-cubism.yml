# Cubism-inclusive release packaging.
# Downloads the proprietary Cubism SDK from a private Release (or configured
# source repo), builds native bridges, and optionally publishes a GitHub Release.
#
# Maintainers: protect the GitHub Environment "release-cubism" (required reviewers).
# On a PUBLIC application repo, NEVER store the SDK zip as a Release asset here —
# point CUBISM_SDK_SOURCE_REPO at a private sibling repo. See docs/*/guide/CUBISM_CI_RELEASE.md.
name: Release Cubism

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 1.2.0)"
        required: true
        type: string
      create_github_release:
        description: "Create/update GitHub Release for v{version}"
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Same version from dispatch + subsequent tag push should not stack endlessly.
concurrency:
  group: cubism-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  DEFAULT_SDK_TAG: internal-sdk/cubism-5-r.5
  DEFAULT_SDK_ASSET: CubismSdkForNative-5-r.5.zip
  SDK_EXTRACT_DIR: CubismSdkForNative-5-r.5

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      create_release: ${{ steps.ver.outputs.create_release }}
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            CREATE="${{ inputs.create_github_release }}"
          else
            REF="${{ github.ref_name }}"
            VERSION="${REF#v}"
            CREATE="true"
          fi
          if [[ -z "$VERSION" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Invalid version: '$VERSION' (expected semver like 1.2.0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "create_release=$CREATE" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=$VERSION TAG=v$VERSION create_release=$CREATE"

  build-windows:
    name: Build Windows Cubism
    needs: prepare
    runs-on: windows-2022  # Cubism Core_MT.lib is MSVC 143; windows-latest is VS 2026-only
    environment: release-cubism
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure CMake
        shell: bash
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          fi
          cmake --version

      - name: Download Cubism SDK
        env:
          GH_TOKEN: ${{ secrets.SDK_FETCH_TOKEN || secrets.GITHUB_TOKEN }}
          SDK_REPO: ${{ vars.CUBISM_SDK_SOURCE_REPO || github.repository }}
          SDK_TAG: ${{ vars.CUBISM_SDK_RELEASE_TAG || 'internal-sdk/cubism-5-r.5' }}
          SDK_ASSET: ${{ vars.CUBISM_SDK_ASSET_NAME || 'CubismSdkForNative-5-r.5.zip' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path vendor) { Remove-Item -Recurse -Force vendor }
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Write-Host "Fetching $env:SDK_ASSET from $env:SDK_REPO @$env:SDK_TAG"
          gh release download $env:SDK_TAG -p $env:SDK_ASSET -R $env:SDK_REPO --dir vendor
          $zipPath = Join-Path (Get-Location) "vendor/$env:SDK_ASSET"
          if (-not (Test-Path $zipPath)) { throw "Downloaded zip missing: $zipPath" }
          Write-Host "Zip size: $((Get-Item $zipPath).Length) bytes"
          # Prefer Python zipfile over Expand-Archive (more reliable for large SDK zips).
          python -c "import zipfile; zipfile.ZipFile(r'$zipPath').extractall('vendor')"
          $extract = Join-Path (Get-Location) "vendor/$env:SDK_EXTRACT_DIR"
          if (Test-Path $extract) {
            $sdkRoot = (Resolve-Path $extract).Path
          } elseif (Test-Path "vendor/Core/include/Live2DCubismCore.h") {
            $sdkRoot = (Resolve-Path "vendor").Path
          } else {
            $top = Get-ChildItem vendor -Directory | Where-Object { $_.Name -notlike '.*' -and $_.Name -notlike '*.zip' } | Select-Object -First 1
            if (-not $top) { throw "Could not locate extracted SDK root under vendor/" }
            $sdkRoot = $top.FullName
          }
          "CUBISM_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using CUBISM_SDK_ROOT=$sdkRoot"

      - name: Verify Cubism SDK tree (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:CUBISM_SDK_ROOT
          $need = @(
            "Core/include/Live2DCubismCore.h",
            "Core/lib/windows/x86_64/143/Live2DCubismCore_MT.lib",
            "Samples/OpenGL/thirdParty/glew/include/GL/glew.h",
            "Samples/OpenGL/thirdParty/stb/stb_image.h"
          )
          $missing = @()
          foreach ($rel in $need) {
            $p = Join-Path $root $rel
            if (-not (Test-Path $p)) {
              Write-Host "::error::Missing required SDK file: $p"
              $missing += $p
            } else {
              Write-Host "OK: $p"
            }
          }
          $tp = Join-Path $root "Samples/OpenGL/thirdParty"
          if (Test-Path $tp) {
            Write-Host "=== thirdParty listing ==="
            Get-ChildItem $tp -Recurse -Depth 3 | Select-Object -First 80 FullName, Length | Format-Table -AutoSize
            $glewCount = (Get-ChildItem (Join-Path $tp "glew") -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
            Write-Host "glew file count: $glewCount"
          } else {
            Write-Host "::error::thirdParty dir missing: $tp"
            Write-Host "=== vendor / SDK layout (depth 3) ==="
            Get-ChildItem $root -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 120 FullName
            $missing += $tp
          }
          if ($missing.Count -gt 0) {
            Write-Host "=== find Samples (maxdepth 4) ==="
            if (Test-Path (Join-Path $root "Samples")) {
              Get-ChildItem (Join-Path $root "Samples") -Recurse -Depth 3 | Select-Object -First 100 FullName
            }
            exit 1
          }
          Write-Host "SDK Core + OpenGL thirdParty (glew/stb) OK"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        shell: bash
        run: choco install ninja -y

      - name: Build native renderer
        shell: cmd
        run: |
          set CUBISM_SDK_ROOT=%CUBISM_SDK_ROOT%
          native\build_live2d_renderer.bat -Clean -Deploy

      - name: Confirm deployed DLL
        shell: bash
        run: |
          DLL="src/main/resources/cubism/windows-x86_64/live2d_renderer.dll"
          if [[ ! -f "$DLL" ]]; then
            echo "::error::Expected $DLL after -Deploy"
            exit 1
          fi
          ls -la src/main/resources/cubism/windows-x86_64/

      - name: Package with Cubism
        shell: cmd
        run: |
          gradlew.bat packageDistributionForCurrentOS createDistributable -Ppsd2live.includeCubism=true --no-daemon

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "dist-artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $version = $env:VERSION
          $minExeBytes = 5MB

          $appDir = Get-ChildItem -Path "build/compose/binaries" -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq "app" } |
            Select-Object -First 1
          if (-not $appDir) {
            $appDir = Get-ChildItem -Path "build/compose/binaries" -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq "PSD2Live" } |
              Select-Object -First 1
          }
          if (-not $appDir) {
            Write-Host "::error::Could not find createDistributable app directory under build/compose/binaries"
            Get-ChildItem -Path "build/compose/binaries" -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object -First 40 FullName
            exit 1
          }
          Write-Host "Zipping portable from: $($appDir.FullName)"
          $portable = Join-Path (Resolve-Path $out) "PSD2Live-$version-windows-x86_64-portable.zip"
          if (Test-Path $portable) { Remove-Item $portable -Force }
          Compress-Archive -Path (Join-Path $appDir.FullName "*") -DestinationPath $portable -Force

          # Prefer the largest installer .exe (exclude uninstallers). Compose may also
          # emit a tiny launcher stub (~500KB); never publish that as the Release asset.
          $exes = @(Get-ChildItem -Path "build/compose/binaries" -Recurse -Filter "*.exe" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "(?i)unins" })
          if ($exes.Count -eq 0) {
            Write-Host "::error::No .exe under build/compose/binaries"
            Get-ChildItem -Path "build/compose/binaries" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 50 FullName
            exit 1
          }
          $exe = $exes | Sort-Object Length -Descending | Select-Object -First 1
          Write-Host "Candidate exes:"
          $exes | Sort-Object Length -Descending | ForEach-Object {
            Write-Host ("  {0:N0} bytes  {1}" -f $_.Length, $_.FullName)
          }
          if ($exe.Length -lt $minExeBytes) {
            Write-Host "::error::No sufficiently large .exe (>= 5MB) under build/compose/binaries; refusing stub-sized installer."
            $exes | Sort-Object Length -Descending | ForEach-Object {
              Write-Host ("  {0:N0} bytes  {1}" -f $_.Length, $_.FullName)
            }
            exit 1
          }

          $msis = @(Get-ChildItem -Path "build/compose/binaries" -Recurse -Filter "*.msi" -File -ErrorAction SilentlyContinue)
          if ($msis.Count -eq 0) {
            Write-Host "::error::No .msi under build/compose/binaries"
            exit 1
          }
          $msi = $msis | Sort-Object Length -Descending | Select-Object -First 1
          Write-Host "Selected exe: $($exe.FullName) ($($exe.Length) bytes)"
          Write-Host "Selected msi: $($msi.FullName) ($($msi.Length) bytes)"
          Copy-Item $exe.FullName (Join-Path $out "PSD2Live-$version.exe")
          Copy-Item $msi.FullName (Join-Path $out "PSD2Live-$version.msi")
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-cubism
          path: dist-artifacts/*
          if-no-files-found: error

  build-linux:
    name: Build Linux Cubism
    needs: prepare
    runs-on: ubuntu-22.04
    environment: release-cubism
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build deps
        run: |
          sudo apt-get update
          # libglx-dev is virtual on some Ubuntu releases; fall back to mesa.
          sudo apt-get install -y --no-install-recommends \
            cmake g++ \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev xvfb zip unzip
          sudo apt-get install -y --no-install-recommends libglx-dev \
            || sudo apt-get install -y --no-install-recommends libglx-mesa-dev

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Cubism SDK
        env:
          GH_TOKEN: ${{ secrets.SDK_FETCH_TOKEN || secrets.GITHUB_TOKEN }}
          SDK_REPO: ${{ vars.CUBISM_SDK_SOURCE_REPO || github.repository }}
          SDK_TAG: ${{ vars.CUBISM_SDK_RELEASE_TAG || 'internal-sdk/cubism-5-r.5' }}
          SDK_ASSET: ${{ vars.CUBISM_SDK_ASSET_NAME || 'CubismSdkForNative-5-r.5.zip' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor
          mkdir -p vendor
          echo "Fetching $SDK_ASSET from $SDK_REPO @$SDK_TAG"
          gh release download "$SDK_TAG" -p "$SDK_ASSET" -R "$SDK_REPO" --dir vendor
          ZIP="vendor/$SDK_ASSET"
          test -f "$ZIP"
          echo "Zip size: $(wc -c < "$ZIP") bytes"
          # Prefer Python zipfile over unzip (more reliable for large SDK zips).
          python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('vendor')" "$ZIP"
          if [[ -d "vendor/$SDK_EXTRACT_DIR" ]]; then
            SDK_ROOT="$(pwd)/vendor/$SDK_EXTRACT_DIR"
          elif [[ -f "vendor/Core/include/Live2DCubismCore.h" ]]; then
            SDK_ROOT="$(pwd)/vendor"
          else
            TOP=$(find vendor -maxdepth 1 -mindepth 1 -type d ! -name '.*' | head -1)
            SDK_ROOT="$(cd "$TOP" && pwd)"
          fi
          echo "CUBISM_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using CUBISM_SDK_ROOT=$SDK_ROOT"

      - name: Verify Cubism SDK tree (Linux)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$CUBISM_SDK_ROOT"
          fail=0
          need=(
            "Core/include/Live2DCubismCore.h"
            "Core/lib/linux/x86_64/libLive2DCubismCore.a"
            "Samples/OpenGL/thirdParty/glew/include/GL/glew.h"
            "Samples/OpenGL/thirdParty/stb/stb_image.h"
          )
          for rel in "${need[@]}"; do
            p="$ROOT/$rel"
            if [[ ! -f "$p" ]]; then
              echo "::error::Missing required SDK file: $p"
              fail=1
            else
              echo "OK: $p"
            fi
          done
          TP="$ROOT/Samples/OpenGL/thirdParty"
          if [[ -d "$TP" ]]; then
            echo "=== thirdParty disk usage ==="
            du -sh "$TP" "$TP"/* 2>/dev/null || true
            echo "glew file count: $(find "$TP/glew" -type f 2>/dev/null | wc -l)"
            echo "stb file count: $(find "$TP/stb" -type f 2>/dev/null | wc -l)"
            echo "=== thirdParty (maxdepth 3) ==="
            # Avoid pipefail+SIGPIPE from find|head aborting a successful verify.
            set +o pipefail
            find "$TP" -maxdepth 3 \( -type d -o -type f \) | head -80
            set -o pipefail
          else
            echo "::error::thirdParty dir missing: $TP"
            fail=1
          fi
          if [[ "$fail" -ne 0 ]]; then
            echo "=== find Samples -maxdepth 4 ==="
            set +o pipefail
            find "$ROOT/Samples" -maxdepth 4 2>/dev/null | head -200 || true
            echo "=== vendor top ==="
            find vendor -maxdepth 3 2>/dev/null | head -100 || true
            set -o pipefail
            exit 1
          fi
          echo "SDK Core + OpenGL thirdParty (glew/stb) OK"

      - name: Build native renderer
        run: |
          export CUBISM_SDK_ROOT
          ./native/build_live2d_renderer.sh --clean --deploy

      - name: Confirm deployed shared library
        run: |
          SO="src/main/resources/cubism/linux-x86_64/liblive2d_renderer.so"
          if [[ ! -f "$SO" ]]; then
            echo "::error::Expected $SO after --deploy"
            exit 1
          fi
          ls -la src/main/resources/cubism/linux-x86_64/

      - name: Package Deb with Cubism
        run: ./gradlew packageDeb -Ppsd2live.includeCubism=true --no-daemon

      - name: Collect Linux artifacts
        run: |
          set -euo pipefail
          OUT=dist-artifacts
          mkdir -p "$OUT"
          DEB=$(find build/compose/binaries -type f -name '*.deb' | head -1 || true)
          if [[ -z "$DEB" ]]; then
            echo "::error::No .deb under build/compose/binaries"
            find build/compose/binaries -type f 2>/dev/null | head -50 || true
            exit 1
          fi
          cp "$DEB" "$OUT/PSD2Live-${VERSION}-linux-amd64.deb"
          ls -la "$OUT"
          # Soft file-existence smoke (no GUI): confirm package is non-empty
          test -s "$OUT/PSD2Live-${VERSION}-linux-amd64.deb"
          # Optional GUI smoke is intentionally skipped in v1 (brittle under xvfb).
          # Example if re-enabled later:
          # xvfb-run -a timeout 15s ./gradlew run -Ppsd2live.includeCubism=true || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-cubism
          path: dist-artifacts/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [prepare, build-windows, build-linux]
    if: needs.prepare.outputs.create_release == 'true'
    runs-on: ubuntu-latest
    environment: release-cubism
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-cubism
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-cubism
          path: release-assets

      # softprops creates the tag from target_commitish when missing (workflow_dispatch).
      # Pushing a tag yourself also triggers this workflow; prefer one entry path.
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PSD2Live v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            ## 主要更新

            相对 v1.2.1，**${{ env.VERSION }}** 增强混合形状关键点编写与曲面变形器编辑：

            - 混合形状（Blend Shape）关键点按加性增量（additive deltas）编写，更符合 Cubism 语义
            - 在层级编辑模式，或在变形模式下按住 Ctrl 编辑曲面变形器时，保留子对象几何（子网格、关键点增量、混合形状、子旋转/曲面变形器），避免牵动子件

            ## 1.2.1 更新说明

            相对 v1.1.1，**1.2.1** 带来工作区、画布隔离、网格生成/分割、导出与 MCP/Agent 增强，并正式提供 Linux Cubism 预览包：

            - Linux x86_64 Cubism Native 预览桥接与 `.deb` 打包；文档说明 X11/GLX 限制
            - 命名布局工作区（替代共享标签）
            - 画布会话与选择隔离；预览运行时按画布隔离
            - 套索分割源图层；不相连网格岛分割且不改父变形；导入时可批量分割
            - 分割对话框预览网格岛
            - 可选网格填充算法、边缘带与结构化内部填充；网格设置停靠为独立标签
            - 网格重建与预览设置时保留编辑
            - MCP/Agent：图层分类与共享写作工具；PSD / 绘画 / 网格 / 预览工作流共享
            - 导出：对齐 Cubism 目标、恢复网格生成，并对实际降级特性给出警告
            - CMO3：变形路径目标绑定与拓扑观察，支持编辑器内拖拽
            - GitHub Actions：公开 CI + 从私有仓库拉取 Cubism SDK 的发行工作流

            ## 1.1.1 更新说明

            相对 v1.1.0，**1.1.1** 修复停靠栏收起后画布与历史图错位：

            - 网格点跟随画布，不再停在旧窗口位置
            - 历史图保持在面板内

            ## 1.1.0 更新说明

            相对 v1.0.1，**1.1.0** 完善参数编辑与预览交互：

            - 完整参数编辑体验，轴上吸附、间隔与关键点编辑
            - 参数轨道显示关键值标签；侧边浮层显示绑定该参数的组件
            - 文件夹标签色（Cubism 兼容）、文件夹内创建参数与重命名稳定性
            - 预览播放/暂停与鼠标跟踪移至画布工具栏；缩放与统计 pill 停靠左下
            - 修复层级树网格预览悬停、全屏对话框遮罩压扁停靠栏、未提交笔触进入共享预览

            ## 下载

            - **便携版 ZIP** `PSD2Live-${{ env.VERSION }}-windows-x86_64-portable.zip`：解压后即可运行，无需安装。
            - **Windows EXE** `PSD2Live-${{ env.VERSION }}.exe`：安装程序。
            - **Windows MSI** `PSD2Live-${{ env.VERSION }}.msi`：Windows Installer 安装包。
            - **Linux amd64 Deb（含 Cubism Native 预览）** `PSD2Live-${{ env.VERSION }}-linux-amd64.deb`：需 X11/GLX；内含官方运行时预览桥接，请遵守 Live2D SDK 许可，勿再二次公开分发专有组件。
          files: |
            release-assets/PSD2Live-${{ env.VERSION }}-windows-x86_64-portable.zip
            release-assets/PSD2Live-${{ env.VERSION }}.exe
            release-assets/PSD2Live-${{ env.VERSION }}.msi
            release-assets/PSD2Live-${{ env.VERSION }}-linux-amd64.deb
