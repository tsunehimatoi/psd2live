[package]
name = "p2l-runtime"
version = "0.1.0"
edition = "2021"
# The oldest rustc the dependencies build with (ruzstd 0.8 needs 1.87). The app build skips the runtime below it.
rust-version = "1.87"
license = "MIT"
description = "Plays .p2lrt rigs compiled by PSD2Live: deformation, physics and clips, with a C ABI."
publish = false

[lib]
name = "p2l_runtime"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# The runtime's allocator hands every allocation to a host's functions once p2l_set_allocator sets them. Crates
# that use the runtime as a Rust library and bring their own allocator turn it off.
default = ["host-allocator"]
host-allocator = []

[dependencies]
# Chunk decompression for .p2lrt 2: zlib (deflate) and zstd, both pure Rust so the WebAssembly build keeps them.
miniz_oxide = "0.8"
ruzstd = "0.8"

[profile.release]
lto = true
codegen-units = 1
