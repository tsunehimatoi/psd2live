sim.damping=Damping
sim.dampingTip=How quickly motion dies out, per second.
sim.goal=Shape
sim.goalTip=Spring back toward the drawn shape. It also holds shapes gravity would fold, such as a flared hem. 0 is pure physics.
sim.slack=Slack
sim.slackTip=How much farther than its rest path a vertex may get from its pin under a hard jerk.
