tutorial.basic.action=Try this now
tutorial.basic.hint.manual=Try the controls inside the frame, then choose Next.
tutorial.basic.hint.auto=Continues after the action. Choose Skip to explore later.
tutorial.basic.step.openFile.action=Click File in the frame, or choose Next to open it automatically.
tutorial.basic.step.import.action=Choose Import PSD and select a layered file. If you cancel, try again or skip this step.
tutorial.basic.step.preview.action=Click the Preview tab. If it is already selected, the tutorial continues automatically.
tutorial.basic.step.layers.action=Look over the list first; no changes are needed. Choose Next to learn about one row.
tutorial.basic.step.layerRow.action=Change only incorrect assignments. Switch and toggle layers use parameter bindings instead of part presets. Choose Next when you are ready.
tutorial.basic.step.settings.action=Review head and body motion and physics. Change one setting at a time, then choose Next.
tutorial.basic.step.export.action=Click Export to open its options. Confirm output choices in that dialog to actually export files.
tutorial.basic.targetMissing=The target is not visible yet. If no PSD is loaded, go back to import one, skip this step, or exit and restart.
menu.help.tutorialCatalog=Tutorial catalog…
tutorial.catalog.title=Interactive tutorial catalog
tutorial.catalog.desc=Learn the UI and editing flow in order. Start from basics or jump to any lesson.
tutorial.catalog.progressive=Progressive lessons
tutorial.common.continueNext=Continue: {0}
tutorial.common.openCatalog=Open tutorial catalog
tutorial.common.requireSelection=Select an artmesh or deformer in the highlighted hierarchy first, then continue.
tutorial.common.requireLayer=Select a layer in the hierarchy first, then continue paint steps.
tutorial.common.hint.prerequisite=Finish the highlighted selection before continuing; skip is disabled until then.
tutorial.basic.step.naming.title=Preset naming tips
tutorial.basic.step.naming.body=Some layers auto-match presets by name: eye_close, mouth_close, tooth_t / tooth_b, tongue. Draw upper lashes only; mouth at max open; body upright for binding.
tutorial.basic.step.naming.action=Compare layer names with the Preset column, then Next.
tutorial.variants.step.toggleWhy.title=Why toggle variants
tutorial.variants.step.toggleWhy.body=A toggle drives one layer visibility with a parameter — blush, tears, glasses, light overlays. Drag the parameter to show/hide.
tutorial.variants.step.toggleSetup.title=Set up a toggle
tutorial.variants.step.toggleSetup.body=Set Type to Toggle and fill a parameter name (e.g. blush). The same name can drive several toggle layers.
tutorial.variants.step.toggleSetup.action=Set one row to Toggle and fill a parameter (or review), then Next.
tutorial.variants.step.switchWhy.title=Why switch variants
tutorial.variants.step.switchWhy.body=Switch variants pick one of several looks: only one ID shows at a time — expressions, poses, costumes.
tutorial.variants.step.switchSetup.title=Set up a switch
tutorial.variants.step.switchSetup.body=Related rows share Switch + the same parameter name; set IDs to 0, 1, 2… e.g. expression: 0 normal / 1 happy.
tutorial.variants.step.switchSetup.action=Configure two rows with the same name and different IDs (or review), then Next.
tutorial.parameters.step.findTab.title=Find Parameters
tutorial.parameters.step.findTab.body=Open the Parameters dock tab on the right. Expand the inspector area if needed.
tutorial.parameters.step.findTab.action=Open Parameters, then Next.
tutorial.parameters.step.operate.title=Keyform gestures
tutorial.parameters.step.operate.body=On a slider: left-drag scrubs the value; hover a key mark and right-click to snap. 2D pads work the same: left-drag free, right-click snaps to a key intersection.
tutorial.create.step.contextDeformer.title=Create from a deformer
tutorial.create.step.contextDeformer.body=Right-click a deformer to add parent/child warp or rotation. Creation opens a placement session.
tutorial.create.step.contextDeformer.action=Right-click a deformer and browse create items (cancel if you like).
tutorial.create.step.contextLayer.title=Create from a layer
tutorial.create.step.contextLayer.body=Right-click a layer to add a parent warp/rotation, or a deform path on meshed art. Placement confirm follows.
tutorial.create.step.contextLayer.action=Right-click a layer and browse Add items.
tutorial.basic.title=Basic workflow
tutorial.basic.desc=Import a PSD, preview, adjust layers and settings, then export moc3/cmo3.
tutorial.workspace.title=Workspace tour
tutorial.workspace.desc=Workspaces, window toggles, docks, view options, and canvas navigation.
tutorial.workspace.step.tabs.title=Workspaces
tutorial.workspace.step.tabs.body=A workspace remembers where panels sit. The canvas title bar switches that canvas between Edit and Preview; add another canvas from Windows to see both. History opens from Windows. {key:NEW_EDIT_TAB} creates a workspace, {key:NEXT_TAB} switches.
tutorial.workspace.step.tabs.action=Look at the workspace strip. Use Edit on the canvas title bar when you need to edit, then choose Next.
tutorial.workspace.step.hierarchyToggle.title=Show or hide the hierarchy
tutorial.workspace.step.hierarchyToggle.body=Title-bar layout toggles show/hide hierarchy, log, and inspector. The highlighted control is the hierarchy toggle.
tutorial.workspace.step.hierarchyToggle.action=Try the toggle once, then choose Next.
tutorial.workspace.step.docks.title=Right-side docks
tutorial.workspace.step.docks.body=Docks include Settings, Layers, Parameters, Tool details, Inspector, Animation, and Physics. Animation/Physics only need to be noticed for now.
tutorial.workspace.step.docks.action=Browse dock tabs, then choose Next.
tutorial.workspace.step.viewMenu.title=View options menu
tutorial.workspace.step.viewMenu.body=View on the canvas title bar stores mesh, deformer and path visibility for that canvas. Each canvas keeps its own.
tutorial.workspace.step.viewMenu.action=Open the menu, browse items, then choose Next.
tutorial.workspace.step.camera.title=Zoom and pan
tutorial.workspace.step.camera.body=Scroll to zoom; middle-drag or {kbd:Space} to pan. {key:ZOOM_IN} / {key:ZOOM_OUT} / {key:ZOOM_RESET} zoom; {key:RESET_CAMERA} resets; {key:FRAME_VIEW} frames selection (later).
tutorial.workspace.step.camera.action=Try zooming and panning, then choose Next.
tutorial.workspace.step.done.title=Workspace tour complete
tutorial.workspace.step.done.body=Next, learn Hierarchy tree and mode bar — the core editing chrome.
tutorial.hierarchy.title=Hierarchy & mode bar
tutorial.hierarchy.desc=Left hierarchy tree, layer import, draw-order ruler, and the mode bar with temporary session names.
tutorial.hierarchy.step.openTree.title=Open the hierarchy
tutorial.hierarchy.step.openTree.body=The tree shows deformer/artmesh parent links. The root shows Model Hierarchy and counts.
tutorial.hierarchy.step.openTree.action=Confirm the hierarchy dock is visible, then choose Next.
tutorial.hierarchy.step.toolbar.title=Search and expand
tutorial.hierarchy.step.toolbar.body=The top bar searches deformers/layers and expands or collapses all. There are no dedicated tree shortcuts — use this UI.
tutorial.hierarchy.step.toolbar.action=Try search or expand/collapse, then choose Next.
tutorial.hierarchy.step.treeBody.title=Rows and selection sync
tutorial.hierarchy.step.treeBody.body=Eye icons toggle visibility; parent badges mark ancestors; selecting in the tree highlights on canvas.
tutorial.hierarchy.step.treeBody.action=Select a node and watch the canvas, then choose Next.
tutorial.hierarchy.step.dragParent.title=Drag to reparent
tutorial.hierarchy.step.dragParent.body=Drag onto another deformer to reparent, or onto Move to Root. Dropping transparent images onto the tree imports layers (next step) — that is different from reparenting.
tutorial.hierarchy.step.dragParent.action=Try dragging a node (or just review), then choose Next.
tutorial.hierarchy.step.contextDeformer.title=Deformer context menu
tutorial.hierarchy.step.contextDeformer.body=Add parent/child warp or rotation, Import Layer, move to root, expand/collapse branch, delete (children move up).
tutorial.hierarchy.step.contextDeformer.action=Right-click a deformer, browse the menu, then choose Next.
tutorial.hierarchy.step.contextLayer.title=Layer context menu
tutorial.hierarchy.step.contextLayer.body=Solo, draw order, mesh settings, add parent deformer/path, Import Layer, delete. Solo is temporary edit visibility — not parameter-driven variants.
tutorial.hierarchy.step.contextLayer.action=Right-click a layer, browse the menu, then choose Next.
tutorial.hierarchy.step.importLayer.title=Import layer
tutorial.hierarchy.step.importLayer.body=Drop PNG / WebP / TIFF / BMP onto a tree node, or use Import Layer… in the context menu. The new layer appears under that node (or under a layer’s parent deformer), then a placement session opens.
tutorial.hierarchy.step.importLayer.action=Optional: drop or import one transparent image to try it; otherwise review and choose Next.
tutorial.hierarchy.step.placeSession.title=Placement session
tutorial.hierarchy.step.placeSession.body=After import or create, the bottom-left placement panel appears; the session owns canvas clicks until Confirm or {key:CANCEL}. The mode bar shows a temporary session name (e.g. Place Layer). Confirming a placed layer returns to Select mode.
tutorial.hierarchy.step.placeSession.action=Remember “session owns canvas → confirm returns to Select”, then choose Next.
tutorial.hierarchy.step.drawOrder.title=Draw-order ruler
tutorial.hierarchy.step.drawOrder.body=Scroll to zoom the ruler, drag to change order, double-click to type a value. Same property as Inspector and the context menu.
tutorial.hierarchy.step.drawOrder.action=Scroll or drag a mark, then choose Next.
tutorial.hierarchy.step.modeBar.title=Hierarchy mode bar
tutorial.hierarchy.step.modeBar.body=Top-left modes: Select, Deform, Edit, Paint. Without a target you get partFirst/layerFirst hints. Mode changes apply view presets. During a placement session, a session name appears beside the mode chips.
tutorial.hierarchy.step.modeBar.action=Click each mode chip, then choose Next.
tutorial.hierarchy.step.modeExtras.title=Mode extras
tutorial.hierarchy.step.modeExtras.body=Deform has L1 mesh points / L2 Bezier handles; Edit shows grid size; Paint has FG/BG and apply/discard; temporary sessions add a session-name chip.
tutorial.hierarchy.step.modeExtras.action=In Deform, inspect L1/L2, then choose Next.
tutorial.hierarchy.step.gesturePreview.title=Select gestures preview
tutorial.hierarchy.step.gesturePreview.body=In Select: click, {kbd:Shift} add, {kbd:Alt} subtract, {kbd:Ctrl} +click walks hierarchy, drag marquee, {key:SELECT_ALL}, {key:CANCEL}. Practiced in the next lesson.
tutorial.hierarchy.step.gesturePreview.action=Remember the gestures, then choose Next.
tutorial.hierarchy.step.done.title=Hierarchy lesson complete
tutorial.hierarchy.step.done.body=Continue with Variants to make toggle/switch layers.
tutorial.variants.title=Variants
tutorial.variants.desc=Layer types, toggle variants, and switch variants.
tutorial.variants.step.types.title=Layer types
tutorial.variants.step.types.body=Type column: Preset (auto parts), Toggle (show/hide by parameter), Switch (mutually exclusive looks). Learn toggle and switch next.
tutorial.variants.step.types.action=Browse the Type column, then Next.
tutorial.variants.step.done.title=Variants complete
tutorial.variants.step.done.body=Continue with Parameters & keyforms.
tutorial.parameters.title=Parameters & keyforms
tutorial.parameters.desc=Find the panel, drag values, keyforms, and linking.
tutorial.parameters.step.panel.title=The parameter panel
tutorial.parameters.step.panel.body=Search, lock, reset, and folders organize parameters that drive variants and deformation.
tutorial.parameters.step.panel.action=Open Parameters and browse, then Next.
tutorial.parameters.step.drag.title=Drag parameters
tutorial.parameters.step.drag.body=Sliders update Edit/Preview poses to check variants and motion range.
tutorial.parameters.step.drag.action=Drag a parameter, then Next.
tutorial.parameters.step.keys.title=What keyforms are
tutorial.parameters.step.keys.body=Marks beside a parameter store shapes: circles are usually grid keys; squares blend keys. Deform places shapes on keys.
tutorial.parameters.step.keys.action=Inspect key dots, then Next.
tutorial.parameters.step.link.title=Parameter links
tutorial.parameters.step.link.body=Some parameters form a 2D link (XY pad). Use linking controls when you need combined drives; you need not master it now.
tutorial.parameters.step.link.action=Note the entry, then Next.
tutorial.parameters.step.done.title=Parameters complete
tutorial.parameters.step.done.body=Continue with Select mode gestures.
tutorial.select.title=Select mode
tutorial.select.desc=Select tools, object gestures, tree/canvas sync.
tutorial.select.step.mode.title=Enter Select
tutorial.select.step.mode.body=Switch to Select on the mode bar, or press {key:TOOL_SELECT} for the pick tool.
tutorial.select.step.mode.action=Ensure Select mode, then Next.
tutorial.select.step.tools.title=Select tools
tutorial.select.step.tools.body=Pick {key:TOOL_SELECT}, Lasso {key:TOOL_LASSO_SELECT}, Brush select {key:TOOL_BRUSH_SELECT}. The left toolbar groups by mode.
tutorial.select.step.tools.action=Switch select tools, then Next.
tutorial.select.step.gestures.title=Object gestures
tutorial.select.step.gestures.body=Click select · {kbd:Shift} add · {kbd:Alt} subtract · {kbd:Ctrl} +click walks hierarchy · drag marquee · {key:SELECT_ALL} · {key:CANCEL}.
tutorial.select.step.gestures.action=Practice on canvas, then Next.
tutorial.select.step.sync.title=Tree and canvas sync
tutorial.select.step.sync.body=Selection syncs with the hierarchy. {key:FRAME_VIEW} frames the selection.
tutorial.select.step.sync.action=Select via tree and canvas, try F, then Next.
tutorial.select.step.extras.title=Marquee style & linked
tutorial.select.step.extras.body={key:SELECTION_STYLE_BOX} / {key:SELECTION_STYLE_LASSO} toggle box/lasso style; {key:SELECT_LINKED} selects linked points. Canvas context menu follows mode.
tutorial.select.step.extras.action=Try the shortcuts, then Next.
tutorial.select.step.done.title=Select complete
tutorial.select.step.done.body=Continue with Create deformers.
tutorial.create.title=Create deformers
tutorial.create.desc=Select in the hierarchy, create from context menus, confirm in the placement panel.
tutorial.create.step.selectFirst.title=Select in the hierarchy first
tutorial.create.step.selectFirst.body=Pick an artmesh or deformer in the tree before creating. This lesson blocks until a selection exists.
tutorial.create.step.selectFirst.action=Select a target in the highlighted tree.
tutorial.create.step.placement.title=Bottom-left placement panel
tutorial.create.step.placement.body=After create, the bottom-left panel edits name, relation, and size/aim. {key:FINISH_PATH} confirms, {key:CANCEL} cancels. The session owns the canvas; the mode bar shows a temporary name.
tutorial.create.step.placement.action=Note the panel, session ownership, and confirm/cancel, then Next.
tutorial.create.step.done.title=Create complete
tutorial.create.step.done.body=Continue with Deform mode.
tutorial.deform.title=Deform mode
tutorial.deform.desc=L1/L2, deform brushes, axis lock, keyed shapes.
tutorial.deform.step.enter.title=Enter Deform
tutorial.deform.step.enter.body=Select the artmesh/deformer to edit, then enter Deform. If nothing is selected, finish the tree pick first.
tutorial.deform.step.enter.action=Select a target, then enter Deform.
tutorial.deform.step.levels.title=L1 and L2
tutorial.deform.step.levels.body=L1 edits mesh points; L2 edits Bezier handles.
tutorial.deform.step.levels.action=Toggle L1/L2, then Next.
tutorial.deform.step.brushes.title=Deform brushes
tutorial.deform.step.brushes.body=Brush {key:TOOL_BRUSH}, Smooth {key:TOOL_SMOOTH}, Inflate {key:TOOL_INFLATE} — or drag points.\nImportant: hold {kbd:Alt} and right-drag to scrub brush radius/hardness live (axes map to different parameters).
tutorial.deform.step.brushes.action=Try a brush and one {kbd:Alt}+right-drag radius tweak.
tutorial.deform.step.shortcuts.title=Radius and axes
tutorial.deform.step.shortcuts.body={key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP} radius, {key:BRUSH_HARDNESS_DOWN} {key:BRUSH_HARDNESS_UP} hardness; {key:AXIS_CONSTRAIN_X} / {key:AXIS_CONSTRAIN_Y} axis lock. Prefer {kbd:Alt}+right-drag for live tweaks.
tutorial.deform.step.shortcuts.action=Try shortcuts, then Next.
tutorial.deform.step.keys.title=Shapes on keyforms
tutorial.deform.step.keys.body=Place different shapes on different parameter keys for head turns and expressions.
tutorial.deform.step.keys.action=Optionally tweak on a key, then Next.
tutorial.deform.step.undo.title=Undo / redo
tutorial.deform.step.undo.body={key:UNDO} undo; {key:REDO} redo. Avoid mid-gesture mode switches.
tutorial.deform.step.undo.action=Note this, then Next.
tutorial.deform.step.done.title=Deform complete
tutorial.deform.step.done.body=Continue with Edit mode topology.
tutorial.edit.title=Edit mode
tutorial.edit.desc=Subdivide, knife, and safe topology edits.
tutorial.edit.step.enter.title=Enter Edit
tutorial.edit.step.enter.body=Edit forces mesh display for topology, not freeform pulling.
tutorial.edit.step.enter.action=Enter Edit, then Next.
tutorial.edit.step.topo.title=Subdivide & knife
tutorial.edit.step.topo.body=Subdivide {key:TOOL_SUBDIVIDE}, Knife {key:TOOL_KNIFE}. Drag mesh points to reshape topology; Knife cuts along a stroke.
tutorial.edit.step.topo.action=Locate tools and try lightly, then Next.
tutorial.edit.step.delete.title=Delete points
tutorial.edit.step.delete.body={key:DELETE_SELECTION} deletes selected points. Confirm the selection before large edits.
tutorial.edit.step.delete.action=Note the caution, then Next.
tutorial.edit.step.viewAids.title=View aids
tutorial.edit.step.viewAids.body=Bottom-right view bar or View menu can show deform paths while editing topology.
tutorial.edit.step.viewAids.action=Enable aids, then Next.
tutorial.edit.step.when.title=When to edit topology
tutorial.edit.step.when.body=Use Edit when the mesh is too coarse; everyday shaping stays in Deform.
tutorial.edit.step.when.action=Remember the split, then Next.
tutorial.edit.step.done.title=Edit complete
tutorial.edit.step.done.body=Continue with Paint mode.
tutorial.paint.title=Paint mode
tutorial.paint.desc=Paint tools, apply/discard session, paint undo.
tutorial.paint.step.layerFirst.title=Select a layer first
tutorial.paint.step.layerFirst.body=Painting requires a layer; otherwise layerFirst is shown.
tutorial.paint.step.layerFirst.action=Select a layer and enter Paint, then Next.
tutorial.paint.step.tools.title=Paint tools
tutorial.paint.step.tools.body=Brush {key:TOOL_PAINT_BRUSH}, pencil {key:TOOL_PAINT_PENCIL}, eraser {key:TOOL_PAINT_ERASER}, bucket {key:TOOL_PAINT_BUCKET}, eyedropper {key:TOOL_PAINT_EYEDROPPER} and shapes {key:TOOL_PAINT_LINE}; shortcuts follow the toolbar and your bindings.
tutorial.paint.step.tools.action=Switch paint tools, then Next.
tutorial.paint.step.shortcuts.title=Brush shortcuts
tutorial.paint.step.shortcuts.body=Radius {key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP}, hardness {key:BRUSH_HARDNESS_DOWN} {key:BRUSH_HARDNESS_UP}, opacity {key:PAINT_OPACITY_DOWN} {key:PAINT_OPACITY_UP}; shape cycle {key:PAINT_SHAPE_CYCLE}. Paint also supports {kbd:Alt}+right-drag tip tweaks.
tutorial.paint.step.shortcuts.action=Adjust radius, then Next.
tutorial.paint.step.session.title=Apply or discard
tutorial.paint.step.session.body=Paint sessions have their own undo. Mode bar apply/discard; apply may rebuild mesh.
tutorial.paint.step.session.action=Note the session flow, then Next.
tutorial.paint.step.return.title=Back to shaping
tutorial.paint.step.return.body=After touch-ups, return to Select or Deform for forms and keys.
tutorial.paint.step.return.action=Return to Select, then Next.
tutorial.paint.step.done.title=Paint complete
tutorial.paint.step.done.body=Continue with Inspector.
tutorial.inspector.title=Inspector
tutorial.inspector.desc=Type-specific properties and three draw-order entries.
tutorial.inspector.step.open.title=Open Inspector
tutorial.inspector.step.open.body=Empty until something is selected; then shows matching properties.
tutorial.inspector.step.open.action=Open Inspector and select something, then Next.
tutorial.inspector.step.artmesh.title=ArtMesh properties
tutorial.inspector.step.artmesh.body=Clipping, draw order, opacity, blend, culling, user data.
tutorial.inspector.step.artmesh.action=Browse artmesh fields, then Next.
tutorial.inspector.step.deformers.title=Deformer properties
tutorial.inspector.step.deformers.body=Warp has Bezier division and edit level; Rotation and DeformPath have their own fields.
tutorial.inspector.step.deformers.action=Select a deformer, then Next.
tutorial.inspector.step.keyframes.title=Keyframe button
tutorial.inspector.step.keyframes.body=Inspector keyframe control pairs with parameter marks to key the current value.
tutorial.inspector.step.keyframes.action=Find the control, then Next.
tutorial.inspector.step.drawOrder.title=Three draw-order entries
tutorial.inspector.step.drawOrder.body=Inspector, tree context menu, and ruler edit the same property.
tutorial.inspector.step.drawOrder.action=Compare with the ruler, then Next.
tutorial.inspector.step.done.title=Inspector complete
tutorial.inspector.step.done.body=Continue with Tool details.
tutorial.tools.title=Tool details
tutorial.tools.desc=Per-tool parameters and shortcut mapping.
tutorial.tools.step.open.title=Open Tool details
tutorial.tools.step.open.body=Content follows the active tool for brush/create parameters.
tutorial.tools.step.open.action=Open Tool details, then Next.
tutorial.tools.step.brushes.title=Brush parameters
tutorial.tools.step.brushes.body=Deform and paint brushes share size/hardness; {key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP} drive the same values.
tutorial.tools.step.brushes.action=Switch tools and watch the panel, then Next.
tutorial.tools.step.split.title=Toolbar vs panel
tutorial.tools.step.split.body=Left toolbar picks tools; Tool details tunes them; mode bar picks work mode.
tutorial.tools.step.split.action=Compare the three, then Next.
tutorial.tools.step.shortcuts.title=Shortcut presets
tutorial.tools.step.shortcuts.body=Change Photoshop / Blender / Cubism presets or custom bindings under Settings → Shortcuts. Tutorial keycaps follow your current bindings.
tutorial.tools.step.shortcuts.action=Note this, then Next.
tutorial.tools.step.done.title=Tool details complete
tutorial.tools.step.done.body=Continue with Project & history.
tutorial.project.title=Project & history
tutorial.project.desc=Save .psd2live, history nodes, and branches.
tutorial.project.step.save.title=Save project
tutorial.project.step.save.body={key:SAVE_PROJECT} saves; {key:SAVE_PROJECT_AS} Save As. The project is an unencrypted ZIP with PSD, history and UI state.
tutorial.project.step.save.action=Note the entry (saving optional), then Next.
tutorial.project.step.historyTab.title=History tab
tutorial.project.step.historyTab.body={key:OPEN_HISTORY_TAB} opens the History tab. Saves and some automated edits add nodes.
tutorial.project.step.historyTab.action=Click the highlighted History tab (or use the shortcut).
tutorial.project.step.restore.title=Restore a version
tutorial.project.step.restore.body=Restore switches the workspace to that node without deleting other branches.
tutorial.project.step.restore.action=Find Restore, then Next.
tutorial.project.step.branch.title=Branches
tutorial.project.step.branch.body=Editing from an old node creates a branch; rename, note, or hide nodes (data kept).
tutorial.project.step.branch.action=Note this, then Next.
tutorial.project.step.done.title=Project lesson complete
tutorial.project.step.done.body=Optional: Texture upscale, or reopen the catalog.
tutorial.upscale.title=Texture upscale
tutorial.upscale.desc=AI upscale textures, then recheck mesh and export.
tutorial.upscale.step.entry.title=Entry
tutorial.upscale.step.entry.body=Open Tools → Texture Upscale…, or press {key:TEXTURE_UPSCALE}. Useful when source art is low-res.
tutorial.upscale.step.entry.action=In the highlighted Tools menu, click Texture Upscale….
tutorial.upscale.step.scale.title=Scale
tutorial.upscale.step.scale.body=Usually 2× / 4×. Denser pixels may change how the mesh looks.
tutorial.upscale.step.scale.action=Note options, then Next.
tutorial.upscale.step.check.title=Recheck and export
tutorial.upscale.step.check.body=After upscale, inspect mesh/deformers in Edit, verify Preview, then re-export.
tutorial.upscale.step.check.action=Note the flow, then Next.
tutorial.upscale.step.done.title=Advanced path complete
tutorial.upscale.step.done.body=You finished the progressive tutorials. Reopen any lesson from Help → catalog.

