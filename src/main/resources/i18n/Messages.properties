help.spec.intro=PSD2Live supports English, Japanese, and Chinese layer aliases. Standardized naming and layering maximizes rigging quality:
help.spec.group.head=Head & Facial Components
help.spec.head.face=face / head: Facial base for center and 9-axis perspective; put blush, tear marks and other details in facedetail
help.spec.head.hairFront=front_hair / bangs: Front hair ArtMeshes attached to front hair physics deformer
help.spec.head.hairBack=back_hair: Back hair ArtMeshes attached to back hair physics deformer
help.spec.head.headwear=headwear / hat: Mounted on the head and kept out of the 9-axis facial deformation
help.spec.head.eyelash=eyelash: Upper eyelashes only! Open naturally; curves into a smooth U-shape on eye close (do not include lower lash)
help.spec.head.eyewhite=eyewhite: Sclera reference & closure baseline; clipping mask for irides
help.spec.head.eyeClose=eye_close: A pre-drawn closed-eye shape; use either this or the eyelash closure curve
help.spec.head.irides=irides / pupil / eye: Gaze tracking & jelly-eye spring dynamics
help.spec.head.eyebrow=eyebrow: Brow vertical movement and perspective follow
help.spec.head.nose=nose: 3D head orientation perception keypoint
help.spec.head.mouth=mouth / mouth_open: Must be drawn at maximum open state (crisp outlines recommended); closes concentrically
help.spec.head.mouthClose=mouth_close: A pre-drawn closed-mouth shape (optional)
help.spec.head.mouthInternals=tooth_t / tooth_b / tongue: Automatically clipped to mouth ArtMesh
help.spec.head.ears=ears / earwear / eyewear: Ears, earrings and glasses that follow head rotation
help.spec.group.body=Torso & Body Components
help.spec.body.neck=neck: Connects head rotation and torso movement
help.spec.body.topwear=topwear / clothes / shirt: Binds body XYZ orientation and chest Gaussian breathing expansion
help.spec.body.limbs=handwear / legwear / footwear (arm / hand / leg / foot): Arms, hands, legs and feet
help.spec.body.bottomwear=bottomwear: Pants and skirts
help.spec.body.neckwear=neckwear: Collars, scarves and neck accessories
help.spec.group.extra=Extra & Props
help.spec.extra.tail=tail: Swings independently
help.spec.extra.wings=wings: Mounted behind the body
help.spec.extra.objects=objects / prop: Any other separately controllable part
help.spec.group.notes=Key Best Practices
help.spec.note.eyelash=• Do not draw lower lashes on the eyelash layer to prevent distortion during eye closure;
help.spec.note.mouth=• Always draw the mouth in its fully open state; closed mouth shapes are generated by concentric compression;
help.spec.note.body=• Avoid severely tilted, recumbent, or horizontal character poses to maintain proper breathing and rotation physics;
help.spec.note.unknown=• Unrecognized layers move to the end and are marked unknown; assign a part manually in the Layers table.

