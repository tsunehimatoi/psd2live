help.tutorial.standard.intro=For PSDs generated by See-Through, import and export in 2 steps; check the result in the four workspace views before or after exporting:
help.tutorial.standard.step1.title=Step 1: Import PSD
help.tutorial.standard.step1.desc=Drag and drop your .psd file (or press Ctrl+Shift+O). Parts and meshes are generated automatically.
help.tutorial.standard.step2.title=Step 2: Export Model
help.tutorial.standard.step2.desc=Press Ctrl+G to export .cmo3 and .moc3 model pack.
help.tutorial.standard.step3.title=Step 3: Check the Result
help.tutorial.standard.step3.desc=The Edit tab shows the deformer tree and lets you inspect the mesh; the Preview tab verifies head turn, blinks and breathing; add more tabs with + and give each one its own view options, and open the History tab with Ctrl+H for version nodes.

help.tutorial.custom.intro=For custom or non-See-Through PSDs, simply match part presets in the bottom-right Inspector:
help.tutorial.custom.step1.title=Step 1: Import PSD
help.tutorial.custom.step1.desc=Drag and drop your custom .psd file (or press Ctrl+Shift+O).
help.tutorial.custom.step2.title=Step 2: Match Part Presets in Bottom-Right Inspector
help.tutorial.custom.step2.desc=In the bottom-right Inspector "Layers" table, choose the category (front_hair, eye, clothes, etc.) in "Part Preset"; select Left/Right for unilateral parts.
help.tutorial.custom.step3.title=Step 3: Export Model
help.tutorial.custom.step3.desc=Press Ctrl+G to export.
help.tutorial.project.intro=A .psd2live project is an unencrypted ZIP: one file carries the original PSD, images, every history branch and the UI state.
help.tutorial.project.step1.title=1. Save the project
help.tutorial.project.step1.desc=Press Ctrl+S. The first save asks for a location; later saves go straight there. Use Ctrl+Shift+S to save as.
help.tutorial.project.step2.title=2. Inspect history
help.tutorial.project.step2.desc=Open the History tab from the View menu (Ctrl+H), or press Ctrl+Y when a redo has several branches. Every save and every Agent edit appends one node.
help.tutorial.project.step3.title=3. Return to an older version
help.tutorial.project.step3.desc=Selecting a node shows its ID, parent, revision hash and timestamp; Restore to this version moves the workspace back without deleting any branch.
help.tutorial.project.step4.title=4. Branch and tidy up
help.tutorial.project.step4.desc=Editing from an older node creates a new branch automatically; nodes can be renamed, annotated, hidden or shown again, and hiding never deletes data.

help.tutorial.optional.title=Optional Advanced Features (As Needed):
help.tutorial.optional.desc=Freely select any of these features before or after exporting (click to open tutorial):
help.tutorial.optional.action=View Tutorial >
help.tutorial.optional.opt1.title=Adjust & Preview (Feature Selection)
help.tutorial.optional.opt1.desc=Tweak settings and parameters, then test gaze tracking, blinks and breathing in the Preview tab.
help.tutorial.optional.opt2.title=AI Texture Upscaling (Ctrl+U)
help.tutorial.optional.opt2.desc=Enlarge low-res textures 2×/4× with smooth transparent borders via Ctrl+U.
help.tutorial.optional.opt3.title=Create Variants
help.tutorial.optional.opt3.desc=Set layer type to Toggle Variant or Switch Variant in the Inspector.
help.tutorial.optional.opt4.title=AI Agent / MCP
help.tutorial.optional.opt4.desc=Connect an external AI host to inspect and edit the project [Warning: experimental, high token usage].

help.tutorial.preview.intro=After generation, fine-tune the model settings and parameters you need, then confirm the motion looks natural in the Preview tab:
help.tutorial.preview.step1.title=Fine-tune Model Settings & Parameters
help.tutorial.preview.step1.desc=• Model Settings: head strength, body strength and the physics toggle;\n• Parameters tab: search, lock and temporarily override any parameter; the play toggle at the top drives the idle animation;\n• Layers table: verify part recognition, visibility and parameter binding.
help.tutorial.preview.step2.title=Preview, Then Export
help.tutorial.preview.step2.desc=• Switch to the Preview tab and move the mouse to test gaze tracking and head turn;\n• Use the play toggle to watch blinks, breathing and physics sway;\n• Export with Ctrl+G once the motion looks right.

help.tutorial.upscale.intro=When artwork resolution is low or edges show artifacts, enhance texture quality with built-in AI upscaling:
help.tutorial.upscale.step1.title=Quick Launch Upscaler
help.tutorial.upscale.step1.desc=Press Ctrl+U or select "Tools" -> "Texture Upscaling…" from the top menu.
help.tutorial.upscale.step2.title=Scale Factor & Alpha Edge Smoothing
help.tutorial.upscale.step2.desc=• Supports 2× or 4× lossless upscaling;\n• Automatically smooths alpha channel edges and removes fringes to produce crisp Live2D texture sheets.

help.tutorial.variants.intro=Create variants in the bottom-right Inspector:
help.tutorial.variants.step1.title=Toggle Variants (Blush / Tears / Glasses)
help.tutorial.variants.step1.desc=• Set layer "Type" to "Toggle Variant";\n• Enter parameter name (e.g. blush, tears) in "Param Binding";\n• Fade in/out using the slider in the Parameters panel for independent accessories.
help.tutorial.variants.step2.title=Switch Variants (Mutually Exclusive States)
help.tutorial.variants.step2.desc=• Set mutually exclusive layers' "Type" to "Switch Variant";\n• Enter the same "Param Binding" (e.g. expression, arm_pose);\n• Assign sequential numbers (0, 1, 2...) in "Binding ID" for exclusive switching;\n• Typical Examples:\n  1. Expression Switch (e.g. expression): 0 Normal / 1 Joy / 2 Angry / 3 Cry\n  2. Gesture/Pose Switch (e.g. arm_pose): 0 Resting / 1 Waving / 2 Hands on Hips\n  3. Outfit/Hairstyle Switch (e.g. costume or hair_style): 0 Uniform / 1 Casual / 2 Dress
help.tutorial.variants.step3.title=Artwork Naming & Drawing Tips
help.tutorial.variants.step3.desc=• Auto Binding: eye_close (eyes), mouth_close (mouth), tooth_t/b, tongue (mouth clipping mask);\n• Upper Lashes: Draw upper lashes only (no lower eyelid lines);\n• Mouth & Body: Draw fully open mouth; keep body upright.

help.tutorial.agent.warning=[WARNING] Capabilities are experimental and unstable during testing. Not recommended for routine use. Repeated automated calls may consume substantial tokens without guaranteed results.
help.tutorial.agent.intro=Copy the client config from Tools → MCP → MCP Connection & Setup…, then paste it into ChatGPT Desktop / Codex, Gemini / Antigravity, or another host that supports Streamable HTTP:
help.tutorial.agent.ready.title=[Supported] Inspection & Screenshots
help.tutorial.agent.ready.desc=Read the project, hierarchy and parameters; render multi-pose views; import transparent artwork and attach accessories.
help.tutorial.agent.beta.title=[Experimental] Image Generation
help.tutorial.agent.beta.desc=Expression and motion variants, mouth-internal separation, hair separation with occlusion fill, and shadow layers; end to end still unstable.
help.tutorial.agent.unsupported.title=[Unsupported] Vertex Deformation
help.tutorial.agent.unsupported.desc=Precise per-point deformation of a part, which requires driving Warp and Mesh points individually.
help.tutorial.agent.tip=Tip: start by reading project state and object summaries before attempting any write.

help.spec.intro=PSD2Live supports English, Japanese, and Chinese layer aliases. Standardized naming and layering maximizes rigging quality:
help.spec.group.head=Head & Facial Components
help.spec.head.face=face / head: Facial base for center and 9-axis perspective; put blush, tear marks and other details in facedetail
help.spec.head.hairFront=front_hair / bangs: Front hair ArtMeshes attached to front hair physics deformer
help.spec.head.hairBack=back_hair: Back hair ArtMeshes attached to back hair physics deformer
help.spec.head.headwear=headwear / hat: Mounted on the head and kept out of the 9-axis facial deformation
help.spec.head.eyelash=eyelash: Upper eyelashes only! Open naturally; curves into a smooth U-shape on eye close (do not include lower lash)
help.spec.head.eyewhite=eyewhite: Sclera reference & closure baseline; clipping mask for irides
help.spec.head.eyeClose=eye_close: A pre-drawn closed-eye shape; use either this or the eyelash closure curve
help.spec.head.irides=irides / pupil / eye: Gaze tracking & jelly-eye spring dynamics
help.spec.head.eyebrow=eyebrow: Brow vertical movement and perspective follow
help.spec.head.nose=nose: 3D head orientation perception keypoint
help.spec.head.mouth=mouth / mouth_open: Must be drawn at maximum open state (crisp outlines recommended); closes concentrically
help.spec.head.mouthClose=mouth_close: A pre-drawn closed-mouth shape (optional)
help.spec.head.mouthInternals=tooth_t / tooth_b / tongue: Automatically clipped to mouth ArtMesh
help.spec.head.ears=ears / earwear / eyewear: Ears, earrings and glasses that follow head rotation
help.spec.group.body=Torso & Body Components
help.spec.body.neck=neck: Connects head rotation and torso movement
help.spec.body.topwear=topwear / clothes / shirt: Binds body XYZ orientation and chest Gaussian breathing expansion
help.spec.body.limbs=handwear / legwear / footwear (arm / hand / leg / foot): Arms, hands, legs and feet
help.spec.body.bottomwear=bottomwear: Pants and skirts
help.spec.body.neckwear=neckwear: Collars, scarves and neck accessories
help.spec.group.extra=Extra & Props
help.spec.extra.tail=tail: Swings independently
help.spec.extra.wings=wings: Mounted behind the body
help.spec.extra.objects=objects / prop: Any other separately controllable part
help.spec.group.notes=Key Best Practices
help.spec.note.eyelash=• Do not draw lower lashes on the eyelash layer to prevent distortion during eye closure;
help.spec.note.mouth=• Always draw the mouth in its fully open state; closed mouth shapes are generated by concentric compression;
help.spec.note.body=• Avoid severely tilted, recumbent, or horizontal character poses to maintain proper breathing and rotation physics;
help.spec.note.unknown=• Unrecognized layers move to the end and are marked unknown; assign a part manually in the Layers table.

