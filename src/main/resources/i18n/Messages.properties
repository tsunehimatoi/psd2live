toolDetails.noModel=Load a model to view tool details
tutorial.basic.hint.manual=Try the controls inside the frame, then choose Next.
tutorial.basic.hint.auto=Continues after the action. Choose Skip to explore later.
tutorial.basic.step.openFile.action=Click File in the frame, or choose Next to open it automatically.
tutorial.basic.step.import.action=Choose New project from PSD… and select a layered file. If you cancel, try again or skip this step.
tutorial.basic.step.preview.action=Open the mode menu in the highlight and pick Preview. If the canvas is already previewing, the tutorial continues automatically.
tutorial.basic.step.export.action=Click Export Live2D model… to open its options. Confirm output choices in that dialog to actually export files. Other formats such as Spine or video are under File → Export as.
tutorial.basic.targetMissing=The target is not visible yet. If no PSD is loaded, go back to import one, skip this step, or exit and restart.
tutorial.catalog.title=Interactive tutorial catalog
tutorial.catalog.desc=Choose the path that matches your experience, then learn in chapters highlighted directly in the workspace.
tutorial.common.continueNext=Continue: {0}
tutorial.common.openCatalog=Open tutorial catalog
tutorial.common.requireSelection=Select an artmesh or deformer in the highlighted hierarchy first, then continue.
tutorial.common.requireLayer=Select a layer in the hierarchy first, then continue paint steps.
tutorial.common.hint.prerequisite=Finish the highlighted selection before continuing; skip is disabled until then.
tutorial.common.progress.prepare=Before you start
tutorial.common.hint.required=Continues automatically once done; you can also exit the tutorial.
tutorial.common.step.openModel.title=Open a model first
tutorial.common.step.openModel.body=This chapter works on a model in the workspace. Import a layered PSD or open a saved .psd2live project; the lesson continues once the preview is ready. Larger files may take a moment.
tutorial.common.step.openModel.action=In the highlighted File menu, choose Import → New project from PSD… or Open project. To learn importing step by step, exit and start Basic workflow.
tutorial.basic.step.naming.title=Preset naming tips
tutorial.basic.step.naming.body=Some layers auto-match presets by name: eye_close, mouth_close, tooth_t / tooth_b, tongue. Draw upper lashes only; mouth at max open; body upright for binding.
tutorial.basic.step.naming.action=Compare layer names with the Preset column, then Next.
tutorial.variants.step.toggleWhy.title=Why toggle variants
tutorial.variants.step.toggleWhy.body=A toggle drives one layer visibility with a parameter — blush, tears, glasses, light overlays. Drag the parameter to show/hide.
tutorial.variants.step.toggleSetup.title=Set up a toggle
tutorial.variants.step.toggleSetup.body=Set Type to Toggle and fill a parameter name (e.g. blush). The same name can drive several toggle layers.
tutorial.variants.step.toggleSetup.action=Set one row to Toggle and fill a parameter (or review), then Next.
tutorial.variants.step.switchWhy.title=Why switch variants
tutorial.variants.step.switchWhy.body=Switch variants pick one of several looks: only one ID shows at a time — expressions, poses, costumes.
tutorial.variants.step.switchSetup.title=Set up a switch
tutorial.variants.step.switchSetup.body=Related rows share Switch + the same parameter name; set IDs to 0, 1, 2… e.g. expression: 0 normal / 1 happy.
tutorial.variants.step.switchSetup.action=Configure two rows with the same name and different IDs (or review), then Next.
tutorial.parameters.step.findTab.title=Find Parameters
tutorial.parameters.step.findTab.body=Open the Parameters dock tab on the right. Expand the inspector area if needed.
tutorial.parameters.step.findTab.action=Open Parameters, then Next.
tutorial.parameters.step.operate.title=Parameter key gestures
tutorial.parameters.step.operate.body=On a slider: left-drag scrubs the value; hover a key mark and right-click to snap to it. 2D pads work the same: left-drag freely, right-click snaps to the intersection of both parameters' keys. Parameter keys are modeling data, not keyframes on the animation timeline.
tutorial.basic.title=Basic workflow
tutorial.basic.desc=Import a PSD, preview, adjust layers and model presets, then export CMO3 / MOC3.
tutorial.workspace.title=Workspaces and flexible layout
tutorial.workspace.desc=Use the latest presets, then freely combine, split or detach canvases and modules.
tutorial.workspace.step.viewMenu.title=View options menu
tutorial.workspace.step.viewMenu.body=View on the canvas title bar stores mesh, deformer, path visibility, and custom canvas backgrounds (checker/solid/transparent). Each canvas keeps its own.
tutorial.workspace.step.viewMenu.action=Open the menu, browse items, then choose Next.
tutorial.workspace.step.camera.title=Zoom and pan
tutorial.workspace.step.camera.body=Scroll to zoom; drag with {key:PAN_VIEW} or {kbd:Space} to pan. {key:ZOOM_IN} / {key:ZOOM_OUT} / {key:ZOOM_RESET} zoom; {key:RESET_CAMERA} resets; {key:FRAME_VIEW} frames selection (later).
tutorial.workspace.step.done.title=Workspace tour complete
tutorial.workspace.step.done.body=Next, learn Hierarchy tree and mode bar — the core editing chrome.
tutorial.workspace.step.presets.title=Current workspace presets
tutorial.workspace.step.presets.body=New projects provide 8 presets: Edit, Mesh, Rig, Animation, Preview, Physics, Texture, and History. Each preset supplies task-specific canvases, modules and split ratios; create a Blank dock from "+".
tutorial.workspace.step.presets.action=Open the + menu in the workspace strip and browse the presets; you do not need to create one.
tutorial.workspace.step.switch.title=Switch and organize workspaces
tutorial.workspace.step.switch.body=Each top tab is an independent layout. Click to switch, middle-click to close, or drag to reorder. The context menu also renames, duplicates, closes others or restores the preset layout.
tutorial.workspace.step.switch.action=Switch between existing workspaces or drag one tab to observe reordering.
tutorial.workspace.step.texture.title=Texture workspace
tutorial.workspace.step.texture.body=The Texture workspace shows the atlas pages with each tile tinted by its density, and for the selected layer its canvas size, source pixels and atlas pixels. Drag a tile to move it, drag a selected tile’s corner to change its density, Arrange packs the tiles by their meshes, and switch the canvas between atlas and source pixels from the view rail.
tutorial.workspace.step.dockTabs.title=Combine any modules
tutorial.workspace.step.dockTabs.body=Canvases, Hierarchy, Parameters, Inspector, Animation and Physics are all dock modules. Drag a tab to reorder it or insert it between tabs in another strip.
tutorial.workspace.step.dockTabs.action=Drag a dock tab and watch the insertion marker in its own or another tab strip.
tutorial.workspace.step.split.title=Drop on an edge to split
tutorial.workspace.step.split.body=While dragging, the top, bottom, left and right edges of a target become drop zones. Drop to create a split, then drag its divider to resize. Canvases and panels follow the same rules.
tutorial.workspace.step.float.title=Detach into a window
tutorial.workspace.step.float.body=Drag a module outside the main window to detach it. Its title bar can return it to the dock; middle-click closes a tab, and the Window menu can show closed modules again.
tutorial.workspace.step.memory.title=Layouts are saved per workspace
tutorial.workspace.step.memory.body=Tab groups, split ratios, floating state, canvas modes and view options are stored per workspace. Reset Layout restores only this workspace's preset and never changes model content.
tutorial.workspace.step.sidebars.title=Top-right sidebar controls
tutorial.workspace.step.sidebars.body=The title bar shows left, top, bottom and right sidebar buttons according to the current layout. A button appears only when that side contains modules; its highlighted edge indicates the side, and its tooltip lists the modules.
tutorial.workspace.step.sidebars.action=Click a highlighted layout button to collapse its sidebar, then click again to restore it. No model or layout structure is deleted.
tutorial.hierarchy.title=Hierarchy & mode bar
tutorial.hierarchy.desc=Left hierarchy tree, layer import, draw-order ruler, and the mode bar with temporary session names.
tutorial.hierarchy.step.openTree.title=Open the hierarchy
tutorial.hierarchy.step.openTree.body=The tree shows deformer/artmesh parent links. The root shows Model Hierarchy and counts.
tutorial.hierarchy.step.toolbar.title=Search and expand
tutorial.hierarchy.step.toolbar.body=The top bar searches deformers/layers and expands or collapses all. There are no dedicated tree shortcuts — use this UI.
tutorial.hierarchy.step.treeBody.title=Rows and selection sync
tutorial.hierarchy.step.treeBody.body=Eye icons toggle visibility; parent badges mark ancestors; selecting in the tree highlights on canvas.
tutorial.hierarchy.step.treeBody.action=Select a node and watch the canvas, then choose Next.
tutorial.hierarchy.step.dragParent.title=Drag to reparent
tutorial.hierarchy.step.dragParent.body=Drag onto another deformer to reparent, or onto Move to Root. Dropping transparent images onto the tree imports layers (next step) — that is different from reparenting.
tutorial.hierarchy.step.contextDeformer.title=Deformer context menu
tutorial.hierarchy.step.contextDeformer.body=Add a parent warp, child warp or parent rotation deformer, import a layer, move to root, expand/collapse the branch, or delete (children move up).
tutorial.hierarchy.step.contextLayer.title=Layer context menu
tutorial.hierarchy.step.contextLayer.body=Solo, draw order, mesh settings, add parent deformer/path, Import Layer, delete. Solo is temporary edit visibility — not parameter-driven variants.
tutorial.hierarchy.step.importLayer.title=Import layer
tutorial.hierarchy.step.importLayer.body=Drop PNG / WebP / TIFF / BMP onto a tree node, or use Import Layer… in the context menu. The new layer appears under that node (or under a layer’s parent deformer), then a placement session opens.
tutorial.hierarchy.step.placeSession.title=Placement session
tutorial.hierarchy.step.placeSession.body=After import or create, the bottom-left placement panel appears; the session owns canvas clicks until Confirm or {key:CANCEL}. The mode bar shows a temporary session name (e.g. Place Layer). Confirming a placed layer returns to Select mode.
tutorial.hierarchy.step.drawOrder.title=Draw-order ruler
tutorial.hierarchy.step.drawOrder.body=Scroll to zoom the ruler, drag to change order, double-click to type a value. Same property as Inspector and the context menu.
tutorial.hierarchy.step.modeBar.title=Hierarchy mode bar
tutorial.hierarchy.step.modeBar.body=The mode menu at the top left lists every canvas mode: Select, Deform, Edit, Simulate, Skeleton, Paint and Preview (1-7 pick one while it is open). Without a target you get partFirst/layerFirst hints. Mode changes apply view presets. During a placement session, a session name appears beside the mode menu.
tutorial.hierarchy.step.modeBar.action=Open the mode menu and look through each mode, then choose Next.
tutorial.hierarchy.step.modeExtras.title=Mode extras
tutorial.hierarchy.step.modeExtras.body=Deform on a warp has the Vertices / Bezier levels; Edit shows grid size; Paint has FG/BG and apply/discard; temporary sessions add a session-name chip.
tutorial.hierarchy.step.gesturePreview.title=Select gestures preview
tutorial.hierarchy.step.gesturePreview.body=In Select: click, {kbd:Shift} add, {kbd:Alt} subtract, {kbd:Ctrl} +click walks hierarchy, drag marquee, {key:SELECT_ALL}, {key:CANCEL}. Practiced in the next lesson.
tutorial.hierarchy.step.done.title=Hierarchy lesson complete
tutorial.hierarchy.step.done.body=Hierarchy, draw order and the mode bar are now mapped. Continue with the next lesson in your current path.
tutorial.variants.title=Variants
tutorial.variants.desc=Layer types, toggle variants, and switch variants.
tutorial.variants.step.types.title=Layer types
tutorial.variants.step.types.body=Type column: Preset (auto parts), Toggle (show/hide by parameter), Switch (mutually exclusive looks). Learn toggle and switch next.
tutorial.variants.step.done.title=Variants complete
tutorial.variants.step.done.body=Continue with Parameters & keyforms.
tutorial.parameters.title=Parameters & keyforms
tutorial.parameters.desc=Find the Parameters panel, change values, and read parameter keys, keyforms and 2D links.
tutorial.parameters.step.panel.title=The parameter panel
tutorial.parameters.step.panel.body=Search, lock, reset, and folders organize parameters that drive variants and deformation.
tutorial.parameters.step.drag.title=Drag parameters
tutorial.parameters.step.drag.body=Sliders update Edit/Preview poses to check variants and motion range.
tutorial.parameters.step.drag.action=Drag a parameter, then Next.
tutorial.parameters.step.keys.title=Parameter keys and keyforms
tutorial.parameters.step.keys.body=Marks beside a parameter show where the selected object has keys. Each key stores a shape, the keyform. Round marks are regular keys, interpolated between each other; square marks are blend shape keys, which add a shape difference on top of the base shape.
tutorial.parameters.step.link.title=Parameter links
tutorial.parameters.step.link.body=Some parameters form a 2D link (XY pad). Use linking controls when you need combined drives; you need not master it now.
tutorial.parameters.step.done.title=Parameters complete
tutorial.parameters.step.done.body=You can now read parameters, parameter keys and keyforms. Continue with the next lesson in your current path.
tutorial.select.title=Select mode
tutorial.select.desc=Select tools, object gestures, tree/canvas sync.
tutorial.select.step.mode.title=Enter Select
tutorial.select.step.mode.body=Pick Select in the mode menu, or press {key:TOOL_SELECT} for the pick tool.
tutorial.select.step.mode.action=Ensure Select mode, then Next.
tutorial.select.step.tools.title=Select tools
tutorial.select.step.tools.body=Pick {key:TOOL_SELECT}, Lasso {key:TOOL_LASSO_SELECT}, Brush select {key:TOOL_BRUSH_SELECT}. Tools of one kind share a slot of the left toolbar, showing the last one used: click the active slot again or right-click it to open the rest beside it. In Select mode the last slot creates warps, rotations and paths.
tutorial.select.step.tools.action=Switch select tools, then Next.
tutorial.select.step.gestures.title=Object gestures
tutorial.select.step.gestures.body=Click select · {kbd:Shift} add · {kbd:Alt} subtract · {kbd:Ctrl} +click walks hierarchy · drag marquee · {key:SELECT_ALL} · {key:CANCEL}.
tutorial.select.step.sync.title=Tree and canvas sync
tutorial.select.step.sync.body=Selection syncs with the hierarchy. {key:FRAME_VIEW} frames the selection.
tutorial.select.step.sync.action=Select via tree and canvas, try F, then Next.
tutorial.select.step.extras.title=Marquee style & linked
tutorial.select.step.extras.body={key:SELECTION_STYLE_BOX} / {key:SELECTION_STYLE_LASSO} toggle box/lasso style; {key:SELECT_LINKED} selects linked points. Hold {key:TEMPORARY_SELECT} to select temporarily from another tool and return on release; {key:QUICK_PREVIEW} toggles a quick preview. Canvas context menu follows mode.
tutorial.select.step.done.title=Select complete
tutorial.select.step.done.body=Continue with Create deformers.
tutorial.create.title=Create deformers
tutorial.create.desc=Select in the hierarchy, create from context menus, confirm in the placement panel.
tutorial.create.step.selectFirst.title=Select in the hierarchy first
tutorial.create.step.selectFirst.body=Pick an artmesh or deformer in the tree before creating. This lesson blocks until a selection exists.
tutorial.create.step.selectFirst.action=Select a target in the highlighted tree.
tutorial.create.step.contextDeformer.title=Create from a deformer
tutorial.create.step.contextDeformer.body=Right-click a deformer to add parent/child warp or rotation. Creation opens a placement session.
tutorial.create.step.contextDeformer.action=Right-click a deformer and browse create items (cancel if you like).
tutorial.create.step.contextLayer.title=Create from a layer
tutorial.create.step.contextLayer.body=Right-click a layer to add a parent warp/rotation, or a deform path on meshed art. Placement confirm follows.
tutorial.create.step.contextLayer.action=Right-click a layer and browse Add items.
tutorial.create.step.placement.title=Bottom-left placement panel
tutorial.create.step.placement.body=After create, the bottom-left panel edits name, relation, and size/aim. {key:FINISH_PATH} confirms, {key:CANCEL} cancels. The session owns the canvas; the mode bar shows a temporary name.
tutorial.create.step.placement.action=Note the panel, session ownership, and confirm/cancel, then Next.
tutorial.create.step.done.title=Create complete
tutorial.create.step.done.body=Continue with Deform mode.
tutorial.deform.title=Deform mode
tutorial.deform.desc=Vertices / Bezier levels, point picks, deform brushes, axis lock and keyforms on parameter keys.
tutorial.deform.step.enter.title=Enter Deform
tutorial.deform.step.enter.body=Select the artmesh/deformer to edit, then enter Deform. If nothing is selected, finish the tree pick first.
tutorial.deform.step.enter.action=Select a target, then enter Deform.
tutorial.deform.step.levels.title=Vertices and Bezier
tutorial.deform.step.levels.body=When the target is a warp deformer, the mode bar shows two levels: Vertices edits the lattice points; Bezier bends the lattice with anchors and handles while its points are shown faint and take no edits. {key:PICK_OPTION_1} / {key:PICK_OPTION_2} switch levels. On a mesh, vertex, edge and face in the mode bar pick points as in Edit.
tutorial.deform.step.levels.action=Switch between Vertices and Bezier, then Next.
tutorial.deform.step.brushes.title=Deform brushes
tutorial.deform.step.brushes.body=Brush {key:TOOL_BRUSH}, Smooth {key:TOOL_SMOOTH}, Inflate {key:TOOL_INFLATE} — or drag points.\nImportant: hold {kbd:Alt} and right-drag to scrub brush radius/hardness live (axes map to different parameters).
tutorial.deform.step.brushes.action=Try a brush and one {kbd:Alt}+right-drag radius tweak.
tutorial.deform.step.shortcuts.title=Radius and axes
tutorial.deform.step.shortcuts.body={key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP} radius, {key:BRUSH_HARDNESS_DOWN} {key:BRUSH_HARDNESS_UP} hardness; {key:AXIS_CONSTRAIN_X} / {key:AXIS_CONSTRAIN_Y} axis lock. Prefer {kbd:Alt}+right-drag for live tweaks.
tutorial.deform.step.keys.title=Keyforms on parameter keys
tutorial.deform.step.keys.body=Move the parameter to the key you want to edit, then adjust the ArtMesh or deformer. Shapes between keys are interpolated, which produces head turns, eye and mouth open/close and similar motion.
tutorial.deform.step.undo.title=Undo / redo
tutorial.deform.step.undo.body={key:UNDO} undo; {key:REDO} redo. Avoid mid-gesture mode switches.
tutorial.deform.step.done.title=Deform complete
tutorial.deform.step.done.body=Continue with Edit mode topology.
tutorial.edit.title=Edit mode
tutorial.edit.desc=Subdivide, knife, and safe topology edits.
tutorial.edit.step.enter.title=Enter Edit
tutorial.edit.step.enter.body=Edit forces mesh display for topology, not freeform pulling. Vertex, edge and face in the mode bar ({key:PICK_OPTION_1}–{key:PICK_OPTION_3}) set what the selection tools pick.
tutorial.edit.step.enter.action=Enter Edit, then Next.
tutorial.edit.step.topo.title=Subdivide & knife
tutorial.edit.step.topo.body=Subdivide {key:TOOL_SUBDIVIDE}, Knife {key:TOOL_KNIFE}. Drag mesh points to reshape topology; Knife cuts along a stroke.
tutorial.edit.step.delete.title=Delete points
tutorial.edit.step.delete.body={key:DELETE_SELECTION} deletes selected points. Confirm the selection before large edits.
tutorial.edit.step.viewAids.title=View aids
tutorial.edit.step.viewAids.body=Bottom-right view bar or View menu can show deform paths while editing topology.
tutorial.edit.step.when.title=When to edit topology
tutorial.edit.step.when.body=Use Edit when the mesh is too coarse; everyday shaping stays in Deform.
tutorial.edit.step.done.title=Edit complete
tutorial.edit.step.done.body=You now understand the division between deformation and topology editing. Continue with your current path.
tutorial.paint.title=Paint mode
tutorial.paint.desc=Paint tools, apply/discard session, paint undo.
tutorial.paint.step.layerFirst.title=Select a layer first
tutorial.paint.step.layerFirst.body=Painting requires a selected layer; otherwise the mode bar asks you to select one first.
tutorial.paint.step.layerFirst.action=Select a layer and enter Paint, then Next.
tutorial.paint.step.tools.title=Paint tools
tutorial.paint.step.tools.body=Brush {key:TOOL_PAINT_BRUSH}, pencil {key:TOOL_PAINT_PENCIL}, eraser {key:TOOL_PAINT_ERASER}, bucket {key:TOOL_PAINT_BUCKET}, eyedropper {key:TOOL_PAINT_EYEDROPPER} and shapes {key:TOOL_PAINT_LINE}; shortcuts follow the toolbar and your bindings.
tutorial.paint.step.tools.action=Switch paint tools, then Next.
tutorial.paint.step.shortcuts.title=Brush shortcuts
tutorial.paint.step.shortcuts.body=Radius {key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP}, hardness {key:BRUSH_HARDNESS_DOWN} {key:BRUSH_HARDNESS_UP}, opacity {key:PAINT_OPACITY_DOWN} {key:PAINT_OPACITY_UP}; shape cycle {key:PAINT_SHAPE_CYCLE}. Paint also supports {kbd:Alt}+right-drag tip tweaks.
tutorial.paint.step.session.title=Apply or discard
tutorial.paint.step.session.body=Paint sessions have their own undo. Mode bar apply/discard; apply may rebuild mesh.
tutorial.paint.step.return.title=Back to shaping
tutorial.paint.step.return.body=After touch-ups, return to Select or Deform to adjust the base shape and the keyforms on parameter keys.
tutorial.paint.step.return.action=Return to Select, then Next.
tutorial.paint.step.done.title=Paint complete
tutorial.paint.step.done.body=Continue with Inspector.
tutorial.inspector.title=Inspector
tutorial.inspector.desc=Type-specific properties and three draw-order entries.
tutorial.inspector.step.open.title=Open Inspector
tutorial.inspector.step.open.body=Empty until something is selected; then shows matching properties.
tutorial.inspector.step.open.action=Open Inspector and select something, then Next.
tutorial.inspector.step.artmesh.title=ArtMesh properties
tutorial.inspector.step.artmesh.body=Clipping mask, draw order, opacity, blend mode, culling, user data and more.
tutorial.inspector.step.deformers.title=Deformer properties
tutorial.inspector.step.deformers.body=Warp deformers have Bezier division and edit level; rotation deformers and deform paths have their own fields (such as a path's curve, width and closed flag).
tutorial.inspector.step.drawOrder.title=Three draw-order entries
tutorial.inspector.step.drawOrder.body=Inspector, tree context menu, and ruler edit the same property.
tutorial.inspector.step.done.title=Inspector complete
tutorial.inspector.step.done.body=You can now locate properties by object type. Continue with the next lesson in your current path.
tutorial.tools.title=Tool options
tutorial.tools.desc=The options bar, the context menu and the Tool Details panel, and how they map to shortcuts.
tutorial.tools.step.open.title=The options bar
tutorial.tools.step.open.body=At the canvas's bottom left, the options bar follows the tool in hand: drag a value sideways to scrub it, or click it for a slider. Right-click the canvas for the same values and the tool's actions.
tutorial.tools.step.open.action=Select a part so the bar shows its options, then Next.
tutorial.tools.step.brushes.title=Brush parameters
tutorial.tools.step.brushes.body=Deform and paint brushes share size/hardness; {key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP} drive the same values.
tutorial.tools.step.split.title=Toolbar, bar and menu
tutorial.tools.step.split.body=The left toolbar picks the tool: tools of one kind share a slot, and clicking the active slot again or right-clicking it opens the rest. A tool's variants (brush tips, paint shapes, sub-tools) lead the options bar as icons, and {key:PICK_OPTION_1}–{key:PICK_OPTION_5} pick them. The options bar at the bottom left tunes the tool; the mode bar picks the work mode and holds the confirm and cancel of a step in hand. Right-click the canvas for the same values; longer command groups open a second pane beside the menu.
tutorial.tools.step.advanced.title=Advanced settings
tutorial.tools.step.advanced.body=The Tool Details panel keeps what needs more room: numeric transforms, create defaults, the path list, skeleton binding and weights, and the paint palette.
tutorial.tools.step.shortcuts.title=Shortcut presets
tutorial.tools.step.shortcuts.body=Change Photoshop / Blender / Cubism presets or custom bindings under Settings → Shortcuts. Tutorial keycaps follow your current bindings.
tutorial.tools.step.done.title=Tool options complete
tutorial.tools.step.done.body=The roles of the toolbar, options bar, context menu and Tool Details panel are clear. Next: skeleton rigging and posing.
tutorial.project.title=Project & history
tutorial.project.desc=Save .psd2live, recent files, the History workspace, branches and updating the generated rig.
tutorial.project.step.save.title=Save project
tutorial.project.step.save.body={key:SAVE_PROJECT} saves; {key:SAVE_PROJECT_AS} Save As. The project is an unencrypted ZIP with PSD, history and UI state. File > Open Recent and the start screen list the projects and PSDs you opened lately; files that no longer exist are hidden.
tutorial.project.step.historyTab.title=History tab & preset
tutorial.project.step.historyTab.body={key:OPEN_HISTORY_TAB} opens the History tab, or switch to the dedicated History workspace preset. Saving the project or an Agent (MCP) edit commits a new node whenever the content has changed.
tutorial.project.step.historyTab.action=Click the highlighted History tab (or use the shortcut).
tutorial.project.step.restore.title=Restore a version & search
tutorial.project.step.restore.body=Double-click a node card to check out that version directly. The toolbar includes search filtering and highlights the full branch path to HEAD without deleting other branches.
tutorial.project.step.branch.title=Branches
tutorial.project.step.branch.body=Editing from an old node creates a branch; rename, note, or hide nodes (data kept).
tutorial.project.step.regenerate.title=Update the generated rig
tutorial.project.step.regenerate.body=A project keeps the generated rig your edits were made on, so upgrading PSD2Live never changes it by itself. When you want this version's generators, choose Tools > Update Generated Rig: it regenerates and merges your edits on top. What could not be carried over is listed in the quality report.
tutorial.project.step.done.title=Project lesson complete
tutorial.project.step.done.body=Optional: Texture upscale, or reopen the catalog.
tutorial.upscale.title=Texture upscale
tutorial.upscale.desc=AI upscale textures, then recheck mesh and export.
tutorial.upscale.step.entry.title=Entry
tutorial.upscale.step.entry.body=Open Tools → Texture Upscale…, or press {key:TEXTURE_UPSCALE}. Useful when source art is low-res.
tutorial.upscale.step.entry.action=In the highlighted Tools menu, click Texture Upscale….
tutorial.upscale.step.scale.title=Scale
tutorial.upscale.step.scale.body=Usually 2× / 4×. Denser pixels may change how the mesh looks.
tutorial.upscale.step.check.title=Recheck and export
tutorial.upscale.step.check.body=After upscale, inspect mesh/deformers in Edit, verify Preview, then re-export.
tutorial.upscale.step.done.title=Path complete
tutorial.upscale.step.done.body=You finished your current path. Reopen any lesson from the catalog under Help → Tutorials.

# Tutorial learning paths and current canvas features
tutorial.path.beginner.title=New to Live2D
tutorial.path.beginner.desc=Start with layered PSDs, parts and parameters, then continue through editing, motion, physics and export. No Cubism experience required.
tutorial.path.experienced.title=Experienced with Live2D / Cubism
tutorial.path.experienced.desc=Map familiar ArtMesh, Deformer and Parameter concepts to PSD2Live, focusing on auto-generation, canvas modes, skeletons, animation and physics.
tutorial.path.start=Start this path
tutorial.live2dBridge.title=Live2D user bridge
tutorial.live2dBridge.desc=Map Cubism concepts to PSD2Live and understand the auto-generation workflow.
tutorial.live2dBridge.step.workspace.title=Start with workspace presets
tutorial.live2dBridge.step.workspace.body=The top workspaces are task layouts: Edit, Mesh, Rig, Animation, Preview, Physics, Texture and History. They share one project and only store different canvas and dock arrangements.
tutorial.live2dBridge.step.structure.title=ArtMeshes and deformers
tutorial.live2dBridge.step.structure.body=Imported PSD layers become ArtMeshes. PSD2Live's warp deformers and rotation deformers map to Cubism's; deform paths are an experimental PSD2Live tool that exports as baked mesh keyforms. Parenting controls inherited deformation; draw order alone controls overlap.
tutorial.live2dBridge.step.modes.title=Canvas modes
tutorial.live2dBridge.step.modes.body=Select operates on objects, Deform authors keyforms on parameter keys, Edit changes mesh topology, Simulate paints the vertex groups cloth and hair simulations read, Skeleton poses or reshapes the armature, Paint modifies layer pixels and Preview plays the model. The mode menu keeps these tool contexts separate.
tutorial.live2dBridge.step.parameters.title=Parameters and keyforms
tutorial.live2dBridge.step.parameters.body=The Parameters dock maps to Cubism parameters. Round marks are regular keys, square marks are blend shape keys, and a 2D link drives two parameters at once. Keyforms on parameter keys are modeling data; do not confuse them with keyframes on the animation timeline.
tutorial.live2dBridge.step.export.title=Export is a build product
tutorial.live2dBridge.step.export.body=.psd2live stores PSD2Live's artwork, edits and branch history. CMO3 is a model project you can keep editing in Cubism Editor. The runtime deliverable is MOC3 together with model3.json, textures and, when enabled, physics and other files. File > Export as also writes VTube Studio, the PSD2Live runtime (web player, Godot), image sequences and video. Save the project before exporting.
tutorial.live2dBridge.step.done.title=Concept mapping complete
tutorial.live2dBridge.step.done.body=Continue with a quick workspace tour, then focus on PSD2Live's newer canvas features.
tutorial.skeleton.title=Skeleton rigging and editing
tutorial.skeleton.desc=Build and edit skeletons in Skeleton mode, batch-bind ArtMeshes, pose with FK/IK, paint skin weights and save poses.
tutorial.skeleton.step.panel.title=Skeleton dock
tutorial.skeleton.step.panel.body=Skeletons are PSD2Live's fast limb-rigging tool, not a standalone bone object in the Cubism model. Create body, limb, tail or wing chains, and disable a rig without deleting its data.
tutorial.skeleton.step.panel.action=Open the highlighted Skeleton dock and locate Create Skeleton.
tutorial.skeleton.step.mode.title=Skeleton mode
tutorial.skeleton.step.mode.body=Skeleton in the mode menu is dedicated to the armature: with an enabled skeleton it opens Pose Bones, otherwise Edit Bones. Switch between them in the left toolbar. Switching to posing or leaving the mode saves your edits; Cancel discards them.
tutorial.skeleton.step.mode.action=Open the highlighted mode menu and find Skeleton. Entering without a skeleton proposes a new one.
tutorial.skeleton.step.build.title=Create, extrude and arrange bones
tutorial.skeleton.step.build.body=Edit Bones has sub-tools: Edit (drag joints; {kbd:Shift}-click or box-select several bones to move, rotate or scale them together), New Bone (drag from head to tail), Extrude (pull child bones from the selected tip, one after another), Bind and Weights. Tool Details also renames bones, sets parent and connection, and duplicates, mirrors (with symmetric editing), subdivides or dissolves them into the parent.
tutorial.skeleton.step.bind.title=Place and bind on canvas
tutorial.skeleton.step.bind.body=With Bind, pick the target bone in the tree, then click meshes or drag a box to preview and bind several at once ({kbd:Shift}-box adds more). Existing bindings can be removed in bulk too.
tutorial.skeleton.step.pose.title=Pose and IK
tutorial.skeleton.step.pose.body=Pose Bones offers Auto, FK and IK. In Auto, drag a bone to rotate it; drag an endpoint or hold {kbd:Shift} for IK. IK settings cover root bone, iterations, tolerance and bend direction, and Pin selected tip keeps solving while parameters change. Posing drives parameters without editing the source mesh.
tutorial.skeleton.step.pose.action=Inspect the skeleton overlay and, if available, drag an endpoint.
tutorial.skeleton.step.weights.title=Paint and clean skin weights
tutorial.skeleton.step.weights.body=Automatic weights diffuse smoothly across mesh topology. To fix them by hand, use Weights: pick a bound mesh and a bone in the same limb, then paint add, subtract, replace or smooth. Tool Details normalizes and cleans, restores automatic weights, or copies and mirrors weights to another mesh by triangle interpolation, nearest vertex or matching topology. Show skin weights while posing to check joints.
tutorial.skeleton.step.snapshots.title=Save and reuse poses
tutorial.skeleton.step.snapshots.body=While posing, Tool Details saves the current model parameters under a name and applies them later (same name overwrites; values clamp to parameter ranges). The animation editor can insert a saved pose at the playhead.
tutorial.skeleton.step.sampling.title=Parameter sampling & keyform limits
tutorial.skeleton.step.sampling.body=At the bottom of the Skeleton dock, configure sampling tolerance, minimum angle step, and max mesh keyforms. Real-time point counts preview total and selected bone points to prevent keyform bloat.
tutorial.skeleton.step.sampling.action=Inspect the Parameter Sampling section at the bottom of the Skeleton dock.
tutorial.skeleton.step.done.title=Skeleton lesson complete
tutorial.skeleton.step.done.body=On export, bones, weights and IK results are baked into Cubism parameters, warp/rotation deformers and mesh keyforms; Cubism Editor does not keep PSD2Live's skeleton semantics. Next, author and preview a custom motion.
tutorial.animation.title=Animation and motion editor
tutorial.animation.desc=Create motions, auto-key changes, record poses, edit keys and preview on canvas.
tutorial.animation.step.motions.title=Motion list
tutorial.animation.step.motions.body=The Animation dock separates preset and custom motions. Each preset has its own knobs, such as sway, breath, head, speed and blink for the idle or count for nod and shake; they save with the project and drive preview, editor and export alike, until keys are edited by hand. Create a blank motion or copy a preset; deleted presets come back from the New Motion menu. The panel's play button shares one motion and playhead with the animation editor.
tutorial.animation.step.motions.action=Open the Animation dock and select or create a motion.
tutorial.animation.step.editor.title=Timeline and tracks
tutorial.animation.step.editor.body=Add parameter tracks in the editor. Use the dope sheet for timing and curves for easing. Double-click a track to add a key; key markers and guides appear beside track names.
tutorial.animation.step.autoKey.title=Auto-keying
tutorial.animation.step.autoKey.body=Enable Auto-Key in the toolbar. Adjusting any parameter slider, 2D pad, or canvas pose will automatically record a keyframe at the playhead; untracked parameters are automatically archived into motion curves.
tutorial.animation.step.autoKey.action=Toggle the Auto-Key chip in the editor toolbar, or scrub a parameter at the playhead to auto-record a key.
tutorial.animation.step.keys.title=Record poses & Bezier easing
tutorial.animation.step.keys.body=In manual mode, pose parameters first, then click Record Pose to write values at the playhead. Keys default to smooth Bezier interpolation, with keyframe markers shown beside track names.
tutorial.animation.step.keys.action=Move the playhead and record a pose, or double-click a track to add a key.
tutorial.animation.step.preview.title=Live canvas preview & shared pose
tutorial.animation.step.preview.body=The canvas updates while the motion plays. All canvases in the workspace share the same parameter pose, keeping pose state synchronized when switching between animation, preview, and edit modes.
tutorial.animation.step.done.title=Animation lesson complete
tutorial.animation.step.done.body=Next, tune pendulums and output ranges on the same preview canvas.
tutorial.physics.title=Physics canvas tuning
tutorial.physics.desc=Build physics groups, manipulate pendulums on canvas and calibrate outputs.
tutorial.physics.step.groups.title=Physics groups
tutorial.physics.step.groups.body=The Physics dock manages preset, skeleton, swing and custom groups, plus pendulums baked from simulations. Groups can be duplicated, ordered, disabled or reset.
tutorial.physics.step.groups.action=Open the Physics dock and select a group, or create a blank pendulum.
tutorial.physics.step.pendulum.title=Edit pendulums on canvas
tutorial.physics.step.pendulum.body=Canvas rings are pendulum segments: drag to change length and click to select. Drag an output badge beside a segment to choose its sampled angle.
tutorial.physics.step.io.title=Inputs, outputs and conflicts
tutorial.physics.step.io.body=Inputs feed position or angle into the simulation; outputs drive parameters. Invalid parameters, feedback and contested outputs are flagged in place.
tutorial.physics.step.test.title=Pull and calibrate
tutorial.physics.step.test.body=Drag empty canvas space to pull the model, watch reach and range fans, then fit output scale to avoid clipping at parameter endpoints.
tutorial.physics.step.test.action=Drag once inside the highlighted canvas and watch the pendulum response.
tutorial.physics.step.done.title=Physics lesson complete
tutorial.physics.step.done.body=Physics is done. Next: Cloth and hair simulation.
tutorial.simulation.title=Cloth and hair simulation
tutorial.simulation.desc=Generate hair and clothing simulation from the model presets in one step, then learn bodies, vertex groups, material, inputs and outputs and bake settings, and bake into exportable parameters and pendulums.
tutorial.simulation.step.presets.title=Start from the model presets
tutorial.simulation.step.presets.body=The Physics & Simulation group of the Model Presets panel makes common parts simulate in one step: front and back hair each have a dropdown, clothing and eye jelly are checkboxes, and the grey note beside each tells its state (not in the artwork, no clothing found, not baked and so on). Presets create ordinary simulation bodies and vertex groups that you can keep tuning in the Simulation panel, so generating from a preset first and refining afterwards is the quickest route.
tutorial.simulation.step.generate.title=Generate hair or clothing simulation
tutorial.simulation.step.generate.body=If the model has no simulation body yet, make one here: set the front or back hair dropdown to Simulate, or check Clothing. Each change is one undo step; the bake follows in the background, so you can keep editing, and lands as its own undo step. Progress and Cancel are in the status bar at the bottom. When bodies already exist, this step continues by itself.
tutorial.simulation.step.generate.action=Set Front hair or Back hair to Simulate in the highlighted group, or check Clothing; the lesson continues once a body exists. If the artwork has neither hair nor clothing, choose Skip.
tutorial.simulation.step.hairModes.title=The three hair modes
tutorial.simulation.step.hairModes.body=Simulate: all meshes of that hair become one hair body (Front hair (preset) or Back hair (preset)). Each strand, meaning each connected piece of a mesh, is pinned at its own top and freed toward the tip, and only the pin group is written. The hair's former sway parameter, deformers and pendulum are removed while the artwork stays in place.\nClassic sway: deletes that body and restores the old deformer sway, one pendulum swinging the hair as a whole; cheap, but without the feel of cloth.\nOff: neither simulated nor swaying; the hair follows the head and stays still.
tutorial.simulation.step.clothing.title=Clothing, eye jelly and the toolbar
tutorial.simulation.step.clothing.body=Checking Clothing reads the top, bottom, neckwear, sleeve and legwear layers and simulates only what the artwork shows hanging loose (ruffles, bows, flared hems, coat flaps, skirts); tight parts keep following the rig. Bottoms are told apart as skirt or trousers by name or silhouette. Under the row, each simulated garment is listed with how much of it hangs loose and its mesh, followed by the garments worn tight; unchecking removes all clothing simulation. Eye jelly switches the jelly pendulum of the eyes.\nIn the toolbar, Selected only (n) makes a checkbox act on the selected layers only, and Auto pin weights recomputes pin, mass and the other weights of simulated meshes by part and bakes again, which restores weights you have painted out of shape.
tutorial.simulation.step.bodies.title=Simulation dock and bodies
tutorial.simulation.step.bodies.body=The Simulation dock sits after Physics. Each row of Bodies is a set of meshes simulated together: the checkbox on the left enables or disables it (disabled bodies neither simulate nor export but keep their bake), and the state on the right reads a green dot for baked, yellow Stale when export still uses an old bake, and red Not baked when nothing exports. Right-click to bake, clear the bake or delete.\nTo make one by hand, select meshes and choose New in the toolbar, then Cloth or Hair. With a row selected, the editor below shows Bake, Material, Inputs, Outputs, Glue and Vertex groups, explained in the next steps.
tutorial.simulation.step.bodies.action=Open the highlighted Simulation dock and select a body in the list, such as Back hair (preset) made by the preset.
tutorial.simulation.step.weights.title=Paint vertex groups in Simulate mode
tutorial.simulation.step.weights.body=A vertex group gives each vertex of a mesh a value from 0 to 1 that tells the simulation where to hold, where to be stiffer or heavier. Groups exist only in this editor and are not written into exported files. With Simulate chosen in the mode menu, the left toolbar holds Weight paint and Weight gradient, with the weight kinds listed below them; click a kind as you would a brush shape.\nBrush modes: Add raises weights by the strength, Subtract lowers them, Set pulls them toward the strength and Smooth averages with neighbours; hold {kbd:Alt} to swap Add and Subtract. The ring marks the vertices a press reaches, the number is the weight under the pointer, and a heat map colours the whole mesh. Weight gradient is dragged from where the weight should be full to where it should fade. Tool Details sets radius, hardness and strength, and offers Fill, Clear, Invert and Delete group.
tutorial.simulation.step.weights.action=Select a layer used by a simulation in the hierarchy, switch to Simulate and paint a few strokes with the weight brush.
tutorial.simulation.step.weightKinds.title=What each weight kind means
tutorial.simulation.step.weightKinds.body=Pin: vertices held by the rig; the weight is how firmly. 1 follows the rig fully, 0 leaves the vertex to the simulation, and values in between are a springy soft hold. Hair is usually pinned at the roots and skirts at the waistline; the simulation needs pins, or glue used as a pin, to know where the body hangs.\nStiffness: scales stretch and bend stiffness per vertex, for a stiff root fading into a soft hem.\nShape: scales the spring back toward the drawn shape per vertex, holding up shapes gravity would flatten such as a flared skirt or upturned tips.\nMass: scales mass per vertex; heavier hems and tips lag and overshoot more.\nDamping: scales how fast motion dies down per vertex; higher weights settle sooner and calm jittery corners.\nEach mesh has one group per kind. Presets write only the groups they need: hair writes pin only, clothing also writes mass.
tutorial.simulation.step.glue.title=Glue roles
tutorial.simulation.step.glue.body=When a simulated mesh is glued to other meshes, the Glue section lists each glue with a role: Ignore (default; the simulation leaves it alone and it only welds at runtime), Pin (the simulated side follows the other mesh as it actually deforms, such as a skirt hanging from the waist) or Hold together (keeps the seam closed when both sides simulate, such as separate front and back panels). Glue never becomes a pin on its own; choose it here.
tutorial.simulation.step.material.title=Material presets
tutorial.simulation.step.material.body=The Preset dropdown at the top of Material fills in the values of a named material. Cloth has cotton (default), silk (light and soft, swings long), chiffon (lightest, stopped quickly by the air), wool (heavy and soft, starts late and stops soon), denim (heavy and stiff, wide folds), leather (stiffest, swings almost as a whole) and elastic (stretches and springs back, for straps and socks). Hair has hair (default), fine hair (bends and parts easily) and thick hair (swings as a whole and keeps its shape). Every value stays adjustable; once they match no preset the dropdown shows Custom, and the section's Back to the preset of this kind takes changes back. Switching a body's kind applies that kind's preset.
tutorial.simulation.step.material.action=With a body selected, pick another material in the Material preset; you can compare the swing in Reference sim later.
tutorial.simulation.step.materialValues.title=Material values
tutorial.simulation.step.materialValues.body=Mass: relative density; each vertex weighs its share of the mesh area, so a finer mesh is not a heavier cloth. Stretch: resistance to getting longer; keep cloth and hair near 1. Bend: how sharply it may curve, low like soft silk, high like card. Area: how firmly each triangle keeps its area; low lets thin cloth bunch up as it folds in depth, high keeps heavy parts in shape, and triangles never flip either way. Grain: how much softer it is across the grain, which runs away from the pins; high lets strands part and fold lengthwise without stretching. Damping: how fast motion dies down per second. Shape: a spring back toward the drawn shape, 0 is pure physics. Slack: how far past its resting path a vertex may move from the pins in a hard fling. Hover a name for its explanation.
tutorial.simulation.step.inputs.title=Inputs and outputs
tutorial.simulation.step.inputs.body=Inputs are the parameters that shake the body, used exactly as listed. A new body gets the head and body angles the model has (angle X / Z, body X / Z) plus nodding, body up-down and lean; parameters the model no longer has are flagged missing. Add or remove parameters freely; when the list differs from the default the section offers Reset to the default inputs, and an empty list cannot bake. Vertical inputs bake apart into a Y parameter when needed, showing the body lag and bounce up and down.\nOutputs list the mode parameters and pendulums a bake made. Click a name to rename it; this needs no new bake and the IDs stay.
tutorial.simulation.step.bakeSettings.title=Bake settings
tutorial.simulation.step.bakeSettings.body=The Bake section shapes the exported result:\nModes (1–3, default 2): how many parameters are made. The first is the overall swing; each later one only adds the bending, bunching and compression the ones above cannot show. Long strands and ribbons may use 3.\nKeys (3 / 5 / 7 / 9, default 5): keys on each mode parameter; more follow arcs closer and add keyforms, not parameters.\nExaggeration (×1–×2, default ×1.3): how much larger the swing is than the simulation; it takes effect at once without a new bake.\nAdvanced holds Exact poses (parameters whose settled shape is made exact at every key, up to four) and Modes as (Auto, Blend shapes or Keyform axes; both play the same, blend shapes need Cubism 4.2+, and Auto uses them only when a mesh would exceed 64 keyforms).
tutorial.simulation.step.bake.title=Only a bake exports
tutorial.simulation.step.bake.body=The live simulation runs only in the editor; Cubism does not simulate like this. A bake drives the simulation with a library of head turns and body shakes and fits the result into mode parameters, keyforms and a Cubism pendulum, so the exported model moves like the Export preview. It usually takes a few seconds.\nChoose Bake in the body's Bake section, or Bake all in the toolbar (every unbaked or stale body as one undo step). Bake automatically is off by default; when on, each panel edit bakes again. After a bake the section shows the fit (R² and error, R² below 0.8 in warning colour). Changing settings, meshes or weights afterwards turns the body Stale and export keeps the old bake until you bake again; Clear bake removes the parameters, keyforms and pendulum it made.
tutorial.simulation.step.bake.action=Choose Bake on the selected body, or Bake all in the toolbar, and watch the progress in the status bar.
tutorial.simulation.step.preview.title=Export result and reference sim
tutorial.simulation.step.preview.body=The preview switch in the toolbar chooses what the canvas plays. Off is Export: the fitted pendulum drives the bake exactly as the exported model moves, and unbaked bodies stay still. On is Reference sim: the editor runs its own simulation for comparison, which never exports and is marked in the canvas corner; the reset button beside it brings the live simulation back to rest. Tune the material in Reference sim, then switch back to Export after baking to see the difference.\nBaked pendulums appear in the Physics dock marked Simulation and their parameters in the physics folder of the parameter list; renaming a pendulum in the Physics dock renames the body's output.
tutorial.simulation.step.preview.action=Turn the preview switch on for Reference sim, turn the head in the parameter panel to watch it, then turn the switch off to compare with Export.
tutorial.simulation.step.done.title=Simulation lesson complete
tutorial.simulation.step.done.body=Simulation is done. Remember to bake after tuning, before you export. Next: Project and history.

