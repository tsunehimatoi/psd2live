tutorial.basic.step.openFile.title=Open the File menu
tutorial.basic.step.openFile.body=Click File on the left of the title bar. Or press Next to continue.
tutorial.basic.step.import.title=Import a PSD
tutorial.basic.step.import.body=In the menu on the left, click Import PSD… and open your layered artwork.
tutorial.basic.step.preview.title=Switch to Preview
tutorial.basic.step.preview.body=Open the mode menu at the top left of the canvas and pick Preview to see the model animate live.
tutorial.basic.step.layers.title=Meet the Layers panel
tutorial.basic.step.layers.body=The frame covers the entire Layers panel. It lists PSD layers and their detected types, preset parts and sides. Compare names with the assigned parts. The next step focuses on one row and explains how to correct a mismatch.
tutorial.basic.step.layerRow.title=Correct a mismatched preset
tutorial.basic.step.layerRow.body=The frame marks one layer. Check its name to identify the actual part. For a preset-driven part, set Type to Preset, then select the matching part and check its side. For example, correct a hair layer assigned to a different body part by choosing the appropriate hair preset.
tutorial.basic.step.settings.title=Model Presets panel
tutorial.basic.step.settings.body=Model presets control deformation, motions and simulation. Hair and clothing presets generate Pin weights and bake simulations; texture atlas controls are in Export.
tutorial.basic.step.export.title=Export the model
tutorial.basic.step.export.body=Export opens a settings window. CMO3 is a model project you can keep editing in Cubism Editor. A runtime bundle contains MOC3 plus model3.json, textures and, when enabled, physics and other files; deliver the whole set, not the MOC3 alone.
tutorial.basic.step.done.title=Basic tour finished
tutorial.basic.step.done.body=You have walked import, preview, layers, settings, and export. Continue to Workspace tour, or open the catalog. Restart anytime from Help.
