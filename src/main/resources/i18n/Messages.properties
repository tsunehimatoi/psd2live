editor.glueBrushHint=Select two meshes and enter Edit: both are edited together, and each glued point is one diamond that selects and moves both meshes at once. The glue brush makes the other mesh gain or slide a vertex (UV included) onto each brushed vertex, so the picture never moves. Alt-drag unglues. The weight brush washes A in blue and B in orange; Alt subtracts. Ctrl+G glues the selected vertices.

editor.objectHint=Click to select · Shift add · Alt subtract · Ctrl+Click walks the hierarchy   Drag to marquee   In the hierarchy and layer list, Shift selects a range and Ctrl toggles   {key:SELECT_ALL} select all   {key:CANCEL} cancel

editor.apply=Apply
editor.extend=Extend
editor.createRotation=Create rotation deformer
editor.selectionCount={0} objects / {1} points selected
editor.rotationBrush=Use move, rotate or scale for a rotation deformer

editor.creationSelectFirst=Select the artwork to bind, then drag to create.
editor.rotationGestureHint=Drag origin: move · Drag tip: rotate · Shift: 15° snap · Alt + tip: scale
editor.rotationScopeHint=Inserts as the direct parent of the selection; the canvas highlights what remounts.
editor.rotationMountHint=Mount: insert as parent of the selected mesh/deformer (keeps its former parent).
editor.rotationScopeCount=Affects {0} deformers and {1} meshes (highlighted on the canvas).
editor.createFromSelection=Create from selection
editor.undoPoint=Undo point
editor.createWarpHint=Select artwork, then drag a frame · Wheel: conversion divisions · {key:CANCEL}: cancel. The placement ghost matches the final lattice.
editor.createRotationHint=Select artwork, drag from pivot toward direction · Shift: 15° snap · {key:CANCEL}: cancel
editor.warpAddTo=Add to
editor.warpAddTo.parentOfSelected=Set as parent of selected
editor.warpAddTo.childOfDeformer=Set as child of selected deformer (empty)
editor.warpAddTo.specifyParent=Specify parent deformer
editor.warpPart=Part to insert
editor.warpPart.inherit=Inherit from selection
editor.warpSizeStrategy=Size
editor.warpSize.selection=Fit selection (+5% padding)
editor.warpSize.keyform=Include keyform envelope
editor.warpSize.center=Align center with selection
editor.sequentialCreate=Sequential create
editor.defaultWarpName={0} warp
editor.defaultRotationName={0} rotation
editor.createWarpSameParent=Unify the parent deformer of the selected meshes first.
editor.pathCreateHint=Click to add points on the mesh, Enter to finish. A deform path is an edit aid, not a deformer. Finishing enters Edit mode to adjust binding.
editor.pathLevelHint=Path group L{0} (L2 and L3 each hold a path set; unrelated to a warp's Vertices / Bezier levels).
editor.pathEditLevel=Path edit level
editor.placementAsParentOf=Parent of “{0}”
editor.placementAsChildOf=Child of “{0}”
editor.placementMeshCount={0} meshes
editor.placementDragHint=Drag to move · Corners resize · {key:FINISH_PATH} confirm
editor.placementRotationHint=Pivot moves · Tip aims · {key:FINISH_PATH} confirm
editor.placementConfirm=Create
editor.placementCancel=Cancel
editor.placementPathNeedPoints=Click at least two path points on the canvas first.
editor.placementPathReady=Path points ready ({0} points) · Enter to confirm
editor.placementPathNeedMore=Click on canvas to add path points (Current: {0}/2)
editor.placementPathPreviewHint=Live preview: width (red dashed) and hardness (blue) influence rings
editor.placementPathShortcutCreate=Create tool {0}
editor.placementPathShortcutFinish=Finish {0}
editor.placementPathShortcutUndo=Undo point {0}
editor.placementPathShortcutCancel=Cancel {0}
