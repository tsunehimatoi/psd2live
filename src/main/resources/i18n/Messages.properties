cli.usage=PSD2Live 0.3.0\nRun without arguments to start the desktop GUI; command-line mode:\n  psd2live --input character.psd [--output out] [options]\n\nOptions:\n  --lang en               Interface language: zh, en, ja\n  --atlas 4096            Texture page size (256..16384)\n  --mesh-spacing 64       Mesh sample spacing (pixels)\n  --head-strength 1.0     Head 3D turn range\n  --body-strength 1.0     Body motion range\n  --mesh-only             Export texture atlas and meshes only\n  --no-deformers          Do not generate deformer hierarchy\n  --no-motions            Do not export motion files\n  --no-physics            Do not generate hair/eye physics\n  --no-cmo3               Do not export editable CMO3\n  --no-moc3               Do not export the MOC3 runtime file set\n  --no-json               Do not export project metadata JSON

