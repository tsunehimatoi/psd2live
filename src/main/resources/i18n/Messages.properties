editor.treeAddWarpParent=Parent · Warp
editor.treeAddWarpChild=Child · Warp
editor.treeAddRotationParent=Parent · Rotation
editor.treeAddPath=Deform path
editor.finishCut=Finish cut
editor.glueDistance=Weld tolerance
editor.subdivideHint=Click or drag across edges to subdivide them together; a selected vertex refines all incident edges.
editor.knifeGestureHint=Click free points inside or outside the mesh · Snaps to nearby vertices and edges · Shift: ignore snap · {key:DELETE_SELECTION}: undo point · {key:FINISH_PATH}: finish
editor.knifeSnapRadius=Snap radius
editor.knifeCannotConnect=This cut cannot connect every point without overlapping the mesh. Undo the last point or place it closer to the current outline.
