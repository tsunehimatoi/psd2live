settings.graphics.preset.desc=アンチエイリアス、テクスチャフィルタリング、GPU キャッシュをまとめて設定します。それ以外の組み合わせは「カスタム」と表示されます。
settings.graphics.display=表示とパフォーマンス
settings.graphics.windowAa=ウィンドウ
settings.graphics.windowAa.coverage=カバレッジ（Skia）
settings.graphics.windowAa.coverage.desc=Skia が CPU で各輪郭のカバレッジを計算します。輪郭は正確ですが、フレームごとの CPU 負荷が最も大きくなります。すぐに反映されます。
settings.graphics.windowAa.msaa.desc=ウィンドウをマルチサンプルのターゲット経由で描画し、GPU が輪郭をラスタライズします。CPU 負荷が減り、GPU メモリを多く使います。すぐに反映されます。
settings.graphics.msaa=MSAA {0}×
settings.graphics.canvasAa=キャンバスとプレビュー
settings.graphics.canvasAa.off=オフ
settings.graphics.canvasAa.off.desc=メッシュの輪郭とマスクはピクセル単位で切れます。ガイドの線と点は自身の輪郭をぼかします。すぐに反映されます。
settings.graphics.canvasAa.msaa.desc=メッシュの輪郭、塗り、マスクの輪郭をマルチサンプリングし、マスクはテクセルの不透明度でなじみます。編集キャンバス、アトラスページ、p2lrt プレビューに適用されます。Cubism のプレビューは独自のレンダラーで描画します。すぐに反映されます。
settings.graphics.canvasAa.ssaa=SSAA 2×
settings.graphics.canvasAa.ssaa.desc=幅と高さを 2 倍で描画して縮小平均します。テクスチャの細部を含むすべてに 4 サンプル。塗るピクセルは 4 倍です。すぐに反映されます。
settings.graphics.texture=テクスチャフィルタリング
settings.graphics.texture.bilinear=バイリニア
settings.graphics.texture.trilinear=トライリニア
settings.graphics.texture.anisotropic=異方性 {0}×
settings.graphics.texture.desc=縮小表示時のキャンバスのサンプリング方法です。トライリニアは mipmap レベル間を補間して輪郭のちらつきを防ぎ、異方性は変形したメッシュがテクスチャを圧縮する方向の細部を保ちます。すぐに反映されます。
