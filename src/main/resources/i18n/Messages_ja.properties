editor.placementDragHint=ドラッグで移動 · 角で拡縮 · Enter 確定
editor.placementRotationHint=原点で移動 · 先端で方向 · Enter 確定
editor.placementConfirm=作成
editor.placementLayerHint=ドラッグで移動 · 角/辺で拡大縮小 · Enter で確定
editor.importLayer.placeTitle=レイヤー配置
editor.importLayer.placeUnder=「{0}」の下へ
editor.importLayer.confirm=確定
editor.importLayer.summary={0} レイヤーをインポートしました
editor.importLayer.placed=レイヤー「{0}」を配置しました
editor.importLayer.cancelled=レイヤーのインポートを取り消しました
