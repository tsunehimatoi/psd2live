help.tutorial.standard.intro=See-Through から生成された PSD は 2 ステップで書き出せます。書き出し前後は 4 つのビューで結果を確認できます：
help.tutorial.standard.step1.title=ステップ 1：PSD の読み込み
help.tutorial.standard.step1.desc=.psd ファイルをドラッグ＆ドロップ（または Ctrl+Shift+O）。自動認識とメッシュ生成が行われます。
help.tutorial.standard.step2.title=ステップ 2：モデル書き出し
help.tutorial.standard.step2.desc=Ctrl+G を押して .cmo3 と .moc3 を一括出力。
help.tutorial.standard.step3.title=ステップ 3：結果の確認
help.tutorial.standard.step3.desc=「編集」タブでデフォーマ構造とメッシュ線框を確認し、「プレビュー」タブで頭の回転・まばたき・呼吸を検証します。+ でタブを増やして表示オプションを個別に設定でき、Ctrl+H で履歴タブを開けます。

help.tutorial.custom.intro=独自命名や See-Through 以外の PSD は右下でプリセット部位を照合するだけ：
help.tutorial.custom.step1.title=ステップ 1：PSD の読み込み
help.tutorial.custom.step1.desc=独自命名の .psd ファイルをドラッグ＆ドロップ（または Ctrl+Shift+O）。
help.tutorial.custom.step2.title=ステップ 2：右下の「プリセット」部位を照合
help.tutorial.custom.step2.desc=右下のインスペクター「レイヤー」テーブルで、各行の「プリセット部位」を実際の部位（前髪・目・服など）に合わせて照合；片側パーツは左右を選択。
help.tutorial.custom.step3.title=ステップ 3：モデル書き出し
help.tutorial.custom.step3.desc=Ctrl+G を押して書き出し。
help.tutorial.project.intro=.psd2live は非暗号化 ZIP です。1 ファイルで元 PSD・画像・全履歴ブランチ・UI 状態を保持し、そのまま移行できます。
help.tutorial.project.step1.title=1. プロジェクトを保存
help.tutorial.project.step1.desc=Ctrl+S。初回のみ保存先を選び、以降はそのまま保存します。別名保存は Ctrl+Shift+S。
help.tutorial.project.step2.title=2. 履歴を確認
help.tutorial.project.step2.desc=「表示 → タブ」から履歴タブを開きます（Ctrl+H）。やり直しの分岐が複数ある場合は Ctrl+Y でも開きます。保存と Agent の編集ごとにノードが 1 つ追加されます。
help.tutorial.project.step3.title=3. 過去のバージョンへ戻る
help.tutorial.project.step3.desc=ノードを選ぶと ID・親ノード・リビジョンハッシュ・時刻を確認できます。「このバージョンへ復元」はワークスペースを戻すだけで、どのブランチも削除しません。
help.tutorial.project.step4.title=4. 分岐と整理
help.tutorial.project.step4.desc=古いノードから編集を続けると自動で新しいブランチができます。ノードは名前変更・メモ・非表示／再表示ができ、非表示でもデータは消えません。

help.tutorial.optional.title=任意の応用機能（必要に応じて利用）：
help.tutorial.optional.desc=書き出しの前後で、必要に応じて以下の機能を選択できます（クリックで個別チュートリアルを表示）：
help.tutorial.optional.action=チュートリアルを見る >
help.tutorial.optional.opt1.title=調整とプレビュー（機能の選択）
help.tutorial.optional.opt1.desc=設定とパラメータを微調整し、「プレビュー」で視線追従・まばたき・呼吸を確認。
help.tutorial.optional.opt2.title=AI テクスチャ超解像 (Ctrl+U)
help.tutorial.optional.opt2.desc=低解像度の原画を Ctrl+U で 2×/4× に無損拡大。
help.tutorial.optional.opt3.title=差分作成
help.tutorial.optional.opt3.desc=インスペクターで差分トグルや差分切替を設定。
help.tutorial.optional.opt4.title=AI Agent / MCP
help.tutorial.optional.opt4.desc=外部 AI ホストを接続してモデルを検査・編集 [警告：テスト中・トークン消費大]。

help.tutorial.preview.intro=生成後に必要な設定とパラメータを微調整し、「プレビュー」で動作の自然さを確認します：
help.tutorial.preview.step1.title=モデル設定とパラメータの微調整
help.tutorial.preview.step1.desc=・「モデル設定」で頭部の振幅・身体の振幅・物理演算のオンオフを調整；\n・「パラメータ」タブで検索・ロック・一時上書きが可能。上部の再生ボタンで待機アニメーションを制御；\n・「レイヤー」テーブルで部位認識・表示状態・パラメータ関連付けを確認。
help.tutorial.preview.step2.title=プレビューと書き出し
help.tutorial.preview.step2.desc=・「プレビュー」タブでマウスを動かし、視線追従と頭の回転を確認；\n・再生ボタンでまばたき・呼吸・物理揺れを確認；\n・問題なければ Ctrl+G で書き出し。

help.tutorial.upscale.intro=原画の解像度が低い場合やエッジの荒れが気になる場合、AI 超解像で高画質化できます：
help.tutorial.upscale.step1.title=超解像の起動
help.tutorial.upscale.step1.desc=Ctrl+U を押すか、上部メニュー「ツール」→「テクスチャ高画質化…」を選択。
help.tutorial.upscale.step2.title=倍率選択とエッジ平滑化
help.tutorial.upscale.step2.desc=・2× または 4× の無損拡大に対応；\n・透明境界のノイズを自動平滑化し、高品質なテクスチャを生成。

help.tutorial.variants.intro=右下のインスペクターで差分を作成：
help.tutorial.variants.step1.title=差分トグル（照れ / 涙 / メガネ等）
help.tutorial.variants.step1.desc=・レイヤーのタイプを「差分トグル」に設定；\n・「パラメータ」に名前（例：blush、tears）を入力；\n・パラメータパネルのスライダーで独立表示切替（装飾品などに最適）。
help.tutorial.variants.step2.title=差分切替（排他複数状態）
help.tutorial.variants.step2.desc=・排他切替するレイヤーの「タイプ」をすべて「差分切替」に設定；\n・同じ「パラメータ」名（例：expression、arm_pose）を入力；\n・「ID」に 0, 1, 2... と番号を割り振ることで排他切替；\n・代表的な応用例：\n  1. 表情切替（例：expression）：0 通常 / 1 笑顔 / 2 怒り / 3 泣き顔\n  2. ポーズ・手の動作切替（例：arm_pose）：0 自然 / 1 手を振る / 2 腰に手\n  3. 衣装・髪型切替（例：costume、hair_style）：0 制服 / 1 私服 / 2 ドレス
help.tutorial.variants.step3.title=原画命名と描画の注意点
help.tutorial.variants.step3.desc=・自動バインド：eye_close（目閉じ）、mouth_close（口閉じ）、tooth_t/b（歯）、tongue（舌）；\n・上まつ毛：上まつ毛のみ描画（下まぶた線を描かない）；\n・口と体幹：口は最大開口で描画；体幹は直立を保持。

help.tutorial.agent.warning=[警告] テスト中のため動作が不安定であり、日常利用は推奨しません。連続呼び出しにより大量のトークンを消費する恐れがあります。
help.tutorial.agent.intro=上部メニューの「ツール → MCP → MCP 接続とセットアップ…」で設定をコピーし、ChatGPT Desktop / Codex、Gemini / Antigravity など Streamable HTTP 対応ホストへ貼り付けます：
help.tutorial.agent.ready.title=[対応済み] 構造取得・外観検査
help.tutorial.agent.ready.desc=プロジェクト・階層・パラメータの読み取り、複数ポーズの描画検査、透明素材の取り込みと装飾の追加。
help.tutorial.agent.beta.title=[実験的] 画像生成
help.tutorial.agent.beta.desc=表情・モーション差分の生成、口腔パーツの分離、髪の分離と遮蔽補完、影レイヤーの追加。エンドツーエンドでは未安定。
help.tutorial.agent.unsupported.title=[非対応] メッシュ頂点編集
help.tutorial.agent.unsupported.desc=パーツの頂点単位の精密変形（Warp / Mesh の点を個別に操作する必要があります）。
help.tutorial.agent.tip=ヒント：まずプロジェクト状態とオブジェクト概要の読み取りから始めてください。

help.spec.intro=PSD2Live は日本語、英語、中国語のレイヤー別名に対応しています。標準化された命名により自動リギングの品質が最大化されます：
help.spec.group.head=頭部・顔パーツタグ
help.spec.head.face=face / 顔 / 肌：顔のベース、中心位置と九軸パースの基準。頬紅や涙痕などは facedetail へ
help.spec.head.hairFront=front_hair / 前髪：前髪アートメッシュ、前髪物理追従デフォーマに配置
help.spec.head.hairBack=back_hair / 後ろ髪：後ろ髪アートメッシュ、後ろ髪物理揺れデフォーマに配置
help.spec.head.headwear=headwear / hat (帽子/頭飾り)：頭部に固定し、顔面九軸の変形には追従させない
help.spec.head.eyelash=eyelash / まつ毛：上まつ毛のみ！目閉じ時はアルファ中心線に沿って滑らかな U 字に変形（下まつ毛は含めないでください）
help.spec.head.eyewhite=eyewhite / 目白：白目・目閉じ基準線、瞳のクリッピングマスク
help.spec.head.eyeClose=eye_close / 閉じ目：あらかじめ描いた閉眼形状。まつ毛の閉眼カーブとはどちらか一方を使用
help.spec.head.irides=irides / pupil / 瞳 / 目：視線追従＋ゼリーアイ弾性動力学
help.spec.head.eyebrow=eyebrow / まゆ / 眉毛：上下連動とパース追従
help.spec.head.nose=nose / 鼻：3D 頭部向き認識の要点
help.spec.head.mouth=mouth / 口 / 口開き：最大開口の原画必須（はっきりした主線を推奨）、求心的な閉口変形
help.spec.head.mouthClose=mouth_close / 口閉じ：あらかじめ描いた閉口形状（任意）
help.spec.head.mouthInternals=tooth_t / tooth_b / tongue (上歯/下歯/舌)：口アートメッシュへ自動クリッピング
help.spec.head.ears=ears / earwear / eyewear (耳/耳飾り/メガネ)：頭の回転に追従
help.spec.group.body=体幹・身体パーツタグ
help.spec.body.neck=neck / 首：頭部回転と身体の連動部
help.spec.body.topwear=topwear / 服 / 上着：身体 XYZ 傾きおよびガウス分布による胸郭呼吸連動
help.spec.body.limbs=handwear / legwear / footwear（arm / hand / leg / foot）：腕・手・脚・足
help.spec.body.bottomwear=bottomwear (ズボン/スカート)：下衣
help.spec.body.neckwear=neckwear (襟/マフラー)：首元の装飾
help.spec.group.extra=追加パーツと小道具
help.spec.extra.tail=tail / しっぽ：独立して揺れます
help.spec.extra.wings=wings / 翼：身体の後ろに配置
help.spec.extra.objects=objects / prop (小道具)：その他の独立制御できるパーツ
help.spec.group.notes=重要注意事項
help.spec.note.eyelash=• まつ毛レイヤーに下まつ毛や下まぶた線を描き込まないでください（目閉じ時の破綻を防ぐため）；
help.spec.note.mouth=• 口は必ず最大限開いた状態で描画してください。閉口はプログラムによって求心圧縮生成されます；
help.spec.note.body=• 極端に傾いたポーズや横たわった体幹は入力しないでください。呼吸と回転の破綻を防ぐためです；
help.spec.note.unknown=• 認識されないレイヤーは末尾に移動し unknown と表示されます。「レイヤー」テーブルで部位を手動指定してください。

help.shortcuts.group.view=キャンバスビュー・操作
help.shortcuts.group.tools=高度なツール
