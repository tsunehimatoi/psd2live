settings.rigTuning.chestGrow=胸の広がり
settings.rigTuning.chestGrow.hint=頭身が正の最大のとき、肩の位置で胸が広がる量。デフォルト {0}%。
settings.rigTuning.bodyShrink=胴の短縮
settings.rigTuning.bodyShrink.hint=頭身が正の最大のとき、胴と腕が短くなる量。デフォルト {0}%。
settings.rigTuning.legShrink=脚の短縮
settings.rigTuning.legShrink.hint=頭身が正の最大のとき、脚とスカートが短くなる量。足は動きません。デフォルト {0}%。
settings.rigTuning.bodyZDegrees=体 Z の傾き
settings.rigTuning.bodyZDegrees.hint=体 Z が最大のとき、上半身が腰を軸に横へ傾く角度。デフォルト {0}°。
settings.rigTuning.breathLift=呼吸の肩上げ
settings.rigTuning.breathLift.hint=呼吸が最大のとき、肩とそれに乗る頭や腕が上がる量。胴の長さに対する割合。デフォルト {0}%。
settings.rigTuning.breathWiden=呼吸の胸の広がり
settings.rigTuning.breathWiden.hint=呼吸が最大のとき、胸が広がる量。デフォルト {0}%。
settings.rigTuning.torsoDepth=胴の厚み
settings.rigTuning.torsoDepth.hint=胴の前後の厚みの、幅に対する割合。回転と前後傾はこの厚みの立体として計算され、厚いほど回転時に手前側が目立ちます。デフォルト {0}%。
settings.rigTuning.turnCameraDistance=回転の視距離
settings.rigTuning.turnCameraDistance.hint=回転を胴の前方どれだけ離れて見るか。胴の長さ単位。近いほど手前側が大きく、奥側が小さくなります。デフォルト {0}。
settings.rigTuning.leanCameraDistance=前傾の視距離
