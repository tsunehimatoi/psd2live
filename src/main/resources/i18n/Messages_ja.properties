settings.rigTuning.mouthFormWiden=笑い口の幅
settings.rigTuning.mouthFormWiden.hint=口の変形が最大のとき笑い口が広く、への字口が狭くなる量。デフォルト {0}%。
settings.rigTuning.mouthClosedNarrow=閉じ口の幅
settings.rigTuning.mouthClosedNarrow.hint=口の開閉が 0 のとき開いたときより狭くなる量。デフォルト {0}%。
settings.rigTuning.mouthSmileBase=口全体の上下
settings.rigTuning.mouthSmileBase.hint=口の変形が最大のとき口全体が上下する量。口の高さに対する割合。デフォルト {0}%。
settings.rigTuning.mouthSeam=唇の合わせ目
settings.rigTuning.mouthSeam.hint=口を閉じたとき唇が合う位置。口の上端から、口の高さに対する割合。デフォルト {0}%。
settings.rigTuning.teethFade=歯の表示
