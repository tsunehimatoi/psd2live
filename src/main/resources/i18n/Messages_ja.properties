toolDetails.noModel=モデルを読み込むとツール詳細が表示されます
tutorial.basic.action=操作してみましょう
tutorial.basic.hint.manual=明るい枠内で操作を試したら「次へ」を選びます。
tutorial.basic.hint.auto=操作が完了すると自動で進みます。後で試す場合はスキップできます。
tutorial.basic.step.openFile.action=枠内の「ファイル」をクリックするか、「次へ」でメニューを開きます。
tutorial.basic.step.import.action=PSD の読み込みを選び、レイヤー付きのファイルを指定します。キャンセル後は再試行するかスキップできます。
tutorial.basic.step.preview.action=「プレビュー」タブをクリックします。すでに選択中の場合は自動で進みます。
tutorial.basic.step.layers.action=まず一覧の構成を確認しましょう。変更する必要はありません。「次へ」で一行の説明に進みます。
tutorial.basic.step.layerRow.action=誤った項目だけ修正し、正しい設定はそのままにします。差分レイヤーでは部品プリセットではなくパラメーターを関連付けます。確認後は「次へ」を選びます。
tutorial.basic.step.settings.action=頭と体の動き、物理演算を確認します。一度に一項目ずつ調整し、「次へ」で進みます。
tutorial.basic.step.export.action=エクスポートをクリックすると設定画面が開きます。実際の出力はその画面で確定します。
tutorial.basic.targetMissing=操作対象がまだ表示されていません。PSD が未読込の場合は前の手順に戻るか、スキップまたは終了して再開できます。
menu.help.tutorialCatalog=チュートリアル一覧…
tutorial.catalog.title=インタラクティブ教程一覧
tutorial.catalog.desc=段階的に UI と編集を学べます。基礎から、または任意の課を直接開始できます。
tutorial.catalog.progressive=段階レッスン
tutorial.common.continueNext=続ける：{0}
tutorial.common.openCatalog=教程一覧を開く
tutorial.common.requireSelection=先にハイライトされた階層ツリーでメッシュまたはデフォーマを選択してください。
tutorial.common.requireLayer=先に階層ツリーでレイヤーを選択してください。
tutorial.common.hint.prerequisite=ハイライト内の選択を終えてから進みます。完了するまでスキップできません。
tutorial.basic.step.naming.title=プリセット命名の注意
tutorial.basic.step.naming.body=名前で自動認識される例：eye_close、mouth_close、tooth_t / tooth_b、tongue。上まつ毛のみ描く、口は最大開口、体は直立。
tutorial.basic.step.naming.action=レイヤー名とプリセット列を見比べ、「次へ」。
tutorial.variants.step.toggleWhy.title=オンオフ差分の役割
tutorial.variants.step.toggleWhy.body=パラメータでレイヤーの表示／非表示を切り替えます。頬紅や眼鏡などに向きます。
tutorial.variants.step.toggleSetup.title=オンオフ差分の設定
tutorial.variants.step.toggleSetup.body=種類をオンオフ差分にし、パラメータ名（例 blush）を入力。同じ名前で複数レイヤーを駆動できます。
tutorial.variants.step.toggleSetup.action=1行をオンオフ差分にしてパラメータ名を入れる（確認のみでも可）、「次へ」。
tutorial.variants.step.switchWhy.title=切替差分の役割
tutorial.variants.step.switchWhy.body=複数の見た目から1つだけ表示。表情・ポーズ・衣装などに使います。
tutorial.variants.step.switchSetup.title=切替差分の設定
tutorial.variants.step.switchSetup.body=関連行を切替差分にし同じパラメータ名、ID を 0,1,2…。例 expression：0 通常 / 1 笑顔。
tutorial.variants.step.switchSetup.action=2行に同じ名前と違う ID を設定（確認のみでも可）、「次へ」。
tutorial.parameters.step.findTab.title=パラメータを開く
tutorial.parameters.step.findTab.body=右側 Dock の「パラメータ」タブを開きます。見つからなければインスペクタ領域を展開。
tutorial.parameters.step.findTab.action=パラメータ Dock を開き、「次へ」。
tutorial.parameters.step.operate.title=キー操作
tutorial.parameters.step.operate.body=左ドラッグで値を変更、キー印にホバーして右クリックで吸着。2D パッドも同様。
tutorial.create.step.contextDeformer.title=デフォーマの右クリック
tutorial.create.step.contextDeformer.body=デフォーマを右クリックして親／子のワープや回転を追加。配置セッションが始まります。
tutorial.create.step.contextDeformer.action=デフォーマを右クリックして作成項目を見る。
tutorial.create.step.contextLayer.title=レイヤーの右クリック
tutorial.create.step.contextLayer.body=レイヤーを右クリックして親ワープ／回転、またはパスを追加。配置確認へ進みます。
tutorial.create.step.contextLayer.action=レイヤーを右クリックして追加項目を見る。
tutorial.basic.title=基本フロー
tutorial.basic.desc=PSD 読込、プレビュー、レイヤーと設定、moc3/cmo3 書き出し。
tutorial.workspace.title=ワークスペース案内
tutorial.workspace.desc=ワークスペース、ウィンドウ切替、ドック、表示オプション、ナビ。
tutorial.workspace.step.tabs.title=ワークスペース
tutorial.workspace.step.tabs.body=ワークスペースはパネル配置を覚えます。キャンバスのタイトルバーで編集とプレビューを切り替え、両方見るには「ウィンドウ」からキャンバスを追加します。履歴も「ウィンドウ」から開きます。{key:NEW_EDIT_TAB} で新規作成、{key:NEXT_TAB} で切り替え。
tutorial.workspace.step.tabs.action=上のワークスペースバーを見て、編集するときはキャンバスの「編集」を押してから次へ。
tutorial.workspace.step.hierarchyToggle.title=Show or hide the hierarchy
tutorial.workspace.step.hierarchyToggle.body=Title-bar layout toggles show/hide hierarchy, log, and inspector. The highlighted control is the hierarchy toggle.
tutorial.workspace.step.hierarchyToggle.action=Try the toggle once, then choose Next.
tutorial.workspace.step.docks.title=Right-side docks
tutorial.workspace.step.docks.body=Docks include Settings, Layers, Parameters, Tool details, Inspector, Animation, and Physics. Animation/Physics only need to be noticed for now.
tutorial.workspace.step.docks.action=Browse dock tabs, then choose Next.
tutorial.workspace.step.viewMenu.title=View options menu
tutorial.workspace.step.viewMenu.body=キャンバスのタイトルバーにある「表示」は、そのキャンバスのメッシュやデフォーマ、パスの表示を覚えます。キャンバスごとに別々です。
tutorial.workspace.step.viewMenu.action=Open the menu, browse items, then choose Next.
tutorial.workspace.step.camera.title=Zoom and pan
tutorial.workspace.step.camera.body=ホイールでズーム、中ドラッグまたは {kbd:Space} でパン。{key:ZOOM_IN} / {key:ZOOM_OUT} / {key:ZOOM_RESET}、{key:RESET_CAMERA} リセット、{key:FRAME_VIEW} で選択合わせ。
tutorial.workspace.step.camera.action=Try zooming and panning, then choose Next.
tutorial.workspace.step.done.title=Workspace tour complete
tutorial.workspace.step.done.body=Next, learn Hierarchy tree and mode bar — the core editing chrome.
tutorial.hierarchy.title=階層ツリーとモードバー
tutorial.hierarchy.desc=階層ツリー、レイヤー取り込み、描画順ルーラー、モードバーと一時セッション名。
tutorial.hierarchy.step.openTree.title=階層を開く
tutorial.hierarchy.step.openTree.body=ツリーはデフォーマ／メッシュの親子を示します。ルートにはモデル階層と件数が表示されます。
tutorial.hierarchy.step.openTree.action=階層ドックが表示されていることを確認し、「次へ」。
tutorial.hierarchy.step.toolbar.title=検索と展開
tutorial.hierarchy.step.toolbar.body=上部バーでデフォーマ／レイヤーを検索し、一括展開／折りたたみができます。専用ショートカットはなく、ここから操作します。
tutorial.hierarchy.step.toolbar.action=検索や展開／折りたたみを試し、「次へ」。
tutorial.hierarchy.step.treeBody.title=行と選択の同期
tutorial.hierarchy.step.treeBody.body=目アイコンで表示切替、親バッジで祖先を示し、ツリー選択はキャンバスと同期します。
tutorial.hierarchy.step.treeBody.action=ノードを選びキャンバスを見てから「次へ」。
tutorial.hierarchy.step.dragParent.title=ドラッグで親変更
tutorial.hierarchy.step.dragParent.body=別デフォーマへドロップして親子を変更、または「ルートへ」へ移動。透明画像のドロップはレイヤー取り込み（次の手順）で、親変更とは別操作です。
tutorial.hierarchy.step.dragParent.action=ノードをドラッグしてみる（または確認のみ）、「次へ」。
tutorial.hierarchy.step.contextDeformer.title=デフォーマの右クリック
tutorial.hierarchy.step.contextDeformer.body=親／子のワープ・回転追加、レイヤー取り込み、ルートへ移動、枝の展開／折りたたみ、削除（子は繰り上げ）。
tutorial.hierarchy.step.contextDeformer.action=デフォーマを右クリックしてメニューを眺め、「次へ」。
tutorial.hierarchy.step.contextLayer.title=レイヤーの右クリック
tutorial.hierarchy.step.contextLayer.body=ソロ、描画順、メッシュ設定、親デフォーマ／パス追加、レイヤー取り込み、削除。ソロは編集中の一時表示で、パラメータ差分ではありません。
tutorial.hierarchy.step.contextLayer.action=レイヤーを右クリックしてメニューを眺め、「次へ」。
tutorial.hierarchy.step.importLayer.title=レイヤーを取り込む
tutorial.hierarchy.step.importLayer.body=PNG / WebP / TIFF / BMP をツリーノードへドロップするか、右クリック「レイヤーをインポート…」で選択。新レイヤーはその下（レイヤー行なら親デフォーマ下）に入り、配置セッションが始まります。
tutorial.hierarchy.step.importLayer.action=任意：透明画像を1枚取り込み／ドロップして試す。確認だけでも「次へ」。
tutorial.hierarchy.step.placeSession.title=配置セッション
tutorial.hierarchy.step.placeSession.body=取り込みや作成後、左下に配置パネルが出ます。確定または {key:CANCEL} までキャンバス操作はセッションが占有します。モードバー横に一時セッション名（例：レイヤー配置）が表示されます。レイヤー配置を確定すると「選択」モードに戻ります。
tutorial.hierarchy.step.placeSession.action=「セッション占有 → 確定で選択へ」を覚え、「次へ」。
tutorial.hierarchy.step.drawOrder.title=描画順ルーラー
tutorial.hierarchy.step.drawOrder.body=ホイールで拡大、ドラッグで順序変更、ダブルクリックで数値入力。インスペクタや右クリックと同じ属性です。
tutorial.hierarchy.step.drawOrder.action=ホイールやドラッグを試し、「次へ」。
tutorial.hierarchy.step.modeBar.title=階層モードバー
tutorial.hierarchy.step.modeBar.body=左上の4モード：選択・変形・編集・ペイント。対象未選択時は partFirst / layerFirst が出ます。モード切替で表示プリセットが変わります。配置セッション中はモード横にセッション名が出ます。
tutorial.hierarchy.step.modeBar.action=各モードチップをクリックし、「次へ」。
tutorial.hierarchy.step.modeExtras.title=モード付属
tutorial.hierarchy.step.modeExtras.body=変形は L1 点 / L2 ベジェ、編集は格子分割、ペイントは前景／背景と適用／破棄。一時セッション時はセッション名チップも出ます。
tutorial.hierarchy.step.modeExtras.action=変形で L1/L2 を確認し、「次へ」。
tutorial.hierarchy.step.gesturePreview.title=選択ジェスチャ予告
tutorial.hierarchy.step.gesturePreview.body=選択：クリック、{kbd:Shift} 加算、{kbd:Alt} 減算、{kbd:Ctrl} +クリックで階層巡回、ドラッグ枠選択、{key:SELECT_ALL}、{key:CANCEL}。次のレッスンで実操します。
tutorial.hierarchy.step.gesturePreview.action=ジェスチャを覚え、「次へ」で本課を完了。
tutorial.hierarchy.step.done.title=階層レッスン完了
tutorial.hierarchy.step.done.body=続けて「差分の作成」でトグル／切替レイヤーを学びます。
tutorial.variants.title=差分の作成
tutorial.variants.desc=レイヤー種類、オンオフ差分と切替差分。
tutorial.variants.step.types.title=レイヤー種類
tutorial.variants.step.types.body=種類列：プリセット、オンオフ差分、切替差分。次にオンオフと切替を学びます。
tutorial.variants.step.types.action=Browse the Type column, then Next.
tutorial.variants.step.done.title=差分レッスン完了
tutorial.variants.step.done.body=続けて「パラメータとキーフォーム」へ。
tutorial.parameters.title=パラメータとキーフォーム
tutorial.parameters.desc=パネルを開き、ドラッグ、キー操作とリンク。
tutorial.parameters.step.panel.title=パラメータパネル
tutorial.parameters.step.panel.body=検索・ロック・リセット、フォルダ整理ができます。
tutorial.parameters.step.panel.action=Open Parameters and browse, then Next.
tutorial.parameters.step.drag.title=パラメータをドラッグ
tutorial.parameters.step.drag.body=スライダーで編集／プレビューの姿勢と差分を確認します。
tutorial.parameters.step.drag.action=パラメータを動かして「次へ」。
tutorial.parameters.step.keys.title=キーフォームとは
tutorial.parameters.step.keys.body=印は値に形状がある印。円は格子キー、四角はブレンドが多いです。
tutorial.parameters.step.keys.action=Inspect key dots, then Next.
tutorial.parameters.step.link.title=パラメータ連動
tutorial.parameters.step.link.body=2D 連動（XY）で2軸をまとめて動かせます。必要なとき使えば十分です。
tutorial.parameters.step.link.action=Note the entry, then Next.
tutorial.parameters.step.done.title=パラメータ完了
tutorial.parameters.step.done.body=続けて「選択モード」へ。
tutorial.select.title=選択モード
tutorial.select.desc=選択ツールとジェスチャ。
tutorial.select.step.mode.title=Enter Select
tutorial.select.step.mode.body=Switch to Select on the mode bar, or press {key:TOOL_SELECT} for the pick tool.
tutorial.select.step.mode.action=Ensure Select mode, then Next.
tutorial.select.step.tools.title=Select tools
tutorial.select.step.tools.body=Pick {key:TOOL_SELECT}, Lasso {key:TOOL_LASSO_SELECT}, Brush select {key:TOOL_BRUSH_SELECT}. The left toolbar groups by mode.
tutorial.select.step.tools.action=Switch select tools, then Next.
tutorial.select.step.gestures.title=Object gestures
tutorial.select.step.gestures.body=クリック選択 · {kbd:Shift} 加算 · {kbd:Alt} 減算 · {kbd:Ctrl} +クリックで階層巡回 · 枠選択 · {key:SELECT_ALL} · {key:CANCEL}。
tutorial.select.step.gestures.action=Practice on canvas, then Next.
tutorial.select.step.sync.title=Tree and canvas sync
tutorial.select.step.sync.body=Selection syncs with the hierarchy. {key:FRAME_VIEW} frames the selection.
tutorial.select.step.sync.action=Select via tree and canvas, try F, then Next.
tutorial.select.step.extras.title=Marquee style & linked
tutorial.select.step.extras.body={key:SELECTION_STYLE_BOX} / {key:SELECTION_STYLE_LASSO} toggle box/lasso style; {key:SELECT_LINKED} selects linked points. Canvas context menu follows mode.
tutorial.select.step.extras.action=Try the shortcuts, then Next.
tutorial.select.step.done.title=Select complete
tutorial.select.step.done.body=Continue with Create deformers.
tutorial.create.title=デフォーマ作成
tutorial.create.desc=階層で選択し、右クリックで作成、配置パネルで確定。
tutorial.create.step.selectFirst.title=先に階層で選択
tutorial.create.step.selectFirst.body=作成前にメッシュ／デフォーマを選択。未選択の間は先に進めません。
tutorial.create.step.selectFirst.action=ハイライトのツリーで対象を選ぶ。
tutorial.create.step.placement.title=左下の配置パネル
tutorial.create.step.placement.body=作成後、左下で名前・関係・サイズを調整。{key:FINISH_PATH} 確定、{key:CANCEL} 取消。セッション中はキャンバスを占有し、モードバーにセッション名が出ます。
tutorial.create.step.placement.action=パネル・占有・確定／取消を確認し、「次へ」。
tutorial.create.step.done.title=デフォーマ作成完了
tutorial.create.step.done.body=続けて「変形モード」へ。
tutorial.deform.title=変形モード
tutorial.deform.desc=L1/L2 と変形ブラシ。
tutorial.deform.step.enter.title=Enter Deform
tutorial.deform.step.enter.body=編集する対象を選んでから変形モードへ。未選択なら先にツリーで選んでください。
tutorial.deform.step.enter.action=対象を選び変形モードへ。
tutorial.deform.step.levels.title=L1 and L2
tutorial.deform.step.levels.body=L1 edits mesh points; L2 edits Bezier handles.
tutorial.deform.step.levels.action=Toggle L1/L2, then Next.
tutorial.deform.step.brushes.title=Deform brushes
tutorial.deform.step.brushes.body=ブラシ {key:TOOL_BRUSH}、スムーズ {key:TOOL_SMOOTH}、膨張 {key:TOOL_INFLATE}。\n重要：{kbd:Alt} を押しながら右ドラッグで半径／硬さをその場調整。
tutorial.deform.step.brushes.action=ブラシを試し、{kbd:Alt}+右ドラッグも一度試す。
tutorial.deform.step.shortcuts.title=Radius and axes
tutorial.deform.step.shortcuts.body={key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP} 半径、{key:BRUSH_HARDNESS_DOWN} {key:BRUSH_HARDNESS_UP} 硬さ、{key:AXIS_CONSTRAIN_X} / {key:AXIS_CONSTRAIN_Y}。現場調整は {kbd:Alt}+右ドラッグ優先。
tutorial.deform.step.shortcuts.action=Try shortcuts, then Next.
tutorial.deform.step.keys.title=Shapes on keyforms
tutorial.deform.step.keys.body=Place different shapes on different parameter keys for head turns and expressions.
tutorial.deform.step.keys.action=Optionally tweak on a key, then Next.
tutorial.deform.step.undo.title=Undo / redo
tutorial.deform.step.undo.body={key:UNDO} 元に戻す、{key:REDO} やり直し。
tutorial.deform.step.undo.action=Note this, then Next.
tutorial.deform.step.done.title=Deform complete
tutorial.deform.step.done.body=Continue with Edit mode topology.
tutorial.edit.title=編集モード
tutorial.edit.desc=分割・ナイフなどトポロジ。
tutorial.edit.step.enter.title=Enter Edit
tutorial.edit.step.enter.body=Edit forces mesh display for topology, not freeform pulling.
tutorial.edit.step.enter.action=Enter Edit, then Next.
tutorial.edit.step.topo.title=Subdivide & knife
tutorial.edit.step.topo.body=分割 {key:TOOL_SUBDIVIDE}、ナイフ {key:TOOL_KNIFE}。格子点をドラッグしてトポロジを調整し、ナイフで経路に沿って切ります。
tutorial.edit.step.topo.action=Locate tools and try lightly, then Next.
tutorial.edit.step.delete.title=Delete points
tutorial.edit.step.delete.body={key:DELETE_SELECTION} で選択点を削除。大き変更前に選択範囲を確認。
tutorial.edit.step.delete.action=Note the caution, then Next.
tutorial.edit.step.viewAids.title=View aids
tutorial.edit.step.viewAids.body=Bottom-right view bar or View menu can show deform paths while editing topology.
tutorial.edit.step.viewAids.action=Enable aids, then Next.
tutorial.edit.step.when.title=When to edit topology
tutorial.edit.step.when.body=Use Edit when the mesh is too coarse; everyday shaping stays in Deform.
tutorial.edit.step.when.action=Remember the split, then Next.
tutorial.edit.step.done.title=Edit complete
tutorial.edit.step.done.body=Continue with Paint mode.
tutorial.paint.title=ペイントモード
tutorial.paint.desc=ペイントツールとセッション。
tutorial.paint.step.layerFirst.title=Select a layer first
tutorial.paint.step.layerFirst.body=Painting requires a layer; otherwise layerFirst is shown.
tutorial.paint.step.layerFirst.action=Select a layer and enter Paint, then Next.
tutorial.paint.step.tools.title=Paint tools
tutorial.paint.step.tools.body=Brush {key:TOOL_PAINT_BRUSH}, pencil {key:TOOL_PAINT_PENCIL}, eraser {key:TOOL_PAINT_ERASER}, bucket {key:TOOL_PAINT_BUCKET}, eyedropper {key:TOOL_PAINT_EYEDROPPER}, shapes {key:TOOL_PAINT_LINE} — toolbar and your bindings.
tutorial.paint.step.tools.action=Switch paint tools, then Next.
tutorial.paint.step.shortcuts.title=Brush shortcuts
tutorial.paint.step.shortcuts.body=半径 {key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP}、硬さ {key:BRUSH_HARDNESS_DOWN} {key:BRUSH_HARDNESS_UP}、不透明度 {key:PAINT_OPACITY_DOWN} {key:PAINT_OPACITY_UP}。{kbd:Alt}+右ドラッグでも先端を調整。
tutorial.paint.step.shortcuts.action=Adjust radius, then Next.
tutorial.paint.step.session.title=Apply or discard
tutorial.paint.step.session.body=Paint sessions have their own undo. Mode bar apply/discard; apply may rebuild mesh.
tutorial.paint.step.session.action=Note the session flow, then Next.
tutorial.paint.step.return.title=Back to shaping
tutorial.paint.step.return.body=After touch-ups, return to Select or Deform for forms and keys.
tutorial.paint.step.return.action=Return to Select, then Next.
tutorial.paint.step.done.title=Paint complete
tutorial.paint.step.done.body=Continue with Inspector.
tutorial.inspector.title=インスペクタ
tutorial.inspector.desc=選択種別に応じた属性。
tutorial.inspector.step.open.title=Open Inspector
tutorial.inspector.step.open.body=Empty until something is selected; then shows matching properties.
tutorial.inspector.step.open.action=Open Inspector and select something, then Next.
tutorial.inspector.step.artmesh.title=ArtMesh properties
tutorial.inspector.step.artmesh.body=Clipping, draw order, opacity, blend, culling, user data.
tutorial.inspector.step.artmesh.action=Browse artmesh fields, then Next.
tutorial.inspector.step.deformers.title=Deformer properties
tutorial.inspector.step.deformers.body=Warp has Bezier division and edit level; Rotation and DeformPath have their own fields.
tutorial.inspector.step.deformers.action=Select a deformer, then Next.
tutorial.inspector.step.keyframes.title=Keyframe button
tutorial.inspector.step.keyframes.body=Inspector keyframe control pairs with parameter marks to key the current value.
tutorial.inspector.step.keyframes.action=Find the control, then Next.
tutorial.inspector.step.drawOrder.title=Three draw-order entries
tutorial.inspector.step.drawOrder.body=Inspector, tree context menu, and ruler edit the same property.
tutorial.inspector.step.drawOrder.action=Compare with the ruler, then Next.
tutorial.inspector.step.done.title=Inspector complete
tutorial.inspector.step.done.body=Continue with Tool details.
tutorial.tools.title=ツール詳細
tutorial.tools.desc=ツール連動パラメータ。
tutorial.tools.step.open.title=Open Tool details
tutorial.tools.step.open.body=Content follows the active tool for brush/create parameters.
tutorial.tools.step.open.action=Open Tool details, then Next.
tutorial.tools.step.brushes.title=Brush parameters
tutorial.tools.step.brushes.body=Deform and paint brushes share size/hardness; {key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP} drive the same values.
tutorial.tools.step.brushes.action=Switch tools and watch the panel, then Next.
tutorial.tools.step.split.title=Toolbar vs panel
tutorial.tools.step.split.body=Left toolbar picks tools; Tool details tunes them; mode bar picks work mode.
tutorial.tools.step.split.action=Compare the three, then Next.
tutorial.tools.step.shortcuts.title=Shortcut presets
tutorial.tools.step.shortcuts.body=Settings → Shortcuts can switch Photoshop / Blender / Cubism presets or custom bindings. Tutorial keycaps follow your current bindings.
tutorial.tools.step.shortcuts.action=Note this, then Next.
tutorial.tools.step.done.title=Tool details complete
tutorial.tools.step.done.body=Continue with Project & history.
tutorial.project.title=プロジェクトと履歴
tutorial.project.desc=保存と履歴ノード。
tutorial.project.step.save.title=Save project
tutorial.project.step.save.body={key:SAVE_PROJECT} saves; {key:SAVE_PROJECT_AS} Save As. Project is an unencrypted ZIP with PSD, history, and UI state.
tutorial.project.step.save.action=Note the entry (saving optional), then Next.
tutorial.project.step.historyTab.title=History tab
tutorial.project.step.historyTab.body={key:OPEN_HISTORY_TAB} で履歴タブ。保存などでノードが増えます。
tutorial.project.step.historyTab.action=ハイライトの履歴タブをクリック（またはショートカット）。
tutorial.project.step.restore.title=Restore a version
tutorial.project.step.restore.body=Restore switches the workspace to that node without deleting other branches.
tutorial.project.step.restore.action=Find Restore, then Next.
tutorial.project.step.branch.title=Branches
tutorial.project.step.branch.body=Editing from an old node creates a branch; rename, note, or hide nodes (data kept).
tutorial.project.step.branch.action=Note this, then Next.
tutorial.project.step.done.title=Project lesson complete
tutorial.project.step.done.body=Optional: Texture upscale, or reopen the catalog.
tutorial.upscale.title=テクスチャ高精細化
tutorial.upscale.desc=AI 拡大と再確認。
tutorial.upscale.step.entry.title=Entry
tutorial.upscale.step.entry.body=「ツール」→「テクスチャ高画質化…」、または {key:TEXTURE_UPSCALE}。
tutorial.upscale.step.entry.action=ハイライトのツールメニューからテクスチャ高画質化を選ぶ。
tutorial.upscale.step.scale.title=Scale
tutorial.upscale.step.scale.body=Usually 2× / 4×. Denser pixels may change how the mesh looks.
tutorial.upscale.step.scale.action=Note options, then Next.
tutorial.upscale.step.check.title=Recheck and export
tutorial.upscale.step.check.body=After upscale, inspect mesh/deformers in Edit, verify Preview, then re-export.
tutorial.upscale.step.check.action=Note the flow, then Next.
tutorial.upscale.step.done.title=Advanced path complete
tutorial.upscale.step.done.body=You finished the progressive tutorials. Reopen any lesson from Help → catalog.

