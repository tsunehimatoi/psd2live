help.spec.intro=部位ごとにレイヤーを分けます。下の英語・中国語・日本語・韓国語のレイヤー名は自動で認識され、読み込み後もレイヤー表で意味タグを変更できます。名前の一覧はドキュメントにあります。
help.spec.fullTable=名前の一覧
help.spec.group.prepare=PSD の準備
help.spec.prepare.format=RGB・8 ビット・透明背景のレイヤー付き PSD
help.spec.prepare.raster=文字・ベクター・レイヤースタイル・調整効果はラスタライズするか、対応するピクセルレイヤーに統合します
help.spec.prepare.pose=体はほぼ直立に。頭は少し傾いていても構いません
help.spec.group.head=頭部・顔パーツタグ
help.spec.head.face=face / 顔 / 肌：顔のベース、中心位置と九軸パースの基準。頬紅や涙痕などは facedetail へ
help.spec.head.hairFront=front_hair / 前髪：前髪アートメッシュ、前髪物理追従デフォーマに配置
help.spec.head.hairBack=back_hair / 後ろ髪：後ろ髪アートメッシュ、後ろ髪物理揺れデフォーマに配置
help.spec.head.headwear=headwear / hat (帽子/頭飾り)：頭部に固定し、顔面九軸の変形には追従させない
help.spec.head.eyelash=eyelash / まつ毛：上まつ毛のみ！目閉じ時はアルファ中心線に沿って滑らかな U 字に変形（下まつ毛は含めないでください）
help.spec.head.eyewhite=eyewhite / 目白：白目・目閉じ基準線、瞳のクリッピングマスク
help.spec.head.eyeClose=eye_close / 閉じ目：あらかじめ描いた閉眼形状。まつ毛の閉眼カーブとはどちらか一方を使用
help.spec.head.irides=irides / pupil / 瞳 / 目：視線追従＋ゼリーアイ弾性動力学
help.spec.head.eyebrow=eyebrow / まゆ / 眉毛：上下連動とパース追従
help.spec.head.nose=nose / 鼻：3D 頭部向き認識の要点
help.spec.head.mouth=mouth / 口 / 口開き：最大開口の原画必須（はっきりした主線を推奨）、求心的な閉口変形
help.spec.head.mouthClose=mouth_close / 口閉じ：あらかじめ描いた閉口形状（任意）
help.spec.head.mouthInternals=tooth_t / tooth_b / tongue (上歯/下歯/舌)：口アートメッシュへ自動クリッピング
help.spec.head.ears=ears / earwear / eyewear (耳/耳飾り/メガネ)：頭の回転に追従
help.spec.group.body=体幹・身体パーツタグ
help.spec.body.neck=neck / 首：頭部回転と身体の連動部
help.spec.body.topwear=topwear / 服 / 上着：身体 XYZ 傾きおよびガウス分布による胸郭呼吸連動
help.spec.body.limbs=handwear / legwear / footwear（arm / hand / leg / foot）：腕・手・脚・足
help.spec.body.bottomwear=bottomwear (ズボン/スカート)：下衣
help.spec.body.neckwear=neckwear (襟/マフラー)：首元の装飾
help.spec.group.extra=追加パーツと小道具
help.spec.extra.tail=tail / しっぽ：独立して揺れます
help.spec.extra.wings=wings / 翼：身体の後ろに配置
help.spec.extra.objects=objects / prop (小道具)：その他の独立制御できるパーツ
help.spec.group.notes=重要注意事項
help.spec.note.eyelash=• まつ毛レイヤーに下まつ毛や下まぶた線を描き込まないでください（目閉じ時の破綻を防ぐため）；
help.spec.note.mouth=• 口は最大に開いた状態で描きます。閉じた口は自動で作られます。形にこだわる場合は mouth_close を別に描きます。
help.spec.note.hair=• 前髪と後ろ髪を分け、隠れる部分も少し描き足して、動いたときに下地が見えないようにします。
help.spec.note.sides=• 左右はキャラクター自身から見た向きで、キャラクターの左は通常画面の右です。eyelash-l、eyelash_left、左まつ毛 などと書けます。同じレイヤーに描いた左右の部位は自動では分かれません。
help.spec.note.unknown=• 認識されなかったレイヤーもメッシュが作られ、代わりの所属先に付きます。レイヤー表で意味タグを付けて直せます。

