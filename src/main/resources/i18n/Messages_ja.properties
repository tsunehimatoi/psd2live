settings.rig.knob.eye.wide.lift=見開きの量
settings.rig.knob.eye.wide.lift.hint=最大まで見開いたとき上まぶたが上がる量（原画の開きに対する %）。既定 {0}%。
settings.rig.module.eye.gaze-lid=視線とまぶた
settings.rig.module.eye.gaze-lid.hint=上を見ると上まぶたが上がり、下を見ると下がり、左右を見るとまぶたの頂点が視線側に寄ります。
settings.rig.knob.eye.gaze-lid.follow=追従量
settings.rig.knob.eye.gaze-lid.follow.hint=まぶたが視線に追従する度合い（%）。既定 {0}%。
settings.rig.module.eye.emotion=感情の目の形
settings.rig.module.eye.emotion.hint=目の形パラメータ（正は怒り：目頭が下がる、負は哀しみ：内側が上がり外側が垂れる）と細め目を追加し、まばたきや笑顔と重ねられます。
settings.rig.knob.eye.emotion.strength=強さ
settings.rig.knob.eye.emotion.strength.hint=感情による目の変化の大きさ（%）。既定 {0}%。
settings.rig.module.eye.lid-fade=まぶたの線を先に消す
settings.rig.module.eye.lid-fade.hint=二重の線とまぶたの影が、目が閉じきる前に沈んで消え、閉じ目の線に重なりません。
settings.rig.module.eye.highlight=ハイライトの視差
settings.rig.module.eye.highlight.hint=目のハイライトが顔の向きと逆に動き、固定した光源の映り込みのように見えます。まぶたが閉じる前に消えます。
settings.rig.knob.eye.highlight.parallax=移動量
settings.rig.knob.eye.highlight.parallax.hint=ハイライトが動く量（%）。既定 {0}%。
settings.rig.module.eye.aftershock=まばたきの余韻
settings.rig.module.eye.aftershock.hint=まばたきの後まぶたが少し行き過ぎて戻り、まつ毛が揺れます。目の開閉を入力とする振り子で動きます。
settings.rig.knob.eye.aftershock.softness=柔らかさ
settings.rig.knob.eye.aftershock.softness.hint=余韻の大きさ（%）。既定 {0}%。
settings.rig.module.eye.squash=閉じるとき瞳をつぶす
settings.rig.module.eye.squash.hint=まぶたが閉じるとき瞳が少し下につぶれます。
model.parameter.eyeLSmile=左目 笑顔
model.parameter.eyeRSmile=右目 笑顔
model.parameter.eyeLForm=左目 変形
model.parameter.eyeRForm=右目 変形
model.parameter.eyeLSquint=左目 細め
model.parameter.eyeRSquint=右目 細め
model.parameter.eyeLBounce=左目 余韻
model.parameter.eyeRBounce=右目 余韻
model.physics.eyeBounce=まばたきの余韻 {0}
