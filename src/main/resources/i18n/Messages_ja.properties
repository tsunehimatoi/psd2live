settings.graphics.gpu.highPerformance.desc=内蔵 GPU も持つコンピューターでの外部（ディスクリート）GPU。
settings.graphics.gpu.powerSaving=省電力
settings.graphics.gpu.powerSaving.desc=内蔵 GPU。消費電力と発熱が少なく、大きなモデルでは低速です。
settings.graphics.gpu.device={0} の GPU
settings.graphics.gpu.device.primary={0} の GPU（システムの既定）
settings.graphics.gpu.device.missing=現在見つかりません。システムの既定を使います
settings.graphics.gpu.windows=Windows の PSD2Live 用グラフィックス設定（設定 > ディスプレイ > グラフィック）を変更します。次回起動時に反映。OpenGL では従わないドライバーもあります。
settings.graphics.gpu.windowsUnpackaged=Windows のグラフィックス設定はインストール版でのみ変更できます。このコピーはシステムの既定を使います。
settings.graphics.gpu.linux=PRIME オフロード（DRI_PRIME、または NVIDIA 独自の変数）で選択します。次回起動時に反映。起動前に設定済みの変数はそのままです。
settings.graphics.gpu.linuxApplied=次回起動時に反映されます。現在の設定：{0}
settings.graphics.gpu.mac=macOS はウィンドウを Metal で描画します。次回起動時に反映されます。
settings.graphics.antialiasing=アンチエイリアス
settings.graphics.vsync=垂直同期
settings.graphics.vsync.on=オン
settings.graphics.vsync.on.desc=ディスプレイのリフレッシュに合わせて表示し、ティアリングを防ぎます。各フレームの終わりにリフレッシュを待ちます。
settings.graphics.vsync.adaptive=アダプティブ
settings.graphics.vsync.adaptive.desc=リフレッシュに間に合う間は待ち、間に合わない間は描画したらすぐ表示して、半分のフレームレートに落ちるのを防ぎます。Windows はデスクトップを合成するためティアリングしません。
settings.graphics.vsync.off=オフ
settings.graphics.vsync.off.desc=描画したらすぐ表示します。フレームレートは GPU 次第です。次回起動時に反映されます。
settings.graphics.vsync.off.linux.desc=バッファ交換の代わりにタイマーでディスプレイに合わせ、UI スレッドが毎フレーム交換を待たなくなります。入力の反応が速くなります。コンポジターがないとティアリングすることがあります。次回起動時に反映されます。
settings.graphics.frameRate=最大フレームレート
settings.graphics.frameRate.display=ディスプレイに合わせる
settings.graphics.fps={0} FPS
settings.graphics.backgroundFrameRate=バックグラウンド
settings.graphics.backgroundFrameRate.same=最大と同じ
settings.graphics.frameRate.desc=再生中のプレビューの描画頻度を制限します。PSD2Live がアクティブでない間はバックグラウンドの値になり、消費電力と発熱を抑えます。すぐに反映されます。
settings.graphics.threadedGl=ドライバーのスレッド化
