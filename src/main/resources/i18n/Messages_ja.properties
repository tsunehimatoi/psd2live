editor.warpPart.inherit=選択から継承
editor.warpParentAligned=親がワープのとき、配置枠は親の UV に書き込まれます。変換分割とベジェ分割はどちらも自由に設定できます。
editor.warpSizeStrategy=サイズ
editor.warpSize.selection=選択に合わせる（+5%）
editor.warpSize.keyform=キーフォーム包絡を含める
editor.warpSize.center=選択の中心に合わせる
editor.sequentialCreate=連続作成
editor.defaultWarpName={0} のワープ
editor.defaultRotationName={0} の回転
editor.createWarpSameParent=選択メッシュの親デフォーマを先に揃えてください。
editor.pathCreateHint=メッシュ上をクリックして点を追加し、Enter で完了。変形パスは編集補助でありデフォーマではありません。完了後は編集モードでバインドを調整します。
editor.pathLevelHint=編集レベル L{0}（L2 / L3 に別々のパスを保存できます）。
editor.pathEditLevel=パス編集レベル
editor.placementAsParentOf=「{0}」の親
editor.placementAsChildOf=「{0}」の子
