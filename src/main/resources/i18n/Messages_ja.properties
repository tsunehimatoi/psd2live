mesh.settings.fillHint.GRADED_POISSON=輪郭付近から内側へ自然に疎になる均等な点配置。内部密度が最大の点間隔です。
mesh.settings.fillHint.ADAPTIVE_QUADTREE=直角三角形を段階的に二分割し、内側へ疎になります。内部密度が最も粗い格子間隔です。
mesh.settings.fillHint.SIMPLE_TRIANGLES=従来の均一な千鳥状三角格子。
mesh.settings.fillHint.TRIANGLE_FRACTAL=正三角形を四分割し、隣接は最大1段差。内部密度が最も粗い格子間隔です。
mesh.settings.fillHint.CONTOUR_PAVING=輪郭に沿って内側へ行を敷き 2:1 で間引き、中心は内部密度の三角格子で埋めます。
mesh.settings.fillParam.edgeRatio=輪郭遷移倍率
mesh.settings.fillParam.gradation=勾配
mesh.settings.fillParam.jitter=ランダム度
mesh.settings.fillParam.angle=格子の向き
mesh.settings.fillParam.maxRows=最大行数
mesh.settings.fillParamHint.edgeRatio=内側の最初の列の点間隔と輪郭点間隔の比。2 で 2:1 遷移となり、輪郭沿いの二重列を作りません。
mesh.settings.fillParamHint.gradation=深さ 1px あたりに増える点間隔。大きいほど早く疎になります。
mesh.settings.fillParamHint.jitter=0 は規則的な千鳥格子、1 は最大のランダムずれ。
mesh.settings.fillParamHint.angle=格子全体の回転角度。格子線をパーツの向きに合わせられます。
mesh.settings.fillParamHint.maxRows=輪郭に沿って敷く行数の上限。残りは中心の格子が埋めます。
mesh.settings.topologyHint=離れた輪郭点は内部点を介して接続します。滑らかな輪郭を損なう場合は自動的に戻します。
mesh.settings.overridden=カスタム設定
mesh.panel.globalTitle=グローバル既定
mesh.panel.globalHint=個別上書きのないパーツに適用されます。ArtMesh を選ぶと一部品だけ編集できます。
