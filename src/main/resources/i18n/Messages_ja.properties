editor.glueBrushHint=2つのメッシュを選んで編集モードに入ると、両方を同時に編集できます。グルー点はひし形1つで表示され、選択・移動すると両方のメッシュの頂点が一緒に動きます。グルーブラシは、もう一方のメッシュの頂点を各頂点の位置に追加またはスライド（UV も追従）させるので、絵は動きません。Alt+ドラッグで結合解除。重みブラシは A を青、B を橙で表示し、Alt で減らします。Ctrl+G で選択頂点を結合します。

editor.objectHint=クリックで選択 · Shift 追加 · Alt 除外 · Ctrl+クリックで階層を移動   ドラッグで範囲選択   階層とレイヤー一覧では Shift が範囲、Ctrl が切替   Ctrl+A 全選択   Esc 取消

