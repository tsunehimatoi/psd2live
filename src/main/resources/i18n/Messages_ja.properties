settings.graphics.threadedGl.on=オン
settings.graphics.threadedGl.off=オフ
settings.graphics.threadedGl.desc=OpenGL ドライバーが専用スレッドで呼び出しを処理し（Mesa glthread、NVIDIA threaded optimization）、UI スレッドはキューに積むだけになります。大きなウィンドウや非力な CPU で効果があります。不具合があればオフにしてください。次回起動時に反映されます。
