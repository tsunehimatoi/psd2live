mesh.settings.unitsDocument=ドキュメントサイズに合わせる
mesh.settings.unitsHint=オン：長辺を {0} px に縮めたドキュメントのピクセルで長さを測ります。大きな PSD でも同じメッシュを縮小ラスターから生成します。オフ：元のピクセル（旧プロジェクトと同じ）。
mesh.settings.unitsScale=1 単位 = 元画像 {0} px
mesh.settings.traceTexture=テクスチャのピクセルで輪郭を取る
mesh.settings.traceHint=オン：各レイヤー自身のピクセルに沿って、メッシュ単位の最大 {0} 分の 1 の細かさで輪郭を取り、キャンバスの 1 ピクセルより細い線もメッシュ内に収めます。頂点の間隔は変わりません。オフ：キャンバス解像度に縮めたレイヤーから輪郭を取ります（旧プロジェクトと同じ）。
mesh.settings.wrap=包み込み
mesh.settings.wrapHint=包み込みトポロジー：輪郭を取る前に、この幅より狭い隙間やくぼみを閉じます。まつ毛や毛先などの細い突起はそれぞれの輪郭ではなく、一つの簡単な外形を共有します。細長い線は外形の中に全長が残り、描かれたピクセルはすべてメッシュ内に収まります。0 は描画の縁に沿います。
