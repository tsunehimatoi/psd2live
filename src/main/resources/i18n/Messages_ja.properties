tutorial.basic.step.openFile.title=「ファイル」メニューを開く
tutorial.basic.step.openFile.body=タイトルバー左側の「ファイル」をクリックしてください。「次へ」でも進めます。
tutorial.basic.step.import.title=PSD を読み込む
tutorial.basic.step.import.body=ハイライトされた「インポート」サブメニューで「PSD から新規プロジェクト…」をクリックし、レイヤー分けされた立絵を開きます。既存の Cubism モデルも同じサブメニューから、新規プロジェクトとして、または現在のモデルを置き換えて読み込めます。PSD を読み込むと「スタート」画面が開きます。「最小 / 標準 / フル」のクイック設定でモデルプリセットを決め、メッシュごとに分割するレイヤーにチェックを入れます。
tutorial.basic.step.preview.title=プレビューに切り替え
tutorial.basic.step.preview.body=キャンバス左上のモードメニューを開き、「プレビュー」を選んでモデルの動きを確認します。プレビュー左側のツールバー下端の行で、Cubism SDK と PSD2Live ランタイム（標準 / 拡張）を切り替えられます。
tutorial.basic.step.layers.title=まず「レイヤー」全体を確認
tutorial.basic.step.layers.body=枠内はレイヤーパネル全体です。PSD のレイヤー名と、認識されたタグ（生成器が読む部位と左右）、各レイヤーの差分を確認できます。次の手順では一行に注目し、タグが合わない場合の修正方法を説明します。
tutorial.basic.step.layerRow.title=タグが部品と合わない場合
tutorial.basic.step.layerRow.body=枠内のレイヤー名から実際の部品を確認し、タグをクリックして対応する部位と左右を選ぶか、「髪」「前」などの語を入力します。例えば髪が別の部品として認識されていたら、適切な髪の部位に変更します。生成済みのレイヤーは再生成で新しいタグを反映します。
tutorial.basic.step.settings.title=モデルプリセットパネル
tutorial.basic.step.settings.body=ハイライトは「モデルプリセット」パネル全体です。頭部・身体の可動幅、口、モーション、髪と衣装のシミュレーション、キャンバスで作るデフォーマの分割を調整し、「次へ」。テクスチャアトラスは書き出し画面で設定します。
tutorial.basic.step.export.title=モデルを書き出す
tutorial.basic.step.export.body=書き出しを押すと設定ウィンドウが開きます。CMO3 は Cubism Editor で編集を続けられるモデルファイルです。ランタイム用には MOC3 のほか model3.json、テクスチャ、必要に応じて物理演算などのファイルが含まれるため、MOC3 だけを渡さないでください。
tutorial.basic.step.done.title=基本ガイド終了
tutorial.basic.step.done.body=読込から書き出しまでの流れを一通り見ました。次は「ワークスペース案内」へ進むか、一覧から選んでください。
