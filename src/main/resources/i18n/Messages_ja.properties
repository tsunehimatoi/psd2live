help.manual.mcp.intro=ローカル MCP サーバー（設定 → MCP）を有効にすると、AI エージェントやスクリプトが下の操作でこのページの作業を行えます。完全なツール構成では各操作が同名のツールになり、コンパクト構成では右側のとおりに呼び出します。リクエストには request_id と project_id も付けられ、コンパクト構成では自動で補われます。操作を開くとリクエストのフィールドが表示されます。
