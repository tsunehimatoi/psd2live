editor.pathCreateHint=メッシュ上をクリックして点を追加し、Enter で完了。変形パスは編集補助でありデフォーマではありません。完了後は編集モードでバインドを調整します。
editor.pathLevelHint=編集レベル L{0}（L2 / L3 に別々のパスを保存できます）。
editor.pathEditLevel=パス編集レベル
editor.placementAsParentOf=「{0}」の親
editor.placementAsChildOf=「{0}」の子
