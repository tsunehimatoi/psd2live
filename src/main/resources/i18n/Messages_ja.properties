editor.subdivideHint=クリックまたはドラッグした辺を一括細分。頂点を一つ選ぶと隣接辺を細分。
editor.knifeGestureHint=メッシュ内外に自由配置 · 近くの頂点・辺に自動スナップ · Shift：一時無効 · Backspace：点を戻す · Enter：確定
editor.knifeSnapRadius=スナップ半径
