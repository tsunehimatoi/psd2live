settings.rigTuning.armSwingDegrees=腕の振れ
settings.rigTuning.armSwingDegrees.hint=体 X が最大のとき、腕が肩を軸に回転と逆向きへ何度振れるか。手は体より少し遅れます。負の値では腕が体と同じ向きに振れます。デフォルト {0}°。
settings.rigTuning.hipShift=腰の横移動
