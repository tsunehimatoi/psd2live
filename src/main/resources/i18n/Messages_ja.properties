settings.rigTuning.faceTurn=顔の回転
settings.rigTuning.faceTurn.hint=角度 X が最大のとき顔面が向きに合わせて回り込む量。顔の半幅に対する割合で、大きいほどパーツが向く側へ寄ります。デフォルト {0}%。
settings.rigTuning.faceTilt=顔の上下
settings.rigTuning.faceTilt.hint=角度 Y が最大のとき顔の各行が上向きで広がり下向きで詰まる量。顔の半分の高さに対する割合。デフォルト {0}%。
settings.rigTuning.faceLeanDown=前傾でうつむく
settings.rigTuning.faceLeanDown.hint=前傾が最大のとき顔が下を向く角度（角度 Y）。デフォルト {0}°。
settings.rigTuning.faceLeanUp=後傾で上を向く
settings.rigTuning.faceLeanUp.hint=後傾が最大のとき顔が上を向く角度（角度 Y）。デフォルト {0}°。
settings.rigTuning.faceTurnBase=顔全体の移動
settings.rigTuning.faceTurnBase.hint=角度 X が最大のとき顔全体が一緒に動く量。顔の半幅に対する割合。デフォルト {0}%。
settings.rigTuning.faceLift=顔全体の上下
settings.rigTuning.faceLift.hint=角度 Y が最大のとき顔全体が上下する量。顔の半分の高さに対する割合。デフォルト {0}%。
settings.rigTuning.faceArch=上下の弧
settings.rigTuning.faceArch.hint=角度 Y が最大のとき顔の各行が上向きで ^、下向きで V に曲がる量。顔の半分の高さに対する割合。デフォルト {0}%。
settings.rigTuning.faceCorner=斜めの補正
settings.rigTuning.faceCorner.hint=角度 X と Y を同時に動かした四隅のポーズでの追加補正の強さ。100% がデフォルトの形、0 で補正なし。デフォルト {0}%。
settings.rigTuning.faceOutsideFollow=輪郭外の追従
settings.rigTuning.faceOutsideFollow.hint=肌の輪郭の外にある頭のレイヤーが向きに合わせて一体で動く量。顔の半分の大きさに対する割合。デフォルト {0}%。
settings.rigTuning.yawEase=回転の緩和
settings.rigTuning.yawEase.hint=角度 X がこのあたりで緩やかになります。小さいほど回り始めに大きく、終わりに小さく動きます。デフォルト {0}°。
settings.rigTuning.pitchEase=上下の緩和
settings.rigTuning.pitchEase.hint=角度 Y がこのあたりで緩やかになります。小さいほど動き始めに大きく、終わりに小さく動きます。デフォルト {0}°。
settings.rigTuning.featurePlane=パーツの傾き
settings.rigTuning.featurePlane.hint=四隅のポーズで両目・両眉・口を結ぶ線が傾く量。デフォルト {0}%。
settings.rigTuning.headShellTurn=頭殻の回転
settings.rigTuning.headShellTurn.hint=角度 X が最大のとき頭殻（髪を含む）が動く量。頭の幅に対する割合。デフォルト {0}%。
settings.rigTuning.headShellCrown=頭頂の追加
settings.rigTuning.headShellCrown.hint=角度 X が最大のとき頭頂が頭殻よりさらに動く量。頭の幅に対する割合。デフォルト {0}%。
