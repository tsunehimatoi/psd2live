help.tutorial.triage.title=操作チュートリアルを選択してください：
help.tutorial.triage.back=< チュートリアル選択に戻る
help.tutorial.triage.section.core=基本フロー：生成・出力・保存
help.tutorial.triage.section.advanced=応用・任意機能：

help.tutorial.triage.standard.title=【See-Through 出力 PSD】直接出力 (読み込み → 書き出し)
help.tutorial.triage.standard.desc=See-Through から出力された立絵：全自動認識、手動設定不要の 2 ステップ書き出し。
help.tutorial.triage.custom.title=【独自命名 PSD】プリセット照合 (読み込み → 照合 → 書き出し)
help.tutorial.triage.custom.desc=独自命名の立絵：右下のインスペクターで部位プリセットを照合する 1 手間のみ。
help.tutorial.triage.project.title=プロジェクト保存とバージョン復帰
help.tutorial.triage.project.desc=.psd2live 1 ファイルに原画・全ブランチ・素材が入ります。
help.tutorial.triage.preview.title=【調整とプレビュー】必要な機能の選択とリアルタイム確認
help.tutorial.triage.preview.desc=モデル設定とパラメータを微調整し、頭の回転・まばたき・呼吸をプレビューで確認。
help.tutorial.triage.upscale.title=【AI 超解像】テクスチャ 2×/4× 高解像度化 (Ctrl+U)
help.tutorial.triage.upscale.desc=解像度が低い原画を無損拡大し、透明境界のジャギーやゴミを除去。
help.tutorial.triage.variants.title=【差分作成】トグル差分と切替差分
help.tutorial.triage.variants.desc=照れ・涙のトグル差分や複数表情・ポーズ・衣装の排他切替差分を作成。
help.tutorial.triage.agent.title=【AI Agent / MCP】外部連携と注意事項 [実験的]
help.tutorial.triage.agent.desc=MCP で外部 AI を接続。警告：テスト中につきトークン消費大。

