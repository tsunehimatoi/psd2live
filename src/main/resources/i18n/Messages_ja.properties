settings.rigTuning.mouthShift=口の横移動
settings.rigTuning.mouthShift.hint=角度 X が最大のとき口が向く側へ動く量。顔の半幅に対する割合。デフォルト {0}%。
settings.rigTuning.mouthCornerLag=奥の口角の遅れ
settings.rigTuning.mouthCornerLag.hint=角度 X が最大のとき奥側の口角が遅れる量。口の幅に対する割合。デフォルト {0}%。
settings.rigTuning.mouthNearLag=手前の口角の遅れ
settings.rigTuning.mouthNearLag.hint=角度 X が最大のとき手前側の口角が遅れる量。口の幅に対する割合。デフォルト {0}%。
settings.rigTuning.mouthTurnArch=回転時の口の沈み
settings.rigTuning.mouthTurnArch.hint=角度 X が最大のとき口の中央が下がる量。口の高さに対する割合。デフォルト {0}%。
settings.rigTuning.mouthTilt=口の上下
settings.rigTuning.mouthTilt.hint=角度 Y が最大のとき口が上下する量。口の高さに対する割合。デフォルト {0}%。
settings.rigTuning.noseShift=鼻の横移動
settings.rigTuning.noseShift.hint=角度 X が最大のとき鼻が向く側へ動く量。顔の半幅に対する割合で、鼻先は鼻の付け根より大きく動きます。デフォルト {0}%。
settings.rigTuning.earFade=奥の耳のフェード
settings.rigTuning.earFade.hint=角度 X が最大のとき奥側の耳が透ける量。デフォルト {0}%。
settings.rigTuning.noseTilt=鼻の上下
settings.rigTuning.noseTilt.hint=角度 Y が最大のとき鼻が上下する量。鼻の高さに対する割合。デフォルト {0}%。
settings.rigTuning.earFarShrink=奥の耳の縮小
settings.rigTuning.earFarShrink.hint=角度 X が最大のとき奥側の耳が細くなる量。デフォルト {0}%。
settings.rigTuning.earShift=耳の逆移動
settings.rigTuning.earShift.hint=角度 X が最大のとき耳が向きと逆へ動く量。顔の半幅に対する割合。デフォルト {0}%。
settings.rigTuning.frontHairTurn=前髪の回転
settings.rigTuning.frontHairTurn.hint=角度 X が最大のとき前髪が向きと逆へずれる量。頭の幅に対する割合。デフォルト {0}%。
settings.rigTuning.backHairTurn=後ろ髪の回転
settings.rigTuning.backHairTurn.hint=角度 X が最大のとき後ろ髪が向きと逆へずれる量。頭の幅に対する割合。デフォルト {0}%。
settings.rigTuning.frontHairSway=前髪の揺れ幅
settings.rigTuning.frontHairSway.hint=前髪の揺れが最大のとき毛先が振れる量。髪の短い辺に対する割合。デフォルト {0}%。
settings.rigTuning.backHairSway=後ろ髪の揺れ幅
settings.rigTuning.backHairSway.hint=後ろ髪の揺れが最大のとき毛先が振れる量。髪の短い辺に対する割合。デフォルト {0}%。
settings.rigTuning.frontHairTilt=前髪の上下
settings.rigTuning.frontHairTilt.hint=角度 Y が最大のとき前髪が上下と逆へずれる量。頭の高さに対する割合で、負の値は同じ向きに動きます。デフォルト {0}%。
settings.rigTuning.backHairTilt=後ろ髪の上下
settings.rigTuning.backHairTilt.hint=角度 Y が最大のとき後ろ髪が上下と逆へずれる量。頭の高さに対する割合で、負の値は同じ向きに動きます。デフォルト {0}%。
settings.rigTuning.frontHairPerspective=前髪の遠近
settings.rigTuning.frontHairPerspective.hint=角度 X が最大のとき前髪の中央が向く側へさらに動く量。デフォルト {0}%。
settings.rigTuning.frontHairCurl=前髪の跳ね
settings.rigTuning.frontHairCurl.hint=前髪が最大まで振れたとき毛先が持ち上がる量。髪の短い辺に対する割合。デフォルト {0}%。
settings.rigTuning.backHairCurl=後ろ髪の跳ね
settings.rigTuning.backHairCurl.hint=後ろ髪が最大まで振れたとき毛先が持ち上がる量。髪の短い辺に対する割合。デフォルト {0}%。
settings.rigTuning.hairRollHold=長い髪の傾き保持
settings.rigTuning.hairRollHold.hint=Angle Z で頭を傾けたとき、あごより下の髪が毛先でどれだけ戻るか（あごから徐々に）。長い髪がまるごと振り出されず曲がります。デフォルト {0}%。
settings.rigTuning.turnFade=回転の減衰
settings.rigTuning.turnFade.hint=体の回転が腰から下のどこまでで消えるか。胴の長さ単位。デフォルト {0}。
settings.rigTuning.kneesInRest=膝の基本の内向き
settings.rigTuning.kneesInRest.hint=膝が曲がるとき、沈み込みの量にかかわらず内に向く角度。デフォルト {0}°。
settings.rigTuning.turnDegrees=回転角度
settings.rigTuning.turnDegrees.hint=体 X が最大のとき、腰から上の上半身が中心線を軸に何度回るか。デフォルト {0}°。
settings.rigTuning.armSwingDegrees=腕の振れ
settings.rigTuning.armSwingDegrees.hint=体 X が最大のとき、腕が肩を軸に回転と逆向きへ何度振れるか。手は体より少し遅れます。負の値では腕が体と同じ向きに振れます。デフォルト {0}°。
settings.rigTuning.hipShift=腰の横移動
settings.rigTuning.hipShift.hint=体 X が最大のとき、腰が体ごと横へ動く量。脚の長さに対する割合。デフォルト {0}%。
settings.rigTuning.sink=沈み込み
settings.rigTuning.sink.hint=体 Y の下向きが最大のとき、膝を曲げて腰が沈む量。脚の長さに対する割合。デフォルト {0}%。
settings.rigTuning.rise=伸び上がり
settings.rigTuning.rise.hint=体 Y の上向きが最大のとき、脚が伸びて腰が上がる量。脚の長さに対する割合。デフォルト {0}%。
settings.rigTuning.kneesIn=膝の内向き
settings.rigTuning.kneesIn.hint=体 Y の下向きが最大のとき、曲がった膝がさらに内側へ向く角度。デフォルト {0}°。
settings.rigTuning.openShorten=背中の縮み
settings.rigTuning.openShorten.hint=体 Y の下向きが最大のとき、背中が縮む量。胴の長さに対する割合。デフォルト {0}%。
settings.rigTuning.openWiden=肩の開き
settings.rigTuning.openWiden.hint=体 Y の下向きが最大のとき、肩が広がる量。デフォルト {0}%。
settings.rigTuning.standStretch=背中の伸び
settings.rigTuning.standStretch.hint=体 Y の上向きが最大のとき、背中が伸びる量。胴の長さに対する割合。デフォルト {0}%。
settings.rigTuning.standNarrow=肩のすぼみ
settings.rigTuning.standNarrow.hint=体 Y の上向きが最大のとき、肩が狭まる量。デフォルト {0}%。
settings.rigTuning.leanDegrees=前傾角度
settings.rigTuning.leanDegrees.hint=身体の前後傾が正の最大のとき、体が見る人の方へ曲がる角度。デフォルト {0}°。
settings.rigTuning.leanBackDegrees=後傾角度
settings.rigTuning.leanBackDegrees.hint=身体の前後傾が負の最大のとき、体が後ろへ反る角度。デフォルト {0}°。
settings.rigTuning.pelvisShare=骨盤の分担
settings.rigTuning.pelvisShare.hint=前後傾のうち骨盤が股関節を軸に受け持つ割合。残りは腰で曲がります。デフォルト {0}%。
settings.rigTuning.headGrow=頭の拡大
settings.rigTuning.headGrow.hint=頭身が正の最大（デフォルメ）のとき、頭が大きくなる量。負の値では逆になります。デフォルト {0}%。
settings.rigTuning.chestGrow=胸の広がり
settings.rigTuning.chestGrow.hint=頭身が正の最大のとき、肩の位置で胸が広がる量。デフォルト {0}%。
settings.rigTuning.bodyShrink=胴の短縮
settings.rigTuning.bodyShrink.hint=頭身が正の最大のとき、胴と腕が短くなる量。デフォルト {0}%。
settings.rigTuning.legShrink=脚の短縮
settings.rigTuning.legShrink.hint=頭身が正の最大のとき、脚とスカートが短くなる量。足は動きません。デフォルト {0}%。
settings.rigTuning.bodyZDegrees=体 Z の傾き
settings.rigTuning.bodyZDegrees.hint=体 Z が最大のとき、上半身が腰を軸に横へ傾く角度。デフォルト {0}°。
settings.rigTuning.breathLift=呼吸の肩上げ
settings.rigTuning.breathLift.hint=呼吸が最大のとき、肩とそれに乗る頭や腕が上がる量。胴の長さに対する割合。デフォルト {0}%。
settings.rigTuning.breathWiden=呼吸の胸の広がり
settings.rigTuning.breathWiden.hint=呼吸が最大のとき、胸が広がる量。デフォルト {0}%。
settings.rigTuning.torsoDepth=胴の厚み
settings.rigTuning.torsoDepth.hint=胴の前後の厚みの、幅に対する割合。回転と前後傾はこの厚みの立体として計算され、厚いほど回転時に手前側が目立ちます。デフォルト {0}%。
settings.rigTuning.turnCameraDistance=回転の視距離
settings.rigTuning.turnCameraDistance.hint=回転を胴の前方どれだけ離れて見るか。胴の長さ単位。近いほど手前側が大きく、奥側が小さくなります。デフォルト {0}。
settings.rigTuning.leanCameraDistance=前傾の視距離
settings.rigTuning.leanCameraDistance.hint=前後傾を胴の前方どれだけ離れて見るか。胴の長さ単位。近いほど前傾時に胸が大きく見えます。デフォルト {0}。
