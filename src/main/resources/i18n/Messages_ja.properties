editor.placementPathNeedPoints=先にキャンバスでパス点を2つ以上クリックしてください。
editor.placementPathReady=パス制御点が準備完了（{0} 点）· Enter で確定
editor.placementPathNeedMore=キャンバスをクリックして制御点を追加（現在 {0}/2）
editor.placementPathPreviewHint=幅（赤破線）と硬度（青実線）の影響範囲をリアルタイム表示
