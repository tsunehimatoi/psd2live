settings.rigTuning.eyeShift=目の横移動
settings.rigTuning.eyeShift.hint=角度 X が最大のとき両目が向く側へさらに動く量。顔の半幅に対する割合。デフォルト {0}%。
settings.rigTuning.eyeTilt=目の上下
settings.rigTuning.eyeTilt.hint=角度 Y が最大のとき目が上下する量。目の高さに対する割合。デフォルト {0}%。
settings.rigTuning.eyeLidCurve=まぶたの弧
settings.rigTuning.eyeLidCurve.hint=角度 Y が最大のとき目の中央がさらに上下する量。目の高さに対する割合。デフォルト {0}%。
settings.rigTuning.eyeTiltStretch=目の上下伸縮
settings.rigTuning.eyeTiltStretch.hint=角度 Y が最大のとき目が上向きで高く、下向きで平たくなる量。デフォルト {0}%。
settings.rigTuning.irisShift=瞳の逆移動
settings.rigTuning.irisShift.hint=角度 X が最大のとき瞳が向きと逆へ動く量。瞳の幅に対する割合。デフォルト {0}%。
settings.rigTuning.irisKeepWidth=瞳の幅保持
settings.rigTuning.irisKeepWidth.hint=角度 X が最大のとき奥側の瞳が細くなる白目の中で形を保つため広がる量。手前側はその 5 分の 1。デフォルト {0}%。
settings.rigTuning.irisTilt=瞳の上下
settings.rigTuning.irisTilt.hint=角度 Y が最大のとき瞳が上下する量。瞳の高さに対する割合。デフォルト {0}%。
