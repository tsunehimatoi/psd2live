editor.createWarpHint=メッシュ選択後に枠をドラッグ · ホイール：変換分割 · Esc：取消。配置プレビューが最終格子と一致します。
editor.createRotationHint=メッシュ選択後に中心から方向へドラッグ · Shift：15°刻み · Esc：取消
editor.warpAddTo=追加先
editor.warpAddTo.parentOfSelected=選択オブジェクトの親にする
editor.warpAddTo.childOfDeformer=選択デフォーマの子にする（空）
