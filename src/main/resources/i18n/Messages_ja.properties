settings.rigTuning.backHairCurl=後ろ髪の跳ね
settings.rigTuning.backHairCurl.hint=後ろ髪が最大まで振れたとき毛先が持ち上がる量。髪の短い辺に対する割合。デフォルト {0}%。
settings.rigTuning.turnFade=回転の減衰
settings.rigTuning.turnFade.hint=体の回転が腰から下のどこまでで消えるか。胴の長さ単位。デフォルト {0}。
settings.rigTuning.kneesInRest=膝の基本の内向き
