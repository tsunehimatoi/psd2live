tutorial.basic.step.openFile.title=「ファイル」メニューを開く
tutorial.basic.step.openFile.body=タイトルバー左側の「ファイル」をクリックしてください。「次へ」でも進めます。
tutorial.basic.step.import.title=PSD を読み込む
tutorial.basic.step.import.body=左のメニューで「PSD を読み込み…」をクリックし、レイヤー分けされた立絵を開きます。
tutorial.basic.step.preview.title=プレビューに切り替え
tutorial.basic.step.preview.body=キャンバス左上のモードメニューを開き、「プレビュー」を選んでモデルの動きを確認します。
tutorial.basic.step.layers.title=まず「レイヤー」全体を確認
tutorial.basic.step.layers.body=枠内はレイヤーパネル全体です。PSD のレイヤー名と、認識された種類・プリセット部品・左右を確認できます。次の手順では一行に注目し、部品とプリセットが一致しない場合の修正方法を説明します。
tutorial.basic.step.layerRow.title=部品とプリセットが合わない場合
tutorial.basic.step.layerRow.body=枠内のレイヤー名から実際の部品を確認します。プリセットを使う部品は種類をプリセットにして、対応する部品と左右を選びます。例えば髪が別の部品として認識されていたら、適切な髪のプリセットに変更します。
tutorial.basic.step.settings.title=モデルプリセットパネル
tutorial.basic.step.settings.body=モデルプリセットで変形・モーション・シミュレーションを調整します。髪と衣装のプリセットは Pin ウェイトとベイクを生成します。テクスチャアトラスはエクスポート画面で調整します。
tutorial.basic.step.export.title=モデルを書き出す
tutorial.basic.step.export.body=書き出しを押すと設定ウィンドウが開きます。CMO3 は Cubism Editor で編集を続けられるモデルファイルです。ランタイム用には MOC3 のほか model3.json、テクスチャ、必要に応じて物理演算などのファイルが含まれるため、MOC3 だけを渡さないでください。
tutorial.basic.step.done.title=基本ガイド終了
tutorial.basic.step.done.body=読込から書き出しまでの流れを一通り見ました。次は「ワークスペース案内」へ進むか、一覧から選んでください。
