cli.usage=PSD2Live 3.6.7\n引数なしでデスクトップ GUI を起動します。コマンドラインモード：\n  psd2live --input character.psd [--output out] [オプション]\n\nオプション：\n  --lang ja               UI言語：zh, en, ja, ko\n  --clear-user-data       設定、ワークスペースの保存領域、ダウンロードしたランタイムを削除して終了\n  --atlas 4096            テクスチャページサイズ（256..16384）\n  --mesh-spacing 64       メッシュサンプル間隔（2048 px ドキュメント換算のピクセル）\n  --mesh-pixels           メッシュ間隔を元のピクセルで測る\n  --mesh-wrap 0           包み込みトポロジー：この幅（メッシュ単位）より狭い輪郭の隙間を閉じ、細い突起を一つの外形にまとめる\n  --head-strength 1.0     頭部3D回転の可動幅\n  --body-strength 1.0     身体モーションの可动幅\n  --mesh-only             メッシュとテクスチャのみ出力\n  --no-deformers          デフォーマ階層を生成しない\n  --no-see-through        眉も目も前髪から透かさない\n  --no-see-through-eyes   目を前髪から透かさない\n  --see-through-opacity 0.5  眉と目が前髪から透ける度合い（0..1）\n  --no-motions            モーションファイルを出力しない\n  --no-physics            物理演算を生成しない\n  --no-cmo3               編集可能な CMO3 を出力しない\n  --no-moc3               MOC3 ランタイムファイル群を出力しない\n  --no-json               プロジェクト情報 JSON を出力しない

