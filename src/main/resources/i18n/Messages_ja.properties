editor.creationSelectFirst=関連付けるアートメッシュを選択してからドラッグしてください。
editor.rotationGestureHint=原点：移動 · 先端：回転 · Shift：15°刻み · Alt＋先端：拡縮
editor.rotationScopeHint=選択の直上の親として挿入。キャンバスで付け替え対象を強調表示します。
editor.rotationMountHint=マウント：選択メッシュ/デフォーマの親として挿入（元の親を維持）。
editor.rotationScopeCount={0} 個のデフォーマ、{1} 個のメッシュに影響します（キャンバスで強調表示）。
