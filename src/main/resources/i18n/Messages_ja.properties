toolDetails.noModel=モデルを読み込むとツール詳細が表示されます
tutorial.basic.hint.manual=明るい枠内で操作を試したら「次へ」を選びます。
tutorial.basic.hint.auto=操作が完了すると自動で進みます。後で試す場合はスキップできます。
tutorial.basic.step.openFile.action=枠内の「ファイル」をクリックするか、「次へ」でメニューを開きます。
tutorial.basic.step.import.action=PSD の読み込みを選び、レイヤー付きのファイルを指定します。キャンセル後は再試行するかスキップできます。
tutorial.basic.step.preview.action=ハイライト内のモードメニューを開き「プレビュー」を選びます。すでにプレビュー中の場合は自動で進みます。
tutorial.basic.step.export.action=エクスポートをクリックすると設定画面が開きます。実際の出力はその画面で確定します。
tutorial.basic.targetMissing=操作対象がまだ表示されていません。PSD が未読込の場合は前の手順に戻るか、スキップまたは終了して再開できます。
tutorial.catalog.title=インタラクティブ教程一覧
tutorial.catalog.desc=経験に合うコースを選び、ワークスペース上のハイライトに沿って章ごとに学びます。
tutorial.common.continueNext=続ける：{0}
tutorial.common.openCatalog=教程一覧を開く
tutorial.common.requireSelection=先にハイライトされた階層ツリーでメッシュまたはデフォーマを選択してください。
tutorial.common.requireLayer=先に階層ツリーでレイヤーを選択してください。
tutorial.common.hint.prerequisite=ハイライト内の選択を終えてから進みます。完了するまでスキップできません。
tutorial.basic.step.naming.title=プリセット命名の注意
tutorial.basic.step.naming.body=名前で自動認識される例：eye_close、mouth_close、tooth_t / tooth_b、tongue。上まつ毛のみ描く、口は最大開口、体は直立。
tutorial.basic.step.naming.action=レイヤー名とプリセット列を見比べ、「次へ」。
tutorial.variants.step.toggleWhy.title=オンオフ差分の役割
tutorial.variants.step.toggleWhy.body=パラメータでレイヤーの表示／非表示を切り替えます。頬紅や眼鏡などに向きます。
tutorial.variants.step.toggleSetup.title=オンオフ差分の設定
tutorial.variants.step.toggleSetup.body=種類をオンオフ差分にし、パラメータ名（例 blush）を入力。同じ名前で複数レイヤーを駆動できます。
tutorial.variants.step.toggleSetup.action=1行をオンオフ差分にしてパラメータ名を入れる（確認のみでも可）、「次へ」。
tutorial.variants.step.switchWhy.title=切替差分の役割
tutorial.variants.step.switchWhy.body=複数の見た目から1つだけ表示。表情・ポーズ・衣装などに使います。
tutorial.variants.step.switchSetup.title=切替差分の設定
tutorial.variants.step.switchSetup.body=関連行を切替差分にし同じパラメータ名、ID を 0,1,2…。例 expression：0 通常 / 1 笑顔。
tutorial.variants.step.switchSetup.action=2行に同じ名前と違う ID を設定（確認のみでも可）、「次へ」。
tutorial.parameters.step.findTab.title=パラメータを開く
tutorial.parameters.step.findTab.body=右側 Dock の「パラメータ」タブを開きます。見つからなければインスペクタ領域を展開。
tutorial.parameters.step.findTab.action=パラメータ Dock を開き、「次へ」。
tutorial.parameters.step.operate.title=キーの操作
tutorial.parameters.step.operate.body=スライダーでは左ドラッグで値を変更し、キーの印にホバーして右クリックするとそのキーに吸着します。2D パッドも同様で、右クリックで 2 つのパラメータのキーの交点に吸着します。パラメータのキーはモデリング用のデータで、アニメーションのキーフレームではありません。
tutorial.basic.title=基本フロー
tutorial.basic.desc=PSD 読込、プレビュー、レイヤーと設定、CMO3 / MOC3 書き出し。
tutorial.workspace.title=ワークスペースと自由レイアウト
tutorial.workspace.desc=最新プリセットを使い、キャンバスとモジュールを自由に結合、分割、分離します。
tutorial.workspace.step.viewMenu.title=表示オプションメニュー
tutorial.workspace.step.viewMenu.body=キャンバスのタイトルバーにある「表示」は、そのキャンバスのメッシュ、デフォーマ、パス、背景（市松模様/単色/透明）などの表示を覚えます。キャンバスごとに別々です。
tutorial.workspace.step.viewMenu.action=メニューを開いて項目を確認し、閉じてから「次へ」。
tutorial.workspace.step.camera.title=ズームとパン
tutorial.workspace.step.camera.body=ホイールでズーム、中ドラッグまたは {kbd:Space} でパン。{key:ZOOM_IN} / {key:ZOOM_OUT} / {key:ZOOM_RESET}、{key:RESET_CAMERA} リセット、{key:FRAME_VIEW} で選択合わせ。
tutorial.workspace.step.done.title=ワークスペース案内完了
tutorial.workspace.step.done.body=次は編集キャンバスの中心となる「階層ツリーとモードバー」をおすすめします。
tutorial.workspace.step.presets.title=最新ワークスペースプリセット
tutorial.workspace.step.presets.body=新規プロジェクトには編集、メッシュ、リギング、アニメーション、プレビュー、物理、履歴の 7 つのプリセットを用意。各タスクに最適なキャンバスとモジュール配置を提供し、「+」から空白構成も作成できます。
tutorial.workspace.step.presets.action=ワークスペース欄の「+」を開き、プリセットの説明を確認します。作成は任意です。
tutorial.workspace.step.switch.title=ワークスペースの切替と整理
tutorial.workspace.step.switch.body=上部タブごとに独立したレイアウトを持ちます。クリックで切替、中クリックで閉じ、ドラッグで並べ替えます。右クリックで名前変更、複製、他を閉じる、プリセット復元もできます。
tutorial.workspace.step.switch.action=既存ワークスペースを切り替えるか、タブをドラッグして並べ替えます。
tutorial.workspace.step.dockTabs.title=モジュールを自由に結合
tutorial.workspace.step.dockTabs.body=キャンバス、階層、パラメータ、インスペクター、アニメーション、物理はすべて Dock モジュールです。同じ欄で並べ替えるか、別の欄へ挿入できます。
tutorial.workspace.step.dockTabs.action=Dock タブをドラッグし、同じ欄または別の欄の挿入マークを確認します。
tutorial.workspace.step.split.title=端へドロップして分割
tutorial.workspace.step.split.body=ドラッグ中は対象の上下左右がドロップ領域になります。ドロップで分割し、境界をドラッグして比率を変更できます。キャンバスとパネルは同じ規則です。
tutorial.workspace.step.float.title=独立ウィンドウへ分離
tutorial.workspace.step.float.body=主ウィンドウ外へドラッグすると浮動ウィンドウになります。タイトルバーから Dock に戻せます。閉じたモジュールはウィンドウメニューから再表示できます。
tutorial.workspace.step.memory.title=レイアウトはワークスペース別に保存
tutorial.workspace.step.memory.body=タブ構成、分割比率、浮動状態、キャンバスモード、表示設定はワークスペースごとに保存されます。「レイアウトをリセット」はモデル内容を変更しません。
tutorial.workspace.step.sidebars.title=右上のサイドバー操作
tutorial.workspace.step.sidebars.body=現在のレイアウトに応じて、タイトルバー右上に左、上、下、右のサイドバーボタンが表示されます。その方向にモジュールがある場合だけ表示され、強調された辺が方向を示します。
tutorial.workspace.step.sidebars.action=ハイライト内のボタンでサイドバーを閉じ、もう一度押して復元します。モデルやレイアウト構造は削除されません。
tutorial.hierarchy.title=階層ツリーとモードバー
tutorial.hierarchy.desc=階層ツリー、レイヤー取り込み、描画順ルーラー、モードバーと一時セッション名。
tutorial.hierarchy.step.openTree.title=階層を開く
tutorial.hierarchy.step.openTree.body=ツリーはデフォーマ／メッシュの親子を示します。ルートにはモデル階層と件数が表示されます。
tutorial.hierarchy.step.toolbar.title=検索と展開
tutorial.hierarchy.step.toolbar.body=上部バーでデフォーマ／レイヤーを検索し、一括展開／折りたたみができます。専用ショートカットはなく、ここから操作します。
tutorial.hierarchy.step.treeBody.title=行と選択の同期
tutorial.hierarchy.step.treeBody.body=目アイコンで表示切替、親バッジで祖先を示し、ツリー選択はキャンバスと同期します。
tutorial.hierarchy.step.treeBody.action=ノードを選びキャンバスを見てから「次へ」。
tutorial.hierarchy.step.dragParent.title=ドラッグで親変更
tutorial.hierarchy.step.dragParent.body=別デフォーマへドロップして親子を変更、または「ルートへ」へ移動。透明画像のドロップはレイヤー取り込み（次の手順）で、親変更とは別操作です。
tutorial.hierarchy.step.contextDeformer.title=デフォーマの右クリック
tutorial.hierarchy.step.contextDeformer.body=親ワープ、子ワープ、親回転デフォーマの追加、レイヤー取り込み、ルートへ移動、枝の展開／折りたたみ、削除（子は繰り上げ）。
tutorial.hierarchy.step.contextLayer.title=レイヤーの右クリック
tutorial.hierarchy.step.contextLayer.body=ソロ、描画順、メッシュ設定、親デフォーマ／パス追加、レイヤー取り込み、削除。ソロは編集中の一時表示で、パラメータ差分ではありません。
tutorial.hierarchy.step.importLayer.title=レイヤーを取り込む
tutorial.hierarchy.step.importLayer.body=PNG / WebP / TIFF / BMP をツリーノードへドロップするか、右クリック「レイヤーをインポート…」で選択。新レイヤーはその下（レイヤー行なら親デフォーマ下）に入り、配置セッションが始まります。
tutorial.hierarchy.step.placeSession.title=配置セッション
tutorial.hierarchy.step.placeSession.body=取り込みや作成後、左下に配置パネルが出ます。確定または {key:CANCEL} までキャンバス操作はセッションが占有します。モードバー横に一時セッション名（例：レイヤー配置）が表示されます。レイヤー配置を確定すると「選択」モードに戻ります。
tutorial.hierarchy.step.drawOrder.title=描画順ルーラー
tutorial.hierarchy.step.drawOrder.body=ホイールで拡大、ドラッグで順序変更、ダブルクリックで数値入力。インスペクタや右クリックと同じ属性です。
tutorial.hierarchy.step.modeBar.title=階層モードバー
tutorial.hierarchy.step.modeBar.body=左上のモードメニューにすべてのキャンバスモードが並びます：選択・変形・編集・シミュレーション・ボーン・ペイント・プレビュー（開いている間は 1-7 で選択）。対象が未選択のときは、先にメッシュ／デフォーマまたはレイヤーを選ぶよう案内が出ます。モード切替で表示プリセットが変わります。配置セッション中はモードメニュー横にセッション名が出ます。
tutorial.hierarchy.step.modeBar.action=各モードチップをクリックし、「次へ」。
tutorial.hierarchy.step.modeExtras.title=モード付属
tutorial.hierarchy.step.modeExtras.body=変形は L1 点 / L2 ベジェ、編集はメッシュ分割、描画は前景／背景色と適用／破棄。一時セッション中はセッション名チップも表示されます。
tutorial.hierarchy.step.gesturePreview.title=選択ジェスチャ予告
tutorial.hierarchy.step.gesturePreview.body=選択：クリック、{kbd:Shift} 加算、{kbd:Alt} 減算、{kbd:Ctrl} +クリックで階層巡回、ドラッグ枠選択、{key:SELECT_ALL}、{key:CANCEL}。次のレッスンで実操します。
tutorial.hierarchy.step.done.title=階層レッスン完了
tutorial.hierarchy.step.done.body=階層、描画順、モードバーを確認しました。選択中のコースの次章へ進みます。
tutorial.variants.title=差分の作成
tutorial.variants.desc=レイヤー種類、オンオフ差分と切替差分。
tutorial.variants.step.types.title=レイヤー種類
tutorial.variants.step.types.body=種類列：プリセット、オンオフ差分、切替差分。次にオンオフと切替を学びます。
tutorial.variants.step.done.title=差分レッスン完了
tutorial.variants.step.done.body=続けて「パラメータとキーフォーム」へ。
tutorial.parameters.title=パラメータとキーフォーム
tutorial.parameters.desc=パラメータパネルで値を動かし、パラメータのキー、キーフォーム、2D リンクを確認します。
tutorial.parameters.step.panel.title=パラメータパネル
tutorial.parameters.step.panel.body=検索・ロック・リセット、フォルダ整理ができます。
tutorial.parameters.step.drag.title=パラメータをドラッグ
tutorial.parameters.step.drag.body=スライダーで編集／プレビューの姿勢と差分を確認します。
tutorial.parameters.step.drag.action=パラメータを動かして「次へ」。
tutorial.parameters.step.keys.title=キーとキーフォーム
tutorial.parameters.step.keys.body=パラメータ横の印は、選択中のオブジェクトがその値にキーを持つことを示します。各キーが保持する形状がキーフォームです。丸は通常のキーでキー間が補間され、四角はブレンドシェイプのキーで、基本形状に形状差分を加算します。
tutorial.parameters.step.link.title=パラメータ連動
tutorial.parameters.step.link.body=2D 連動（XY）で2軸をまとめて動かせます。必要なとき使えば十分です。
tutorial.parameters.step.done.title=パラメータ完了
tutorial.parameters.step.done.body=パラメータ、キー、キーフォームを読み取れるようになりました。選択中のコースを続けます。
tutorial.select.title=選択モード
tutorial.select.desc=選択ツールとジェスチャ。
tutorial.select.step.mode.title=選択モードに入る
tutorial.select.step.mode.body=モードメニューで「選択」を選ぶか、{key:TOOL_SELECT} で選択ツールを有効にします。
tutorial.select.step.mode.action=選択モードにして「次へ」。
tutorial.select.step.tools.title=選択ツール
tutorial.select.step.tools.body=選択 {key:TOOL_SELECT}、投げ縄 {key:TOOL_LASSO_SELECT}、ブラシ選択 {key:TOOL_BRUSH_SELECT}。左のツールバーはモードごとにまとまっています。
tutorial.select.step.tools.action=選択ツールを切り替えて「次へ」。
tutorial.select.step.gestures.title=オブジェクト選択の操作
tutorial.select.step.gestures.body=クリック選択 · {kbd:Shift} 加算 · {kbd:Alt} 減算 · {kbd:Ctrl} +クリックで階層巡回 · 枠選択 · {key:SELECT_ALL} · {key:CANCEL}。
tutorial.select.step.sync.title=ツリーとキャンバスの同期
tutorial.select.step.sync.body=キャンバスでの選択は階層ツリーと同期します。{key:FRAME_VIEW} で選択範囲に表示を合わせます。
tutorial.select.step.sync.action=ツリーとキャンバスで選択を切り替え、表示合わせのショートカットも試して「次へ」。
tutorial.select.step.extras.title=選択範囲の形とリンク選択
tutorial.select.step.extras.body={key:SELECTION_STYLE_BOX} / {key:SELECTION_STYLE_LASSO} で矩形と投げ縄を切り替え、{key:SELECT_LINKED} でつながった制御点を選択します。キャンバスの右クリックメニューもモードに応じて変わります。
tutorial.select.step.done.title=選択モード完了
tutorial.select.step.done.body=続けて「デフォーマの作成」へ。
tutorial.create.title=デフォーマ作成
tutorial.create.desc=階層で選択し、右クリックで作成、配置パネルで確定。
tutorial.create.step.selectFirst.title=先に階層で選択
tutorial.create.step.selectFirst.body=作成前にメッシュ／デフォーマを選択。未選択の間は先に進めません。
tutorial.create.step.selectFirst.action=ハイライトのツリーで対象を選ぶ。
tutorial.create.step.contextDeformer.title=デフォーマの右クリック
tutorial.create.step.contextDeformer.body=デフォーマを右クリックして親／子のワープや回転を追加。配置セッションが始まります。
tutorial.create.step.contextDeformer.action=デフォーマを右クリックして作成項目を見る。
tutorial.create.step.contextLayer.title=レイヤーの右クリック
tutorial.create.step.contextLayer.body=レイヤーを右クリックして親ワープ／回転、またはパスを追加。配置確認へ進みます。
tutorial.create.step.contextLayer.action=レイヤーを右クリックして追加項目を見る。
tutorial.create.step.placement.title=左下の配置パネル
tutorial.create.step.placement.body=作成後、左下で名前・関係・サイズを調整。{key:FINISH_PATH} 確定、{key:CANCEL} 取消。セッション中はキャンバスを占有し、モードバーにセッション名が出ます。
tutorial.create.step.placement.action=パネル・占有・確定／取消を確認し、「次へ」。
tutorial.create.step.done.title=デフォーマ作成完了
tutorial.create.step.done.body=続けて「変形モード」へ。
tutorial.deform.title=変形モード
tutorial.deform.desc=L1/L2、変形ブラシ、軸拘束、パラメータのキー上のキーフォーム。
tutorial.deform.step.enter.title=変形モードに入る
tutorial.deform.step.enter.body=編集する対象を選んでから変形モードへ。未選択なら先にツリーで選んでください。
tutorial.deform.step.enter.action=対象を選び変形モードへ。
tutorial.deform.step.levels.title=L1 and L2
tutorial.deform.step.levels.body=L1 はメッシュの点、L2 はベジェハンドルを編集します。
tutorial.deform.step.levels.action=L1/L2 を切り替えて確認し、「次へ」。
tutorial.deform.step.brushes.title=変形ブラシ
tutorial.deform.step.brushes.body=ブラシ {key:TOOL_BRUSH}、スムーズ {key:TOOL_SMOOTH}、膨張 {key:TOOL_INFLATE}。\n重要：{kbd:Alt} を押しながら右ドラッグで半径／硬さをその場調整。
tutorial.deform.step.brushes.action=ブラシを試し、{kbd:Alt}+右ドラッグも一度試す。
tutorial.deform.step.shortcuts.title=半径と軸拘束
tutorial.deform.step.shortcuts.body={key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP} 半径、{key:BRUSH_HARDNESS_DOWN} {key:BRUSH_HARDNESS_UP} 硬さ、{key:AXIS_CONSTRAIN_X} / {key:AXIS_CONSTRAIN_Y}。現場調整は {kbd:Alt}+右ドラッグ優先。
tutorial.deform.step.keys.title=キーごとにキーフォームを作る
tutorial.deform.step.keys.body=編集したいキーへパラメータを移動してから、アートメッシュやデフォーマを調整します。キー間の形状は補間され、顔の向きや目・口の開閉などの動きになります。
tutorial.deform.step.undo.title=元に戻す／やり直し
tutorial.deform.step.undo.body={key:UNDO} 元に戻す、{key:REDO} やり直し。
tutorial.deform.step.done.title=変形モード完了
tutorial.deform.step.done.body=続けて「編集モード」でトポロジーを学びます。
tutorial.edit.title=編集モード
tutorial.edit.desc=分割・ナイフなどトポロジ。
tutorial.edit.step.enter.title=編集モードに入る
tutorial.edit.step.enter.body=編集モードはメッシュを常に表示し、形の変形ではなくトポロジーの変更に使います。
tutorial.edit.step.enter.action=編集モードに入り、「次へ」。
tutorial.edit.step.topo.title=分割とナイフ
tutorial.edit.step.topo.body=分割 {key:TOOL_SUBDIVIDE}、ナイフ {key:TOOL_KNIFE}。格子点をドラッグしてトポロジを調整し、ナイフで経路に沿って切ります。
tutorial.edit.step.delete.title=点の削除
tutorial.edit.step.delete.body={key:DELETE_SELECTION} で選択点を削除します。大きな変更の前に選択範囲を確認してください。
tutorial.edit.step.viewAids.title=表示補助
tutorial.edit.step.viewAids.body=右下の表示バーまたは「表示 ▾」で変形パスなどの補助線を表示し、トポロジーと見比べられます。
tutorial.edit.step.when.title=トポロジーを変える場面
tutorial.edit.step.when.body=メッシュが粗すぎる、分割が不適切なときに編集モードを使います。普段の形の調整は変形モードで行います。
tutorial.edit.step.done.title=編集モード完了
tutorial.edit.step.done.body=変形とトポロジー編集の役割を理解しました。選択中のコースを続けます。
tutorial.paint.title=ペイントモード
tutorial.paint.desc=ペイントツールとセッション。
tutorial.paint.step.layerFirst.title=先にレイヤーを選択
tutorial.paint.step.layerFirst.body=描画にはレイヤーの選択が必要です。未選択の場合はモードバーにレイヤー選択の案内が出ます。
tutorial.paint.step.layerFirst.action=レイヤーを選んで描画モードに入り、「次へ」。
tutorial.paint.step.tools.title=描画ツール
tutorial.paint.step.tools.body=ブラシ {key:TOOL_PAINT_BRUSH}、鉛筆 {key:TOOL_PAINT_PENCIL}、消しゴム {key:TOOL_PAINT_ERASER}、塗りつぶし {key:TOOL_PAINT_BUCKET}、スポイト {key:TOOL_PAINT_EYEDROPPER}、図形ツール {key:TOOL_PAINT_LINE}。キーはツールバーと現在の設定に従います。
tutorial.paint.step.tools.action=描画ツールを切り替えて「次へ」。
tutorial.paint.step.shortcuts.title=ブラシのショートカット
tutorial.paint.step.shortcuts.body=半径 {key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP}、硬さ {key:BRUSH_HARDNESS_DOWN} {key:BRUSH_HARDNESS_UP}、不透明度 {key:PAINT_OPACITY_DOWN} {key:PAINT_OPACITY_UP}。{kbd:Alt}+右ドラッグでも先端を調整。
tutorial.paint.step.session.title=適用または破棄
tutorial.paint.step.session.body=描画セッションには独立した元に戻す履歴があります。モードバーで適用／破棄を選び、適用後はメッシュの再構築を提案されることがあります。
tutorial.paint.step.return.title=形の調整に戻る
tutorial.paint.step.return.body=修正後は選択または変形モードに戻り、基本形状とキー上のキーフォームを調整します。
tutorial.paint.step.return.action=選択モードに戻して「次へ」。
tutorial.paint.step.done.title=描画モード完了
tutorial.paint.step.done.body=続けて「インスペクター」へ。
tutorial.inspector.title=インスペクタ
tutorial.inspector.desc=選択種別に応じた属性。
tutorial.inspector.step.open.title=インスペクターを開く
tutorial.inspector.step.open.body=何も選択していないときは案内のみ表示され、アートメッシュやデフォーマを選ぶと対応するプロパティが表示されます。
tutorial.inspector.step.open.action=インスペクター Dock を開いて対象を選び、「次へ」。
tutorial.inspector.step.artmesh.title=アートメッシュのプロパティ
tutorial.inspector.step.artmesh.body=クリッピングマスク、描画順、不透明度、合成モード、カリング、ユーザーデータなど。
tutorial.inspector.step.deformers.title=デフォーマのプロパティ
tutorial.inspector.step.deformers.body=ワープデフォーマにはベジェの分割数と編集レベル、回転デフォーマと変形パスにはそれぞれ専用の項目（パスの曲線、幅、閉じるなど）があります。
tutorial.inspector.step.drawOrder.title=描画順の 3 つの入口
tutorial.inspector.step.drawOrder.body=インスペクターの数値、階層ツリーの右クリック、描画順ルーラーは同じ属性を編集します。
tutorial.inspector.step.done.title=インスペクター完了
tutorial.inspector.step.done.body=オブジェクト別のプロパティを確認できるようになりました。選択中のコースを続けます。
tutorial.tools.title=ツール詳細
tutorial.tools.desc=ツール連動パラメータ。
tutorial.tools.step.open.title=ツール詳細を開く
tutorial.tools.step.open.body=この Dock の内容は左のツールに応じて変わり、ブラシや作成の設定を細かく調整します。
tutorial.tools.step.open.action=ツール詳細 Dock を開いて「次へ」。
tutorial.tools.step.brushes.title=ブラシの設定
tutorial.tools.step.brushes.body=変形ブラシと描画ブラシには大きさや硬さがあり、{key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP} などのショートカットと同じ値を操作します。
tutorial.tools.step.split.title=ツールバーとパネルの役割
tutorial.tools.step.split.body=左のツールバーでツールを選び、ツール詳細で調整し、モードバーで作業モードを選びます。
tutorial.tools.step.shortcuts.title=ショートカットのプリセット
tutorial.tools.step.shortcuts.body=「設定 → ショートカット」で Photoshop / Blender / Cubism のプリセットや独自設定に切り替えられます。教程中のキー表示は現在の設定に従います。
tutorial.tools.step.done.title=ツール詳細完了
tutorial.tools.step.done.body=ツールバー、モードバー、ツール詳細の役割を確認しました。次はボーンリグとポーズです。
tutorial.project.title=プロジェクトと履歴
tutorial.project.desc=.psd2live の保存、履歴ワークスペース、ノード検索、分岐からの復帰。
tutorial.project.step.save.title=プロジェクトの保存
tutorial.project.step.save.body={key:SAVE_PROJECT} で保存、{key:SAVE_PROJECT_AS} で名前を付けて保存。プロジェクトは暗号化されていない ZIP で、PSD、履歴、画面状態を含みます。
tutorial.project.step.historyTab.title=履歴タブとプリセット
tutorial.project.step.historyTab.body={key:OPEN_HISTORY_TAB} で履歴タブを開きます。専用の「履歴」ワークスペースプリセットからも利用可能です。保存や Agent（MCP）編集で内容が変わると新ノードが記録されます。
tutorial.project.step.historyTab.action=ハイライトの履歴タブをクリック（またはショートカット）。
tutorial.project.step.restore.title=バージョン復帰と検索
tutorial.project.step.restore.body=ノードカードをダブルクリックすると直接チェックアウトできます。検索フィルターや HEAD への経路ハイライトを備え、他のブランチを消すことはありません。
tutorial.project.step.branch.title=分岐と整理
tutorial.project.step.branch.body=古いノードから編集を続けると分岐ができます。ノードにはメモや非表示を設定でき、非表示にしてもデータは残ります。
tutorial.project.step.done.title=プロジェクトと履歴完了
tutorial.project.step.done.body=任意で「テクスチャ高解像度化」へ進むか、教程一覧で復習できます。
tutorial.upscale.title=テクスチャ高解像度化
tutorial.upscale.desc=AI でテクスチャを拡大し、メッシュと書き出しを再確認します。
tutorial.upscale.step.entry.title=入口
tutorial.upscale.step.entry.body=タイトルバーの「ツール」→「テクスチャ高解像度化…」、または {key:TEXTURE_UPSCALE}。元絵の解像度が低いときに使います。
tutorial.upscale.step.entry.action=ハイライトされた「ツール」メニューから「テクスチャ高解像度化…」を選びます。
tutorial.upscale.step.scale.title=倍率
tutorial.upscale.step.scale.body=通常は 2× / 4× から選びます。拡大後は画素が細かくなり、メッシュの見え方が変わることがあります。
tutorial.upscale.step.check.title=再確認と書き出し
tutorial.upscale.step.check.body=拡大後は編集画面でメッシュとデフォーマを確認し、プレビューで見た目を確かめてから書き出し直します。
tutorial.upscale.step.done.title=コース完了
tutorial.upscale.step.done.body=選択中のコースを最後まで学びました。「ヘルプ → チュートリアル」の一覧からいつでも各講座をやり直せます。

# Tutorial learning paths and current canvas features
tutorial.path.beginner.title=Live2D モデル制作が初めて
tutorial.path.beginner.desc=レイヤー PSD、パーツ、パラメータから始め、編集、モーション、物理、書き出しまで順番に学びます。
tutorial.path.experienced.title=Live2D / Cubism 経験者
tutorial.path.experienced.desc=ArtMesh、Deformer、Parameter を PSD2Live に対応づけ、自動生成、キャンバスモード、ボーン、アニメーション、物理を重点的に学びます。
tutorial.path.start=このコースを開始
tutorial.live2dBridge.title=Live2D ユーザー向け早見ガイド
tutorial.live2dBridge.desc=Cubism の概念を PSD2Live に対応づけ、自動生成の流れを理解します。
tutorial.live2dBridge.step.workspace.title=ワークスペースプリセット
tutorial.live2dBridge.step.workspace.body=上部の編集、メッシュ、リギング、アニメーション、プレビュー、物理、履歴は作業別レイアウトです。同じプロジェクトを共有します。
tutorial.live2dBridge.step.structure.title=アートメッシュとデフォーマ
tutorial.live2dBridge.step.structure.body=取り込んだ PSD レイヤーはアートメッシュになります。PSD2Live のワープデフォーマと回転デフォーマは Cubism のものに対応し、変形パスは PSD2Live の実験的なツールで、書き出し時にメッシュのキーフォームへベイクされます。親子関係が変形の継承を、描画順が前後関係を決めます。
tutorial.live2dBridge.step.modes.title=キャンバスモード
tutorial.live2dBridge.step.modes.body=選択はオブジェクト操作、変形はキー上のキーフォーム作成、編集はメッシュのトポロジー変更、シミュレーションは布・髪のシミュレーションが読む頂点グループの描画、ボーンはポーズ付けと骨格の調整、描画はレイヤーの画素編集、プレビューはモデルの再生に使います。
tutorial.live2dBridge.step.parameters.title=パラメータとキーフォーム
tutorial.live2dBridge.step.parameters.body=パラメータ Dock は Cubism のパラメータに相当します。丸は通常のキー、四角はブレンドシェイプのキーで、2D リンクでは 2 つのパラメータを同時に操作できます。キー上のキーフォームはモデリング用で、アニメーションのキーフレームとは別物です。
tutorial.live2dBridge.step.export.title=書き出しはプロジェクト本体ではない
tutorial.live2dBridge.step.export.body=.psd2live は PSD2Live の素材、編集、分岐履歴を保存します。CMO3 は Cubism Editor で編集を続けられるモデルファイルです。ランタイム用の成果物は MOC3、model3.json、テクスチャ、必要に応じて物理演算などのファイル一式です。書き出し前にプロジェクトを保存してください。
tutorial.live2dBridge.step.done.title=概念の対応づけが完了
tutorial.live2dBridge.step.done.body=ワークスペースを確認してから、新しいキャンバス機能へ進みます。
tutorial.skeleton.title=ボーンリグとポーズ
tutorial.skeleton.desc=キャンバスでスケルトンを作成し、ArtMesh のバインド、IK、平滑ウェイト拡散、サンプリング設定を学びます。
tutorial.skeleton.step.panel.title=スケルトン Dock
tutorial.skeleton.step.panel.body=ボーンは PSD2Live の手足リグ用ツールで、Cubism モデル内の独立したボーンではありません。体、手足、尻尾、翼のチェーンを作成でき、データを残したまま無効化もできます。
tutorial.skeleton.step.panel.action=ハイライトされたスケルトン Dock を開き、「スケルトンを作成」を確認します。
tutorial.skeleton.step.bind.title=キャンバスで配置とバインド
tutorial.skeleton.step.bind.body=関節をドラッグして配置し、ボーンを選んで ArtMesh をクリックするとバインドします。終了で保存、キャンセルで破棄します。
tutorial.skeleton.step.pose.title=ポーズと IK
tutorial.skeleton.step.pose.body=ボーンをドラッグして回転し、末端のドラッグまたは {kbd:Shift} ドラッグで IK を使います。ポーズはパラメータを駆動し、元のメッシュを壊しません。
tutorial.skeleton.step.pose.action=ボーンのオーバーレイを確認し、スケルトンがあれば末端をドラッグします。
tutorial.skeleton.step.weights.title=スキンウェイトと平滑拡散の確認
tutorial.skeleton.step.weights.body=ウェイト表示で関節の遷移を確認します。ウェイトはメッシュトポロジに沿って滑らかに拡散し、近接関節へのアンカーで断層を防ぎます。帯幅や範囲も調整可能です。
tutorial.skeleton.step.sampling.title=パラメータサンプリングとキー点数プレビュー
tutorial.skeleton.step.sampling.body=スケルトンパネル下部でサンプリング許容値、最小角度間隔、メッシュキー上限を設定できます。パラメータ点数がリアルタイム表示され、多すぎるキー生成による負荷を防ぎます。
tutorial.skeleton.step.sampling.action=スケルトンパネル下部の「パラメータサンプリング」で点数統計とスライダーを確認します。
tutorial.skeleton.step.done.title=ボーンの章が完了
tutorial.skeleton.step.done.body=書き出し時、ボーン、ウェイト、IK の結果は Cubism のパラメータ、ワープ／回転デフォーマ、メッシュのキーフォームへベイクされ、Cubism Editor にはボーンとしての情報は残りません。次はカスタムモーションを作成します。
tutorial.animation.title=アニメーションとモーション編集
tutorial.animation.desc=モーション作成、自動キーフレーム、ポーズ記録、キー編集、キャンバスプレビューを学びます。
tutorial.animation.step.motions.title=モーション一覧
tutorial.animation.step.motions.body=生成済みとカスタムのモーションを管理し、空またはプリセットから作成して時間、ループ、フェードを設定します。
tutorial.animation.step.motions.action=アニメーション Dock を開き、モーションを選択または作成します。
tutorial.animation.step.editor.title=タイムラインとトラック
tutorial.animation.step.editor.body=パラメータトラックを追加します。ドープシートで時間、カーブで補間を調整し、ダブルクリックでキーを追加します。トラック名横にはキー位置マークとガイド線が表示されます。
tutorial.animation.step.autoKey.title=自動キーフレーム
tutorial.animation.step.autoKey.body=ツールバーの「自動キーフレーム」を有効にすると、再生ヘッドの位置でパラメータスライダーや 2D パッド、キャンバスのポーズを操作するだけで自動的にキーが打たれます。未トラックのパラメータも曲線に自動追加されます。
tutorial.animation.step.autoKey.action=エディターツールバーで「自動キーフレーム」を切り替えるか、再生ヘッドでパラメータを変更してキーを打ちます。
tutorial.animation.step.keys.title=ポーズ記録とベジェ補間
tutorial.animation.step.keys.body=手動モードではポーズを調整してから「ポーズを記録」で書き込みます。キーは標準で滑らかなベジェ補間になり、トラック名横にキー位置マークが表示されます。
tutorial.animation.step.keys.action=再生ヘッドを移動してポーズを記録するか、トラックをダブルクリックします。
tutorial.animation.step.preview.title=キャンバスプレビューとポーズ共有
tutorial.animation.step.preview.body=再生中はキャンバスに結果が反映されます。ワークスペース内の全キャンバスでパラメータポーズが共有され、アニメーション・プレビュー・編集モードの切り替えでもポーズが維持されます。
tutorial.animation.step.done.title=アニメーションの章が完了
tutorial.animation.step.done.body=次は同じキャンバスで物理振り子と出力範囲を調整します。
tutorial.physics.title=物理のキャンバス調整
tutorial.physics.desc=物理グループを作り、キャンバスで振り子と出力を調整します。
tutorial.physics.step.groups.title=物理グループ
tutorial.physics.step.groups.body=プリセット、ボーン、揺れ、カスタム物理を管理します。複製、順序変更、無効化、リセットができます。
tutorial.physics.step.groups.action=物理 Dock を開いてグループを選ぶか、空の振り子を作成します。
tutorial.physics.step.pendulum.title=キャンバス上の振り子編集
tutorial.physics.step.pendulum.body=円は振り子の節です。ドラッグで長さを変え、クリックで選択します。出力ラベルを節の横へドラッグして参照角度を決めます。
tutorial.physics.step.io.title=入力、出力、競合
tutorial.physics.step.io.body=入力は位置や角度をシミュレーションへ送り、出力はパラメータを駆動します。無効設定や出力競合はその場で表示されます。
tutorial.physics.step.test.title=引っ張って校正
tutorial.physics.step.test.body=キャンバスの空白をドラッグしてモデルを引き、最大出力を確認して倍率を合わせ、端点でのクリップを防ぎます。
tutorial.physics.step.test.action=ハイライトされたキャンバス内をドラッグし、振り子の反応を確認します。
tutorial.physics.step.done.title=物理の章が完了
tutorial.physics.step.done.body=物理の章が完了しました。次は「プロジェクトと履歴」です。

