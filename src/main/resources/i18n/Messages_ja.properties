settings.rigTuning.blinkCorner.hint=目を閉じたとき目尻が白目の上端からどこに来るか。白目の高さに対する割合。デフォルト {0}%。
settings.rigTuning.eyelashSquash=閉じ目のまつ毛の太さ
settings.rigTuning.eyelashSquash.hint=目を閉じたときまつ毛が元の太さを保つ割合。デフォルト {0}%。
settings.rigTuning.irisJellyStretch=瞳の弾み（伸び）
settings.rigTuning.irisJellyStretch.hint=目玉の形が最大のとき瞳が縦に伸びる量。デフォルト {0}%。
settings.rigTuning.irisJellySquash=瞳の弾み（縮み）
settings.rigTuning.irisJellySquash.hint=目玉の形が最大のとき伸びに合わせて瞳が細くなる量。デフォルト {0}%。
settings.rigTuning.browLift=眉の上下
settings.rigTuning.browLift.hint=眉 Y が最大のとき眉が上下する量。眉の高さに対する割合。デフォルト {0}%。
settings.rigTuning.browFarShrink=奥の眉の縮小
settings.rigTuning.browFarShrink.hint=角度 X が最大のとき奥側の眉が細くなる量。デフォルト {0}%。
