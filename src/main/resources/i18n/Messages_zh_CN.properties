settings.rigTuning.pelvisShare=骨盆分担
settings.rigTuning.pelvisShare.hint=前后倾中由骨盆绕髋关节承担的比例，其余在腰部弯折。默认 {0}%。
settings.rigTuning.headGrow=头部放大
