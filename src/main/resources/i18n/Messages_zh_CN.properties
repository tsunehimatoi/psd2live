help.tutorial.standard.intro=由 See-Through 生成的分层 PSD，导入后两步即可导出；导出前后可在四个视图中检查结果。
help.tutorial.standard.step1.title=1. 导入 PSD
help.tutorial.standard.step1.desc=拖入 .psd 文件，或按 Ctrl+Shift+O。程序会自动识别部位。
help.tutorial.standard.step2.title=2. 导出模型
help.tutorial.standard.step2.desc=按 Ctrl+G，导出可编辑工程（CMO3）和运行用模型包（MOC3）。
help.tutorial.standard.step3.title=3. 检查生成结果
help.tutorial.standard.step3.desc=「编辑」标签页查看变形器结构与网格线框，「预览」标签页验证转头、眨眼与呼吸；用 + 增加标签页并各自设置视图选项，按 Ctrl+H 打开历史记录标签页查看版本节点。

help.tutorial.custom.intro=非 See-Through 生成的 PSD 也能用，导入后手动指定部位即可。
help.tutorial.custom.step1.title=1. 导入 PSD
help.tutorial.custom.step1.desc=拖入分层 .psd 文件，或按 Ctrl+Shift+O。
help.tutorial.custom.step2.title=2. 指定图层部位
help.tutorial.custom.step2.desc=在右下角「图层」表格的「预设部件」中，选择前发、眼睛、衣服等对应部位。单侧部件还要选左 / 右。
help.tutorial.custom.step3.title=3. 导出模型
help.tutorial.custom.step3.desc=按 Ctrl+G 导出模型。
help.tutorial.project.intro=.psd2live 工程是未加密的 ZIP，单个文件即可迁移，包含原始 PSD、图片、全部历史分支与界面状态。
help.tutorial.project.step1.title=1. 保存工程
help.tutorial.project.step1.desc=按 Ctrl+S；首次保存需要选择位置，之后直接保存。另存为按 Ctrl+Shift+S。
help.tutorial.project.step2.title=2. 查看历史
help.tutorial.project.step2.desc=从「视图 → 标签页」打开历史记录标签页（Ctrl+H），重做分支不唯一时也可按 Ctrl+Y。每次保存与 Agent 修改都会新增一个节点。
help.tutorial.project.step3.title=3. 回到旧版本
help.tutorial.project.step3.desc=点选节点可查看节点 ID、父节点、版本 Hash 与创建时间；「恢复到此版本」把工作区切回该节点，不会删除任何分支。
help.tutorial.project.step4.title=4. 分支与整理
help.tutorial.project.step4.desc=从旧节点继续编辑会自动生成新分支；节点可改名、加备注、隐藏或重新显示，隐藏不会删除数据。

help.tutorial.optional.title=还想调整？
help.tutorial.optional.desc=按需查看，修改后重新导出。
help.tutorial.optional.action=查看 >
help.tutorial.optional.opt1.title=调整动作
help.tutorial.optional.opt1.desc=微调设置与参数，预览转头、眨眼和呼吸。
help.tutorial.optional.opt2.title=贴图高清化
help.tutorial.optional.opt2.desc=用 AI 放大低分辨率贴图。
help.tutorial.optional.opt3.title=制作差分
help.tutorial.optional.opt3.desc=控制配件显隐，切换表情或服装。
help.tutorial.optional.opt4.title=连接 AI 助手
help.tutorial.optional.opt4.desc=让外部 AI 宿主读取并修改工程（测试中）。

help.tutorial.preview.intro=生成后按需选择并微调设置与参数，再回到「预览」确认动作是否自然。
help.tutorial.preview.step1.title=1. 调整模型设置与参数
help.tutorial.preview.step1.desc=• 「模型设置」调整头部幅度、身体幅度与物理模拟开关。\n• 「参数」标签页可搜索、锁定并临时覆写任意参数，顶部的播放开关控制待机动画。\n• 「图层」表格核对部位识别、可见性与参数关联。
help.tutorial.preview.step2.title=2. 预览，再导出
help.tutorial.preview.step2.desc=切到「预览」标签页，移动鼠标检查视线跟随与转头；再用播放开关观察眨眼、呼吸与物理摆动。满意后按 Ctrl+G 导出。

help.tutorial.upscale.intro=原画分辨率偏低时，可用 AI 放大贴图、改善边缘。
help.tutorial.upscale.step1.title=1. 打开高清化工具
help.tutorial.upscale.step1.desc=按 Ctrl+U，或选「工具」→「纹理高清化…」。
help.tutorial.upscale.step2.title=2. 选择放大倍率
help.tutorial.upscale.step2.desc=选择 2× 或 4×。处理后检查线条和透明边缘，确认效果再导出。

help.tutorial.variants.intro=差分就是可替换的图层。在右下角「图层」表格中设置。
help.tutorial.variants.step1.title=开关差分：显示 / 隐藏
help.tutorial.variants.step1.desc=「类型」选「开关差分」，「参数关联」填名称（如 blush）。在参数面板拖动滑块，即可开关腮红、眼泪或眼镜。
help.tutorial.variants.step2.title=切换差分：多个造型选一个
help.tutorial.variants.step2.desc=相关图层的「类型」都选「切换差分」，填相同的「参数关联」，再将「关联 ID」依次设为 0、1、2…\n例如：表情 expression（正常 / 开心）、手势 arm_pose（垂手 / 挥手）、服饰 costume（日常 / 礼服）。同一参数一次只显示一个 ID 对应的造型。
help.tutorial.variants.step3.title=画图和命名要点
help.tutorial.variants.step3.desc=• eye_close（闭眼）、mouth_close（闭口）、tooth_t / tooth_b（上下牙）、tongue（舌头）可自动识别。\n• 睫毛层只画上睫毛；嘴巴画最大张口；身体保持直立。

help.tutorial.agent.warning=测试中：效果不稳定，可能消耗大量 Token，暂不建议日常使用。
help.tutorial.agent.intro=在菜单「工具 → MCP → MCP 连接与安装…」复制配置，粘贴到 ChatGPT Desktop / Codex、Gemini / Antigravity 或其他支持 Streamable HTTP 的宿主。
help.tutorial.agent.ready.title=可以做
help.tutorial.agent.ready.desc=读取工程、层级与参数，渲染多姿态检查，导入透明素材并挂载配饰。
help.tutorial.agent.beta.title=还在试验
help.tutorial.agent.beta.desc=生成表情与动作差分、拆分口腔部件、拆分并补全头发、添加阴影；端到端尚不稳定。
help.tutorial.agent.unsupported.title=暂不支持
help.tutorial.agent.unsupported.desc=对部件做精确的逐点变形（需要逐点操作 Warp / Mesh）。
help.tutorial.agent.tip=建议先从读取工程状态与对象摘要开始，再逐步尝试写入。

help.spec.intro=每个部位单独分层，图层名可用下面的英文或中文别名，也支持日文。
help.spec.group.head=头部与五官
help.spec.head.face=face / 脸 / 脸部：脸部底图；facedetail / 腮红 / 泪痕等细节放这里
help.spec.head.hairFront=front_hair / 前发 / 刘海：前面的头发
help.spec.head.hairBack=back_hair / 后发 / 后脑勺：后面的头发
help.spec.head.headwear=headwear / hat / 头饰 / 帽子：挂在头部、不随脸部九轴变形
help.spec.head.eyelash=eyelash / 睫毛：睁眼时的上睫毛，不含下睫毛和下眼眶
help.spec.head.eyewhite=eyewhite / 眼白：用于闭眼变形，并限制瞳孔显示范围
help.spec.head.eyeClose=eye_close / 闭眼：预先画好的闭眼造型，与睫毛闭眼曲线二选一
help.spec.head.irides=irides / pupil / 瞳孔 / 眼睛：跟随视线移动的部分
help.spec.head.eyebrow=eyebrow / 眉毛
help.spec.head.nose=nose / 鼻子
help.spec.head.mouth=mouth / 嘴巴 / 口：画最大张口状态，建议保留清晰描边
help.spec.head.mouthClose=mouth_close / 闭嘴：预先画好的闭口造型，可选
help.spec.head.mouthInternals=tooth_t / tooth_b / tongue：上牙 / 下牙 / 舌头，自动限制在嘴内显示
help.spec.head.ears=ears / earwear / eyewear：耳朵 / 耳饰 / 眼镜，随头部转动
help.spec.group.body=身体
help.spec.body.neck=neck / 脖子
help.spec.body.topwear=topwear / 衣服 / 上衣：跟随身体转动和呼吸
help.spec.body.limbs=handwear / legwear / footwear（arm / hand / leg / foot）：手臂 / 手 / 腿 / 脚
help.spec.body.bottomwear=bottomwear / 裤子 / 裙子：下装
help.spec.body.neckwear=neckwear / 领饰 / 围巾：挂在脖子上的饰物
help.spec.group.extra=附加与道具
help.spec.extra.tail=tail / 尾巴：独立摆动
help.spec.extra.wings=wings / 翅膀：挂在身体后方
help.spec.extra.objects=objects / prop / 道具：其他可独立控制的部件
help.spec.group.notes=画图时注意
help.spec.note.eyelash=• 睫毛层只画上睫毛，否则闭眼时可能拉扯下眼眶。
help.spec.note.mouth=• 嘴巴画最大张口，程序会自动生成闭口动作。
help.spec.note.body=• 身体保持直立，过度倾斜或躺卧容易导致动作变形。
help.spec.note.unknown=• 未识别的图层会置后并标为 unknown，可在「图层」表格中手动指定部位。

