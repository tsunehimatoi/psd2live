tutorial.basic.targetMissing=当前操作区域尚未显示。若尚未导入 PSD，可点「上一步」返回导入；也可跳过或退出后重新开始。
tutorial.catalog.title=交互教程目录
tutorial.catalog.desc=先选择适合你的经验路线，再按章节学习；每一章都会直接在当前工作区标出对应控件。
tutorial.common.continueNext=继续：{0}
tutorial.common.openCatalog=打开教程目录
tutorial.common.requireSelection=请先在亮框的层级树中选中一个画元或变形器，选好后才能继续。
tutorial.common.requireLayer=请先在层级树中选中一个图层，选好后才能继续绘画相关步骤。
tutorial.common.hint.prerequisite=完成亮框中的选择后再继续；在此之前无法跳过本步。
tutorial.basic.step.naming.title=预设命名注意点
tutorial.basic.step.naming.body=部分图层可按命名自动识别为预设：如 eye_close（闭眼）、mouth_close（闭口）、tooth_t / tooth_b（上下牙）、tongue（舌头）。画图时：睫毛层只画上睫毛；嘴巴画最大张口；身体保持直立，便于自动绑定。
tutorial.basic.step.naming.action=对照图层名与预设列，然后点「下一步」。
tutorial.variants.step.toggleWhy.title=开关差分的作用
tutorial.variants.step.toggleWhy.body=开关差分用一个参数控制该图层显示或隐藏，适合腮红、眼泪、眼镜、光影等「有/无」类部件。拖动参数即可在编辑与预览中看到开关效果。
tutorial.variants.step.toggleSetup.title=设置开关差分
tutorial.variants.step.toggleSetup.body=在图层表将「类型」设为「开关差分」，在「参数关联」填写参数名（如 blush）。同一参数名可驱动多个开关图层。
tutorial.variants.step.toggleSetup.action=找一行设为开关差分并填写参数名（也可先了解），然后点「下一步」。
tutorial.variants.step.switchWhy.title=切换差分的作用
tutorial.variants.step.switchWhy.body=切换差分让多套造型互斥：同一参数一次只显示其中一个 ID 对应的图层，适合表情、手势、服饰等「多选一」。
tutorial.variants.step.switchSetup.title=设置切换差分
tutorial.variants.step.switchSetup.body=相关图层都选「切换差分」，填写相同的「参数关联」，再把「关联 ID」依次设为 0、1、2…。例如 expression：0 正常 / 1 开心。
tutorial.variants.step.switchSetup.action=试着为两行配置相同参数名与不同 ID（或先了解），然后点「下一步」。
tutorial.parameters.step.findTab.title=找到参数面板
tutorial.parameters.step.findTab.body=右侧 Dock 中打开「参数」标签。若看不到，先展开检视区，再点参数模块。
tutorial.parameters.step.findTab.action=打开参数 Dock，然后点「下一步」。
tutorial.parameters.step.operate.title=参数键操作
tutorial.parameters.step.operate.body=在参数条上：左键拖动可自由改变当前值；悬停在键标记上右键单击，可吸附到该键。二维关联垫同样：左键拖动，右键吸附到两个参数的键交点。参数键属于建模数据，不是动画时间线上的关键帧。
tutorial.basic.title=基础流程
tutorial.basic.desc=导入 PSD、预览、图层与模型预设，最后导出 CMO3 / MOC3。
tutorial.workspace.title=工作区与自由布局
tutorial.workspace.desc=使用最新预设，并自由组合、分栏或分离画布与功能模块。
tutorial.workspace.step.viewMenu.title=视图选项菜单
tutorial.workspace.step.viewMenu.body=画布标题栏的「视图 ▾」保存这块画布的网格、变形器、变形路径及自定义背景（棋盘格/纯色/透明）等显示选项。每块画布各自记住。
tutorial.workspace.step.viewMenu.action=打开菜单浏览各项，关闭后点「下一步」。
tutorial.workspace.step.camera.title=缩放与平移
tutorial.workspace.step.camera.body=滚轮缩放；中键或 {kbd:Space} 拖移平移。{key:ZOOM_IN} / {key:ZOOM_OUT} / {key:ZOOM_RESET} 缩放，{key:RESET_CAMERA} 重置相机，{key:FRAME_VIEW} 适配所选（选择课再用）。
tutorial.workspace.step.done.title=工作区导览完成
tutorial.workspace.step.done.body=接下来建议学习「层级树与模式条」，这是编辑画布的核心入口。
tutorial.workspace.step.presets.title=最新工作区预设
tutorial.workspace.step.presets.body=新工程提供编辑、网格、绑定、动画、预览、物理和历史 7 种预设。每个预设都为对应任务准备了画布模式、模块组合与分栏比例；也可从“+”创建空白工作区。
tutorial.workspace.step.presets.action=点击工作区栏的“+”，浏览各预设及说明；不必实际创建。
tutorial.workspace.step.switch.title=切换与整理工作区
tutorial.workspace.step.switch.body=每个顶部标签都是一套独立布局。单击切换，中键关闭，拖动可排序；右键还可重命名、复制、关闭其他或恢复预设布局。
tutorial.workspace.step.switch.action=在已有工作区之间切换，或拖动一个标签观察排序。
tutorial.workspace.step.dockTabs.title=模块可以任意组合
tutorial.workspace.step.dockTabs.body=画布、层级、参数、检视、动画、物理等都是 Dock 模块。拖动模块标签可在同一栏排序，也可放到另一栏的标签之间，与目标模块组合成一组。
tutorial.workspace.step.dockTabs.action=拖动一个 Dock 标签，在原标签栏或另一标签栏中查看插入标记。
tutorial.workspace.step.split.title=拖到边缘创建分栏
tutorial.workspace.step.split.body=拖动模块时，目标区域的上、下、左、右边缘会出现落点。松开后创建新分栏；拖动分隔线可调整比例。画布和普通面板遵循同一套规则。
tutorial.workspace.step.float.title=分离为独立窗口
tutorial.workspace.step.float.body=把模块拖出主窗口会分离为浮动窗口。浮动标题栏可将它归位；中键关闭标签，窗口菜单则能重新显示被关闭的模块。
tutorial.workspace.step.memory.title=布局按工作区保存
tutorial.workspace.step.memory.body=模块组合、分栏比例、浮动状态、画布模式与视图选项都分别保存在当前工作区。右上“重置布局”只恢复这一工作区的预设，不影响模型内容。
tutorial.workspace.step.sidebars.title=右上角侧边栏按钮
tutorial.workspace.step.sidebars.body=标题栏右上角会根据当前布局显示左、上、下、右侧栏按钮；只有对应方向停靠了模块时才出现。图标中的高亮边表示侧栏方向，悬停可查看其中包含的模块。
tutorial.workspace.step.sidebars.action=点击一个亮框内的布局按钮收起侧栏，再次点击即可恢复；模型和布局结构不会被删除。
tutorial.hierarchy.title=层级树与模式条
tutorial.hierarchy.desc=左侧层级树、导入图层、绘制顺序尺，以及画布左上角模式条与临时会话名。
tutorial.hierarchy.step.openTree.title=打开层级树
tutorial.hierarchy.step.openTree.body=层级树展示变形器与画元的父子关系。根节点显示「模型层级」与变形器/图层数量统计。
tutorial.hierarchy.step.toolbar.title=树顶栏：搜索与展开
tutorial.hierarchy.step.toolbar.body=顶栏可搜索变形器与图层，并一键全部展开或全部折叠。树侧没有独立快捷键，主要靠这里操作。
tutorial.hierarchy.step.treeBody.title=节点行与选中同步
tutorial.hierarchy.step.treeBody.body=眼睛图标控制显隐；父级徽章提示祖先；在树中点选会与画布高亮同步。
tutorial.hierarchy.step.treeBody.action=点选一个节点，观察画布高亮，然后点「下一步」。
tutorial.hierarchy.step.dragParent.title=拖拽改父级
tutorial.hierarchy.step.dragParent.body=拖拽节点到其他变形器下可改父子；拖到「移到顶层」区域可移至根级。这是搭建变形器结构的常用方式。把透明图片拖到树上则是导入图层（下一步说明），与改父级不是同一操作。
tutorial.hierarchy.step.contextDeformer.title=变形器右键菜单
tutorial.hierarchy.step.contextDeformer.body=可添加父级网格、子级网格或父级旋转变形器，导入图层、移至根级、展开 / 折叠分支、删除（子级上移）。
tutorial.hierarchy.step.contextLayer.title=图层右键菜单
tutorial.hierarchy.step.contextLayer.body=可独显/取消独显、设置绘制顺序与网格、添加父级变形器或变形路径、导入图层、删除图层。独显是编辑态临时显隐，与参数驱动的差分不同。
tutorial.hierarchy.step.importLayer.title=导入图层
tutorial.hierarchy.step.importLayer.body=把 PNG / WebP / TIFF / BMP 拖到树节点上，或通过右键「导入图层…」选文件。新图层会出现在该节点下（图层行则挂到其父变形器下），随后进入放置会话。
tutorial.hierarchy.step.placeSession.title=放置会话
tutorial.hierarchy.step.placeSession.body=导入或创建变形器后，左下角会出现放置面板；画布交互由会话占用，直到确认或 {key:CANCEL} 取消。模式条旁会显示临时会话名（如「放置图层」）。确认放置图层后回到「选择」模式。
tutorial.hierarchy.step.drawOrder.title=绘制顺序尺
tutorial.hierarchy.step.drawOrder.body=树旁竖尺可滚轮缩放、拖改顺序、双击输入数值。与检视面板、右键「绘制顺序…」是同一属性的不同入口。
tutorial.hierarchy.step.modeBar.title=层级模式条
tutorial.hierarchy.step.modeBar.body=画布左上角的模式菜单列出所有画布模式：选择、变形、编辑、模拟、骨骼、绘画和预览（菜单打开时按 1-7 直接选择）。未选目标时会提示先选画元/变形器或图层。切换模式会套用视图预设（如是否显示网格）。放置会话进行时，模式菜单旁会显示会话名以免误解。
tutorial.hierarchy.step.modeBar.action=点击各模式芯片观察变化，然后点「下一步」。
tutorial.hierarchy.step.modeExtras.title=模式条附属控件
tutorial.hierarchy.step.modeExtras.body=变形模式有 L1 网格点 / L2 贝塞尔手柄；编辑模式显示网格分割；绘画模式有前景/背景色与应用/放弃；临时会话时还会出现会话名芯片。
tutorial.hierarchy.step.gesturePreview.title=选择手势预告
tutorial.hierarchy.step.gesturePreview.body=选择模式下：单击选择、{kbd:Shift} 加选、{kbd:Alt} 减选、{kbd:Ctrl} +单击在命中环上切换层级、拖拽框选、{key:SELECT_ALL} 全选、{key:CANCEL} 取消。下一课会实操。
tutorial.hierarchy.step.done.title=层级与模式条完成
tutorial.hierarchy.step.done.body=层级、绘制顺序和模式条已经就位。请按当前学习路线继续下一章。
tutorial.variants.title=差分制作
tutorial.variants.desc=图层类型、开关差分与切换差分的用途与设置。
tutorial.variants.step.types.title=图层类型一览
tutorial.variants.step.types.body=图层表「类型」列主要有：预设（绑定自动动作部位）、开关差分（参数控制显隐）、切换差分（多造型互斥选一）。先认清类型，再分别学习开关与切换。
tutorial.variants.step.done.title=差分制作完成
tutorial.variants.step.done.body=建议继续「参数与关键形」，学会用参数面板驱动这些差分。
tutorial.parameters.title=参数与关键形
tutorial.parameters.desc=找到参数面板，调整参数值，认识参数键、关键形与二维关联。
tutorial.parameters.step.panel.title=认识参数面板
tutorial.parameters.step.panel.body=可搜索参数、锁定、复位，并用文件夹整理。列表中每一行对应一个可驱动差分与变形的参数。
tutorial.parameters.step.drag.title=拖动参数
tutorial.parameters.step.drag.body=拖动滑块可在编辑/预览中看到姿态与差分变化，用来检查开关/切换差分与动作幅度。
tutorial.parameters.step.drag.action=拖动一两个参数观察效果，然后点「下一步」。
tutorial.parameters.step.keys.title=参数键与关键形
tutorial.parameters.step.keys.body=参数旁的标记表示选中对象在该参数值上有键（Cubism 中文版称为「键」），每个键记录一组形状，本程序称为关键形。圆点是普通键，键与键之间插值；方点是融合变形键，把形状差叠加到基础形状上。
tutorial.parameters.step.link.title=参数关联
tutorial.parameters.step.link.body=部分参数可组成二维关联（XY 垫）。需要时在参数面板使用关联控件，把两个一维参数绑在一起驱动表情等；不必一次学完。
tutorial.parameters.step.done.title=参数课完成
tutorial.parameters.step.done.body=你已经能读取参数、参数键与关键形。请按当前学习路线继续下一章。
tutorial.select.title=选择模式
tutorial.select.desc=选择工具、对象手势与树画布同步。
tutorial.select.step.mode.title=切入选择模式
tutorial.select.step.mode.body=在模式菜单中选「选择」，或按 {key:TOOL_SELECT} 激活点选工具。
tutorial.select.step.mode.action=确保处于选择模式，然后点「下一步」。
tutorial.select.step.tools.title=选择工具组
tutorial.select.step.tools.body=点选 {key:TOOL_SELECT}、套索 {key:TOOL_LASSO_SELECT}、笔刷选择 {key:TOOL_BRUSH_SELECT}。左侧工具栏随模式分组显示。
tutorial.select.step.tools.action=切换几种选择工具，然后点「下一步」。
tutorial.select.step.gestures.title=对象选择手势
tutorial.select.step.gestures.body=单击选择 · {kbd:Shift} 加选 · {kbd:Alt} 减选 · {kbd:Ctrl} +单击切换层级 · 拖拽框选 · {key:SELECT_ALL} 全选 · {key:CANCEL} 取消。
tutorial.select.step.sync.title=树与画布同步
tutorial.select.step.sync.body=画布选中与层级树同步。按 {key:FRAME_VIEW} 可适配所选到视图。
tutorial.select.step.sync.action=在树与画布间切换选中并试适配视图快捷键，然后点「下一步」。
tutorial.select.step.extras.title=框选样式与相连点
tutorial.select.step.extras.body={key:SELECTION_STYLE_BOX} / {key:SELECTION_STYLE_LASSO} 切换框选与套索样式；{key:SELECT_LINKED} 选择相连控制点（为变形铺垫）。画布右键菜单也会随模式变化。
tutorial.select.step.done.title=选择模式完成
tutorial.select.step.done.body=建议继续「创建变形器」。
tutorial.create.title=创建变形器
tutorial.create.desc=在层级树选中目标后，用右键菜单创建并在放置面板中确认。
tutorial.create.step.selectFirst.title=先在层级树选中组件
tutorial.create.step.selectFirst.body=创建变形器前，请先在层级树点选画元或变形器。未选中时本课会强制引导你完成选择。
tutorial.create.step.selectFirst.action=在亮框的层级树中点选一个目标。
tutorial.create.step.contextDeformer.title=变形器上的右键创建
tutorial.create.step.contextDeformer.body=在变形器节点上右键，可用「添加父级/子集网格或旋转」等方式插入变形器。创建后进入放置会话。
tutorial.create.step.contextDeformer.action=右键一个变形器，浏览创建相关菜单项（可不真正创建）。
tutorial.create.step.contextLayer.title=图层上的右键创建
tutorial.create.step.contextLayer.body=在图层（画元）上右键，可添加父级网格/旋转，或为有网格的画元添加变形路径。同样会进入放置确认。
tutorial.create.step.contextLayer.action=右键一个图层，浏览「添加」相关菜单项。
tutorial.create.step.placement.title=左下角放置面板
tutorial.create.step.placement.body=创建后左下角出现放置面板：可改名称、关系与尺寸/朝向，{key:FINISH_PATH} 确认，{key:CANCEL} 取消。会话期间画布由放置占用；模式条旁会显示临时会话名。
tutorial.create.step.placement.action=了解面板、会话占用与确认方式，然后点「下一步」。
tutorial.create.step.done.title=创建变形器完成
tutorial.create.step.done.body=建议继续「变形模式」学习拉形与笔刷。
tutorial.deform.title=变形模式
tutorial.deform.desc=L1/L2、变形笔刷、轴约束与参数键上的关键形。
tutorial.deform.step.enter.title=进入变形
tutorial.deform.step.enter.body=先选中要编辑的画元或变形器，再切到「变形」模式。未选中时请先在层级树完成选择。
tutorial.deform.step.enter.action=选中目标后切入变形模式。
tutorial.deform.step.levels.title=L1 与 L2
tutorial.deform.step.levels.body=L1 编辑网格点，L2 编辑贝塞尔手柄。按对象与编辑级别选择。
tutorial.deform.step.levels.action=在 L1/L2 间切换观察，然后点「下一步」。
tutorial.deform.step.brushes.title=变形笔刷
tutorial.deform.step.brushes.body=笔刷 {key:TOOL_BRUSH}、平滑 {key:TOOL_SMOOTH}、膨胀 {key:TOOL_INFLATE}；也可直接拖控制点。\n重要：按住 {kbd:Alt} 并用右键拖动，可现场调节笔刷半径 / 硬度（横向与纵向分别对应不同参数），不必先打开工具细节。
tutorial.deform.step.brushes.action=试用一种笔刷，并试一次 {kbd:Alt} +右键拖动调半径。
tutorial.deform.step.shortcuts.title=半径与轴约束
tutorial.deform.step.shortcuts.body=快捷键 {key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP} 调半径，{key:BRUSH_HARDNESS_DOWN} {key:BRUSH_HARDNESS_UP} 调硬度；{key:AXIS_CONSTRAIN_X} / {key:AXIS_CONSTRAIN_Y} 限制轴向。现场微调优先用 {kbd:Alt} +右键拖动。
tutorial.deform.step.keys.title=在参数键上制作关键形
tutorial.deform.step.keys.body=先把参数移到要编辑的键，再调整画元或变形器。各键之间的形状会自动插值，由此形成转头、眼口开合等动作。
tutorial.deform.step.undo.title=撤销与重做
tutorial.deform.step.undo.body={key:UNDO} 撤销，{key:REDO} 重做。变形未完成时注意不要误切模式丢失上下文。
tutorial.deform.step.done.title=变形模式完成
tutorial.deform.step.done.body=建议继续「编辑模式」学习拓扑。
tutorial.edit.title=编辑模式
tutorial.edit.desc=网格细分、切割刀与拓扑安全操作。
tutorial.edit.step.enter.title=进入编辑模式
tutorial.edit.step.enter.body=编辑模式强制显示网格，用于改拓扑而非拉形。
tutorial.edit.step.enter.action=切入编辑模式，然后点「下一步」。
tutorial.edit.step.topo.title=细分与切割
tutorial.edit.step.topo.body=细分 {key:TOOL_SUBDIVIDE}、切割刀 {key:TOOL_KNIFE}。在网格点上拖动可改拓扑；切割刀沿路径切开网格。
tutorial.edit.step.delete.title=删点
tutorial.edit.step.delete.body={key:DELETE_SELECTION} 删除选中点。大改前先确认选中范围，避免误删。
tutorial.edit.step.viewAids.title=视图辅助
tutorial.edit.step.viewAids.body=右下视图条或「视图 ▾」可打开变形路径等辅助线，便于对照拓扑。
tutorial.edit.step.when.title=何时改拓扑
tutorial.edit.step.when.body=网格过疏或切割不合理时进编辑模式；日常拉形应留在变形模式。
tutorial.edit.step.done.title=编辑模式完成
tutorial.edit.step.done.body=你已经理解变形与拓扑编辑的分工。请按当前学习路线继续下一章。
tutorial.paint.title=绘画模式
tutorial.paint.desc=绘画工具、会话应用/放弃与独立撤销。
tutorial.paint.step.layerFirst.title=先选图层
tutorial.paint.step.layerFirst.body=绘画前必须选中图层；未选中时模式条会提示先选择图层。
tutorial.paint.step.layerFirst.action=选中图层并切入绘画，然后点「下一步」。
tutorial.paint.step.tools.title=绘画工具
tutorial.paint.step.tools.body=笔刷 {key:TOOL_PAINT_BRUSH}、铅笔 {key:TOOL_PAINT_PENCIL}、橡皮 {key:TOOL_PAINT_ERASER}、油漆桶 {key:TOOL_PAINT_BUCKET}、吸管 {key:TOOL_PAINT_EYEDROPPER} 与形状工具 {key:TOOL_PAINT_LINE}；快捷键以工具栏与当前设置为准。
tutorial.paint.step.tools.action=切换几种绘画工具，然后点「下一步」。
tutorial.paint.step.shortcuts.title=笔刷快捷键
tutorial.paint.step.shortcuts.body=半径 {key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP}、硬度 {key:BRUSH_HARDNESS_DOWN} {key:BRUSH_HARDNESS_UP}、不透明度 {key:PAINT_OPACITY_DOWN} {key:PAINT_OPACITY_UP}；形状循环 {key:PAINT_SHAPE_CYCLE}。绘画时同样可用 {kbd:Alt} +右键拖动现场调尖端参数。
tutorial.paint.step.session.title=应用或放弃
tutorial.paint.step.session.body=绘画会话可独立撤销。模式条提供应用/放弃；应用后可能提示重建网格。
tutorial.paint.step.return.title=画完继续调形
tutorial.paint.step.return.body=修边补色后回到选择或变形模式，继续调整基础形状与参数键上的关键形。
tutorial.paint.step.return.action=切回选择模式，然后点「下一步」。
tutorial.paint.step.done.title=绘画模式完成
tutorial.paint.step.done.body=建议继续「检视面板」。
tutorial.inspector.title=检视面板
tutorial.inspector.desc=按选中类型显示属性，及绘制顺序三入口。
tutorial.inspector.step.open.title=打开检视
tutorial.inspector.step.open.body=无选中时显示提示；选中画元或变形器后出现对应属性表。
tutorial.inspector.step.open.action=打开检视 Dock 并选中对象，然后点「下一步」。
tutorial.inspector.step.artmesh.title=ArtMesh 属性
tutorial.inspector.step.artmesh.body=剪贴蒙版、绘制顺序、不透明度、混合模式、剔除、用户数据等。
tutorial.inspector.step.deformers.title=变形器属性
tutorial.inspector.step.deformers.body=网格变形器有贝塞尔分割数与编辑级别；旋转变形器与变形路径各有专用字段（如路径的曲线、宽度、闭合）。
tutorial.inspector.step.drawOrder.title=绘制顺序三入口
tutorial.inspector.step.drawOrder.body=检视数值、层级树右键、绘制顺序尺改的是同一属性。按场景选最顺手的入口。
tutorial.inspector.step.done.title=检视面板完成
tutorial.inspector.step.done.body=你已经能按对象类型定位属性。请按当前学习路线继续下一章。
tutorial.tools.title=工具细节
tutorial.tools.desc=随当前工具变化的参数面板，与快捷键对应。
tutorial.tools.step.open.title=打开工具细节
tutorial.tools.step.open.body=该 Dock 内容随左侧工具变化，用于精调笔刷与创建参数。
tutorial.tools.step.open.action=打开工具细节 Dock，然后点「下一步」。
tutorial.tools.step.brushes.title=笔刷参数
tutorial.tools.step.brushes.body=变形笔刷与绘画笔刷都有大小、硬度等；与 {key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP} 等快捷键对应同一组值。
tutorial.tools.step.split.title=栏与面板分工
tutorial.tools.step.split.body=左侧工具栏负责选工具；工具细节负责调参。模式条负责选工作模式。
tutorial.tools.step.shortcuts.title=快捷键对应
tutorial.tools.step.shortcuts.body=可在「设置 → 快捷键」更换 Photoshop / Blender / Cubism 预设或自定义。本教程中的按键会跟随你的当前绑定显示。
tutorial.tools.step.done.title=工具细节完成
tutorial.tools.step.done.body=工具栏、模式条和工具细节的分工已经明确。下一章学习骨骼绑定与姿态。
tutorial.project.title=工程与历史
tutorial.project.desc=保存 .psd2live、历史工作区、节点搜索与分支恢复。
tutorial.project.step.save.title=保存工程
tutorial.project.step.save.body={key:SAVE_PROJECT} 保存，{key:SAVE_PROJECT_AS} 另存为。工程为未加密 ZIP，含 PSD、历史与界面状态。
tutorial.project.step.historyTab.title=历史标签与预设
tutorial.project.step.historyTab.body={key:OPEN_HISTORY_TAB} 打开历史标签，也可切换到专用的「历史」工作区预设。保存工程或 Agent（MCP）修改时，只要内容有变化就会提交新节点。
tutorial.project.step.historyTab.action=点击亮框中的「历史」标签（或用快捷键打开）。
tutorial.project.step.restore.title=恢复版本与搜索
tutorial.project.step.restore.body=双击节点卡片可直接检出该版本；顶部工具栏提供搜索筛选，并高亮通往 HEAD 的完整分支路径，不会删除其他分支。
tutorial.project.step.branch.title=分支与整理
tutorial.project.step.branch.body=从旧节点继续编辑会生成新分支；节点可改名、备注、隐藏（不删数据）。
tutorial.project.step.done.title=工程与历史完成
tutorial.project.step.done.body=可选继续「贴图高清化」，或打开教程目录复习。
tutorial.upscale.title=贴图高清化
tutorial.upscale.desc=AI 放大贴图并复查网格与导出。
tutorial.upscale.step.entry.title=入口
tutorial.upscale.step.entry.body=打开标题栏「工具」菜单，选择「纹理高清化…」，或按 {key:TEXTURE_UPSCALE}。适合原画分辨率偏低时。
tutorial.upscale.step.entry.action=在亮框的「工具」菜单中点击「纹理高清化…」。
tutorial.upscale.step.scale.title=倍率
tutorial.upscale.step.scale.body=通常可选 2× / 4×。放大后贴图像素变密，可能影响网格观感。
tutorial.upscale.step.check.title=复查与导出
tutorial.upscale.step.check.body=放大后在编辑页检查网格与变形器，再到预览确认，最后重新导出。
tutorial.upscale.step.done.title=学习路线完成
tutorial.upscale.step.done.body=你已走完当前学习路线。可随时从「帮助 → 教程…」的目录重学任意一章。

# Tutorial learning paths and current canvas features
tutorial.path.beginner.title=第一次制作 Live2D 模型
tutorial.path.beginner.desc=从分层 PSD、部件与参数讲起，循序完成导入、编辑、动作、物理和导出。不要求使用过 Cubism。
tutorial.path.experienced.title=我有 Live2D / Cubism 经验
tutorial.path.experienced.desc=用熟悉的 ArtMesh、Deformer、Parameter 概念快速对应 PSD2Live，重点了解自动生成、画布模式、骨骼、动画与物理工作流。
tutorial.path.start=从这条路线开始
tutorial.live2dBridge.title=Live2D 用户快速迁移
tutorial.live2dBridge.desc=把 Cubism 概念映射到 PSD2Live，并了解自动生成与编辑边界。
tutorial.live2dBridge.step.workspace.title=从工作区预设开始
tutorial.live2dBridge.step.workspace.body=顶部工作区对应不同任务布局：编辑、网格、绑定、动画、预览、物理、历史。它们共享同一工程，只保存不同的画布和 Dock 排列。
tutorial.live2dBridge.step.structure.title=ArtMesh 与 Deformer 在这里
tutorial.live2dBridge.step.structure.body=PSD 图层导入后生成画元，对应 Cubism 的 ArtMesh（图形网格）。PSD2Live 的「网格变形器」对应 Warp Deformer（弯曲变形器），另有旋转变形器；变形路径是本程序的实验性工具，导出时烘焙为网格关键形。父子关系决定形变继承，绘制顺序单独决定遮挡。
tutorial.live2dBridge.step.modes.title=画布模式
tutorial.live2dBridge.step.modes.body=选择用于对象操作，变形用于在参数键上制作关键形，编辑用于修改网格拓扑，模拟绘制布料与头发模拟读取的顶点权重组，骨骼用于摆姿态或调整骨架，绘画直接修改图层纹理，预览播放模型。模式菜单把这几类工具上下文分开。
tutorial.live2dBridge.step.parameters.title=参数与关键形
tutorial.live2dBridge.step.parameters.body=参数面板对应 Cubism 参数。圆点是普通键，方点是融合变形（Blend Shape）键；二维关联可同时操作两个参数。键上的关键形属于建模数据，不要与动画时间线的关键帧混淆。
tutorial.live2dBridge.step.export.title=导出而不是工程本体
tutorial.live2dBridge.step.export.body=.psd2live 保存 PSD2Live 中的素材、编辑与分支历史；CMO3 是 Cubism Editor 可继续编辑的模型工程。运行时交付物是 MOC3、model3.json、纹理及按需生成的物理等文件的组合；建议先保存工程，再导出。
tutorial.live2dBridge.step.done.title=概念映射完成
tutorial.live2dBridge.step.done.body=接下来快速浏览工作区与画布，再进入 PSD2Live 特有的新功能。
tutorial.skeleton.title=骨骼绑定与姿态
tutorial.skeleton.desc=在画布上创建骨架、绑定 ArtMesh、测试 IK、平滑蒙皮权重并配置参数采样。
tutorial.skeleton.step.panel.title=骨骼面板
tutorial.skeleton.step.panel.body=骨骼是 PSD2Live 的快速肢体绑定工具，不是 Cubism 模型中的独立骨骼对象。新建骨架后可添加身体、四肢、尾巴或翅膀骨链，也可暂时禁用但保留数据。
tutorial.skeleton.step.panel.action=在亮框中打开骨骼面板；有模型时可浏览“创建骨架”入口。
tutorial.skeleton.step.bind.title=在画布上摆放并绑定
tutorial.skeleton.step.bind.body=编辑骨架时直接拖动画布关节定位；先选骨骼，再点 ArtMesh 完成绑定。退出编辑会保存，取消则放弃本次调整。
tutorial.skeleton.step.pose.title=姿态与 IK
tutorial.skeleton.step.pose.body=姿态工具中拖骨骼可旋转；拖末端或按住 {kbd:Shift} 拖动使用 IK。摆姿态会驱动参数，不会破坏原网格。
tutorial.skeleton.step.pose.action=在画布观察骨骼覆盖层；已有骨架时试着拖动末端。
tutorial.skeleton.step.weights.title=检查蒙皮权重与平滑扩散
tutorial.skeleton.step.weights.body=开启“显示蒙皮权重”检查关节过渡。权重会自动沿网格拓扑连通扩散，网格优先挂载到覆盖的近端关节，消除权重断层；可在面板中调整关节带宽与影响范围。
tutorial.skeleton.step.sampling.title=骨骼参数采样与点数预览
tutorial.skeleton.step.sampling.body=骨架面板底部支持配置参数采样容差、最小角度间隔和网格关键形上限，并实时预览参数点总数与当前骨骼点数，避免导出时生成过多关键形导致性能下降。
tutorial.skeleton.step.sampling.action=浏览骨骼面板底部的「骨骼参数采样」区域，查看参数点统计与调节滑块。
tutorial.skeleton.step.done.title=骨骼章节完成
tutorial.skeleton.step.done.body=导出时，骨骼、权重与 IK 结果会烘焙为 Cubism 的参数、弯曲 / 旋转变形器与网格关键形；Cubism Editor 中不保留 PSD2Live 的骨架语义。下一章将制作并预览自定义动作。
tutorial.animation.title=动画与动作编辑器
tutorial.animation.desc=创建动作、自动插帧、记录姿态、编辑关键帧并在画布实时预览。
tutorial.animation.step.motions.title=动作列表
tutorial.animation.step.motions.body=动画面板区分内置动作和自定义动作。可新建空白动作或从预设复制，并设置时长、循环与淡入淡出。
tutorial.animation.step.motions.action=打开动画 Dock，选择一个动作；也可新建自定义动作。
tutorial.animation.step.editor.title=时间轴与轨道
tutorial.animation.step.editor.body=在动画编辑器添加参数轨道；摄影表适合排时间，曲线视图适合调缓动。双击轨道添加关键帧，轨道名称旁会显示参数关键帧标记与导引线。
tutorial.animation.step.autoKey.title=自动插帧
tutorial.animation.step.autoKey.body=开启工具栏的「自动插帧」，在播放头所在时间调整任意参数滑块、2D 点或画布姿态，即可自动打上关键帧；未在轨道上的参数也会自动归档进动作曲线中。
tutorial.animation.step.autoKey.action=可在动画编辑器工具栏点击「自动插帧」开关，或在播放头处调整参数体验自动打帧。
tutorial.animation.step.keys.title=记录当前姿态与贝塞尔缓动
tutorial.animation.step.keys.body=手动模式下先在参数面板摆好姿态，再用“记录姿态”把受控参数写到播放头。关键帧默认采用贝塞尔（Bezier）平滑过渡，并在轨道名称旁实时显示关键点标记，方便定位。
tutorial.animation.step.keys.action=移动播放头并记录一次姿态，或在轨道上双击添加关键帧。
tutorial.animation.step.preview.title=画布实时预览与姿态共享
tutorial.animation.step.preview.body=播放动作时画布会实时显示结果。工作区内的所有画布共享同一套参数姿态，在动画编辑、预览与各编辑模式间切换时姿态保持同步，不会丢失或意外重置。
tutorial.animation.step.done.title=动画章节完成
tutorial.animation.step.done.body=下一章用同一块预览画布调试物理摆锤与输出范围。
tutorial.physics.title=物理画布调试
tutorial.physics.desc=建立物理组，在画布拖拽摆锤并校准参数输出。
tutorial.physics.step.groups.title=物理组
tutorial.physics.step.groups.body=物理面板集中管理预设、骨骼、摆动和自定义组。每个组都可复制、排序、禁用或恢复生成值。
tutorial.physics.step.groups.action=打开物理 Dock，选择一个已有组；没有时可新建空白摆锤。
tutorial.physics.step.pendulum.title=直接编辑画布摆锤
tutorial.physics.step.pendulum.body=画布圆环代表摆锤节点：拖动可改长度，单击选择某一段；右侧输出标签可拖到目标摆锤旁，决定取哪一段的角度。
tutorial.physics.step.io.title=输入、输出与冲突
tutorial.physics.step.io.body=输入把位置或角度送入模拟，输出驱动参数。面板会提示缺失参数、反馈回路和多个组争用同一输出等无效配置。
tutorial.physics.step.test.title=牵动画布并校准
tutorial.physics.step.test.body=拖动画布空白处牵动模型，观察输出最大值与范围扇形；再用“按最大值调整倍率”校准，避免长期截断在参数端点。
tutorial.physics.step.test.action=在亮出的画布内拖动一次，观察摆锤响应和输出最大值。
tutorial.physics.step.done.title=物理章节完成
tutorial.physics.step.done.body=物理章节结束。接下来是「工程与历史」。

