help.spec.intro=每个部位单独分层，图层名可用下面的英文或中文别名，也支持日文。
help.spec.group.head=头部与五官
help.spec.head.face=face / 脸 / 脸部：脸部底图；facedetail / 腮红 / 泪痕等细节放这里
help.spec.head.hairFront=front_hair / 前发 / 刘海：前面的头发
help.spec.head.hairBack=back_hair / 后发 / 后脑勺：后面的头发
help.spec.head.headwear=headwear / hat / 头饰 / 帽子：挂在头部、不随脸部九轴变形
help.spec.head.eyelash=eyelash / 睫毛：睁眼时的上睫毛，不含下睫毛和下眼眶
help.spec.head.eyewhite=eyewhite / 眼白：用于闭眼变形，并限制瞳孔显示范围
help.spec.head.eyeClose=eye_close / 闭眼：预先画好的闭眼造型，与睫毛闭眼曲线二选一
help.spec.head.irides=irides / pupil / 瞳孔 / 眼睛：跟随视线移动的部分
help.spec.head.eyebrow=eyebrow / 眉毛
help.spec.head.nose=nose / 鼻子
help.spec.head.mouth=mouth / 嘴巴 / 口：画最大张口状态，建议保留清晰描边
help.spec.head.mouthClose=mouth_close / 闭嘴：预先画好的闭口造型，可选
help.spec.head.mouthInternals=tooth_t / tooth_b / tongue：上牙 / 下牙 / 舌头，自动限制在嘴内显示
help.spec.head.ears=ears / earwear / eyewear：耳朵 / 耳饰 / 眼镜，随头部转动
help.spec.group.body=身体
help.spec.body.neck=neck / 脖子
help.spec.body.topwear=topwear / 衣服 / 上衣：跟随身体转动和呼吸
help.spec.body.limbs=handwear / legwear / footwear（arm / hand / leg / foot）：手臂 / 手 / 腿 / 脚
help.spec.body.bottomwear=bottomwear / 裤子 / 裙子：下装
help.spec.body.neckwear=neckwear / 领饰 / 围巾：挂在脖子上的饰物
help.spec.group.extra=附加与道具
help.spec.extra.tail=tail / 尾巴：独立摆动
help.spec.extra.wings=wings / 翅膀：挂在身体后方
help.spec.extra.objects=objects / prop / 道具：其他可独立控制的部件
help.spec.group.notes=画图时注意
help.spec.note.eyelash=• 睫毛层只画上睫毛，否则闭眼时可能拉扯下眼眶。
help.spec.note.mouth=• 嘴巴画最大张口，程序会自动生成闭口动作。
help.spec.note.body=• 身体保持直立，过度倾斜或躺卧容易导致动作变形。
help.spec.note.unknown=• 未识别的图层会置后并标为 unknown，可在「图层」表格中手动指定部位。

