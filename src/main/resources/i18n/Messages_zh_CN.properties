layout.new.hint=画布是模型的坐标空间，以画布单位计；导出到 Cubism 后就是模型画布，一个单位对应一个像素。它决定模型的大小和比例，不决定清晰度。清晰度来自素材：素材保留原始像素，摆放和缩放图层都不会重采样，所以图层摆得越小，纹理越密。导出时贴图要放进纹理集预算（纹理工作区中的页面尺寸和页数），放不下时图块会一起按比例缩小。在空白图层上直接绘画时，每个画布单位画一个像素。
