mesh.settings.edgeModeHint.TRIPLE=中线贴合原始轮廓；外线和内线各距中线一个宽度。
mesh.settings.shapeGroup=轮廓位置
mesh.settings.samplingGroup=点位密度
mesh.settings.topologyGroup=连接拓扑
mesh.settings.suppressBoundaryDiagonals=抑制边缘点之间的跨越连线
mesh.settings.fillAlgorithm=内部填充算法
mesh.settings.fill.GRADED_POISSON=渐疏泊松填充（默认）
mesh.settings.fill.ADAPTIVE_QUADTREE=平衡四叉树填充（4-8 细分）
mesh.settings.fill.SIMPLE_TRIANGLES=简单三角填充
mesh.settings.fill.TRIANGLE_FRACTAL=正三角分形细分
mesh.settings.fill.CONTOUR_PAVING=轮廓层铺
mesh.settings.fillHint.GRADED_POISSON=边缘较密、内部渐疏；点位均匀自然，适合大多数部件。内部密度即最大点距。
mesh.settings.fillHint.ADAPTIVE_QUADTREE=直角三角逐级二分的米字格，向内逐级变疏；内部密度即最粗一级格距。
mesh.settings.fillHint.SIMPLE_TRIANGLES=原有错列三角点阵，密度均一。
mesh.settings.fillHint.TRIANGLE_FRACTAL=正三角形逐级四分，相邻最多差一级；内部密度即最粗一级格距。
mesh.settings.fillHint.CONTOUR_PAVING=沿轮廓向内逐层铺设 /\\/\\ 行并按 2:1 抽稀，中心用正三角点阵收尾；内部密度即中心点距。
mesh.settings.fillParam.edgeRatio=边缘过渡倍率
mesh.settings.fillParam.gradation=渐变斜率
mesh.settings.fillParam.jitter=随机度
mesh.settings.fillParam.angle=网格朝向
mesh.settings.fillParam.maxRows=最大铺设行数
mesh.settings.fillParamHint.edgeRatio=内侧第一圈点距与轮廓点距之比；2 即 2:1 过渡，不再重复一圈贴边点。
mesh.settings.fillParamHint.gradation=每深入 1px 点距增加的像素数；越大越快变疏。
mesh.settings.fillParamHint.jitter=0 为规则错列点阵，1 为最大随机扰动。
mesh.settings.fillParamHint.angle=点阵整体旋转角度，可让格线顺着部件走向。
mesh.settings.fillParamHint.maxRows=沿轮廓铺设的行数上限，其余交给中心点阵。
mesh.settings.topologyHint=优先让非相邻边缘点通过内部点连接；若该约束会破坏平滑轮廓，则自动回退。
mesh.settings.overridden=已自定义设置
mesh.panel.globalTitle=全局默认
mesh.panel.globalHint=作用于未单独覆盖的部件。选中某个 ArtMesh 可编辑该部件。
mesh.panel.showHints=显示说明
mesh.panel.hideHints=隐藏说明
mesh.settings.unitsGroup=单位
mesh.settings.unitsDocument=随文档尺寸缩放
mesh.settings.unitsHint=开启：长度按长边缩放到 {0} px 的文档计算，大尺寸 PSD 得到同样的网格，并在缩小后的栅格上生成。关闭：按源像素计算，与旧工程一致。
mesh.settings.unitsScale=1 单位 = {0} 源像素
mesh.settings.traceTexture=按贴图像素描出轮廓
mesh.settings.traceHint=开启：轮廓沿图层自身的像素描出，最细可达网格单位的 {0} 分之一，细于画布像素的笔画也留在网格内；顶点间距不变。关闭：按缩放到画布分辨率的图层描轮廓，与旧工程一致。
mesh.settings.wrap=包裹
mesh.settings.wrapHint=包裹拓扑：描轮廓前闭合窄于此值的缝隙与凹口，睫毛、发梢等细小凸起共用一个简单包络，不再各自成一圈轮廓。细长笔画完整留在包络内，所有绘制像素仍在网格内。0 表示沿绘制边缘。
