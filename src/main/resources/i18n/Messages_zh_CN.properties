settings.rigTuning.irisKeepWidth.hint=角度 X 满值时远侧瞳孔在收窄的眼白中加宽多少以保持形状，近侧为其五分之一。默认 {0}%。
settings.rigTuning.irisTilt=瞳孔俯仰
settings.rigTuning.irisTilt.hint=角度 Y 满值时瞳孔上下移多少，按瞳孔高度的百分比。默认 {0}%。
settings.rigTuning.blinkCorner=闭眼眼角
settings.rigTuning.blinkCorner.hint=闭眼时眼角落在眼白从上往下的哪里，按眼白高度的百分比。默认 {0}%。
settings.rigTuning.eyelashSquash=闭眼睫毛厚度
settings.rigTuning.eyelashSquash.hint=闭眼时睫毛保留原厚度的百分比。默认 {0}%。
settings.rigTuning.irisJellyStretch=瞳孔弹性拉长
settings.rigTuning.irisJellyStretch.hint=眼球形状满值时瞳孔拉高多少。默认 {0}%。
settings.rigTuning.irisJellySquash=瞳孔弹性收窄
settings.rigTuning.irisJellySquash.hint=眼球形状满值时瞳孔随拉长收窄多少。默认 {0}%。
settings.rigTuning.browLift=眉毛升降
settings.rigTuning.browLift.hint=眉毛 Y 满值时眉毛上下移多少，按眉高的百分比。默认 {0}%。
settings.rigTuning.browFarShrink=远眉变窄
settings.rigTuning.browFarShrink.hint=角度 X 满值时远侧眉毛变窄多少。默认 {0}%。
settings.rigTuning.browNearGrow=近眉变宽
settings.rigTuning.browNearGrow.hint=角度 X 满值时近侧眉毛变宽多少。默认 {0}%。
settings.rigTuning.browShift=眉毛横移
settings.rigTuning.browShift.hint=角度 X 满值时双眉向转向一侧额外移动多少，按半个脸宽的百分比。默认 {0}%。
settings.rigTuning.browTilt=眉毛俯仰
settings.rigTuning.browTilt.hint=角度 Y 满值时眉毛上下移多少，按眉高的百分比。默认 {0}%。
settings.rigTuning.mouthSmile=嘴角上扬
settings.rigTuning.mouthSmile.hint=嘴型满值时嘴角上扬或下垂多少，按嘴高的百分比。默认 {0}%。
settings.rigTuning.mouthFormWiden=笑时加宽
settings.rigTuning.mouthFormWiden.hint=嘴型满值时笑嘴变宽、撇嘴变窄多少。默认 {0}%。
settings.rigTuning.mouthClosedNarrow=闭嘴收窄
settings.rigTuning.mouthClosedNarrow.hint=张嘴为 0 时嘴比张开时窄多少。默认 {0}%。
settings.rigTuning.mouthSmileBase=整嘴升降
settings.rigTuning.mouthSmileBase.hint=嘴型满值时整张嘴上下移多少，按嘴高的百分比。默认 {0}%。
settings.rigTuning.mouthSeam=闭合线位置
settings.rigTuning.mouthSeam.hint=闭嘴时上下唇在嘴从上往下的哪里合拢，按嘴高的百分比。默认 {0}%。
settings.rigTuning.teethFade=牙齿显现
