settings.rigTuning.bodyZDegrees=身体 Z 倾斜
settings.rigTuning.bodyZDegrees.hint=身体 Z 满值时上半身绕腰向侧面倾斜多少度。默认 {0}°。
settings.rigTuning.breathLift=呼吸抬肩
settings.rigTuning.breathLift.hint=呼吸满值时肩膀及其承载的头和手臂抬起多少，按躯干长度的百分比。默认 {0}%。
settings.rigTuning.breathWiden=呼吸扩胸
