cli.usage=PSD2Live 3.7.0\n无参数启动桌面 GUI；命令行模式：\n  psd2live --input character.psd [--output out] [选项]\n\n选项：\n  --lang zh               界面语言：zh、en、ja、ko\n  --clear-user-data       删除设置、工作区存储和下载的运行时后退出\n  --atlas 4096            贴图页边长（256..16384）\n  --mesh-spacing 64       网格采样间距（按 2048 px 文档的像素）\n  --mesh-pixels           改为按源像素计算网格间距\n  --mesh-wrap 0           包裹拓扑：闭合窄于此值（网格单位）的轮廓缝隙，细小凸起共用一个包络\n  --head-strength 1.0     头部 3D 转动幅度\n  --body-strength 1.0     身体动作幅度\n  --mesh-only             仅导出网格与贴图\n  --no-deformers          不生成变形器层级\n  --no-see-through        眉毛与眼睛都不透过刘海\n  --no-see-through-eyes   眼睛不透过刘海\n  --see-through-opacity 0.5  眉毛与眼睛透过刘海的程度（0..1）\n  --no-motions            不导出动作文件\n  --no-physics            不生成头发与果冻眼物理\n  --no-cmo3               不导出可编辑 CMO3\n  --no-moc3               不导出运行时 MOC3 文件族\n  --no-json               不导出工程元数据 JSON

