settings.rigTuning.turnFade=转身过渡
settings.rigTuning.turnFade.hint=转身在腰以下多远内逐渐消失，按躯干长度计。默认 {0}。
settings.rigTuning.kneesInRest=膝盖基础内扣
settings.rigTuning.kneesInRest.hint=膝盖弯曲时无论下沉多少都会内扣的角度。默认 {0}°。
settings.rigTuning.turnDegrees=转身角度
settings.rigTuning.turnDegrees.hint=身体 X 满值时腰以上的上半身绕中线转多少度。默认 {0}°。
settings.rigTuning.armSwingDegrees=手臂摆动
