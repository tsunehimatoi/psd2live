sim.blendShapesTip=模态参数的写入方式。关键形轴：所有 Cubism 版本都能读，但每个模态会把网格的关键形数量乘以它的关键点数。融合变形（Cubism 4.2+）：关键形叠加在原有关键形上。两者播放效果相同。「自动」只在网格关键形超过 64 个时使用融合变形。
