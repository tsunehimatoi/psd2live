settings.rigTuning.mouthShift=嘴巴横移
settings.rigTuning.mouthShift.hint=角度 X 满值时嘴向转向一侧移动多少，按半个脸宽的百分比。默认 {0}%。
settings.rigTuning.mouthCornerLag=远侧嘴角滞后
settings.rigTuning.mouthCornerLag.hint=角度 X 满值时远侧嘴角落后多少，按嘴宽的百分比。默认 {0}%。
settings.rigTuning.mouthNearLag=近侧嘴角滞后
settings.rigTuning.mouthNearLag.hint=角度 X 满值时近侧嘴角落后多少，按嘴宽的百分比。默认 {0}%。
settings.rigTuning.mouthTurnArch=转向嘴中下沉
settings.rigTuning.mouthTurnArch.hint=角度 X 满值时嘴中部下沉多少，按嘴高的百分比。默认 {0}%。
settings.rigTuning.mouthTilt=嘴巴俯仰
settings.rigTuning.mouthTilt.hint=角度 Y 满值时嘴上下移多少，按嘴高的百分比。默认 {0}%。
settings.rigTuning.noseShift=鼻子横移
settings.rigTuning.noseShift.hint=角度 X 满值时鼻子向转向一侧移动多少，按半个脸宽的百分比；鼻尖比鼻根移得更多。默认 {0}%。
settings.rigTuning.earFade=远耳淡出
settings.rigTuning.earFade.hint=角度 X 满值时远侧耳朵变透明多少。默认 {0}%。
settings.rigTuning.noseTilt=鼻子俯仰
settings.rigTuning.noseTilt.hint=角度 Y 满值时鼻子上下移多少，按鼻高的百分比。默认 {0}%。
settings.rigTuning.earFarShrink=远耳变窄
settings.rigTuning.earFarShrink.hint=角度 X 满值时远侧耳朵变窄多少。默认 {0}%。
settings.rigTuning.earShift=耳朵反移
settings.rigTuning.earShift.hint=角度 X 满值时耳朵逆转向移动多少，按半个脸宽的百分比。默认 {0}%。
settings.rigTuning.frontHairTurn=前发转向
settings.rigTuning.frontHairTurn.hint=角度 X 满值时前发逆转向错开多少，按头宽的百分比。默认 {0}%。
settings.rigTuning.backHairTurn=后发转向
settings.rigTuning.backHairTurn.hint=角度 X 满值时后发逆转向错开多少，按头宽的百分比。默认 {0}%。
settings.rigTuning.frontHairSway=前发摆幅
settings.rigTuning.frontHairSway.hint=前发摇摆满值时发梢摆多少，按头发短边的百分比。默认 {0}%。
settings.rigTuning.backHairSway=后发摆幅
settings.rigTuning.backHairSway.hint=后发摇摆满值时发梢摆多少，按头发短边的百分比。默认 {0}%。
settings.rigTuning.frontHairTilt=前发俯仰
settings.rigTuning.frontHairTilt.hint=角度 Y 满值时前发逆俯仰错开多少，按头高的百分比；负值随之同向。默认 {0}%。
settings.rigTuning.backHairTilt=后发俯仰
settings.rigTuning.backHairTilt.hint=角度 Y 满值时后发逆俯仰错开多少，按头高的百分比；负值随之同向。默认 {0}%。
settings.rigTuning.frontHairPerspective=前发透视
settings.rigTuning.frontHairPerspective.hint=角度 X 满值时前发中部向转向一侧多移多少。默认 {0}%。
settings.rigTuning.frontHairCurl=前发上翘
settings.rigTuning.frontHairCurl.hint=前发摆到满值时发梢抬起多少，按头发短边的百分比。默认 {0}%。
settings.rigTuning.backHairCurl=后发上翘
settings.rigTuning.backHairCurl.hint=后发摆到满值时发梢抬起多少，按头发短边的百分比。默认 {0}%。
settings.rigTuning.hairRollHold=长发歪头保持
