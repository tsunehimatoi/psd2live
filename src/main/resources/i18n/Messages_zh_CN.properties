mesh.settings.traceHint=开启：轮廓沿图层自身的像素描出，最细可达网格单位的 {0} 分之一，细于画布像素的笔画也留在网格内；顶点间距不变。关闭：按缩放到画布分辨率的图层描轮廓，与旧工程一致。
mesh.settings.wrap=包裹
mesh.settings.wrapHint=包裹拓扑：描轮廓前闭合窄于此值的缝隙与凹口，睫毛、发梢等细小凸起共用一个简单包络，不再各自成一圈轮廓。细长笔画完整留在包络内，所有绘制像素仍在网格内。0 表示沿绘制边缘。
settings.alphaThreshold=Alpha 阈值
settings.headStrength=头部幅度
settings.bodyStrength=身体幅度
settings.unit.px=px
settings.unit.x=x
settings.rig.values=数值
settings.rig.turnStyle=转头风格
settings.rig.turnStyle.hint=从一种完整的转头风格开始。选择后本模块的其他数值恢复默认，再用它们在这种风格上调整。
settings.rig.turnStyle.default=标准
settings.rig.turnStyle.bold=强立体：转得深，视线保持，五官与头饰领先
settings.rig.turnStyle.dramatic=夸张：转头与俯仰幅度大，远侧收得多
settings.rig.turnStyle.wide=大幅：转得大，两侧脸颊摆动明显
settings.rig.turnStyle.nod=点头：左右转平缓，俯仰幅度大
settings.rig.turnStyle.soft=柔和：平缓、幅度小
settings.rig.knob.face.depth-turn.style=转头风格
settings.rig.knob.face.depth-turn.style.hint=转头从哪种风格开始：0 为标准，其后依次为强立体、夸张、大幅、点头、柔和。默认 {0}。
settings.rigTuning.default=默认
settings.rigTuning.changed=已修改 {0} 项
settings.rigTuning.reset=将这里的数值恢复为默认值
settings.rigTuning.group.turn=身体 X（左右转身）
settings.rigTuning.group.open=身体 Y（上下）
settings.rigTuning.group.lean=身体前后倾
settings.rigTuning.group.proportion=大小变（头身比）
settings.rigTuning.group.breath=身体 Z 与呼吸
settings.rigTuning.group.depth=立体与透视
settings.rigTuning.advanced=高级
settings.rigTuning.group.head=头部转向
settings.rigTuning.group.eyes=眼睛
settings.rigTuning.group.brows=眉毛
settings.rigTuning.group.mouth=嘴巴
settings.rigTuning.group.nose_ears=鼻子与耳朵
settings.rigTuning.group.hair=头发
settings.rigTuning.faceTurn=脸部转向
settings.rigTuning.faceTurn.hint=角度 X 满值时脸面随转向滚动多少，按半个脸宽的百分比；越大五官越往转向一侧挤。默认 {0}%。
settings.rigTuning.faceTilt=脸部俯仰
settings.rigTuning.faceTilt.hint=角度 Y 满值时脸上各行抬头拉开、低头聚拢多少，按半个脸高的百分比。默认 {0}%。
settings.rigTuning.faceLeanDown=前倾低头
settings.rigTuning.faceLeanDown.hint=身体前倾满值时脸随之向下转多少度（角度 Y）。默认 {0}°。
settings.rigTuning.faceLeanUp=后仰抬头
settings.rigTuning.faceLeanUp.hint=身体后仰满值时脸随之向上转多少度（角度 Y）。默认 {0}°。
settings.rigTuning.faceTurnBase=整脸平移
settings.rigTuning.faceTurnBase.hint=角度 X 满值时整张脸共同平移多少，按半个脸宽的百分比。默认 {0}%。
settings.rigTuning.faceLift=整脸升降
settings.rigTuning.faceLift.hint=角度 Y 满值时整张脸上下移动多少，按半个脸高的百分比。默认 {0}%。
settings.rigTuning.faceArch=俯仰弧度
settings.rigTuning.faceArch.hint=角度 Y 满值时脸上各行抬头弯成 ^、低头弯成 V 的程度，按半个脸高的百分比。默认 {0}%。
settings.rigTuning.faceCorner=斜角修正
settings.rigTuning.faceCorner.hint=角度 X 与 Y 同时取值（四个斜角姿势）时额外修正的强度；100% 为默认形状，0 为不修正。默认 {0}%。
settings.rigTuning.faceOutsideFollow=脸外跟随
settings.rigTuning.faceOutsideFollow.hint=皮肤轮廓之外的头部图层随转向整体平移多少，按半个脸尺寸的百分比。默认 {0}%。
settings.rigTuning.yawEase=转向缓和
settings.rigTuning.yawEase.hint=角度 X 在此附近开始缓和；越小，转头初段动得越多、末段越少。默认 {0}°。
settings.rigTuning.pitchEase=俯仰缓和
settings.rigTuning.pitchEase.hint=角度 Y 在此附近开始缓和；越小，抬头低头初段动得越多、末段越少。默认 {0}°。
settings.rigTuning.featurePlane=五官斜面
settings.rigTuning.featurePlane.hint=斜角姿势时双眼、双眉和嘴的连线倾斜多少。默认 {0}%。
settings.rigTuning.headShellTurn=头壳转向
settings.rigTuning.headShellTurn.hint=角度 X 满值时头壳（连同头发）平移多少，按头宽的百分比。默认 {0}%。
settings.rigTuning.headShellCrown=头顶额外
settings.rigTuning.headShellCrown.hint=角度 X 满值时头顶在头壳之外再多移多少，按头宽的百分比。默认 {0}%。
settings.rigTuning.headShellTilt=头壳俯仰
settings.rigTuning.headShellTilt.hint=角度 Y 满值时头壳上下移动多少，按头高的百分比。默认 {0}%。
settings.rigTuning.faceContour=远侧脸颊内凹
settings.rigTuning.faceContour.hint=角度 X 满值时远侧脸颊轮廓向内凹进多少，按脸宽的百分比。默认 {0}%。
settings.rigTuning.displacementShift=五官位移横移
settings.rigTuning.displacementShift.hint=启用五官位移时，角度 X 满值五官向转向一侧移动多少，按脸宽的百分比。默认 {0}%。
settings.rigTuning.displacementNarrow=五官位移收拢
settings.rigTuning.displacementNarrow.hint=启用五官位移时，角度 X 满值五官相互靠拢多少。默认 {0}%。
settings.rigTuning.displacementTilt=五官位移俯仰
settings.rigTuning.displacementTilt.hint=启用五官位移时，角度 Y 满值五官上下移动多少，按脸高的百分比。默认 {0}%。
settings.rigTuning.displacementTwist=五官位移扭转
settings.rigTuning.displacementTwist.hint=启用五官位移时，斜角姿势五官整体旋转多少度。默认 {0}°。
settings.rigTuning.eyeFarShrink=远眼变窄
settings.rigTuning.eyeFarShrink.hint=角度 X 满值时远侧眼睛变窄多少。默认 {0}%。
settings.rigTuning.gazeX=视线横移
settings.rigTuning.gazeX.hint=眼球 X 满值时瞳孔横移多少，按其变形器宽度的百分比。默认 {0}%。
settings.rigTuning.gazeY=视线纵移
settings.rigTuning.gazeY.hint=眼球 Y 满值时瞳孔上下移多少，按其变形器高度的百分比。默认 {0}%。
settings.rigTuning.blinkDepth=闭眼弧深
settings.rigTuning.blinkDepth.hint=闭眼时眼线弧中部下垂多少，按眼白高度的百分比。默认 {0}%。
settings.rigTuning.eyeNearGrow=近眼变宽
settings.rigTuning.eyeNearGrow.hint=角度 X 满值时近侧眼睛变宽多少。默认 {0}%。
settings.rigTuning.eyeShift=眼睛横移
settings.rigTuning.eyeShift.hint=角度 X 满值时双眼向转向一侧额外移动多少，按半个脸宽的百分比。默认 {0}%。
settings.rigTuning.eyeTilt=眼睛俯仰
settings.rigTuning.eyeTilt.hint=角度 Y 满值时眼睛上下移多少，按眼高的百分比。默认 {0}%。
settings.rigTuning.eyeLidCurve=眼睑弧度
settings.rigTuning.eyeLidCurve.hint=角度 Y 满值时眼睛中部额外上下移多少，按眼高的百分比。默认 {0}%。
settings.rigTuning.eyeTiltStretch=眼睛俯仰伸缩
settings.rigTuning.eyeTiltStretch.hint=角度 Y 满值时眼睛抬头变高、低头变扁多少。默认 {0}%。
settings.rigTuning.irisShift=瞳孔反移
settings.rigTuning.irisShift.hint=角度 X 满值时瞳孔逆转向移动多少，按瞳孔宽度的百分比。默认 {0}%。
