tutorial.basic.step.openFile.title=打开「文件」菜单
tutorial.basic.step.openFile.body=从「文件」菜单开始，接下来将依次完成导入、预览、图层检查和导出。亮框表示当前操作区域，暗色区域暂时不可点击。
tutorial.basic.step.import.title=导入 PSD
tutorial.basic.step.import.body=请选择保留了独立图层的 PSD 立绘。导入后，程序会读取图层并生成预览；较大的文件可能需要稍等片刻。已有 Cubism 模型也可从同一「导入」子菜单载入，新建工程或替换当前模型。导入 PSD 后会打开「开始」界面：用「最小 / 默认 / 完整」快捷选项设定模型预设，并勾选要按网格拆分的图层。
tutorial.basic.step.preview.title=切换到预览
tutorial.basic.step.preview.body=打开画布左上角的模式菜单，选择「预览」检查生成模型的效果。先观察整体外观，再检查眼睛、嘴巴和头发等部件是否符合预期。预览左侧工具栏最下面几行可在 Cubism SDK 与 PSD2Live 运行时（标准 / 扩展）之间切换。
tutorial.basic.step.layers.title=先认识「图层」模块
tutorial.basic.step.layers.body=亮框中是整个图层模块。这里列出 PSD 图层，以及程序为它们识别的类型、预设部件和侧别。先看图层名称与识别结果是否对应；下一步会单独框出一行，解释如何修正不匹配的预设。
tutorial.basic.step.layerRow.title=部件与预设不匹配时怎么改
tutorial.basic.step.layerRow.body=亮框是一条图层记录。先根据左侧名称确认它实际画的部件；如果要使用预设，将「类型」设为「预设」，再在右侧选择对应部件。\n例如：头发图层被识别成其他部件，就把预设改为相应的头发部件；有左右区分时，再核对侧别。
tutorial.basic.step.settings.title=模型预设模块
tutorial.basic.step.settings.body=模型预设控制形变幅度、口型、动作、头发与服装模拟，以及在画布上创建变形器时的默认分割。建议先保留默认值；需要调整时，每次只改一项，再观察预览中的变化。贴图图集参数在导出窗口中设置。
tutorial.basic.step.export.title=导出模型
tutorial.basic.step.export.body=导出入口会打开设置窗口。CMO3 是可在 Cubism Editor 中继续编辑的模型工程；运行时包除 MOC3 外通常还有 model3.json、纹理及按需生成的物理等文件，交付时不要只拷贝 MOC3。
tutorial.basic.step.done.title=基础引导已结束
tutorial.basic.step.done.body=你已浏览导入、预览、图层和模型预设到导出的流程。可继续下一课「工作区导览」，或打开教程目录挑选主题；随时可从「帮助」再次开始。
