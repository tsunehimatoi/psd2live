toolDetails.noModel=모델을 불러오면 도구 세부 정보가 표시됩니다
tutorial.basic.hint.manual=프레임 안의 컨트롤을 사용해 본 후 다음을 선택하세요.
tutorial.basic.hint.auto=작업을 마치면 자동으로 진행됩니다. 나중에 살펴보려면 건너뛰기를 선택하세요.
tutorial.basic.step.openFile.action=프레임 안의 파일을 클릭하거나 다음을 선택하면 자동으로 열립니다.
tutorial.basic.step.import.action=PSD에서 새 프로젝트…를 선택하고 레이어가 있는 파일을 지정하세요. 취소한 경우 다시 시도하거나 이 단계를 건너뛸 수 있습니다.
tutorial.basic.step.preview.action=강조 표시된 영역의 모드 메뉴를 열고 미리보기를 선택하세요. 캔버스가 이미 미리보기 중이면 튜토리얼이 자동으로 진행됩니다.
tutorial.basic.step.export.action=Live2D 모델 내보내기…를 클릭해 옵션을 엽니다. 실제로 파일을 내보내려면 해당 대화 상자에서 출력 설정을 확정하세요. Spine이나 동영상 등 다른 형식은 파일 → 다른 형식으로 내보내기에 있습니다.
tutorial.basic.targetMissing=대상이 아직 표시되지 않았습니다. PSD를 불러오지 않았다면 이전 단계로 돌아가 가져오거나, 이 단계를 건너뛰거나, 종료 후 다시 시작하세요.
tutorial.catalog.title=대화형 튜토리얼 목록
tutorial.common.continueNext=계속: {0}
