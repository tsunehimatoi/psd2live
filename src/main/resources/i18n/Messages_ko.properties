help.links.intro=PSD2Live는 오픈 소스 Live2D 자동 리깅 솔루션입니다. 커뮤니티에 참여하거나, 버그를 보고하거나, 기여해 주세요:
help.links.github.title=GitHub 저장소
help.links.github.desc=전체 소스 코드를 살펴보고, 프로젝트에 스타를 누르고, 풀 리퀘스트를 제출하고, 토론에 참여하세요.
help.links.issues.title=이슈 트래커 및 피드백
help.links.issues.desc=버그, 크래시, 메시 결함을 발견했거나 기능 제안이 있으신가요? GitHub에 이슈를 등록해 주세요.
help.links.releases.title=릴리스 및 다운로드
help.links.releases.desc=포터블 ZIP 또는 데스크톱 설치 프로그램을 다운로드하고, 릴리스 노트와 버전 기록을 확인하세요.
help.links.docs.title=기술 및 알고리즘 문서
help.links.docs.desc=레이어 사양, 9축 얼굴 변형 수학, SDK 설정에 대한 자세한 문서를 읽어 보세요.
help.links.openInBrowser=브라우저에서 열기
help.links.copyUrl=링크 복사
help.links.copied=링크가 클립보드에 복사되었습니다!

help.about.tagline=PSD → 자동 메시 분할 / 디포머 구성 / 물리 리깅 → CMO3 + MOC3
help.about.license=라이선스: GNU General Public License v3.0 (GPL-3.0)
help.about.disclaimer=면책 조항: 이 소프트웨어는 명시적이든 묵시적이든 어떠한 종류의 보증도 없이 “있는 그대로” 제공됩니다. 저작자 및 기여자는 어떠한 청구나 손해에 대해서도 책임을 지지 않습니다.
help.about.sdkNotice=Live2D Cubism SDK 안내: 실시간 미리보기는 선택적으로 Live2D Cubism 5-r.5 Native SDK 셰이더를 지원합니다. Live2D 약관을 엄격히 준수하여, 이 프로젝트는 독점 SDK 바이너리를 포함하거나 배포하지 않습니다.
