canvas.start.welcome.desc=레이어가 나뉜 원화로 시작하거나 기존 프로젝트를 이어서 작업합니다. 작업 공간, 패널, 단축키는 에디터와 동일합니다.
canvas.start.section.start=시작
canvas.start.section.updates=새로운 기능
canvas.start.updates.desc=3.0의 새로운 기능: 도구 옵션 막대, 변형 모드의 정점 / 변 / 면 선택, 텍스처 작업 공간, 생성 결과 업데이트, 다양한 내보내기 형식. 항목을 선택하면 해당 대화형 튜토리얼로 이동합니다.
canvas.start.update.tools.title=도구 옵션 막대와 그룹화된 도구 모음
canvas.start.update.tools.desc=같은 종류의 도구는 한 칸에 묶이며, 현재 칸을 다시 클릭하거나 오른쪽 클릭하면 나머지가 펼쳐집니다. 옵션 막대의 값은 좌우로 끌어 조절하고, 1–5 키로 도구의 변형을 고릅니다.
canvas.start.update.deform.title=변형 모드의 정점 / 변 / 면
canvas.start.update.deform.desc=변형 모드도 편집 모드처럼 정점, 변, 면으로 메시를 선택합니다. 워프 디포머의 레벨은 정점과 베지어가 되었고, 베지어에서는 격자가 흐리게 표시됩니다.
canvas.start.update.texture.title=텍스처 작업 공간
canvas.start.update.texture.desc=아틀라스 페이지를 밀도로 색칠하고, 타일을 끌어 고정하며, 레이어마다 픽셀 밀도를 조정합니다. 가져온 원화는 원래 해상도를 유지합니다.
canvas.start.update.regenerate.title=생성 결과 업데이트
canvas.start.update.regenerate.desc=도구 → 생성 결과 업데이트로 현재 버전이 생성한 결과에 편집을 병합합니다. 생성 설정을 바꿔도 전체 히스토리를 다시 재생하지 않아 프로젝트가 더 빨리 열립니다.
canvas.start.update.export.title=더 많은 내보내기 형식과 PSD2Live 런타임
canvas.start.update.export.desc=파일 → 다른 형식으로 내보내기에 VTube Studio, 웹 플레이어, 이미지 시퀀스, GIF, MP4 등이 추가되었습니다. 오픈 런타임으로 브라우저와 Godot에서 모델을 재생할 수 있습니다.
