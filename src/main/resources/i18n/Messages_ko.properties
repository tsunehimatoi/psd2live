cli.usage=PSD2Live 3.3.1\n인수 없이 실행하면 데스크톱 GUI가 시작됩니다. 명령줄 모드:\n  psd2live --input character.psd [--output out] [옵션]\n\n옵션:\n  --lang en               인터페이스 언어: zh, en, ja, ko\n  --clear-user-data       설정, 작업 공간 저장소, 다운로드한 런타임을 삭제하고 종료\n  --atlas 4096            텍스처 페이지 크기 (256..16384)\n  --mesh-spacing 64       메시 샘플 간격 (2048 px 문서 기준 픽셀)\n  --mesh-pixels           메시 간격을 원본 픽셀 기준으로 측정\n  --mesh-wrap 0           감싸기 토폴로지: 이보다 좁은(메시 단위) 윤곽 틈을 닫아 가는 돌기를 하나의 외곽으로 묶음\n  --head-strength 1.0     머리 3D 회전 범위\n  --body-strength 1.0     몸 모션 범위\n  --mesh-only             텍스처 아틀라스와 메시만 내보내기\n  --no-deformers          디포머 계층을 생성하지 않음\n  --no-motions            모션 파일을 내보내지 않음\n  --no-physics            머리카락/눈 물리를 생성하지 않음\n  --no-cmo3               편집 가능한 CMO3를 내보내지 않음\n  --no-moc3               MOC3 런타임 파일 세트를 내보내지 않음\n  --no-json               프로젝트 메타데이터 JSON을 내보내지 않음

