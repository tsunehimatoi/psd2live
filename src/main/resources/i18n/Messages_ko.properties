help.manual.mcp.intro=로컬 MCP 서버(설정 → MCP)를 켜면 AI 에이전트나 스크립트가 아래 작업으로 이 페이지의 일을 할 수 있습니다. 전체 도구 구성에서는 각 작업이 같은 이름의 도구이고, 간결 구성에서는 오른쪽처럼 호출합니다. 요청에는 request_id와 project_id도 넣을 수 있으며 간결 구성에서는 자동으로 채워집니다. 작업을 펼치면 요청 필드가 보입니다.
