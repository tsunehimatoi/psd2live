tutorial.common.requireSelection=먼저 강조 표시된 계층에서 아트메시나 디포머를 선택한 후 계속하세요.
tutorial.common.requireLayer=먼저 계층에서 레이어를 선택한 후 페인트 단계를 계속하세요.
tutorial.common.hint.prerequisite=계속하기 전에 강조 표시된 항목을 선택하세요. 완료할 때까지 건너뛰기가 비활성화됩니다.
tutorial.common.progress.prepare=시작하기 전에
tutorial.common.hint.required=완료하면 자동으로 진행됩니다. 튜토리얼을 종료할 수도 있습니다.
tutorial.common.step.openModel.title=먼저 모델 열기
tutorial.common.step.openModel.body=이 챕터는 작업 공간의 모델을 사용합니다. 레이어가 있는 PSD를 가져오거나 저장된 .psd2live 프로젝트를 여세요. 미리보기가 준비되면 학습이 계속됩니다. 큰 파일은 시간이 조금 걸릴 수 있습니다.
tutorial.common.step.openModel.action=강조 표시된 파일 메뉴에서 새로 만들기 → PSD에서 새 프로젝트… 또는 프로젝트 열기를 선택하세요. 가져오기를 단계별로 배우려면 종료 후 기본 워크플로를 시작하세요.
tutorial.basic.step.naming.title=프리셋 이름 짓기 팁
tutorial.basic.step.naming.body=일부 레이어는 이름으로 프리셋에 자동 매칭됩니다: eye_close, mouth_close, tooth_t / tooth_b, tongue. 윗속눈썹만 그리고, 입은 최대로 벌린 상태로, 몸은 바인딩을 위해 똑바로 선 자세로 그리세요.
tutorial.basic.step.naming.action=레이어 이름을 태그 열과 비교한 후 다음을 선택하세요.
tutorial.variants.step.toggleWhy.title=토글 차분이 필요한 이유
tutorial.variants.step.toggleWhy.body=토글은 파라미터로 레이어 하나의 표시 여부를 제어합니다. 홍조, 눈물, 안경, 빛 오버레이 등에 사용합니다. 파라미터를 드래그하면 표시/숨기기가 전환됩니다.
tutorial.variants.step.toggleSetup.title=토글 설정
tutorial.variants.step.toggleSetup.body=차분을 토글로 설정하고 파라미터 열에 파라미터 이름(예: blush)을 입력합니다. 같은 이름으로 여러 토글 레이어를 제어할 수 있습니다.
tutorial.variants.step.toggleSetup.action=한 행을 토글로 설정하고 파라미터를 입력(또는 확인만)한 후 다음을 선택하세요.
tutorial.variants.step.switchWhy.title=전환 차분이 필요한 이유
tutorial.variants.step.switchWhy.body=전환 차분은 여러 모습 중 하나를 고릅니다. 한 번에 하나의 ID만 표시되며 표정, 포즈, 의상 등에 사용합니다.
tutorial.variants.step.switchSetup.title=전환 설정
tutorial.variants.step.switchSetup.body=관련 행을 전환으로 설정하고 같은 파라미터 이름을 지정한 뒤 옆의 ID를 0, 1, 2…로 설정합니다. 예: expression: 0 기본 / 1 웃음.
tutorial.variants.step.switchSetup.action=두 행에 같은 이름과 서로 다른 ID를 설정(또는 확인만)한 후 다음을 선택하세요.
tutorial.parameters.step.findTab.title=파라미터 찾기
tutorial.parameters.step.findTab.body=오른쪽의 파라미터 도크 탭을 여세요. 필요하면 인스펙터 영역을 펼치세요.
tutorial.parameters.step.findTab.action=파라미터를 연 후 다음을 선택하세요.
tutorial.parameters.step.operate.title=파라미터 키 조작
tutorial.parameters.step.operate.body=슬라이더에서 왼쪽 드래그로 값을 조절하고, 키 표시에 마우스를 올린 채 오른쪽 클릭하면 해당 키에 스냅됩니다. 2D 패드도 같은 방식으로, 왼쪽 드래그로 자유롭게 움직이고 오른쪽 클릭으로 두 파라미터 키의 교차점에 스냅됩니다. 파라미터 키는 모델링 데이터이며 애니메이션 타임라인의 키프레임이 아닙니다.
tutorial.basic.title=기본 워크플로
tutorial.basic.desc=PSD를 가져와 미리보고, 레이어와 모델 프리셋을 조정한 후 CMO3 / MOC3로 내보냅니다.
tutorial.workspace.title=작업 공간과 유연한 레이아웃
tutorial.workspace.desc=최신 프리셋을 사용하고 캔버스와 모듈을 자유롭게 결합, 분할, 분리합니다.
tutorial.workspace.step.viewMenu.title=보기 옵션 메뉴
tutorial.workspace.step.viewMenu.body=캔버스 제목 표시줄의 보기는 메시, 디포머, 패스 표시 여부와 사용자 지정 캔버스 배경(체커/단색/투명)을 저장합니다. 캔버스마다 따로 유지됩니다.
tutorial.workspace.step.viewMenu.action=메뉴를 열어 항목을 살펴본 후 다음을 선택하세요.
tutorial.workspace.step.camera.title=확대/축소와 이동
tutorial.workspace.step.camera.body=스크롤로 확대/축소하고, {key:PAN_VIEW} 또는 {kbd:Space}를 누른 채 드래그하여 화면을 이동합니다. {key:ZOOM_IN} / {key:ZOOM_OUT} / {key:ZOOM_RESET}로 확대/축소, {key:RESET_CAMERA}로 초기화, {key:FRAME_VIEW}로 선택 항목에 맞춥니다(나중에 학습).
tutorial.workspace.step.done.title=작업 공간 안내 완료
tutorial.workspace.step.done.body=다음으로 핵심 편집 화면인 계층 트리와 모드 바를 학습하세요.
tutorial.workspace.step.presets.title=현재 작업 공간 프리셋
tutorial.workspace.step.presets.body=새 프로젝트에는 편집, 메시, 리그, 애니메이션, 미리보기, 물리, 텍스처, 히스토리의 8가지 프리셋이 제공됩니다. 각 프리셋은 작업에 맞는 캔버스, 모듈, 분할 비율을 제공하며, “+”에서 빈 도크를 만들 수도 있습니다.
tutorial.workspace.step.presets.action=작업 공간 표시줄의 + 메뉴를 열어 프리셋을 살펴보세요. 새로 만들 필요는 없습니다.
tutorial.workspace.step.switch.title=작업 공간 전환 및 정리
tutorial.workspace.step.switch.body=상단의 각 탭은 독립된 레이아웃입니다. 클릭으로 전환하고, 가운데 클릭으로 닫고, 드래그로 순서를 바꿉니다. 컨텍스트 메뉴에서 이름 변경, 복제, 다른 탭 닫기, 프리셋 레이아웃 복원도 할 수 있습니다.
tutorial.workspace.step.switch.action=기존 작업 공간 간에 전환하거나 탭 하나를 드래그해 순서 변경을 확인하세요.
tutorial.workspace.step.texture.title=텍스처 작업 공간
tutorial.workspace.step.texture.body=텍스처 작업 공간에서는 아틀라스 페이지를 타일별 밀도에 따라 색을 입혀 표시하고, 선택한 레이어의 캔버스 크기, 원본 픽셀, 아틀라스 픽셀을 보여 줍니다. 타일을 드래그해 이동하고, 선택한 타일의 모서리를 드래그해 밀도를 바꾸며, 정렬로 메시에 맞춰 타일을 배치합니다. 보기 레일에서 캔버스를 아틀라스 픽셀과 원본 픽셀 간에 전환할 수 있습니다.
tutorial.workspace.step.dockTabs.title=모듈 자유 결합
tutorial.workspace.step.dockTabs.body=캔버스, 계층, 파라미터, 인스펙터, 애니메이션, 물리는 모두 도크 모듈입니다. 탭을 드래그해 순서를 바꾸거나 다른 탭 표시줄의 탭 사이에 삽입할 수 있습니다.
tutorial.workspace.step.dockTabs.action=도크 탭을 드래그하고 같은 탭 표시줄 또는 다른 탭 표시줄에서 삽입 표시를 확인하세요.
tutorial.workspace.step.split.title=가장자리에 놓아 분할
tutorial.workspace.step.split.body=드래그하는 동안 대상의 위, 아래, 왼쪽, 오른쪽 가장자리가 놓기 영역이 됩니다. 놓으면 분할이 생기며, 구분선을 드래그해 크기를 조절합니다. 캔버스와 패널 모두 같은 규칙을 따릅니다.
tutorial.workspace.step.float.title=별도 창으로 분리
tutorial.workspace.step.float.body=모듈을 메인 창 밖으로 드래그하면 분리됩니다. 제목 표시줄에서 도크로 되돌릴 수 있으며, 가운데 클릭으로 탭을 닫고, 창 메뉴에서 닫은 모듈을 다시 표시할 수 있습니다.
tutorial.workspace.step.memory.title=레이아웃은 작업 공간별로 저장
tutorial.workspace.step.memory.body=탭 그룹, 분할 비율, 플로팅 상태, 캔버스 모드, 보기 옵션은 작업 공간별로 저장됩니다. 레이아웃 재설정은 이 작업 공간의 프리셋만 복원하며 모델 내용은 변경하지 않습니다.
tutorial.workspace.step.sidebars.title=오른쪽 위 사이드바 컨트롤
tutorial.workspace.step.sidebars.body=제목 표시줄에는 현재 레이아웃에 따라 왼쪽, 위, 아래, 오른쪽 사이드바 버튼이 표시됩니다. 버튼은 해당 방향에 모듈이 있을 때만 나타나며, 강조된 가장자리가 방향을 나타내고 툴팁에 모듈 목록이 표시됩니다.
tutorial.workspace.step.sidebars.action=강조 표시된 레이아웃 버튼을 클릭해 사이드바를 접은 후 다시 클릭해 복원하세요. 모델이나 레이아웃 구조는 삭제되지 않습니다.
tutorial.hierarchy.title=계층 및 모드 바
tutorial.hierarchy.desc=왼쪽 계층 트리, 레이어 가져오기, 그리기 순서 눈금자, 임시 세션 이름이 표시되는 모드 바.
tutorial.hierarchy.step.openTree.title=계층 열기
tutorial.hierarchy.step.openTree.body=트리는 디포머/아트메시의 부모 관계를 보여 줍니다. 루트에는 모델 계층과 개수가 표시됩니다.
tutorial.hierarchy.step.toolbar.title=검색 및 펼치기
tutorial.hierarchy.step.toolbar.body=상단 바에서 디포머/레이어를 검색하고 모두 펼치거나 접을 수 있습니다. 트리 전용 단축키는 없으므로 이 UI를 사용하세요.
tutorial.hierarchy.step.treeBody.title=행과 선택 동기화
tutorial.hierarchy.step.treeBody.body=눈 아이콘으로 표시 여부를 전환하고, 부모 배지는 상위 항목을 나타냅니다. 트리에서 선택하면 캔버스에 강조 표시됩니다.
tutorial.hierarchy.step.treeBody.action=노드를 선택하고 캔버스를 확인한 후 다음을 선택하세요.
tutorial.hierarchy.step.dragParent.title=드래그로 부모 변경
tutorial.hierarchy.step.dragParent.body=다른 디포머 위로 드래그하면 부모가 바뀌고, 루트로 이동 위에 놓으면 루트로 이동합니다. 트리에 투명 이미지를 놓으면 레이어를 가져오며(다음 단계), 이는 부모 변경과 다른 동작입니다.
tutorial.hierarchy.step.contextDeformer.title=디포머 컨텍스트 메뉴
tutorial.hierarchy.step.contextDeformer.body=부모 워프, 자식 워프, 부모 회전 디포머 추가, 레이어 가져오기, 루트로 이동, 분기 펼치기/접기, 삭제(자식은 위로 이동)를 할 수 있습니다.
tutorial.hierarchy.step.contextLayer.title=레이어 컨텍스트 메뉴
tutorial.hierarchy.step.contextLayer.body=솔로, 그리기 순서, 메시 설정, 부모 디포머/패스 추가, 레이어 가져오기, 삭제. 솔로는 편집 중 임시 표시이며 파라미터로 제어하는 차분이 아닙니다.
tutorial.hierarchy.step.importLayer.title=레이어 가져오기
tutorial.hierarchy.step.importLayer.body=PNG / WebP / TIFF / BMP를 트리 노드에 놓거나 컨텍스트 메뉴의 레이어 가져오기…를 사용하세요. 새 레이어는 해당 노드 아래(레이어인 경우 그 부모 디포머 아래)에 추가되고 배치 세션이 열립니다.
tutorial.hierarchy.step.placeSession.title=배치 세션
tutorial.hierarchy.step.placeSession.body=가져오기나 생성 후 왼쪽 아래에 배치 패널이 나타납니다. 확정하거나 {key:CANCEL}을 누를 때까지 캔버스 클릭은 세션이 처리합니다. 모드 바에는 임시 세션 이름(예: 레이어 배치)이 표시됩니다. 배치한 레이어를 확정하면 오브젝트 모드로 돌아갑니다.
tutorial.hierarchy.step.drawOrder.title=그리기 순서 눈금자
tutorial.hierarchy.step.drawOrder.body=스크롤로 눈금자를 확대/축소하고, 드래그로 순서를 바꾸며, 더블 클릭으로 값을 입력합니다. 인스펙터 및 컨텍스트 메뉴와 같은 속성입니다.
tutorial.hierarchy.step.modeBar.title=계층 모드 바
tutorial.hierarchy.step.modeBar.body=왼쪽 위의 모드 메뉴에 모든 캔버스 모드가 나열됩니다: 선택, 변형, 편집, 시뮬레이션, 스켈레톤, 페인트, 미리보기(메뉴가 열려 있을 때 1-7로 선택). 대상이 없으면 partFirst/layerFirst 안내가 표시됩니다. 모드를 바꾸면 보기 프리셋이 적용됩니다. 배치 세션 중에는 모드 메뉴 옆에 세션 이름이 표시됩니다.
tutorial.hierarchy.step.modeBar.action=모드 메뉴를 열어 각 모드를 살펴본 후 다음을 선택하세요.
tutorial.hierarchy.step.modeExtras.title=모드별 추가 기능
tutorial.hierarchy.step.modeExtras.body=변형에는 워프의 정점/베지어 레벨이 있고, 편집은 그리드 크기를 표시하며, 페인트에는 전경색/배경색과 적용/취소가 있습니다. 임시 세션에서는 세션 이름 칩이 추가됩니다.
tutorial.hierarchy.step.gesturePreview.title=선택 조작 미리보기
tutorial.hierarchy.step.gesturePreview.body=오브젝트 모드: 클릭, {kbd:Shift} 추가, {kbd:Alt} 제외, {kbd:Ctrl} +클릭으로 계층 순회, 드래그로 영역 선택, {key:SELECT_ALL}, {key:CANCEL}. 다음 강의에서 연습합니다.
tutorial.hierarchy.step.done.title=계층 강의 완료
tutorial.hierarchy.step.done.body=계층, 그리기 순서, 모드 바를 모두 익혔습니다. 현재 코스의 다음 강의로 계속하세요.
tutorial.variants.title=차분
tutorial.variants.desc=차분 종류: 차분 없음, 토글 차분, 전환 차분.
tutorial.variants.step.types.title=차분 종류
tutorial.variants.step.types.body=차분 열: 차분 없음(태그의 부위를 자동으로 리깅), 토글(파라미터로 표시/숨기기), 전환(상호 배타적인 모습). 다음으로 토글과 전환을 배웁니다.
tutorial.variants.step.done.title=차분 완료
tutorial.variants.step.done.body=소재와 배치로 계속하세요.
tutorial.layout.title=소재와 배치
tutorial.layout.desc=소재를 가져와 배치하고 태그를 붙여 리그를 생성한 뒤, 더 추가하고 다시 생성합니다.
tutorial.layout.step.workspace.title=레이아웃 작업 공간
tutorial.layout.step.workspace.body=레이아웃은 왼쪽에 소재 브라우저, 가운데 오브젝트 모드 편집 캔버스, 오른쪽에 태그가 있는 레이어 표를 둡니다. 시작 페이지의 레이아웃 프로젝트(「파일 > 새로 만들기 > 새 레이아웃 프로젝트」로도 열림)에서 빈 캔버스로 시작할 수 있습니다. 먼저 배치하고 리그는 필요할 때 생성합니다.
tutorial.layout.step.import.title=소재 가져오기
tutorial.layout.step.import.body=이미지·PSD·CMO3의 이미지·SVG·폴더 전체를 가져오거나 패널에 끌어다 놓습니다. PSD는 레이어별 폴더가 되며 각 레이어는 원래 위치를 유지합니다. 소재는 프로젝트에 저장되고 모든 변경은 되돌릴 수 있습니다.
tutorial.layout.step.import.action=파일을 가져오거나 소재 패널에 끌어다 놓은 뒤 다음을 선택하세요.
tutorial.layout.step.browse.title=둘러보기와 정리
tutorial.layout.step.browse.body=폴더가 먼저, 그다음 소재가 격자나 목록으로 표시됩니다. 폴더는 더블클릭으로 열고 경로 표시줄로 돌아갑니다. 소재를 폴더로 끌면 이동합니다. 소재를 더블클릭하면 별도 창에서 열려 확대해 보고, 그리고, 색을 조정할 수 있습니다. 오른쪽 클릭으로 새 폴더, 이름 변경, PSD 내보내기, SVG 텍스처 해상도를 설정합니다. 폴더의 태그는 거기서 배치한 모든 레이어에 붙습니다.
tutorial.layout.step.place.title=캔버스에 배치
tutorial.layout.step.place.body=소재나 폴더 전체를 캔버스로 끌거나, 오른쪽 클릭으로 배치합니다. 오브젝트 모드의 변형 상자로 이동, 크기 조절, 반전합니다. 픽셀은 리샘플링되지 않으므로 사각형이 작을수록 텍스처 밀도가 높아집니다.
tutorial.layout.step.place.action=소재를 배치하고 움직인 뒤 다음을 선택하세요.
tutorial.layout.step.tags.title=의미 태그
tutorial.layout.step.tags.body=각 레이어에는 태그가 있습니다. 부위와 좌우 단어가 생성기에 무엇인지 알려 줍니다(머리카락+앞은 앞머리, 눈+눈동자+왼쪽은 왼쪽 눈동자). 그 밖의 단어는 사용자 표시입니다. 토글·전환 차분은 별도 열에 있습니다.
tutorial.layout.step.tags.action=레이어의 태그를 클릭해 추가하거나 바꾼 뒤 다음을 선택하세요.
tutorial.layout.step.replace.title=이미지 교체
tutorial.layout.step.replace.body=레이어를 선택하고 소재를 오른쪽 클릭해 「교체」: 캔버스의 위치와 크기는 그대로이고 픽셀과 아틀라스 타일만 바뀝니다. 생성된 레이어는 리그를 유지하며 다음 생성 때 새 픽셀로 메시를 다시 만들 수 있습니다.
tutorial.layout.step.generate.title=리그 생성
tutorial.layout.step.generate.body=캔버스 오른쪽 위 막대에 생성 대기 항목이 표시됩니다. 「생성」은 배치한 레이어와 태그로 리그를 만듭니다. 그 전에는 일반 메시이며 리그 편집은 생성 후에 할 수 있습니다.
tutorial.layout.step.generate.action=「생성」을 누른 뒤 다음을 선택하세요.
tutorial.layout.step.again.title=더 추가하고 다시 생성
tutorial.layout.step.again.body=생성 후 배치한 레이어와 바뀐 태그는 다음 생성을 기다립니다. 그동안은 일반 메시이며 내보내기에도 포함되지 않습니다. 「다시 생성」은 이를 리그에 합치고 키폼·워프·물리·흔들림·뼈대·Glue를 유지합니다.
tutorial.layout.step.done.title=소재와 배치 완료
tutorial.layout.step.done.body=파라미터와 키폼으로 계속하세요.
tutorial.parameters.title=파라미터 및 키폼
tutorial.parameters.desc=파라미터 패널을 찾아 값을 변경하고 파라미터 키, 키폼, 2D 링크를 읽는 방법을 배웁니다.
tutorial.parameters.step.panel.title=파라미터 패널
tutorial.parameters.step.panel.body=차분과 변형을 제어하는 파라미터를 검색, 잠금, 재설정하고 폴더로 정리할 수 있습니다.
tutorial.parameters.step.drag.title=파라미터 드래그
tutorial.parameters.step.drag.body=슬라이더로 편집/미리보기 포즈를 업데이트하여 차분과 움직임 범위를 확인합니다.
tutorial.parameters.step.drag.action=파라미터를 드래그한 후 다음을 선택하세요.
tutorial.parameters.step.keys.title=파라미터 키와 키폼
tutorial.parameters.step.keys.body=파라미터 옆의 표시는 선택한 오브젝트가 키를 가진 위치를 나타냅니다. 각 키는 형태, 즉 키폼을 저장합니다. 둥근 표시는 일반 키로 키 사이가 보간되며, 사각형 표시는 블렌드 셰이프 키로 기본 형태 위에 형태 차이를 더합니다.
tutorial.parameters.step.link.title=파라미터 링크
tutorial.parameters.step.link.body=일부 파라미터는 2D 링크(XY 패드)를 구성합니다. 조합된 제어가 필요할 때 링크 컨트롤을 사용하세요. 지금 완전히 익힐 필요는 없습니다.
tutorial.parameters.step.done.title=파라미터 완료
tutorial.parameters.step.done.body=이제 파라미터, 파라미터 키, 키폼을 읽을 수 있습니다. 현재 코스의 다음 강의로 계속하세요.
tutorial.select.title=오브젝트 모드
tutorial.select.desc=선택 도구, 오브젝트 조작, 트리/캔버스 동기화.
tutorial.select.step.mode.title=오브젝트 모드 진입
tutorial.select.step.mode.body=모드 메뉴에서 오브젝트를 고르거나 {key:TOOL_SELECT}를 눌러 선택 도구를 사용하세요.
tutorial.select.step.mode.action=오브젝트 모드인지 확인한 후 다음을 선택하세요.
tutorial.select.step.tools.title=선택 도구
tutorial.select.step.tools.body=클릭 선택 {key:TOOL_SELECT}, 올가미 {key:TOOL_LASSO_SELECT}, 브러시 선택 {key:TOOL_BRUSH_SELECT}. 왼쪽 도구 모음은 같은 종류의 도구를 한 칸에 묶고 마지막으로 쓴 도구를 표시합니다. 현재 칸을 다시 클릭하거나 오른쪽 클릭하면 옆에 나머지 도구가 펼쳐집니다. 오브젝트 모드의 마지막 칸에서는 워프, 회전 디포머, 패스를 만듭니다.
tutorial.select.step.tools.action=선택 도구를 전환한 후 다음을 선택하세요.
tutorial.select.step.gestures.title=오브젝트 조작
tutorial.select.step.gestures.body=클릭 선택 · {kbd:Shift} 추가 · {kbd:Alt} 제외 · {kbd:Ctrl} +클릭으로 계층 순회 · 드래그로 영역 선택 · {key:SELECT_ALL} · {key:CANCEL}.
tutorial.select.step.sync.title=트리와 캔버스 동기화
tutorial.select.step.sync.body=선택은 계층과 동기화됩니다. {key:FRAME_VIEW}로 선택 항목에 화면을 맞춥니다.
tutorial.select.step.sync.action=트리와 캔버스에서 선택해 보고 F도 눌러 본 후 다음을 선택하세요.
tutorial.select.step.extras.title=영역 선택 방식 및 연결 선택
tutorial.select.step.extras.body={key:SELECTION_STYLE_BOX} / {key:SELECTION_STYLE_LASSO}로 사각형/올가미 방식을 전환하고, {key:SELECT_LINKED}로 연결된 점을 선택합니다. {key:TEMPORARY_SELECT}를 누르고 있으면 다른 도구에서 일시적으로 선택할 수 있으며 손을 떼면 원래 도구로 돌아갑니다. {key:QUICK_PREVIEW}로 빠른 미리보기를 전환합니다. 캔버스 컨텍스트 메뉴는 모드에 따라 달라집니다.
tutorial.select.step.done.title=오브젝트 모드 완료
tutorial.select.step.done.body=디포머 생성으로 계속하세요.
tutorial.create.title=디포머 생성
tutorial.create.desc=계층에서 선택하고, 컨텍스트 메뉴에서 생성한 후, 배치 패널에서 확정합니다.
tutorial.create.step.selectFirst.title=먼저 계층에서 선택
tutorial.create.step.selectFirst.body=생성하기 전에 트리에서 아트메시나 디포머를 선택하세요. 선택 항목이 있을 때까지 이 강의는 진행되지 않습니다.
tutorial.create.step.selectFirst.action=강조 표시된 트리에서 대상을 선택하세요.
tutorial.create.step.contextDeformer.title=디포머에서 생성
tutorial.create.step.contextDeformer.body=디포머를 오른쪽 클릭하여 부모/자식 워프 또는 회전을 추가합니다. 생성하면 배치 세션이 열립니다.
tutorial.create.step.contextDeformer.action=디포머를 오른쪽 클릭해 생성 항목을 살펴보세요(취소해도 됩니다).
tutorial.create.step.contextLayer.title=레이어에서 생성
tutorial.create.step.contextLayer.body=레이어를 오른쪽 클릭하여 부모 워프/회전을 추가하거나, 메시가 있는 아트에 변형 패스를 추가합니다. 이어서 배치를 확정합니다.
tutorial.create.step.contextLayer.action=레이어를 오른쪽 클릭해 추가 항목을 살펴보세요.
tutorial.create.step.placement.title=왼쪽 아래 배치 패널
tutorial.create.step.placement.body=생성 후 왼쪽 아래 패널에서 이름, 관계, 크기/방향을 편집합니다. {key:FINISH_PATH}로 확정, {key:CANCEL}로 취소합니다. 세션이 캔버스를 점유하며 모드 바에 임시 이름이 표시됩니다.
tutorial.create.step.placement.action=패널, 세션 점유, 확정/취소를 확인한 후 다음을 선택하세요.
tutorial.create.step.done.title=생성 완료
tutorial.create.step.done.body=변형 모드로 계속하세요.
tutorial.deform.title=변형 모드
tutorial.deform.desc=정점 / 베지어 레벨, 점 선택, 변형 브러시, 축 고정, 파라미터 키의 키폼.
tutorial.deform.step.enter.title=변형 모드 진입
tutorial.deform.step.enter.body=편집할 아트메시/디포머를 선택한 후 변형 모드로 들어가세요. 선택한 항목이 없으면 먼저 트리에서 선택하세요.
tutorial.deform.step.enter.action=대상을 선택한 후 변형 모드로 들어가세요.
tutorial.deform.step.levels.title=정점과 베지어
tutorial.deform.step.levels.body=대상이 워프 디포머이면 모드 막대에 두 레벨이 표시됩니다. 정점은 격자점을 편집하고, 베지어는 앵커와 핸들로 격자 전체를 구부립니다(격자점은 흐리게 표시되며 편집할 수 없음). {key:PICK_OPTION_1} / {key:PICK_OPTION_2}로 전환합니다. 대상이 메시이면 모드 막대의 정점 / 변 / 면이 편집 모드처럼 선택 방식을 정합니다.
tutorial.deform.step.levels.action=정점과 베지어를 전환해 본 후 다음을 선택하세요.
tutorial.deform.step.brushes.title=변형 브러시
tutorial.deform.step.brushes.body=브러시 {key:TOOL_BRUSH}, 스무드 {key:TOOL_SMOOTH}, 부풀리기 {key:TOOL_INFLATE} — 또는 점을 직접 드래그합니다.\n중요: {kbd:Alt}를 누른 채 오른쪽 드래그하면 브러시 반경/경도를 실시간으로 조절합니다(축마다 다른 값에 대응).
tutorial.deform.step.brushes.action=브러시를 사용해 보고 {kbd:Alt}+오른쪽 드래그로 반경을 한 번 조절해 보세요.
tutorial.deform.step.shortcuts.title=반경과 축
tutorial.deform.step.shortcuts.body={key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP} 반경, {key:BRUSH_HARDNESS_DOWN} {key:BRUSH_HARDNESS_UP} 경도, {key:AXIS_CONSTRAIN_X} / {key:AXIS_CONSTRAIN_Y} 축 고정. 실시간 조절에는 {kbd:Alt}+오른쪽 드래그를 권장합니다.
tutorial.deform.step.keys.title=파라미터 키의 키폼
tutorial.deform.step.keys.body=편집할 키로 파라미터를 옮긴 다음 아트메시나 디포머를 조정합니다. 키 사이의 형태는 보간되어 고개 돌리기, 눈·입 여닫기 같은 움직임이 됩니다.
tutorial.deform.step.undo.title=실행 취소 / 다시 실행
tutorial.deform.step.undo.body={key:UNDO} 실행 취소, {key:REDO} 다시 실행. 조작 도중에 모드를 전환하지 마세요.
tutorial.deform.step.done.title=변형 모드 완료
tutorial.deform.step.done.body=이어서 편집 모드에서 토폴로지를 배웁니다.
tutorial.edit.title=편집 모드
tutorial.edit.desc=분할, 정점 배치 등 안전한 토폴로지 편집.
tutorial.edit.step.enter.title=편집 모드 들어가기
tutorial.edit.step.enter.body=편집 모드는 메시를 항상 표시하며, 형태를 자유롭게 당기는 대신 토폴로지를 변경하는 데 사용합니다. 모드 막대의 정점 / 변 / 면({key:PICK_OPTION_1}–{key:PICK_OPTION_3})이 선택 도구가 고르는 요소를 정합니다.
tutorial.edit.step.enter.action=편집 모드로 들어간 다음 “다음”을 누르세요.
tutorial.edit.step.topo.title=분할과 정점 배치
tutorial.edit.step.topo.body=분할 {key:TOOL_SUBDIVIDE}, 정점 배치 {key:TOOL_MESH_POINT}(선 {key:TOOL_KNIFE}). 메시 점을 드래그해 토폴로지를 다듬고, "선"으로 경로를 따라 이어진 변을 추가합니다.
tutorial.edit.step.delete.title=점 삭제
tutorial.edit.step.delete.body={key:DELETE_SELECTION}으로 선택한 점을 삭제합니다. 큰 편집 전에는 선택 범위를 확인하세요.
tutorial.edit.step.viewAids.title=보기 보조
tutorial.edit.step.viewAids.body=오른쪽 아래 보기 바나 보기 메뉴에서 변형 경로를 표시해 토폴로지를 편집하면서 비교할 수 있습니다.
tutorial.edit.step.when.title=토폴로지를 편집할 때
tutorial.edit.step.when.body=메시가 너무 거칠 때 편집 모드를 사용합니다. 평소의 형태 조정은 변형 모드에서 합니다.
tutorial.edit.step.done.title=편집 모드 완료
tutorial.edit.step.done.body=변형과 토폴로지 편집의 역할 구분을 이해했습니다. 현재 코스를 계속 진행합니다.
tutorial.paint.title=페인트 모드
tutorial.paint.desc=페인트 도구, 세션 적용/취소, 페인트 실행 취소.
tutorial.paint.step.layerFirst.title=먼저 레이어 선택
tutorial.paint.step.layerFirst.body=페인트하려면 레이어를 선택해야 합니다. 선택하지 않으면 모드 바에서 먼저 레이어를 선택하라고 안내합니다.
tutorial.paint.step.layerFirst.action=레이어를 선택하고 페인트 모드로 들어간 다음 “다음”을 누르세요.
tutorial.paint.step.tools.title=페인트 도구
tutorial.paint.step.tools.body=브러시 {key:TOOL_PAINT_BRUSH}, 연필 {key:TOOL_PAINT_PENCIL}, 지우개 {key:TOOL_PAINT_ERASER}, 채우기 {key:TOOL_PAINT_BUCKET}, 스포이트 {key:TOOL_PAINT_EYEDROPPER}, 도형 {key:TOOL_PAINT_LINE}. 단축키는 도구 모음과 현재 키 설정을 따릅니다.
tutorial.paint.step.tools.action=페인트 도구를 전환한 다음 “다음”을 누르세요.
tutorial.paint.step.shortcuts.title=브러시 단축키
tutorial.paint.step.shortcuts.body=반경 {key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP}, 경도 {key:BRUSH_HARDNESS_DOWN} {key:BRUSH_HARDNESS_UP}, 불투명도 {key:PAINT_OPACITY_DOWN} {key:PAINT_OPACITY_UP}, 모양 전환 {key:PAINT_SHAPE_CYCLE}. 페인트에서는 {kbd:Alt}+오른쪽 드래그로 브러시 끝도 조정할 수 있습니다.
tutorial.paint.step.session.title=적용 또는 취소
tutorial.paint.step.session.body=페인트 세션에는 별도의 실행 취소가 있습니다. 모드 바에서 적용/취소를 선택하며, 적용하면 메시를 다시 생성할 수 있습니다.
tutorial.paint.step.return.title=형태 조정으로 돌아가기
tutorial.paint.step.return.body=수정을 마치면 선택 또는 변형 모드로 돌아가 기본 형태와 파라미터 키의 키폼을 조정합니다.
tutorial.paint.step.return.action=오브젝트 모드로 돌아간 다음 “다음”을 누르세요.
tutorial.paint.step.done.title=페인트 모드 완료
tutorial.paint.step.done.body=이어서 인스펙터를 배웁니다.
tutorial.inspector.title=인스펙터
tutorial.inspector.desc=유형별 속성과 세 가지 그리기 순서 입력 위치.
tutorial.inspector.step.open.title=인스펙터 열기
tutorial.inspector.step.open.body=아무것도 선택하지 않으면 비어 있고, 선택하면 해당하는 속성이 표시됩니다.
tutorial.inspector.step.open.action=인스펙터를 열고 대상을 선택한 다음 “다음”을 누르세요.
tutorial.inspector.step.artmesh.title=아트메시 속성
tutorial.inspector.step.artmesh.body=클리핑 마스크, 그리기 순서, 불투명도, 블렌드 모드, 컬링, 사용자 데이터 등.
tutorial.inspector.step.deformers.title=디포머 속성
tutorial.inspector.step.deformers.body=워프 디포머에는 베지어 분할 수와 편집 레벨이 있고, 회전 디포머와 변형 경로에는 각각 전용 항목(경로의 커브, 너비, 닫힘 여부 등)이 있습니다.
tutorial.inspector.step.drawOrder.title=그리기 순서의 세 가지 입력 위치
tutorial.inspector.step.drawOrder.body=인스펙터, 트리의 컨텍스트 메뉴, 눈금자는 같은 속성을 편집합니다.
tutorial.inspector.step.done.title=인스펙터 완료
tutorial.inspector.step.done.body=이제 오브젝트 유형별로 속성을 찾을 수 있습니다. 현재 코스의 다음 강의로 계속합니다.
tutorial.tools.title=도구 옵션
tutorial.tools.desc=도구 옵션 막대, 컨텍스트 메뉴, '도구 상세' 패널의 역할과 단축키 대응.
tutorial.tools.step.open.title=도구 옵션 막대
tutorial.tools.step.open.body=캔버스 왼쪽 아래의 도구 옵션 막대는 현재 도구에 따라 바뀝니다. 값을 좌우로 끌어 조절하거나 클릭해 슬라이더를 엽니다. 캔버스를 오른쪽 클릭하면 같은 값과 도구 동작이 있습니다.
tutorial.tools.step.open.action=부품을 선택해 막대에 옵션이 보이게 한 뒤 “다음”을 누르세요.
tutorial.tools.step.brushes.title=브러시 파라미터
tutorial.tools.step.brushes.body=변형 브러시와 페인트 브러시는 크기/경도를 공유하며, {key:BRUSH_RADIUS_DOWN} {key:BRUSH_RADIUS_UP}도 같은 값을 조정합니다.
tutorial.tools.step.split.title=도구 모음, 막대, 메뉴
tutorial.tools.step.split.body=왼쪽 도구 모음에서 도구를 고릅니다. 같은 종류의 도구는 한 칸에 묶이며, 현재 칸을 다시 클릭하거나 오른쪽 클릭하면 나머지가 펼쳐집니다. 도구의 변형(브러시 팁, 그리기 도형, 하위 도구)은 옵션 막대 앞쪽에 아이콘으로 표시되며 {key:PICK_OPTION_1}–{key:PICK_OPTION_5}로 고릅니다. 왼쪽 아래의 도구 옵션 막대로 조절하고, 모드 막대로 작업 모드를 고르며 진행 중인 단계의 확인과 취소도 여기에 표시됩니다. 캔버스를 오른쪽 클릭하면 같은 값이 나오고, 긴 명령 그룹은 메뉴 옆에 두 번째 창으로 열립니다.
tutorial.tools.step.advanced.title=고급 설정
tutorial.tools.step.advanced.body='도구 상세' 패널에는 넓은 공간이 필요한 설정이 남습니다: 숫자 변형, 만들기 기본값, 패스 목록, 본 바인딩과 웨이트, 페인트 팔레트.
tutorial.tools.step.shortcuts.title=단축키 프리셋
tutorial.tools.step.shortcuts.body=설정 → 단축키에서 Photoshop / Blender / Cubism 프리셋이나 사용자 지정 키로 바꿀 수 있습니다. 튜토리얼의 키 표시는 현재 키 설정을 따릅니다.
tutorial.tools.step.done.title=도구 옵션 완료
tutorial.tools.step.done.body=도구 모음, 도구 옵션 막대, 컨텍스트 메뉴, '도구 상세' 패널의 역할을 알았습니다. 다음은 본 리깅과 포즈입니다.
tutorial.project.title=프로젝트와 히스토리
tutorial.project.desc=.psd2live 저장, 최근 파일, 히스토리 작업 공간, 분기, 생성 결과 업데이트.
tutorial.project.step.save.title=프로젝트 저장
tutorial.project.step.save.body={key:SAVE_PROJECT} 저장, {key:SAVE_PROJECT_AS} 다른 이름으로 저장. 프로젝트는 PSD, 히스토리, UI 상태를 담은 암호화되지 않은 ZIP입니다. 파일 → 최근 파일 열기와 시작 페이지에 최근에 연 프로젝트와 PSD가 표시되며, 더 이상 없는 파일은 표시되지 않습니다.
tutorial.project.step.historyTab.title=히스토리 탭과 프리셋
tutorial.project.step.historyTab.body={key:OPEN_HISTORY_TAB}으로 히스토리 탭을 열거나, 전용 히스토리 작업 공간 프리셋으로 전환합니다. 프로젝트를 저장하거나 Agent(MCP)가 편집할 때 내용이 바뀌었으면 새 노드가 기록됩니다.
tutorial.project.step.historyTab.action=강조 표시된 히스토리 탭을 클릭하세요(또는 단축키 사용).
tutorial.project.step.restore.title=버전 복원과 검색
tutorial.project.step.restore.body=노드 카드를 더블클릭하면 해당 버전으로 바로 체크아웃합니다. 도구 모음에는 검색 필터가 있으며, 다른 분기를 삭제하지 않고 HEAD까지의 전체 분기 경로를 강조 표시합니다.
tutorial.project.step.branch.title=분기
tutorial.project.step.branch.body=이전 노드에서 편집하면 분기가 생깁니다. 노드의 이름 변경, 메모, 숨기기가 가능합니다(데이터는 유지).
tutorial.project.step.regenerate.title=생성 결과 업데이트
tutorial.project.step.regenerate.body=프로젝트는 편집의 바탕이 된 생성 결과를 저장하므로 PSD2Live를 업그레이드해도 저절로 바뀌지 않습니다. 새 버전의 생성기를 쓰려면 모델 → 생성 결과 업데이트를 선택하세요. 다시 생성한 결과에 편집을 병합하며, 옮기지 못한 내용은 품질 보고서에 표시됩니다.
tutorial.project.step.done.title=프로젝트 강의 완료
tutorial.project.step.done.body=선택 사항: 텍스처 고해상도화로 진행하거나 목록을 다시 엽니다.
tutorial.upscale.title=텍스처 고해상도화
tutorial.upscale.desc=AI로 텍스처를 고해상도화한 뒤 메시와 내보내기를 다시 확인합니다.
tutorial.upscale.step.entry.title=진입 경로
tutorial.upscale.step.entry.body=모델 → 텍스처 고해상도화…를 열거나 {key:TEXTURE_UPSCALE}을 누릅니다. 원본 그림의 해상도가 낮을 때 유용합니다.
tutorial.upscale.step.entry.action=강조 표시된 모델 메뉴에서 텍스처 고해상도화…를 클릭하세요.
tutorial.upscale.step.scale.title=배율
tutorial.upscale.step.scale.body=보통 2× / 4×를 사용합니다. 픽셀이 조밀해지면 메시가 보이는 방식이 달라질 수 있습니다.
tutorial.upscale.step.check.title=재확인과 내보내기
tutorial.upscale.step.check.body=고해상도화 후 편집 모드에서 메시/디포머를 확인하고 미리보기로 검증한 다음 다시 내보냅니다.
tutorial.upscale.step.done.title=코스 완료
tutorial.upscale.step.done.body=현재 코스를 마쳤습니다. 도움말 → 튜토리얼의 목록에서 언제든 강의를 다시 열 수 있습니다.

# Tutorial learning paths and current canvas features
tutorial.path.beginner.title=Live2D가 처음인 경우
tutorial.path.beginner.desc=레이어 PSD, 파츠, 파라미터부터 시작해 편집, 모션, 물리, 내보내기까지 차례로 배웁니다. Cubism 경험이 없어도 됩니다.
tutorial.path.experienced.title=Live2D / Cubism 경험자
tutorial.path.experienced.desc=익숙한 아트메시, 디포머, 파라미터 개념을 PSD2Live에 대응시키고, 자동 생성, 캔버스 모드, 스켈레톤, 애니메이션, 물리를 중점적으로 배웁니다.
tutorial.path.start=이 코스 시작
tutorial.live2dBridge.title=Live2D 사용자용 안내
tutorial.live2dBridge.desc=Cubism 개념을 PSD2Live에 대응시키고 자동 생성 흐름을 이해합니다.
tutorial.live2dBridge.step.workspace.title=작업 공간 프리셋부터 시작
tutorial.live2dBridge.step.workspace.body=상단의 작업 공간은 작업별 레이아웃입니다. 편집, 메시, 리그, 애니메이션, 미리보기, 물리, 텍스처, 히스토리가 있습니다. 모두 하나의 프로젝트를 공유하며 캔버스와 도크 배치만 다르게 저장합니다.
tutorial.live2dBridge.step.structure.title=아트메시와 디포머
tutorial.live2dBridge.step.structure.body=가져온 PSD 레이어는 아트메시가 됩니다. PSD2Live의 워프 디포머와 회전 디포머는 Cubism의 것에 대응하며, 변형 경로는 PSD2Live의 실험적 도구로 내보낼 때 메시 키폼으로 베이크됩니다. 부모 관계가 변형의 상속을 결정하고, 겹침은 그리기 순서만으로 결정됩니다.
tutorial.live2dBridge.step.modes.title=캔버스 모드
tutorial.live2dBridge.step.modes.body=선택은 오브젝트를 조작하고, 변형은 파라미터 키에 키폼을 만들고, 편집은 메시 토폴로지를 바꾸고, 시뮬레이션은 천·머리카락 시뮬레이션이 읽는 정점 그룹을 페인트하고, 스켈레톤은 아마추어의 포즈를 잡거나 형태를 바꾸고, 페인트는 레이어 픽셀을 수정하고, 미리보기는 모델을 재생합니다. 모드 메뉴는 이 도구 컨텍스트들을 분리해 둡니다.
tutorial.live2dBridge.step.parameters.title=파라미터와 키폼
tutorial.live2dBridge.step.parameters.body=파라미터 도크는 Cubism의 파라미터에 해당합니다. 둥근 표시는 일반 키, 사각 표시는 블렌드 셰이프 키이며, 2D 링크는 두 파라미터를 동시에 조작합니다. 파라미터 키의 키폼은 모델링 데이터로, 애니메이션 타임라인의 키프레임과 혼동하지 마세요.
tutorial.live2dBridge.step.export.title=내보내기는 빌드 결과물
tutorial.live2dBridge.step.export.body=.psd2live는 PSD2Live의 원화, 편집 내용, 분기 히스토리를 저장합니다. CMO3는 Cubism Editor에서 계속 편집할 수 있는 모델 프로젝트입니다. 런타임 결과물은 MOC3와 model3.json, 텍스처, 그리고 활성화된 경우 물리 등의 파일입니다. 파일 → 다른 형식으로 내보내기에서는 VTube Studio, PSD2Live 런타임(웹 플레이어, Godot), 이미지 시퀀스와 동영상도 내보낼 수 있습니다. 내보내기 전에 프로젝트를 저장하세요.
tutorial.live2dBridge.step.done.title=개념 대응 완료
tutorial.live2dBridge.step.done.body=작업 공간을 빠르게 둘러본 다음, PSD2Live의 새로운 캔버스 기능에 집중합니다.
tutorial.skeleton.title=스켈레톤 리깅과 편집
tutorial.skeleton.desc=스켈레톤 모드에서 스켈레톤을 만들고 편집하며, 아트메시 일괄 바인딩, FK/IK 포즈, 스킨 가중치 페인트, 포즈 저장을 배웁니다.
tutorial.skeleton.step.panel.title=스켈레톤 도크
tutorial.skeleton.step.panel.body=스켈레톤은 PSD2Live의 빠른 팔다리 리깅 도구이며, Cubism 모델의 독립된 본 오브젝트가 아닙니다. 몸, 팔다리, 꼬리, 날개 체인을 만들 수 있고, 데이터를 지우지 않고 리그를 비활성화할 수도 있습니다.
tutorial.skeleton.step.panel.action=강조 표시된 스켈레톤 도크를 열고 스켈레톤 생성을 찾으세요.
tutorial.skeleton.step.mode.title=스켈레톤 모드
tutorial.skeleton.step.mode.body=모드 메뉴의 스켈레톤은 아마추어 전용입니다. 활성화된 스켈레톤이 있으면 본 포즈로, 없으면 본 편집으로 열립니다. 왼쪽 도구 모음에서 전환합니다. 포즈로 전환하거나 모드를 나가면 편집 내용이 저장되고, 취소하면 버려집니다.
tutorial.skeleton.step.mode.action=강조 표시된 모드 메뉴를 열고 스켈레톤을 찾으세요. 스켈레톤 없이 들어가면 새로 만들기를 제안합니다.
tutorial.skeleton.step.build.title=본 생성, 돌출, 정리
tutorial.skeleton.step.build.body=본 편집에는 하위 도구가 있습니다. 편집(관절 드래그, {kbd:Shift}-클릭이나 박스 선택으로 여러 본을 함께 이동·회전·크기 조절), 새 본(머리에서 꼬리로 드래그), 돌출(선택한 끝에서 자식 본을 연달아 뽑아냄), 바인딩, 가중치. 도구 상세에서는 본 이름 변경, 부모와 연결 설정, 복제, 미러(대칭 편집 포함), 세분화, 부모로 병합도 할 수 있습니다.
tutorial.skeleton.step.bind.title=캔버스에서 배치와 바인딩
tutorial.skeleton.step.bind.body=바인딩에서는 트리에서 대상 본을 고른 다음 메시를 클릭하거나 박스를 드래그해 미리 보고 여러 개를 한 번에 바인딩합니다({kbd:Shift}-박스로 추가). 기존 바인딩도 일괄로 해제할 수 있습니다.
tutorial.skeleton.step.pose.title=포즈와 IK
tutorial.skeleton.step.pose.body=본 포즈에는 자동, FK, IK가 있습니다. 자동에서는 본을 드래그해 회전하고, 끝점을 드래그하거나 {kbd:Shift}를 누르면 IK를 사용합니다. IK 설정에서 루트 본, 반복 횟수, 허용 오차, 굽힘 방향을 조정할 수 있으며, 선택한 끝 고정은 파라미터가 바뀌는 동안에도 계속 계산합니다. 포즈는 원본 메시를 편집하지 않고 파라미터를 구동합니다.
tutorial.skeleton.step.pose.action=스켈레톤 오버레이를 확인하고, 가능하면 끝점을 드래그해 보세요.
tutorial.skeleton.step.weights.title=스킨 가중치 페인트와 정리
tutorial.skeleton.step.weights.body=자동 가중치는 메시 토폴로지를 따라 부드럽게 퍼집니다. 직접 고치려면 가중치에서 바인딩된 메시와 같은 팔다리의 본을 고른 다음 더하기, 빼기, 대체, 부드럽게로 페인트합니다. 도구 상세에서는 정규화와 정리, 자동 가중치 복원, 그리고 삼각형 보간·최근접 정점·동일 토폴로지 방식으로 다른 메시에 가중치 복사와 미러를 할 수 있습니다. 포즈 중에 스킨 가중치를 표시해 관절을 확인하세요.
tutorial.skeleton.step.snapshots.title=포즈 저장과 재사용
tutorial.skeleton.step.snapshots.body=포즈 중에 도구 상세에서 현재 모델 파라미터를 이름을 붙여 저장하고 나중에 적용할 수 있습니다(같은 이름은 덮어쓰며, 값은 파라미터 범위로 제한됨). 애니메이션 편집기에서는 재생 헤드 위치에 저장한 포즈를 삽입할 수 있습니다.
tutorial.skeleton.step.sampling.title=파라미터 샘플링과 키폼 제한
tutorial.skeleton.step.sampling.body=스켈레톤 도크 하단에서 샘플링 허용 오차, 최소 각도 간격, 최대 메시 키폼 수를 설정합니다. 실시간 점 수로 전체와 선택한 본의 점을 미리 보여 주어 키폼이 과도하게 늘어나는 것을 막습니다.
tutorial.skeleton.step.sampling.action=스켈레톤 도크 하단의 파라미터 샘플링 섹션을 확인하세요.
tutorial.skeleton.step.done.title=스켈레톤 강의 완료
tutorial.skeleton.step.done.body=내보낼 때 본, 가중치, IK 결과는 Cubism 파라미터, 워프/회전 디포머, 메시 키폼으로 베이크되며, Cubism Editor에는 PSD2Live의 스켈레톤 정보가 남지 않습니다. 다음은 사용자 지정 모션을 만들고 미리 봅니다.
tutorial.animation.title=애니메이션과 모션 편집기
tutorial.animation.desc=모션 생성, 자동 키, 포즈 기록, 키 편집, 캔버스 미리보기를 배웁니다.
tutorial.animation.step.motions.title=모션 목록
tutorial.animation.step.motions.body=애니메이션 도크는 프리셋 모션과 사용자 지정 모션을 구분합니다. 각 프리셋에는 대기의 흔들림·호흡·머리·속도·눈 깜빡임, 끄덕임과 고개 젓기의 횟수 같은 전용 조절 항목이 있으며, 프로젝트와 함께 저장되어 키를 직접 편집하기 전까지 미리보기, 편집기, 내보내기에 똑같이 반영됩니다. 빈 모션을 만들거나 프리셋을 복사할 수 있고, 삭제한 프리셋은 새 모션 메뉴에서 되살릴 수 있습니다. 패널의 재생 버튼은 애니메이션 편집기와 같은 모션과 재생 헤드를 공유합니다.
tutorial.animation.step.motions.action=애니메이션 도크를 열고 모션을 선택하거나 만드세요.
tutorial.animation.step.editor.title=타임라인과 트랙
tutorial.animation.step.editor.body=편집기에서 파라미터 트랙을 추가합니다. 도프 시트로 타이밍을, 커브로 이징을 조정합니다. 트랙을 더블클릭하면 키가 추가되며, 트랙 이름 옆에 키 표시와 가이드가 나타납니다.
tutorial.animation.step.autoKey.title=자동 키
tutorial.animation.step.autoKey.body=도구 모음에서 자동 키를 켜세요. 파라미터 슬라이더, 2D 패드, 캔버스 포즈를 조정하면 재생 헤드 위치에 키프레임이 자동으로 기록되며, 트랙이 없던 파라미터도 모션 커브에 자동으로 추가됩니다.
tutorial.animation.step.autoKey.action=편집기 도구 모음의 자동 키 칩을 전환하거나, 재생 헤드에서 파라미터를 움직여 키를 자동 기록하세요.
tutorial.animation.step.keys.title=포즈 기록과 베지어 이징
tutorial.animation.step.keys.body=수동 모드에서는 먼저 파라미터로 포즈를 잡은 다음 포즈 기록을 클릭해 재생 헤드 위치에 값을 기록합니다. 키는 기본적으로 부드러운 베지어 보간이며, 트랙 이름 옆에 키프레임 표시가 나타납니다.
tutorial.animation.step.keys.action=재생 헤드를 옮겨 포즈를 기록하거나, 트랙을 더블클릭해 키를 추가하세요.
tutorial.animation.step.preview.title=캔버스 실시간 미리보기와 포즈 공유
tutorial.animation.step.preview.body=모션이 재생되는 동안 캔버스가 갱신됩니다. 작업 공간의 모든 캔버스는 같은 파라미터 포즈를 공유하므로, 애니메이션·미리보기·편집 모드를 오가도 포즈 상태가 동기화됩니다.
tutorial.animation.step.done.title=애니메이션 강의 완료
tutorial.animation.step.done.body=다음은 같은 미리보기 캔버스에서 진자와 출력 범위를 조정합니다.
tutorial.physics.title=캔버스에서 물리 조정
tutorial.physics.desc=물리 그룹을 만들고, 캔버스에서 진자를 조작하며 출력을 보정합니다.
tutorial.physics.step.groups.title=물리 그룹
tutorial.physics.step.groups.body=물리 도크는 프리셋, 스켈레톤, 흔들림, 사용자 지정 그룹과 시뮬레이션에서 베이크된 진자를 관리합니다. 그룹은 복제, 순서 변경, 비활성화, 초기화할 수 있습니다.
tutorial.physics.step.groups.action=물리 도크를 열고 그룹을 선택하거나 빈 진자를 만드세요.
tutorial.physics.step.pendulum.title=캔버스에서 진자 편집
tutorial.physics.step.pendulum.body=캔버스의 원은 진자의 마디입니다. 드래그해 길이를 바꾸고 클릭해 선택합니다. 마디 옆의 출력 배지를 드래그해 샘플링할 각도를 고릅니다.
tutorial.physics.step.io.title=입력, 출력, 충돌
tutorial.physics.step.io.body=입력은 위치나 각도를 시뮬레이션에 전달하고, 출력은 파라미터를 구동합니다. 잘못된 파라미터, 피드백, 경합하는 출력은 그 자리에 표시됩니다.
tutorial.physics.step.test.title=당겨서 보정
tutorial.physics.step.test.body=캔버스의 빈 곳을 드래그해 모델을 당기고, 도달 범위와 범위 부채꼴을 확인한 다음 출력 배율을 맞춰 파라미터 끝점에서 잘리지 않게 합니다.
tutorial.physics.step.test.action=강조 표시된 캔버스 안을 한 번 드래그하고 진자의 반응을 확인하세요.
tutorial.physics.step.done.title=물리 강의 완료
tutorial.physics.step.done.body=물리를 마쳤습니다. 다음은 천과 머리카락 시뮬레이션입니다.
tutorial.simulation.title=천과 머리카락 시뮬레이션
tutorial.simulation.desc=모델 프리셋으로 머리카락과 의상 시뮬레이션을 한 번에 생성한 다음, 바디, 정점 그룹, 재질, 입력과 출력, 베이크 설정을 배우고 내보낼 수 있는 파라미터와 진자로 베이크합니다.
tutorial.simulation.step.presets.title=모델 프리셋에서 시작
tutorial.simulation.step.presets.body=모델 프리셋 패널의 물리 및 시뮬레이션(Physics & Simulation) 그룹은 자주 쓰는 파츠를 한 번에 시뮬레이션하게 만듭니다. 앞머리와 뒷머리에는 각각 드롭다운이, 의상과 눈 젤리에는 체크박스가 있으며, 옆의 회색 메모가 상태(원화에 없음, 의상을 찾지 못함, 베이크되지 않음 등)를 알려 줍니다. 프리셋은 일반 시뮬레이션 바디와 정점 그룹을 만들므로 시뮬레이션 패널에서 계속 조정할 수 있습니다. 먼저 프리셋으로 생성하고 나중에 다듬는 것이 가장 빠른 방법입니다.
tutorial.simulation.step.generate.title=머리카락 또는 의상 시뮬레이션 생성
tutorial.simulation.step.generate.body=모델에 아직 시뮬레이션 바디가 없으면 여기서 만듭니다. 앞머리나 뒷머리 드롭다운을 시뮬레이션으로 설정하거나 의상을 체크하세요. 변경할 때마다 실행 취소 한 단계가 되며, 이어서 백그라운드에서 베이크가 진행되므로 계속 편집할 수 있고 베이크는 별도의 실행 취소 단계로 기록됩니다. 진행 상황과 취소는 하단 상태 표시줄에 있습니다. 바디가 이미 있으면 이 단계는 자동으로 넘어갑니다.
tutorial.simulation.step.generate.action=강조 표시된 그룹에서 앞머리나 뒷머리를 시뮬레이션으로 설정하거나 의상을 체크하세요. 바디가 생기면 강의가 계속됩니다. 원화에 머리카락도 의상도 없으면 건너뛰기를 선택하세요.
tutorial.simulation.step.hairModes.title=머리카락의 세 가지 모드
tutorial.simulation.step.hairModes.body=시뮬레이션: 해당 머리카락의 모든 메시가 하나의 머리카락 바디(앞머리(프리셋) 또는 뒷머리(프리셋))가 됩니다. 각 가닥, 즉 메시의 연결된 각 조각은 자신의 위쪽 끝에 고정되고 끝으로 갈수록 자유로워지며, 고정 그룹만 기록됩니다. 해당 머리카락의 기존 흔들림 파라미터, 디포머, 진자는 제거되고 원화의 위치는 그대로 유지됩니다.\n기존 흔들림: 해당 바디를 삭제하고 예전의 디포머 흔들림으로 되돌려, 진자 하나로 머리카락 전체를 흔듭니다. 가볍지만 천 같은 느낌은 없습니다.\n끄기: 시뮬레이션도 흔들림도 없으며, 머리카락이 머리를 따라 움직이고 그대로 정지해 있습니다.
tutorial.simulation.step.clothing.title=의상, 눈 젤리, 도구 모음
tutorial.simulation.step.clothing.body=의상을 체크하면 상의, 하의, 목 장식, 소매, 다리 장식 레이어를 읽어 원화에서 느슨하게 늘어져 보이는 부분(프릴, 리본, 퍼지는 밑단, 코트 자락, 치마)만 시뮬레이션하고, 몸에 붙는 부분은 계속 리그를 따릅니다. 하의는 이름이나 실루엣으로 치마인지 바지인지 구분합니다. 행 아래에는 시뮬레이션하는 의상마다 늘어지는 정도와 메시가, 이어서 몸에 붙는 의상이 표시됩니다. 체크를 해제하면 의상 시뮬레이션이 모두 제거됩니다. 눈 젤리는 눈의 젤리 진자를 켜고 끕니다.\n도구 모음에서 선택만(n)은 체크박스를 선택한 레이어에만 적용하고, 고정 가중치 자동 설정은 시뮬레이션되는 메시의 고정, 질량 등 가중치를 파츠별로 다시 계산해 다시 베이크합니다. 페인트로 망가뜨린 가중치를 복원할 때도 쓸 수 있습니다.
tutorial.simulation.step.bodies.title=시뮬레이션 도크와 바디
tutorial.simulation.step.bodies.body=시뮬레이션 도크는 물리 다음에 있습니다. 바디 목록의 각 행은 함께 시뮬레이션되는 메시 묶음입니다. 왼쪽 체크박스로 활성화/비활성화하며(비활성화된 바디는 시뮬레이션도 내보내기도 되지 않지만 베이크 결과는 유지됨), 오른쪽 상태는 초록 점이 베이크 완료, 노란색 오래됨은 내보내기에 아직 이전 베이크가 쓰임, 빨간색 베이크 안 됨은 아무것도 내보내지 않음을 뜻합니다. 오른쪽 클릭으로 베이크, 베이크 지우기, 삭제를 할 수 있습니다.\n직접 만들려면 메시를 선택하고 도구 모음의 새로 만들기에서 천 또는 머리카락을 고릅니다. 행을 선택하면 아래 편집기에 베이크, 재질, 입력, 출력, 글루, 정점 그룹이 표시되며, 다음 단계에서 차례로 설명합니다.
tutorial.simulation.step.bodies.action=강조 표시된 시뮬레이션 도크를 열고 목록에서 바디(예: 프리셋이 만든 뒷머리(프리셋))를 선택하세요.
tutorial.simulation.step.weights.title=시뮬레이션 모드에서 정점 그룹 페인트
tutorial.simulation.step.weights.body=정점 그룹은 메시의 각 정점에 0~1 값을 부여해, 시뮬레이션에 어디를 고정하고 어디를 더 단단하게 또는 무겁게 할지 알려 줍니다. 그룹은 이 편집기 안에만 존재하며 내보낸 파일에는 기록되지 않습니다. 모드 메뉴에서 시뮬레이션을 선택하면 왼쪽 도구 모음에 가중치 페인트와 가중치 그라디언트가 있고, 그 아래에 가중치 종류가 나열됩니다. 브러시 모양을 고르듯 종류를 클릭하세요.\n브러시 모드: 더하기는 강도만큼 가중치를 올리고, 빼기는 내리고, 설정은 강도 값 쪽으로 당기고, 부드럽게는 이웃과 평균을 냅니다. {kbd:Alt}를 누르고 있으면 더하기와 빼기가 바뀝니다. 원은 한 번 누를 때 닿는 정점을, 숫자는 포인터 아래의 가중치를 나타내며, 히트맵이 메시 전체를 색으로 표시합니다. 가중치 그라디언트는 가중치가 가득해야 할 곳에서 옅어져야 할 곳으로 드래그합니다. 도구 상세에서 반경, 경도, 강도를 설정하고, 채우기, 지우기, 반전, 그룹 삭제를 사용할 수 있습니다.
tutorial.simulation.step.weights.action=계층에서 시뮬레이션에 쓰이는 레이어를 선택하고 시뮬레이션 모드로 전환한 다음, 가중치 브러시로 몇 번 칠해 보세요.
tutorial.simulation.step.weightKinds.title=가중치 종류별 의미
tutorial.simulation.step.weightKinds.body=고정: 리그에 붙잡히는 정점이며, 가중치는 얼마나 단단히 붙잡는지를 나타냅니다. 1은 리그를 완전히 따르고, 0은 정점을 시뮬레이션에 맡기며, 그 사이 값은 탄력 있는 부드러운 고정입니다. 머리카락은 보통 뿌리를, 치마는 허리선을 고정합니다. 시뮬레이션은 바디가 어디에 매달려 있는지 알기 위해 고정(또는 고정으로 쓰는 글루)이 필요합니다.\n강성: 정점별로 늘어남과 굽힘의 강성을 조절해, 단단한 뿌리에서 부드러운 밑단으로 이어지게 합니다.\n형태: 정점별로 원래 그린 형태로 돌아가는 스프링을 조절해, 퍼진 치마나 치켜 올라간 끝처럼 중력에 눌릴 형태를 지탱합니다.\n질량: 정점별로 질량을 조절합니다. 밑단과 끝이 무거울수록 더 늦게 따라오고 더 크게 넘어갑니다.\n감쇠: 정점별로 움직임이 잦아드는 속도를 조절합니다. 가중치가 높을수록 빨리 멈추고 떨리는 모서리가 안정됩니다.\n메시마다 종류별로 그룹이 하나씩 있습니다. 프리셋은 필요한 그룹만 기록합니다. 머리카락은 고정만, 의상은 질량도 기록합니다.
tutorial.simulation.step.glue.title=글루 역할
tutorial.simulation.step.glue.body=시뮬레이션되는 메시가 다른 메시와 글루로 연결되어 있으면, 글루 섹션에 각 글루가 역할과 함께 표시됩니다. 무시(기본값. 시뮬레이션은 관여하지 않고 런타임에서만 접합), 고정(시뮬레이션 쪽이 상대 메시의 실제 변형을 따름. 허리에 매달린 치마 등), 함께 유지(양쪽 모두 시뮬레이션할 때 이음매가 벌어지지 않게 함. 분리된 앞뒤 판 등). 글루는 스스로 고정이 되지 않으므로 여기서 선택하세요.
tutorial.simulation.step.material.title=재질 프리셋
tutorial.simulation.step.material.body=재질 상단의 프리셋 드롭다운은 이름 있는 재질의 값을 채워 넣습니다. 천에는 면(기본값), 실크(가볍고 부드러우며 길게 흔들림), 시폰(가장 가볍고 공기에 금방 멈춤), 울(무겁고 부드러우며 늦게 움직이기 시작해 빨리 멈춤), 데님(무겁고 단단하며 주름이 넓음), 가죽(가장 단단하며 거의 통째로 흔들림), 신축 소재(늘어났다 되돌아옴. 끈이나 양말용)가 있습니다. 머리카락에는 머리카락(기본값), 가는 머리카락(쉽게 휘고 갈라짐), 굵은 머리카락(통째로 흔들리고 형태를 유지)이 있습니다. 모든 값은 조정할 수 있으며, 어떤 프리셋과도 일치하지 않으면 드롭다운에 사용자 지정이 표시되고, 섹션의 이 종류의 프리셋으로 되돌리기로 변경을 되돌릴 수 있습니다. 바디의 종류를 바꾸면 그 종류의 프리셋이 적용됩니다.
tutorial.simulation.step.material.action=바디를 선택한 상태에서 재질 프리셋으로 다른 재질을 고르세요. 흔들림의 차이는 나중에 참조 시뮬레이션에서 비교할 수 있습니다.
tutorial.simulation.step.materialValues.title=재질 값
tutorial.simulation.step.materialValues.body=질량: 상대 밀도입니다. 각 정점은 자신이 맡은 메시 면적만큼의 무게를 가지므로, 메시를 촘촘하게 해도 천이 무거워지지 않습니다. 늘어남: 길어지는 것에 대한 저항으로, 천과 머리카락은 1 근처로 둡니다. 굽힘: 얼마나 급하게 휠 수 있는지로, 낮으면 부드러운 실크, 높으면 두꺼운 종이 같습니다. 면적: 각 삼각형이 면적을 유지하는 강도로, 낮으면 얇은 천이 깊이 방향으로 접히며 뭉치고, 높으면 무거운 부분이 형태를 유지하며, 어느 쪽이든 삼각형은 뒤집히지 않습니다. 결: 결 방향보다 결을 가로지르는 방향이 얼마나 더 부드러운지로, 결은 고정에서 멀어지는 방향으로 이어집니다. 높으면 가닥이 늘어나지 않고 갈라지며 세로로 접힙니다. 감쇠: 초당 움직임이 잦아드는 속도. 형태: 원래 그린 형태로 돌아가는 스프링으로, 0은 순수한 물리입니다. 여유: 세게 휘둘렀을 때 정점이 정지 경로를 넘어 고정에서 얼마나 멀어질 수 있는지. 이름에 포인터를 올리면 설명이 표시됩니다.
tutorial.simulation.step.inputs.title=입력과 출력
tutorial.simulation.step.inputs.body=입력은 바디를 흔드는 파라미터로, 목록 그대로 사용됩니다. 새 바디에는 모델에 있는 머리와 몸의 각도(각도 X / Z, 몸 X / Z)와 끄덕임, 몸 위아래, 기울기가 들어갑니다. 모델에 더 이상 없는 파라미터는 없음으로 표시됩니다. 파라미터는 자유롭게 추가·제거할 수 있으며, 목록이 기본값과 다르면 섹션에 기본 입력으로 초기화가 표시되고, 목록이 비어 있으면 베이크할 수 없습니다. 세로 방향 입력은 필요할 때 별도의 Y 파라미터로 베이크되어 바디가 위아래로 늦게 따라오고 튀는 모습을 보여 줍니다.\n출력은 베이크로 만들어진 모드 파라미터와 진자를 나열합니다. 이름을 클릭하면 바꿀 수 있으며, 다시 베이크할 필요가 없고 ID도 유지됩니다.
tutorial.simulation.step.bakeSettings.title=베이크 설정
tutorial.simulation.step.bakeSettings.body=베이크 섹션에서 내보내기 결과의 형태를 정합니다.\n모드(1–3, 기본값 2): 만들어지는 파라미터 수입니다. 첫 번째는 전체 흔들림이고, 이후의 것은 앞의 모드로 표현할 수 없는 굽힘, 뭉침, 압축만 더합니다. 긴 가닥이나 리본에는 3을 써도 됩니다.\n키(3 / 5 / 7 / 9, 기본값 5): 각 모드 파라미터의 키 수입니다. 많을수록 호를 더 가깝게 따라가며, 늘어나는 것은 파라미터가 아니라 키폼입니다.\n과장(×1–×2, 기본값 ×1.3): 시뮬레이션보다 얼마나 크게 흔들지입니다. 다시 베이크하지 않아도 즉시 적용됩니다.\n고급에는 정확한 포즈(각 키에서 정지한 형태를 정확하게 만들 파라미터, 최대 4개)와 모드 방식(자동, 블렌드 셰이프 또는 키폼 축. 재생 결과는 같으며, 블렌드 셰이프는 Cubism 4.2 이상이 필요하고, 자동은 메시의 키폼이 64개를 넘을 때만 블렌드 셰이프를 사용)이 있습니다.
tutorial.simulation.step.bake.title=내보내지는 것은 베이크뿐
tutorial.simulation.step.bake.body=실시간 시뮬레이션은 편집기 안에서만 동작하며, Cubism은 이런 시뮬레이션을 하지 않습니다. 베이크는 고개 돌리기와 몸 흔들기 등의 동작 모음으로 시뮬레이션을 구동하고, 그 결과를 모드 파라미터, 키폼, Cubism 진자에 맞춰 넣으므로, 내보낸 모델은 내보내기 미리보기와 같이 움직입니다. 보통 몇 초 걸립니다.\n바디의 베이크 섹션에서 베이크를 선택하거나, 도구 모음의 모두 베이크(베이크되지 않았거나 오래된 바디 전체를 실행 취소 한 단계로)를 선택하세요. 자동 베이크는 기본적으로 꺼져 있으며, 켜면 패널을 편집할 때마다 다시 베이크합니다. 베이크 후 섹션에 적합도(R²와 오차, R²가 0.8 미만이면 경고 색)가 표시됩니다. 이후 설정, 메시, 가중치를 바꾸면 바디가 오래됨 상태가 되며, 다시 베이크할 때까지 내보내기에는 이전 베이크가 쓰입니다. 베이크 지우기는 베이크로 만든 파라미터, 키폼, 진자를 제거합니다.
tutorial.simulation.step.bake.action=선택한 바디에서 베이크를 선택하거나 도구 모음의 모두 베이크를 선택하고, 상태 표시줄에서 진행 상황을 확인하세요.
tutorial.simulation.step.preview.title=내보내기 결과와 참조 시뮬레이션
tutorial.simulation.step.preview.body=도구 모음의 미리보기 스위치로 캔버스에서 재생할 내용을 고릅니다. 끄면 내보내기입니다. 맞춰 넣은 진자가 베이크를 구동해 내보낸 모델과 똑같이 움직이며, 베이크되지 않은 바디는 움직이지 않습니다. 켜면 참조 시뮬레이션입니다. 편집기가 비교용으로 자체 시뮬레이션을 실행하며, 이는 내보내지지 않고 캔버스 모서리에 표시됩니다. 옆의 초기화 버튼으로 실시간 시뮬레이션을 정지 상태로 되돌립니다. 참조 시뮬레이션에서 재질을 조정하고, 베이크 후 내보내기로 다시 전환해 차이를 확인하세요.\n베이크된 진자는 물리 도크에 시뮬레이션으로 표시되고, 그 파라미터는 파라미터 목록의 물리 폴더에 들어갑니다. 물리 도크에서 진자 이름을 바꾸면 바디의 출력 이름도 바뀝니다.
tutorial.simulation.step.preview.action=미리보기 스위치를 켜서 참조 시뮬레이션으로 하고, 파라미터 패널에서 머리를 돌려 흔들림을 본 다음, 스위치를 꺼서 내보내기와 비교하세요.
tutorial.simulation.step.done.title=시뮬레이션 강의 완료
tutorial.simulation.step.done.body=시뮬레이션을 마쳤습니다. 조정한 뒤 내보내기 전에 반드시 베이크하세요. 다음은 프로젝트와 히스토리입니다.

parameters.create=파라미터 생성
