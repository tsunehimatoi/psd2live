tutorial.basic.step.openFile.title=파일 메뉴 열기
tutorial.basic.step.openFile.body=제목 표시줄 왼쪽의 파일을 클릭하세요. 또는 다음을 눌러 계속 진행합니다.
tutorial.basic.step.import.title=PSD 가져오기
tutorial.basic.step.import.body=강조 표시된 가져오기 하위 메뉴에서 PSD에서 새 프로젝트…를 클릭하고 레이어로 구성된 일러스트를 여세요. 같은 하위 메뉴에서 기존 Cubism 모델을 새 프로젝트로 불러오거나 현재 모델을 대체하여 불러올 수도 있습니다. PSD를 가져오면 시작 화면이 열립니다. 최소 / 기본 / 전체 빠른 선택으로 모델 프리셋을 설정하고, 메시로 분할할 레이어를 체크하세요.
tutorial.basic.step.preview.title=미리보기로 전환
tutorial.basic.step.preview.body=캔버스 왼쪽 위의 모드 메뉴를 열고 미리보기를 선택하면 모델이 실시간으로 움직이는 것을 볼 수 있습니다. 미리보기 왼쪽 도구 모음의 마지막 행에서 Cubism SDK와 PSD2Live 런타임(표준 / 확장)을 전환할 수 있습니다.
tutorial.basic.step.layers.title=레이어 패널 살펴보기
tutorial.basic.step.layers.body=테두리가 레이어 패널 전체를 감싸고 있습니다. PSD 레이어와 감지된 유형, 프리셋 파츠, 좌우 방향이 표시됩니다. 레이어 이름과 할당된 파츠를 비교해 보세요. 다음 단계에서는 한 행에 초점을 맞춰 불일치를 수정하는 방법을 설명합니다.
tutorial.basic.step.layerRow.title=잘못된 프리셋 수정
tutorial.basic.step.layerRow.body=테두리가 한 레이어를 표시합니다. 이름을 확인하여 실제 파츠를 파악하세요. 프리셋으로 구동되는 파츠라면 유형을 프리셋으로 설정한 후 일치하는 파츠를 선택하고 좌우 방향을 확인하세요. 예를 들어 다른 신체 파츠에 할당된 머리카락 레이어는 알맞은 머리카락 프리셋을 선택하여 수정합니다.
tutorial.basic.step.settings.title=모델 프리셋 패널
tutorial.basic.step.settings.body=강조 표시된 영역이 모델 프리셋 패널 전체입니다. 머리와 몸의 강도, 입, 모션, 머리카락과 의상 시뮬레이션, 캔버스에서 만드는 워프의 기본 그리드를 설정합니다. 텍스처 아틀라스 설정은 내보내기 대화 상자에 있습니다. 준비되면 다음을 누르세요.
tutorial.basic.step.export.title=모델 내보내기
tutorial.basic.step.export.body=내보내기를 누르면 설정 창이 열립니다. CMO3는 Cubism Editor에서 계속 편집할 수 있는 모델 프로젝트입니다. 런타임 번들에는 MOC3와 함께 model3.json, 텍스처, 그리고 활성화한 경우 물리 등의 파일이 포함됩니다. MOC3만 따로 전달하지 말고 전체 세트를 전달하세요.
tutorial.basic.step.done.title=기본 둘러보기 완료
tutorial.basic.step.done.body=가져오기, 미리보기, 레이어, 모델 프리셋, 내보내기를 모두 살펴보았습니다. 작업 공간 둘러보기로 계속하거나 카탈로그를 여세요. 언제든지 도움말에서 다시 시작할 수 있습니다.
