help.spec.intro=부위마다 레이어를 나눕니다. 아래의 영어·중국어·일본어·한국어 레이어 이름은 자동으로 인식되며, 가져온 뒤에도 레이어 표에서 의미 태그를 바꿀 수 있습니다. 전체 이름 표는 문서에 있습니다.
help.spec.fullTable=전체 이름 표
help.spec.group.prepare=PSD 준비
help.spec.prepare.format=RGB, 8비트, 투명 배경의 레이어 PSD
help.spec.prepare.raster=텍스트, 벡터, 레이어 스타일, 조정 효과는 래스터화하거나 해당 픽셀 레이어에 병합합니다
help.spec.prepare.pose=몸은 거의 똑바로 세우고, 머리는 약간 기울어도 됩니다
help.spec.group.head=머리 및 얼굴 구성 요소
help.spec.head.face=face / head: 중심 및 9축 원근의 기준이 되는 얼굴 베이스. 볼터치, 눈물 자국 등의 세부 요소는 facedetail에 넣으세요
help.spec.head.hairFront=front_hair / bangs: 앞머리 물리 디포머에 연결되는 앞머리 아트메시
help.spec.head.hairBack=back_hair: 뒷머리 물리 디포머에 연결되는 뒷머리 아트메시
help.spec.head.headwear=headwear / hat: 머리에 장착되며 9축 얼굴 변형에서 제외됩니다
help.spec.head.eyelash=eyelash: 윗속눈썹만! 자연스럽게 뜬 상태로 그리면, 눈을 감을 때 매끄러운 U자 모양으로 휘어집니다 (아랫속눈썹은 포함하지 마세요)
help.spec.head.eyewhite=eyewhite: 흰자 기준 및 눈 감기 기준선. 눈동자의 클리핑 마스크
help.spec.head.eyeClose=eye_close: 미리 그려 둔 감은 눈 모양. 이것과 속눈썹 감기 커브 중 하나만 사용하세요
help.spec.head.irides=irides / pupil / eye: 시선 추적 및 젤리 아이 스프링 동역학
help.spec.head.eyebrow=eyebrow: 눈썹 상하 움직임 및 원근 추종
help.spec.head.nose=nose: 3D 머리 방향 인식의 기준점
help.spec.head.mouth=mouth / mouth_open: 반드시 최대로 벌린 상태로 그려야 합니다 (선명한 외곽선 권장). 동심원 방향으로 닫힙니다
help.spec.head.mouthClose=mouth_close: 미리 그려 둔 다문 입 모양 (선택 사항)
help.spec.head.mouthInternals=tooth_t / tooth_b / tongue: 입 아트메시에 자동으로 클리핑됩니다
help.spec.head.ears=ears / earwear / eyewear: 머리 회전을 따라가는 귀, 귀걸이, 안경
help.spec.group.body=몸통 및 신체 구성 요소
help.spec.body.neck=neck: 머리 회전과 몸통 움직임을 연결합니다
help.spec.body.topwear=topwear / clothes / shirt: 몸의 XYZ 방향 및 가우시안 가슴 호흡 팽창에 연결됩니다
help.spec.body.limbs=handwear / legwear / footwear (arm / hand / leg / foot): 팔, 손, 다리, 발
help.spec.body.bottomwear=bottomwear: 바지 및 치마
help.spec.body.neckwear=neckwear: 옷깃, 스카프 및 목 액세서리
help.spec.group.extra=기타 및 소품
help.spec.extra.tail=tail: 독립적으로 흔들립니다
help.spec.extra.wings=wings: 몸 뒤쪽에 장착됩니다
help.spec.extra.objects=objects / prop: 그 밖에 별도로 제어할 수 있는 파츠
help.spec.group.notes=핵심 권장 사항
help.spec.note.eyelash=• 눈을 감을 때 왜곡되지 않도록 eyelash 레이어에는 아랫속눈썹을 그리지 마세요.
help.spec.note.mouth=• 입은 가장 크게 벌린 상태로 그립니다. 다문 입은 자동으로 만들어지며, 모양이 중요하면 mouth_close를 따로 그립니다.
help.spec.note.hair=• 앞머리와 뒷머리를 나누고, 가려지는 부분도 조금 더 그려 움직일 때 바탕이 드러나지 않게 합니다.
help.spec.note.sides=• 좌우는 캐릭터 자신 기준이며, 캐릭터의 왼쪽은 보통 화면 오른쪽입니다. eyelash-l, eyelash_left, 왼쪽 속눈썹 등으로 씁니다. 한 레이어에 그린 양쪽 부위는 저절로 나뉘지 않습니다.
help.spec.note.unknown=• 인식되지 않은 레이어도 메시가 만들어지고 대체 소속으로 붙습니다. 레이어 표에서 의미 태그를 추가해 바로잡습니다.

