parameters.deleteWarning={0}을(를) 삭제할까요? 관련 키와 링크도 제거됩니다. 실행 취소할 수 있습니다.

parameters.relatedOnly=관련 항목만
parameters.related=선택한 구성 요소에 바인딩됨
parameters.noRelated=현재 필터와 일치하는 관련 파라미터가 없습니다.
