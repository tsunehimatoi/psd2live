settings.graphics.canvasAa.msaa.desc=메시 가장자리, 채우기, 마스크 가장자리를 멀티샘플링하고 마스크는 텍셀 불투명도로 섞입니다. 편집 캔버스, 아틀라스 페이지, p2lrt 미리 보기에 적용되며 Cubism 미리 보기는 자체 렌더러로 그립니다. 바로 적용됩니다.
settings.graphics.canvasAa.ssaa=SSAA 2×
settings.graphics.canvasAa.ssaa.desc=너비와 높이를 두 배로 그린 뒤 줄여 평균합니다. 텍스처 세부를 포함한 모든 것에 샘플 4개, 채울 픽셀은 네 배입니다. 바로 적용됩니다.
