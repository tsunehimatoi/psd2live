parameters.duplicateHint=이름과 범위를 복사합니다. 오브젝트 바인딩과 폼은 복사하지 않습니다.
parameters.keyCount=키 포인트 {0}개
parameters.blendAxisHelp=사각형 점은 블렌드 셰이프 키입니다. 0은 중립 기준으로 고정되어 있습니다. 다른 점에서 메시나 디포머를 변형하면 가산 형태가 저장됩니다.
parameters.kindNormal=키폼
parameters.kindBlend=블렌드 셰이프

parameters.axisTitle=키 포인트
parameters.axisHelp=빈 곳을 클릭하면 점이 추가되고, 드래그하면 이동합니다. 숫자를 클릭해 편집한 뒤 Enter를 눌러 확정합니다. 오른쪽 클릭으로 삭제합니다.
parameters.step=간격
parameters.distribute=균등
parameters.redoPointEdit=포인트 편집 다시 실행
parameters.axisEditLimit=포인트를 더 편집하기 전에 이 초안을 저장하세요.
parameters.undoPointEdit=포인트 편집 실행 취소
parameters.copy=복사
