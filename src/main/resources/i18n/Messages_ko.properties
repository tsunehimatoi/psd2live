settings.graphics.windowCache.desc=재생 중인 미리 보기만 바뀌는 동안 모든 패널을 다시 그리지 않고 보관한 그림 아래에 미리 보기를 그립니다. 패널이 갱신되지 않으면 끄세요. 바로 적용됩니다.
