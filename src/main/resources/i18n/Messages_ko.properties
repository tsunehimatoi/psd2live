help.about.tagline=레이어 PSD에서 Live2D 모델(메시, 디포머, 파라미터, 모션, 물리)을 자동 생성하고, 편집기에서 다듬어 CMO3, MOC3 등으로 내보냅니다.
help.about.license=라이선스: 앱은 GPL-3.0, 중립 리그 형식과 내보내기 프레임워크 등 모듈은 MIT로 배포합니다.
help.about.thirdParty=사용하는 서드파티 구성 요소와 라이선스는 "서드파티 라이선스"에 있습니다.
help.about.disclaimer=면책 조항: 이 소프트웨어는 명시적이든 묵시적이든 어떠한 종류의 보증도 없이 “있는 그대로” 제공됩니다. 저작자 및 기여자는 어떠한 청구나 손해에 대해서도 책임을 지지 않습니다.
help.about.sdkNotice=Live2D, Cubism, .cmo3, .moc3는 Live2D Inc.의 상표로, 형식 호환을 위해서만 사용합니다. 이 프로젝트는 Live2D Inc.와 관계가 없습니다. 패키지에는 Cubism SDK 독점 파일이 없으며, Cubism 미리 보기는 직접 준비한 SDK를 사용합니다.
help.examples.intro=예제 저장소에는 PSD2Live에서 바로 쓸 수 있는 소재와 프로젝트가 모여 있습니다. 시작할 때, 결과를 비교할 때, 문제를 좁힐 때 쓰세요.
